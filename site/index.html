--selection), [Custom Pagination](https://dashboard-ui-components.pages.dev/?path=/story/components-table--custom-pagination), [Empty State](https://dashboard-ui-components.pages.dev/?path=/story/components-table--empty-state), [Responsive Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-table--responsive-layout), [Custom Slots](https://dashboard-ui-components.pages.dev/?path=/story/components-table--custom-slots), [All Features](https://dashboard-ui-components.pages.dev/?path=/story/components-table--all-features)\n\n**Rendered markup (default story)**\n\n```html\n<s-panel no-padding=\"\" class=\"s-panel no-padding ltr\">\n  <s-panel-head data-collapsed=\"true\" class=\"hydrated\">\n    <h2 slot=\"title\">Table Component<\/h2>\n  <\/s-panel-head>\n  <s-panel-body>\n    <s-table items=\"[{&quot;name&quot;:&quot;John Wick&quot;,&quot;age&quot;:&quot;24&quot;,&quot;visits&quot;:&quot;100&quot;,&quot;progress&quot;:&quot;54&quot;},{&quot;name&quot;:&quot;James Bond&quot;,&quot;age&quot;:&quot;24&quot;,&quot;visits&quot;:&quot;100&quot;,&quot;progress&quot;:&quot;54&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot\n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `pagination`). Edit the catalog, not this file._\n", "03-components/organisms/side-menu": "# NavigationDrawer\n\n> The dashboard side navigation (Material: navigation drawer) composed of NavigationItems and section headers.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Navigation | 4 - Slot / Composition | existing | figma | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `sections` | array |\n| `collapsed` | boolean |\n| `disabled` | boolean |\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nComposes: [NavigationItem](../molecules/side-menu-item.md), [Divider](../atoms/divider.md), [Icon](../atoms/icon.md).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Side menu` | Side menu | 2 | Status: default, disabled |\n| `sidemenu tab` | Side menu | 9 | status: active, default, hover; variant: first, last, middle |\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `side-menu`). Edit the catalog, not this file._\n", "03-components/organisms/accordion": "# Accordion\n\n> Collapsible content container (progressive disclosure) with head and body slots, grouped auto-collapse, tight / relaxed layouts and light / transparent / feature themes.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Containment | 4 - Slot / Composition | existing | storybook | `<s-accordion>` |\n\n## Anatomy\n\n- head (slot)\n- expand icon\n- body (slot, optional maxHeight scroll)\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `theme` | `default`, `light`, `transparent`, `feature` |\n| `layout` | `default`, `tight`, `relaxed` |\n| `outlined` | boolean |\n| `isExpanded` | boolean |\n| `autoCollapse` | boolean (group) |\n| `loading` | boolean |\n| `disabled` | boolean |\n| `readonly` | boolean |\n| `maxHeight` | css length |\n\n## States\n\n- collapsed\n- expanded\n- loading\n- disabled\n- read-only\n\n## Tokens\n\n- sys.color.surface\n- sys.color.outline\n- sys.shape.small\n- sys.typography.title-md\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nHeadless layer: **useDisclosure (expanded state, aria-expanded, group coordination)**.\n\nComposes: [Icon](../atoms/icon.md).\n\n## Notes and migration\n\nStorybook only: no Figma frame exists. Design one from this spec (Material: expansion panel).\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n### `<s-accordion>`\n\n[components-accordion](https://dashboard-ui-components.pages.dev/?path=/docs/components-accordion) · 14 stories · A collapsible content container that provides large amounts of content in a small space through progressive disclosure. Users get the essential details about the core content and can choose to expand this content within the constraints of the accordion.\n\nRelated elements: `<s-accordion-group>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `activeTab` | number | `0` |  | Initially active tab index |\n| `autoCollapse` | boolean | `true` |  | AutoCollapse other accordions in the same group when one is expanded |\n| `disabled` | boolean | `false` |  | Disable accordion |\n| `feature` | boolean | `true` |  | Feature based dependency accordion |\n| `flatHeader` | boolean | `false` |  | Removes the expand/collapse icon from header, needed in certain cases |\n| `headerPadding` | text | `\"\"` |  | Sets custom padding for the accordion header, set value as string like '1rem' or '16px 20px' |\n| `isExpanded` | boolean | `false` |  | If you need accordion to be expanded by default |\n| `layout` | select | `default` | `default`, `tight`, `relaxed` | You can set accordion layout to tight or relaxed if you have small area |\n| `loading` | boolean | `false` |  | Accordion loading state |\n| `maxHeight` | text | `auto` |  | You can set max height for accordion body, will be scrollable when content is more than max height, set value as string like '200px' |\n| `outlined` | boolean | `false` |  | Adds an outline border to the accordion |\n| `readonly` | boolean | `false` |  | Readonly state |\n| `theme` | string | `default` | `default`, `light`, `transparent`, `feature` | Accordion theme, you can set theme to light, transparent or feature if you need feature based dependency accordion |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `accordionToggle` | Emitted when the accordion is toggled. Provides event object with the state of the accordion. |\n| `onchange` | Emitted when the active tab changes. Provides the index of the new active tab. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--default), [Light](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--light), [Transparent](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--transparent), [Feature](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--feature), [Tight](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--tight), [Relaxed](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--relaxed), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--loading), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--disabled), [Expanded](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--expanded), [Outlined](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--outlined), [Max Height](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--max-height), [Grouped](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--grouped), [Nested](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--nested), [Read Only](https://dashboard-ui-components.pages.dev/?path=/story/components-accordion--read-only)\n\n**Rendered markup (default story)**\n\n```html\n<s-accordion theme=\"default\" outlined=\"\" active-tab=\"0\" class=\"hydrated\">\n  <div slot=\"head\">Accordion Title<\/div>\n  <div slot=\"body\">The accordion component provides large amounts of content in a small space through progressive disclosure. Users get the essential details about the core content and can choose to expand this content within the constraints of the accordion.<\/div>\n<\/s-accordion>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `accordion`). Edit the catalog, not this file._\n", "03-components/organisms/tooltip": "# Tooltip\n\n> Hover / focus hint on a primary-container surface with a caret. Exists in Figma as a component set (used inside CheckboxField disabled-info) but has no top-level frame on the components page.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Communication | 5 - Headless | existing | figma, storybook | `<s-tooltip>` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `content` | string |\n| `placement` | `top`, `bottom`, `start`, `end` |\n\n## Tokens\n\n- comp.tooltip.*\n- sys.color.primary-container (#a4ffe5)\n- sys.color.on-primary-container (#004956)\n- sys.typography.body-sm\n- sys.elevation.3 (Shadows/lg)\n- sys.shape.extra-small\n\n## How to build it\n\nBuild the **logic as a headless hook / controller** (state, keyboard, focus, ARIA) and a thin UI component on top. The hook must be usable with custom UI; document it with examples since it is invisible in Figma.\n\nHeadless layer: **useTooltip**.\n\n## Notes and migration\n\nFigma guidance on the disabled-info variants: when a control is disabled because of something the merchant can change, keep the label in normal colour and put a link in the tooltip (e.g. \"Verify your email to enable notifications. Verify now\"). Twilight <s-tooltip> adds themes (default/secondary/white/feature/danger), 12 placements, hover/click toggle, title + action slots.\n\n## Source in Figma today\n\n- Figma node: `1933:1790`\n- Variant filter: `--disabled=--disabled-info-tooltip`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `checkboxfield` | check Box | 16 | Language: Arabic, English; disabled: default, disabled, disabled-info, disabled-info-tooltip; selected: False, True |\n\n## Source in the Twilight Storybook today\n\n### `<s-tooltip>`\n\n[components-tooltip](https://dashboard-ui-components.pages.dev/?path=/docs/components-tooltip) · 27 stories · Tooltip component provides contextual information when users hover or click on an element. It displays helpful content in a small overlay positioned relative to the trigger element.\n\nIt exposes three slots:\n\n- `toggle`: the trigger element, any element can be used (button, avatar, icon, inline text…).\n- `title`: the tooltip heading, it is bolded by the component.\n- default: the tooltip body, it accepts any markup, including `<s-tooltip-action>` actions.\n\nRelated elements: `<s-button>`, `<s-tooltip-action>`, `<s-icon>`, `<s-avatar>`, `<s-tag>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `layout` | string | `normal` | `tight`, `normal`, `relaxed` | Tooltip layout |\n| `placement` | string | `top center` | `bottom`, `bottom-start`, `bottom-end`, `top`, `top-start`, `top-end`, `right`, `right-start`, `right-end` | Tooltip placement |\n| `theme` | string | `default` | `default`, `secondary`, `white`, `feature`, `danger` | Tooltip theme |\n| `toggleAction` | string | `hover` | `hover`, `click` | Toggle action |\n| `width` | string | `300px` |  | Tooltip width |\n\n**Slots**\n\n| Slot | Description |\n|---|---|\n| `content` | Default slot, raw HTML for the tooltip body. It accepts any markup: paragraphs, lists, media, `s-tooltip-action` or `s-button` actions. |\n| `title` | title` slot, the content is rendered inside `<h4 slot=\"title\">` so inline markup such as icons is supported. Leave it empty to render a tooltip without a title. |\n| `toggle` | toggle` slot, raw HTML for the trigger element, it must carry `slot=\"toggle\"`. Any element works: `s-button`, `s-avatar`, `s-tag`, an icon or plain inline text. |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onclose` | Emitted when the tooltip is closed. |\n| `onopen` | Emitted when the tooltip is opened. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--default), [Secondary](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--secondary), [White](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--white), [Danger](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--danger), [Top Start](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--top-start), [Top End](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--top-end), [Bottom Center](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--bottom-center), [Bottom Start](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--bottom-start), [Bottom End](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--bottom-end), [Center Start](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--center-start), [Center End](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--center-end), [Click Toggle](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--click-toggle), [Tight](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--tight), [Relaxed](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--relaxed), [Custom Width](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--custom-width), [Icon Trigger](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--icon-trigger), [Avatar Trigger](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--avatar-trigger), [Inline Text Trigger](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--inline-text-trigger), [Title With Icon](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--title-with-icon), [Without Title](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--without-title), [List Content](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--list-content), [Key Value Content](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--key-value-content), [Media Content](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--media-content), [Multiple Actions](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--multiple-actions), [Feature Locked](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--feature-locked), [Media Card With Image](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--media-card-with-image), [Media Card With Video](https://dashboard-ui-components.pages.dev/?path=/story/components-tooltip--media-card-with-video)\n\n**Rendered markup (default story)**\n\n```html\n<div style=\"min-height: 30vh;\" class=\"flex items-center justify-center\">\n  <s-tooltip theme=\"default\" width=\"300px\" placement=\"top\" toggle-action=\"hover\" layout=\"normal\" class=\"s-tooltip s-tooltip--default ltr hydrated\" data-toggle=\"hover\">\n    <s-button slot=\"toggle\" theme=\"default\" class=\"s-btn s-btn--default default md ltr hydrated\" target=\"_self\">Show Tooltip<\/s-button>\n    <h4 slot=\"title\">Tooltip title<\/h4>\n    <article>\n      <p>This is the tooltip content that provides helpful information to users.<\/p>\n      <s-tooltip-action class=\"hydrated\" theme=\"default\">Click here to learn more<\/s-tooltip-action>\n    <\/article>\n  <\/s-tooltip>\n<\/div>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `tooltip`). Edit the catalog, not this file._\n", "03-components/organisms/alert": "# Alert\n\n> Contextual message with icon, optional title, body, optional button and close. Four semantic variants, default / white / transparent surfaces. Also the Table-embedded variant.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Communication | 1 - Configurable | existing | figma, storybook | `<s-alert-box>` |\n\n## Anatomy\n\n- icon-start\n- title\n- body\n- action (Button size sm)\n- close icon\n- inline-start accent border 3px\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `variant` | `info`, `success`, `warning`, `danger` |\n| `type` | `default`, `white` |\n| `transparent` | boolean |\n| `title` | string |\n| `closable` | boolean |\n| `action` | slot |\n\n## States\n\n- visible\n- dismissed\n\n## Tokens\n\n- comp.alert.*\n- sys.color.info-lighter (#ecf3fe fill)\n- sys.color.info-light (#cbe0fb accent)\n- sys.color.info-darker (#204374 text)\n- sys.shape.small\n- sys.typography.title-md / body-sm\n\n## RTL and localisation\n\nAccent border is border-inline-start; icon-start / close swap sides automatically.\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Notes and migration\n\nFigma prop 'Trasnparet' -> transparent.\n\n## Source in Figma today\n\n- Figma node: `18843:88067 (info, default, title on)`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Alertbox` | Alertbox | 64 | Language: Arabic, English; variant: danger, info, success, warning; Type: Default, Inline, white; Title: Off, On; Trasnparet: Off, On |\n| `Table/Alertbox` | Table | 4 | Hover: Off, On; Device: Desktop, Mobile |\n\n## Source in the Twilight Storybook today\n\n### `<s-alert-box>`\n\n[components-alertbox](https://dashboard-ui-components.pages.dev/?path=/docs/components-alertbox) · 11 stories · A message box provides contextual feedback to users. It can be used to display success, warning, error, or info messages.\n\nRelated elements: `<s-alert-box-action>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `centerAlign` | boolean |  |  | set to true to center the alert box content |\n| `closable` | boolean | `false` |  | Show close button, if you want user to to be able to close the alert box |\n| `horizontal` | boolean |  |  | If true, the alert box will be displayed in a horizontal layout. |\n| `layout` | string | `default` | `default`, `flat` | Alert box Layout, you can set layout to default or flat |\n| `theme` | string | `default` | `default`, `secondary`, `danger`, `warning`, `info`, `feature` | Alert box Theme, you can set theme to default, secondary, danger, warning, info or feature |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onclick` | Emitted when the alert box is clicked. |\n| `onclose` | Emitted when the alert box is closed. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--default), [Secondary](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--secondary), [Danger](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--danger), [Warning](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--warning), [Info](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--info), [Feature](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--feature), [Flat](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--flat), [Closable](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--closable), [Horizontal](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--horizontal), [Center Align](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--center-align), [Custom Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--custom-slot)\n\n**Rendered markup (default story)**\n\n```html\n<s-alert-box theme=\"default\" layout=\"default\" class=\"s-alert-box s-alert-box--default default ltr hydrated\">\n  <i slot=\"icon\" class=\"hgi-stroke hgi-alert-02\">\n  <\/i>\n  <h4 slot=\"title\">AlertBox Title<\/h4>\n  <article slot=\"desc\">\n    <p>This is a default alert description.<\/p>\n  <\/article>\n  <div slot=\"action\">\n    <s-alert-box-action slot=\"action\" layout=\"btn\" theme=\"default\" href=\"https://example.com\" target=\"_blank\" class=\"hydrated\">Primary Action<\/s-alert-box-action>\n    <s-alert-box-action slot=\"action\" layout=\"outlined\" theme=\"default\" href=\"https://example.com\" target=\"_blank\" class=\"hydrated\">Secondary Action<\/s-alert-box-action>\n  <\/div>\n<\/s-alert-box>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `alert`). Edit the catalog, not this file._\n", "03-components/organisms/map": "# Map\n\n> Embedded map for addresses and branches.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Data display | 2 - Standalone | existing | figma, storybook | `<s-maps>` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `center` | latlng |\n| `markers` | array |\n| `language` | `ar`, `en` |\n\n## How to build it\n\nBuild as **separate, explicitly named components**. Share styling through tokens and small internal layout helpers, not through a shared prop bag.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Maps` | Maps | 2 | Language: Default, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-maps>`\n\n[components-maps](https://dashboard-ui-components.pages.dev/?path=/docs/components-maps) · 4 stories · Maps component provides an interactive map interface with search functionality and location services.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `apiKey` | string |  |  | Google Maps API Key. |\n| `hasCurrentLocationButton` | boolean | `false` |  | Show or hide the 'Go to current location' button. |\n| `height` | string | `300px` |  | Map wrapper height. Accepts CSS height property values. |\n| `latitude` | number | `21.4255186` |  | The latitude coordinate of the map's center |\n| `longitude` | number | `39.7858435` |  | The longitude coordinate of the map's center |\n| `searchPlaceholder` | string | `Search...` |  | Search input placeholder. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-maps--default), [With Current Location Button](https://dashboard-ui-components.pages.dev/?path=/story/components-maps--with-current-location-button), [Custom Coordinates](https://dashboard-ui-components.pages.dev/?path=/story/components-maps--custom-coordinates), [Custom Height](https://dashboard-ui-components.pages.dev/?path=/story/components-maps--custom-height)\n\n**Rendered markup (default story)**\n\n```html\n<s-maps api-key=\"\" has-current-location-button=\"false\" latitude=\"21.4255186\" longitude=\"39.7858435\" height=\"300px\" search-placeholder=\"Search...\" value=\"21.4255186,39.7858435\" class=\"w-full relative rounded hydrated\" style=\"height: 300px; position: relative; overflow: hidden;\">\n  <div style=\"height: 100%; width: 100%; position: absolute; top: 0px; left: 0px; background-color: rgb(229, 227, 223);\">\n    <div tabindex=\"0\" aria-label=\"الخريطة\" aria-roledescription=\"خريطة\" role=\"region\" aria-describedby=\"0F3C4CA7-351C-4968-9FE8-DC637B4C546B\" style=\"position: absolute; height: 100%; width: 100%; padding: 0px; border-width: 0px; margin: 0px; left: 0px; top: 0px;\">\n      <div id=\"0F3C4CA7-351C-4968-9FE8-DC637B4C546B\" style=\"display: none;\">\n      <\/div>\n    <\/div>\n    <div class=\"gm-style\" style=\"position: absolute; z-index: 0; left: 0px; top: 0px; height: 100%; width: 100%; padding: 0px; border-width: 0px; margin: 0px;\">\n      <div style=\"position: absolute; z-index: 0; left: 0px; top: 0px; height: 100%; width: 100%; padding: 0px; border-width: 0px; margin: 0px; cursor: url(&quot;https://ma\n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `map`). Edit the catalog, not this file._\n", "03-components/organisms/panel": "# Panel\n\n> Card container with PanelHeader, body and footer slots (Storybook: Panel). Material: card.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Containment | 4 - Slot / Composition | existing | figma, storybook | `<s-panel>` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `header` | slot (PanelHeader) |\n| `body` | slot |\n| `footer` | slot |\n| `elevation` | `0`, `1` |\n\n## Tokens\n\n- sys.color.surface\n- sys.color.outline\n- sys.shape.small (8px, as NavigationDrawer and LearnMore use)\n- sys.elevation.0\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\n## Notes and migration\n\nTwilight ships <s-panel> with <s-panel-head> (title + actions slots) and <s-panel-body>, collapsable, compact/relaxed layouts, noPadding for tables. Missing as a top-level Figma frame.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `previewContainer` | Table | 2 | Type: Blog, Default |\n| `_Table/Panel Header` | Table | 2 | Size: Default, Small |\n\n## Source in the Twilight Storybook today\n\n### `<s-panel>`\n\n[components-panel](https://dashboard-ui-components.pages.dev/?path=/docs/components-panel) · 6 stories · The content wrapper component\n\nRelated elements: `<s-panel-head>`, `<s-panel-body>`, `<s-table>`, `<s-button>`, `<s-dropdown>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `actions` | string |  |  |  |\n| `collapsable` | boolean | `false` |  | Make panel collapsable |\n| `collapsed` | boolean | `true` |  | Set collapse prop |\n| `content` | string |  |  | Panel content, use the `<s-panel-body />` to add all your content inside this slot |\n| `layout` | string | `relaxed` |  | for some scenarions, you may need a compact layout for panel |\n| `noPadding` | boolean |  |  | Remove panel body padding, useful for full width panels with tables inside panel body |\n| `overflowHidden` | boolean |  |  | overflow hidden for panel body |\n| `title` | string |  |  | Panel title, you can add the title via `<s-panel-head />` and use the `title` slot |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--default), [No Padding](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--no-padding), [Collapsable](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--collapsable), [Header Actions Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--header-actions-slot), [Compact Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--compact-layout), [Headless Panel](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--headless-panel)\n\n**Rendered markup (default story)**\n\n```html\n<s-panel collapsed=\"\" layout=\"relaxed\" class=\"s-panel ltr hydrated\">\n  <s-panel-head data-collapsed=\"true\" class=\"hydrated\">\n    <div slot=\"title\">Panel Title<\/div>\n  <\/s-panel-head>\n  <s-panel-body class=\"hydrated\"> Panel content, you can add any content here inside this slot <\/s-panel-body>\n<\/s-panel>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `panel`). Edit the catalog, not this file._\n", "03-components/organisms/bulk-edit-sheet": "# BulkEditSheet\n\n> Side sheet opened from the DataTable bulk bar to edit selected rows.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Containment | 4 - Slot / Composition | existing | figma | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `open` | boolean |\n| `header` | slot |\n| `body` | slot |\n| `footer` | slot (ActionBar) |\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Table/Bulk Edit Sheet` | Table | 2 | Open: Off, On |\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `bulk-edit-sheet`). Edit the catalog, not this file._\n", "03-components/organisms/table-row-mobile": "# MobileRow\n\n> Card-style row for phones: order, product, customer and default layouts.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Data display | 2 - Standalone | existing | figma, storybook | `<s-table> (layout=responsive)` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `kind` | `default`, `order`, `product`, `customer` |\n| `selected` | boolean |\n\n## States\n\n- default\n- hover\n- focus\n- selected\n\n## How to build it\n\nBuild as **separate, explicitly named components**. Share styling through tokens and small internal layout helpers, not through a shared prop bag.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Table/mobile Order` | Table | 6 | Type: Default, Focus, Hover; Selected: Off, On; Deleted: Off |\n| `Table/mobile Default` | Table | 6 | Type: Default, Focus, Hover; Selected: Off, On; Deleted: Off |\n| `Table/mobile Product` | Table | 6 | Type: Default, Focus, Hover; Selected: Off, On; Deleted: Off |\n| `Table/mobile Customer` | Table | 6 | Type: Default, Focus, Hover; Selected: Off, On; Deleted: Off |\n\n## Source in the Twilight Storybook today\n\n### `<s-table>` — layout=responsive\n\n[components-table](https://dashboard-ui-components.pages.dev/?path=/docs/components-table) · 9 stories · The table component is a customizable table that provides functionalities for sorting, pagination, and filtering.\n\nRelated elements: `<s-panel>`, `<s-panel-head>`, `<s-panel-body>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `children` | string |  |  |  |\n| `emptyPlaceholderDesc` | text | `undefined` |  | Description to display when there's no data |\n| `emptyPlaceholderIcon` | text | `undefined` |  | Icon to display when there's no data |\n| `emptyPlaceholderLabel` | text | `undefined` |  | Label to display when there's no data |\n| `fetchUrl` | text | `undefined` |  | Table data source url |\n| `hasNextPage` | boolean | `false` |  | Indicates if there is a next page available |\n| `hasPrevPage` | boolean | `false` |  | Indicates if there is a previous page available |\n| `headers` | array | `[\"Name\", \"Age\", \"Visits\", \"Progress\"]` |  | Table headers |\n| `items` | array | `TABLE_ITEMS` |  | Table data |\n| `itemsPerPage` | string | `[\"10\", \"20\", \"30\", \"40\", \"50\"]` |  | Items per page |\n| `layout` | string | `scroll` |  | Table layout, scroll or responsive, default is scroll |\n| `loading` | boolean | `false` |  | Loading state |\n| `pagination` | boolean | `true` |  | Table pagination |\n| `searchPlaceholder` | string | `Search...` |  | Table search placeholder |\n| `searchable` | boolean | `false` |  | Enable table search |\n| `selectable` | boolean | `false` |  | Enable table row selection |\n| `sortBy` | object | `undefined` |  | Sorting configuration for columns in the table |\n| `sortable` | boolean | `false` |  | Enable table sorting |\n| `transform` | object | `undefined` |  | Transform data before passing to the component |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onNextButtonClicked` | Event emitted when next page button is clicked |\n| `onPrevButtonClicked` | Event emitted when previous page button is clicked |\n| `onSelect` | Event emitted when single or all rows are selected |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-table--default), [With Search](https://dashboard-ui-components.pages.dev/?path=/story/components-table--with-search), [Sorting](https://dashboard-ui-components.pages.dev/?path=/story/components-table--sorting), [Selection](https://dashboard-ui-components.pages.dev/?path=/story/components-table--selection), [Custom Pagination](https://dashboard-ui-components.pages.dev/?path=/story/components-table--custom-pagination), [Empty State](https://dashboard-ui-components.pages.dev/?path=/story/components-table--empty-state), [Responsive Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-table--responsive-layout), [Custom Slots](https://dashboard-ui-components.pages.dev/?path=/story/components-table--custom-slots), [All Features](https://dashboard-ui-components.pages.dev/?path=/story/components-table--all-features)\n\n**Rendered markup (default story)**\n\n```html\n<s-panel no-padding=\"\" class=\"s-panel no-padding ltr\">\n  <s-panel-head data-collapsed=\"true\" class=\"hydrated\">\n    <h2 slot=\"title\">Table Component<\/h2>\n  <\/s-panel-head>\n  <s-panel-body>\n    <s-table items=\"[{&quot;name&quot;:&quot;John Wick&quot;,&quot;age&quot;:&quot;24&quot;,&quot;visits&quot;:&quot;100&quot;,&quot;progress&quot;:&quot;54&quot;},{&quot;name&quot;:&quot;James Bond&quot;,&quot;age&quot;:&quot;24&quot;,&quot;visits&quot;:&quot;100&quot;,&quot;progress&quot;:&quot;54&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot\n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `table-row-mobile`). Edit the catalog, not this file._\n", "03-components/organisms/rich-text-editor": "# RichTextEditor\n\n> Quill-based rich text editor with configurable toolbar, html / text / json output, character limits, preview, product embeds, image picker and AI suggestion.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Text inputs | 3 - Base + Global | existing | figma, storybook | `<s-editor>` |\n\n## Anatomy\n\n- toolbar (slot end for language)\n- content area (start slot icon)\n- counter / description\n- AI actions overlay\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `toolbar` | array config |\n| `fullToolbar` | boolean |\n| `hideToolbar` | boolean |\n| `format` | `html`, `text`, `json` |\n| `min / max` | number |\n| `showCount` | boolean |\n| `hasPreview` | boolean |\n| `multilingual` | boolean |\n| `productEmbed` | config |\n| `aiSuggestion` | config |\n\n## States\n\n- enabled\n- focus\n- disabled\n- error\n- loading\n\n## Tokens\n\n- comp.text-field.*\n- sys.color.outline\n- sys.shape.small\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **BaseField**.\n\n## Notes and migration\n\nFigma models this as TextareaField with Rich text?=Yes plus the _Rich-Text-Panel toolbar; Twilight ships it as a standalone Editor. Treat it as the third global on BaseField.\n\n## Source in Figma today\n\n- Variant filter: `Rich text?=Yes`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_TextArea` | Inputs | 56 | State: Active, Active-Filled, default, disabled, filled, hover, preActive, read-only; error: Fals, False, True; Language: Arabic, English; Rich text: No, Yes |\n| `_Rich-Text-Panel` | Inputs | 2 | Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-editor>`\n\n[components-editor](https://dashboard-ui-components.pages.dev/?path=/docs/components-editor) · 12 stories · A rich text editor component that provides a comprehensive toolbar for content creation and editing. It supports various formats, multilingual content, and preview functionality.\n\nRelated elements: `<s-editor-toolbar>`, `<s-dropdown>`, `<s-button>`, `<s-icon>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `aiSuggestion` | object | `undefined` |  | AI suggestion config (object or JSON string): { enabled, regenerable, source }. When `enabled`, the editor gets the Moshammer AI highlight and overlays the `actions` slot (regenerate / dismiss) at the top of the content area. |\n| `demoImagePicker` | boolean | `undefined (native file picker)` |  | Story-only. Wires a stub `imagePicker` so the toolbar image button opens it instead of the native file picker. `imagePicker` itself is a function prop and has no Storybook control. |\n| `desc` | text | `undefined` |  | Description text for the editor |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `format` | select | `html` | `html`, `text`, `json` | Output format of the editor content |\n| `fullToolbar` | boolean | `false` |  | Editor full toolbar |\n| `hasError` | boolean | `false` |  | Error state |\n| `hasPreview` | boolean | `false` |  | Enable editor preview |\n| `hideToolbar` | boolean | `false` |  | Render the editor without its toolbar. Also moves the `end` slot in flow, since there is no toolbar row left to overlay. |\n| `max` | number | `undefined` |  | Maximum Characters |\n| `min` | number | `undefined` |  | Minimum Characters |\n| `multilingual` | boolean | `false` |  | Enables multilingual support, if true, the editor will be able to handle multiple languages, the language will be detected automatically based on merchant supported languages |\n| `placeholder` | string | `Editor placeholder` |  | Editor placeholder |\n| `productEmbed` | object | `undefined (disabled)` |  | Enable product embeds in the editor. Pass true for the default products API, or an object with endpoint (and optional searchParam / transform). |\n| `required` | boolean | `false` |  | Required state |\n| `server` | object | `Default server config with type: 'products'` |  | Server configuration including upload type (crucial for each app context) |\n| `showCount` | boolean | `false` |  | Show a live `current/max` character counter below the editor. Requires `max`. Counter follows the document direction so it stays anchored when the editor's own dir flips for per-language RTL. Turns danger-red under `has-error`. |\n| `toolbar` | array | `[[\"bold\",\"italic\",\"underline\",\"strike\"],[{\"direction\":\"rtl\"},{\"align\":[]},{\"list\":\"ordered\"},{\"list\":\"bullet\"}],[{\"header\":1},{\"header\":2},{\"header\":3}],[{\"indent\":\"-1\"},{\"indent\":\"+1\"}],[{\"color\":[]},{\"background\":[]}],[\"image\",\"video\",\"link\"],[\"clean\"],[\"blockquote\",\"code-block\"]]` |  | Custom toolbar configuration for the editor |\n| `value` | string | `Editor value` |  | Editor value |\n\n**Slots**\n\n| Slot | Description |\n|---|---|\n| `endSlot` | HTML projected into the `end` slot — trailing chrome such as a language dropdown. Overlaid on the toolbar's trailing edge, or in flow at the end of the body when `hideToolbar` is set. Set `multilingual` (or let the component detect the slot) to reserve the strip it sits over. |\n| `startSlot` | HTML projected into the `start` slot — a leading icon beside the editor body. Same contract as s-input / s-textarea: pass the element itself (no wrapper), and the component supplies `text-xl text-dark-100`. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--default), [Has Preview](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--has-preview), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--disabled), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--has-error), [Has Character Limits 50](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--has-character-limits-50), [With Character Counter](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--with-character-counter), [With Slots](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--with-slots), [With Slots No Toolbar](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--with-slots-no-toolbar), [Custom Toolbar](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--custom-toolbar), [Ai Suggestion](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--ai-suggestion), [With Product Embed](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--with-product-embed), [With Image Picker](https://dashboard-ui-components.pages.dev/?path=/story/components-editor--with-image-picker)\n\n**Rendered markup (default story)**\n\n```html\n<s-editor value=\"Default editor content...\" placeholder=\"Enter your content here...\" full-toolbar=\"\" class=\"s-editor ltr hydrated\">\n  <!---->\n  <div class=\"s-editor__wrapper\">\n    <s-editor-toolbar class=\"hydrated\">\n      <div id=\"toolbar\" class=\"s-editor__toolbar ql-toolbar ql-snow\" role=\"toolbar\" aria-label=\"Editor toolbar\">\n        <span class=\"ql-formats\" role=\"group\" aria-label=\"Formatting options group\">\n          <button type=\"button\" class=\"ql-bold\" title=\"Bold\" aria-label=\"Bold\" aria-pressed=\"false\">\n            <svg viewBox=\"0 0 18 18\">\n              <path class=\"ql-stroke\" d=\"M5,4H9.5A2.5,2.5,0,0,1,12,6.5v0A2.5,2.5,0,0,1,9.5,9H5A0,0,0,0,1,5,9V4A0,0,0,0,1,5,4Z\">\n              <\/path>\n              <path class=\"ql-stroke\" d=\"M5,9h5.5A2.5,2.5,0,0,1,13,11.5v0A2.5,2.5,0,0,1,10.5,14H5a0,0,0,0,1,0,0V9A0,0,0,0,1,5,9Z\">\n              <\/path>\n            <\/svg>\n          <\/button>\n          <button type=\"button\" class=\"ql-italic\" title=\"Italic\" aria-label=\"Italic\" aria-pressed=\"false\">\n            <svg viewBox=\"0 0 18 18\">\n              <line class=\"ql-stroke\" x1=\"7\" x2=\"13\" y1=\"4\" \n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `rich-text-editor`). Edit the catalog, not this file._\n", "03-components/organisms/more-menu": "# MoreMenu\n\n> Overflow (kebab) menu anchored to a trigger, three layouts, left/right placement.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Containment | 4 - Slot / Composition | existing | figma, storybook | `<s-dropdown>` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `trigger` | slot (IconButton) |\n| `items` | array of MenuItem \\| Divider |\n| `placement` | `start`, `end` |\n\n## RTL and localisation\n\nPlacement uses logical start/end; Figma's Dir=Left/Right becomes placement=end/start under RTL.\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nHeadless layer: **useMenu**.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_moreItems` | More Menu | 4 | Type: Icon, Image, Sperator; danger: Off, On |\n| `More Menu` | More Menu | 4 | Type: Type1, Type2, Type3; Dir: Left, Off, Right |\n\n## Source in the Twilight Storybook today\n\n### `<s-dropdown>`\n\n[components-dropdown](https://dashboard-ui-components.pages.dev/?path=/docs/components-dropdown) · 13 stories · A dropdown component that displays a list of selectable items. It supports various states, search functionality, and different toggle elements.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `active` | boolean | `false` |  | Active state of the dropdown |\n| `autoComplete` | boolean | `false` |  | Enables autocomplete functionality |\n| `children` | string |  |  |  |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `isOnClick` | boolean | `false` |  | Enables click event handling |\n| `items` | array | `[]` |  | Items for the dropdown menu |\n| `layout` | select | `start` | `start`, `end`, `expanded` | Dropdown layout |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean | `false` |  | Enables multiple item selection |\n| `overlayAlignment` | select | `start` | `start`, `end` | Horizontal alignment preference for the dropdown overlay |\n| `searchPlaceholder` | text | `undefined` |  | Placeholder text for the search input |\n| `searchQuery` | text | `undefined` |  | Initial search query |\n| `searchable` | boolean | `false` |  | Enables search functionality |\n| `selectable` | boolean | `false` |  | Enables item selection |\n| `sheetTitle` | text |  |  | Optional title shown in the mobile sheet header |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `itemClick` | Event emitted when an item in the dropdown is clicked. Provides the item's route or identifier. |\n| `onclick` | Event emitted when the dropdown toggle button is clicked. This is the main click event for opening/closing the dropdown. |\n| `onclose` | Event emitted when the dropdown menu is closed. Useful for tracking dropdown visibility state and cleanup operations. |\n| `onopen` | Event emitted when the dropdown menu is opened. Useful for tracking dropdown visibility state. |\n| `onselected` | Event emitted when an item is selected in the dropdown. Provides comprehensive information about the selected item including id, label, value, and icon. |\n| `searchValueChange` | Event emitted when the search input value changes (only when searchable or autocomplete is enabled). Useful for implementing custom search logic or autocomplete functionality. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--default), [Selectable](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--selectable), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--searchable), [Layout Start](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-start), [Layout End](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-end), [Overlay Alignment End](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--overlay-alignment-end), [Layout Expanded](https://dashboard-ui-compon hat set the base's props. Consumers never import the base.\n\nBase component: **BaseField**.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Counter` | Inputs | 24 | State: Active, Active-Filled, Active-Filled-with-one, default, disabled, filled, filled-hover, filled-with-one, hover, preActive, read-only, read-only-with-one; error: Fals, False; size: compact, default |\n| `_counter-buttons` | Inputs | 6 | variant: left, left-delete, right; disabled: False, True |\n| `_quantity-hotreload` | Inputs | 10 | State: Active-Filled, default, filled, hover, preActive; error: False; Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-qty>`\n\n[components-qty](https://dashboard-ui-components.pages.dev/?path=/docs/components-qty) · 9 stories · The Qty component represents a quantity input field. It allows users to input numeric quantities and provides buttons to increment or decrement the value.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `deletable` | boolean | `false` |  | Enable this to show delete button instead of minus button when value is 1 an event will be emitted with the following payload { payload: { target, min, max, value, leastValue, deletable } } |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `hasError` | boolean | `false` |  | Error state |\n| `layout` | string | `sides` |  | Field layout, you can choose between sides and end |\n| `max` | number | `100` |  | Field maximum value |\n| `min` | number | `0` |  | Field minimum value |\n| `placeholder` | string | `Enter the required quantity` |  | Field placeholder |\n| `required` | boolean | `false` |  | Required state |\n| `step` | number | `1` |  | Field step, it's the value to increment or decrement when clicking the buttons. Default is 1. |\n| `theme` | string | `default` |  | Field theme, you can choose between default and circular |\n| `value` | number | `1` |  | Field value |\n| `wide` | boolean | `false` |  | Wide state |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `decreaseClicked` | Emitted when the decrease button is clicked. |\n| `increaseClicked` | Emitted when the increase button is clicked. |\n| `valueChanged` | Emitted when the quantity input field value changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--default), [Circular](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--circular), [Wide](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--wide), [Min Max Values](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--min-max-values), [Step](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--step), [Deletable](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--deletable), [Layout End](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--layout-end), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--has-error), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-qty--disabled)\n\n**Rendered markup (default story)**\n\n```html\n<s-qty value=\"1\" theme=\"default\" layout=\"sides\" min=\"1\" max=\"100\" step=\"1\" placeholder=\"Enter Qty\" class=\"s-qty s-qty--default ltr hydrated\">\n<\/s-qty>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `quantity-field`). Edit the catalog, not this file._\n", "03-components/molecules/icon-picker": "# IconPicker\n\n> Trigger button opening a searchable, paginated icon grid (Hugeicons or Salla icons) inside a dropdown.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Selection | 3 - Base + Global | existing | storybook | `<s-icon-picker>` |\n\n## Anatomy\n\n- trigger (current icon)\n- search input\n- icon grid\n- error message\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `source` | `hugeicons`, `sicon` |\n| `value` | icon token |\n| `searchable` | boolean |\n| `iconCellSize` | css length |\n| `wide` | boolean |\n| `feature` | boolean (gate) |\n| `hasError` | boolean |\n| `required` | boolean |\n\n## States\n\n- closed\n- open\n- disabled\n- error\n- feature-locked\n\n## Tokens\n\n- sys.shape.small\n- sys.color.outline\n- sys.elevation.3\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **BaseField**.\n\nComposes: [DropdownList](../organisms/dropdown-list.md), [Icon](../atoms/icon.md), [SearchField](../molecules/search-field.md).\n\n## Notes and migration\n\nStorybook only: no Figma frame.\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n### `<s-icon-picker>`\n\n[components-iconpicker](https://dashboard-ui-components.pages.dev/?path=/docs/components-iconpicker) · 12 stories · Searchable, paginated icon grid rendered inside a built-in dropdown. Renders the currently-picked icon in a trigger button; the grid opens on click.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `disabled` | boolean |  |  | Disables the picker — trigger becomes non-interactive and the dropdown won't open. |\n| `errorMessage` | text |  |  | Optional error message shown under the trigger when `hasError` is true. |\n| `feature` | boolean | `true` |  | Feature-flag guard. When locked, the trigger won't open and clicks reroute to the upgrade flow. |\n| `hasError` | boolean |  |  | Renders the trigger in an error state (danger border/text). |\n| `iconCellSize` | text | `2.5rem` |  | Height / width of each grid tile. |\n| `iconSize` | text | `1.25rem` |  | Font size of icons inside grid cells. |\n| `minWidth` | text | `10rem` |  | Minimum width of the trigger button. Any CSS length. Ignored when `wide` is set. |\n| `name` | text |  |  | Form field name (participates in native `<form>` submission). |\n| `placeholder` | text |  |  | Search-input placeholder. |\n| `required` | boolean |  |  | Marks the field as required for native form validity. |\n| `searchable` | boolean | `true` |  | Show the search input above the grid. |\n| `source` | string | `hugeicons` | `hugeicons`, `sicon` | Icon library — `hugeicons` (prefixed) or `sicon`. |\n| `value` | text |  |  | Selected icon name / class token. |\n| `wide` | boolean |  |  | Stretch the trigger to fill its container; the panel widens to match. Takes precedence over `min-width`. |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `valueChanged` | Emitted when an icon is picked. `event.detail.payload.value` carries the token. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--default), [With Value](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--with-value), [Salla Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--salla-icons), [No Search](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--no-search), [Custom Sizing](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--custom-sizing), [Wide](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--wide), [Feature Locked](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--feature-locked), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--disabled), [With Error](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--with-error), [Required](https://dashboard-ui-components.pages.dev/?path=/story/components-iconpicker--required), [With Value Display](https://dashboard-ui-components.pages.dev/?path=/story le height. Applies when layout is \"text\". |\n| `checked` | boolean | `false` |  | Radio checked state |\n| `desc` | string |  |  | Radio description |\n| `direction` | string | `col` |  | Radio direction, you can choose between col (vertical) or row (horizontal) |\n| `disabled` | boolean | `false` |  | Boolean indicating whether the radio is disabled |\n| `feature` | boolean | `true` |  | Feature based state |\n| `hasError` | boolean | `false` |  | Boolean indicating whether the radio has an error |\n| `items` | text | `[]` |  | Multiple Radio value |\n| `label` | string |  |  | Radio label |\n| `layout` | string | `default` |  | Radio layout style, you can choose between default, text, image, color |\n| `loading` | boolean | `false` |  | Replaces every option with a skeleton placeholder shaped like the current layout. Per-option loading is also supported via `loading: true` on an individual item. |\n| `required` | boolean | `false` |  | If the radio is required |\n| `value` | text |  |  | Single Radio value |\n| `wide` | boolean | `false` |  | Boolean indicating whether the radio occupies full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onChange` | Emitted when the radio selection changes (native change event). |\n| `onInput` | Emitted when the radio input is modified (native input event). |\n| `onValueChanged` | Emitted when the radio value changes. Payload includes value, checked state, and all options. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--default), [Checked](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--checked), [Group Options](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--group-options), [Row Direction](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--row-direction), [Text Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--text-layout), [Text Layout Auto Height](https , then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **BaseField**.\n\nComposes: [DropdownList](../organisms/dropdown-list.md).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_dropdown-single` | Inputs | 29 | Language: Arabic, English; state: Active, Active-Filled, default, disabled, filled, hover, preActive, read-only; error: False, True; Add new value: Off, On |\n| `basic-dropdown-single` | Inputs | 29 | State: Active, Active-Filled, default, disabled, filled, filled-hover, hover, preActive, read-only; error: False, True; Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-select>`\n\n[components-select](https://dashboard-ui-components.pages.dev/?path=/docs/components-select) · 29 stories · Select component provides a dropdown interface for choosing from a list of options. It supports single and multiple selection, search functionality, grouping, and various customization options.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `addMissingItem` | boolean | `false` |  | Allow adding new items |\n| `allowParentSelect` | boolean | `true` |  | When false and layout is drawer, clicking a parent item opens the drawer/toggles children instead of selecting the parent. When true, parent items remain selectable. |\n| `autocomplete` | boolean |  |  | Enables this option to fetch items from server dynamically based on the search query |\n| `cancelLabel` | text |  |  | Label of the cancel action. Defaults to the translated \"Cancel\". |\n| `children` | string |  |  |  |\n| `confirmLabel` | text |  |  | Label of the confirm action. Defaults to the translated \"Save\". |\n| `confirmable` | boolean |  |  | Buffers the selection behind sticky confirm/cancel actions at the end of the dropdown. No `selectChange` is emitted while the dropdown is open — confirm emits it once (plus `selectConfirm`), cancel emits `selectCancel` and restores the value the dropdown opened with. |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | text | `undefined` |  | HTML content to render in the end slot |\n| `hasError` | boolean |  |  | Error state |\n| `hideClearButton` | boolean | `false` |  | Hide the clear button, useful in certain cases |\n| `items` | array | `[]` |  | Options for the select |\n| `layout` | select | `default` | `default`, `drawer` | Layout mode for the select dropdown |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean |  |  | Enables multiple selection mode, you can then choose either tags or count of selected items, count is default |\n| `overlayAlignment` | string | `start` | `start`, `end` | Horizontal alignment preference for the dropdown overlay |\n| `placeholder` | string |  |  | Placeholder text |\n| `readonly` | boolean | `false` |  | The value cannot change, but the component stays usable: the dropdown still opens and closes, and the search box still filters. Selecting, select-all, add-new, drawer navigation, the clear button and tag removal are all locked. Use it for async work that must not be interrupted, or for view-only permissions; unlike `disabled`, it never greys out the whole component or force-closes the overlay. |\n| `required` | boolean |  |  | Required state |\n| `responsive` | boolean |  |  | Responsive mode |\n| `searchPlaceholder` | text | `undefined` |  | Search input placeholder |\n| `searchable` | boolean |  |  | Enables search functionality |\n| `selectAll` | boolean |  |  | Shows a select-all row in the dropdown. Works only when multiselect is enabled. |\n| `sheetTitle` | text |  |  | Optional title shown in the mobile sheet header |\n| `size` | select |  | `md`, `lg` | Size of the select component |\n| `tags` | boolean |  |  | Display selections as tags |\n| `toggleSlot` | text | `undefined` |  | HTML content to render in the toggle slot. When provided, replaces the default input-wrapper. Element should have data-toggle attribute. |\n| `value` | string |  |  | Selected value(s) |\n| `wide` | boolean |  |  | Full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `addNewItem` | Emitted when user clicks to add a missing item. Provides value and searchString. |\n| `optionsChange` | Emitted when the value of options changes. |\n| `searchValueChange` | Emitted when the search value changes in searchable mode. |\n| `selectChange` | Emitted when the value of the select component changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-select--default), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-select--searchable), [Auto Complete](https://dashboard-ui-components.pages.dev/?path=/story/components-select--auto-complete), [With End Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-slot), [With End Overlay Alignment](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-overlay-alignment), [With Toggle Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-toggle-slot), [With Groups And Thumbnails](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-groups-and-thumbnails), [Nested Options](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-options), [Drawer Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout), [Drawer Layout No Parent Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout-no-parent-select), [Nested With Child Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-with-child-icons), [Multi Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select), [Mul ents** that set the base's props. Consumers never import the base.\n\nBase component: **BaseField**.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `searchInput` | Inputs | 16 | State: Active, Active-Filled, Active-Filled-noResult, Active-recommendation, default, filled, hover, preActive; error: False; Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-input>` — type=autocomplete\n\n[components-input](https://dashboard-ui-components.pages.dev/?path=/docs/components-input) · 17 stories · Input component is one of the most used components in any application, it is used to get user different types of input in a text field.\n\nRelated elements: `<s-icon>`, `<s-dropdown>`, `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `aiSuggestion` | object | `undefined` |  | AI suggestion config (object or JSON string): { enabled, regenerable, source }. When `enabled`, the input gets the Moshammer AI highlight and reveals the `actions` slot (regenerate / dismiss). `regenerable` keeps the slot visible without the highlight. |\n| `autocomplete` | array |  |  |  |\n| `desc` | text | `undefined` |  | Input description, you can use it to add a description to the input |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | string |  |  |  |\n| `hasError` | boolean | `false` |  | Error state |\n| `hasPreview` | boolean | `false` |  | Enable input preview |\n| `max` | number | `undefined` |  | Input Maximum value |\n| `min` | number | `undefined` |  | Input Minimum value |\n| `multilingual` | boolean | `false` |  | Enables multilingual support, if true, the input will be able to handle multiple languages, the language will be detected automatically based on merchant supported languages |\n| `noBorder` | boolean | `false` |  | Remove input borders, use it in complex component in your app if needed |\n| `patt gs` | boolean |  |  | Display selections as tags |\n| `toggleSlot` | text | `undefined` |  | HTML content to render in the toggle slot. When provided, replaces the default input-wrapper. Element should have data-toggle attribute. |\n| `value` | string |  |  | Selected value(s) |\n| `wide` | boolean |  |  | Full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `addNewItem` | Emitted when user clicks to add a missing item. Provides value and searchString. |\n| `optionsChange` | Emitted when the value of options changes. |\n| `searchValueChange` | Emitted when the search value changes in searchable mode. |\n| `selectChange` | Emitted when the value of the select component changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-select--default), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-select--searchable), [Auto Complete](https://dashboard-ui-components.pages.dev/?path=/story/components-select--auto-complete), [With End Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-slot), [With End Overlay Alignment](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-overlay-alignment), [With Toggle Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-toggle-slot), [With Groups And Thumbnails](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-groups-and-thumbnails), [Nested Options](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-options), [Drawer Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout), [Drawer Layout No Parent Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout-no-parent-select), [Nested With Child Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-with-child-icons), [Multi Select](ht ion` | string | `col` |  | Radio direction, you can choose between col (vertical) or row (horizontal) |\n| `disabled` | boolean | `false` |  | Boolean indicating whether the radio is disabled |\n| `feature` | boolean | `true` |  | Feature based state |\n| `hasError` | boolean | `false` |  | Boolean indicating whether the radio has an error |\n| `items` | text | `[]` |  | Multiple Radio value |\n| `label` | string |  |  | Radio label |\n| `layout` | string | `default` |  | Radio layout style, you can choose between default, text, image, color |\n| `loading` | boolean | `false` |  | Replaces every option with a skeleton placeholder shaped like the current layout. Per-option loading is also supported via `loading: true` on an individual item. |\n| `required` | boolean | `false` |  | If the radio is required |\n| `value` | text |  |  | Single Radio value |\n| `wide` | boolean | `false` |  | Boolean indicating whether the radio occupies full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onChange` | Emitted when the radio selection changes (native change event). |\n| `onInput` | Emitted when the radio input is modified (native input event). |\n| `onValueChanged` | Emitted when the radio value changes. Payload includes value, checked state, and all options. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--default), [Checked](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--checked), [Group Options](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--group-options), [Row Direction](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--row-direction), [Text Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--text-layout), [Text Layout Auto Height](https://dashboard-ui-components.pages.dev/?path=/story/components-radio--text-layout-auto-height), [Color Layout](https://dashboard-ui-components.pages.dev/?path=/story
