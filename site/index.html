<style>
/*
 * Salla Design System - CSS custom properties

  --ref-palette-amber-600: #d18f36;
  --ref-palette-amber-800: #8f5f22;
  --ref-palette-blue-50: #ecf3fe;
  --ref-palette-blue-200: #cbe0fb;
  --ref-palette-blue-500: #5196f3;

  --ref-font-size-2xl: 24px;
  --ref-font-size-3xl: 30px;
  --ref-font-size-4xl: 36px;
  --ref-font-size-5xl: 48px;
  --ref-font-line-height-4: 16px;
  --ref-font-line-height-5: 20px;
  --ref-font-line-height-6: 24px;

  /* ---------- REFERENCE: shadow (Figma Shadows/*) ---------- */

  /* ---------- REFERENCE: motion (proposed) ---------- */

  --sys-color-danger-primary: var(--ref-palette-red-500);

  --sys-color-danger-darker: var(--ref-palette-red-800);

  --sys-color-warning-darker: var(--ref-palette-amber-800);
  --sys-color-info-lighter: var(--ref-palette-blue-50);
  --sys-color-info-light: var(--ref-palette-blue-200);
  --sys-color-info-primary: var(--ref-palette-blue-500);

  --sys-color-upgrade-primary: var(--ref-palette-gold-200);
  --sys-color-upgrade-dark: var(--ref-palette-gold-500);

  /* ---------- SYSTEM: shape ---------- */
  --sys-shape-none: var(--ref-radius-none);
  --sys-shape-extra-small: var(--ref-radius-md);
  --sys-shape-small: var(--ref-radius-xl);
  --sys-shape-medium: var(--ref-radius-2xl);
  --sys-shape-large: var(--ref-radius-3xl);
  --sys-shape-full: var(--ref-radius-full);

  /* ---------- SYSTEM: typography (font shorthand values) ---------- */
  --sys-type-display-lg: var(--ref-font-weight-bold) var(--ref-font-size-5xl) / 1 var(--ref-font-family-base);
  --sys-type-headline-lg: var(--ref-font-weight-bold) var(--ref-font-size-2xl) / var(--ref-font-line-height-8) var(--ref-font-family-base);
  --sys-type-headline-md: var(--ref-font-weight-bold) var(--ref-font-size-xl) / var(--ref-font-line-height-7) var(--ref-font-family-base);
  --sys-type-title-lg: var(--ref-font-weight-bold) var(--ref-font-size-lg) / var(--ref-font-line-height-7) var(--ref-font-family-base);
  --sys-type-title-md: var(--ref-font-weight-bold) var(--ref-font-size-md) / var(--ref-font-line-height-6) var(--ref-font-family-base);
  --sys-type-title-sm: var(--ref-font-weight-bold) var(--ref-font-size-sm) / var(--ref-font-line-height-5) var(--ref-font-family-base);
  --sys-type-body-lg: var(--ref-font-weight-regular) var(--ref-font-size-md) / var(--ref-font-line-height-6) var(--ref-font-family-base);
  --sys-type-body-md: var(--ref-font-weight-regular) var(--ref-font-size-sm) / var(--ref-font-line-height-5) var(--ref-font-family-base);
  --sys-type-body-sm: var(--ref-font-weight-regular) var(--ref-font-size-xs) / var(--ref-font-line-height-4) var(--ref-font-family-base);
  --sys-type-label-lg: var(--ref-font-weight-medium) var(--ref-font-size-md) / var(--ref-font-line-height-6) var(--ref-font-family-base);
  --sys-type-label-md: var(--ref-font-weight-medium) var(--ref-font-size-sm) / var(--ref-font-line-height-5) var(--ref-font-family-base);
  --sys-type-label-sm: var(--ref-font-weight-medium) var(--ref-font-size-xs) / var(--ref-font-line-height-4) var(--ref-font-family-base);

  /* ---------- SYSTEM: elevation ---------- */
  --sys-elevation-0: none;
  --sys-elevation-1: var(--ref-shadow-sm);
  --sys-elevation-2: var(--ref-shadow-md);

  /* ---------- SYSTEM: focus ---------- */
  --sys-focus-ring: 0 0 0 2px var(--ref-palette-teal-100);

  /* ---------- COMPONENT ---------- */
  --comp-button-height-sm: var(--ref-size-control-sm);

  --comp-button-gap: var(--ref-space-2xs);
  --comp-button-border-width-filled: 2px;
  --comp-button-border-width-outlined: 1px;
  --comp-button-shape: var(--sys-shape-small);
  --comp-button-icon-size: var(--ref-size-icon-sm);

  --comp-text-field-min-height: var(--ref-size-control-md);
  --comp-text-field-padding-x: var(--ref-space-lg);
  --comp-text-field-padding-y: var(--ref-space-sm);
  --comp-text-field-gap: var(--ref-space-sm);
  --comp-text-field-shape: var(--sys-shape-small);
  --comp-text-field-label-gap: var(--ref-space-lg);

  --comp-checkbox-size-sm: 16px;
  --comp-checkbox-size-md: 20px;
  --comp-checkbox-padding: var(--ref-space-3xs);
  --comp-checkbox-shape: var(--sys-shape-extra-small);

  --comp-toggle-size-sm: 16px;
  --comp-toggle-size-default: 24px;
  --comp-toggle-track-width-default: 39px;

  --comp-status-height: 24px;
  --comp-status-dot-size: 10px;
  --comp-status-gap: var(--ref-space-2xs);
  --comp-status-padding-x: var(--ref-space-sm);

  --comp-alert-padding-x: var(--ref-space-4xl);
  --comp-alert-padding-y: var(--ref-space-2xl);
  --comp-alert-gap: var(--ref-space-sm);
  --comp-alert-accent-width: 3px;
  --comp-alert-icon-size: var(--ref-size-icon-md);
  --comp-alert-shape: var(--sys-shape-small);

  --comp-tab-indicator-width: 2px;
  --comp-tab-padding-y: var(--ref-space-sm);

  --comp-top-app-bar-padding-x: var(--ref-space-9xl);

  --comp-navigation-drawer-width: 225px;

  --comp-menu-width: 240px;

  --comp-tooltip-padding: var(--ref-space-lg);

/* Dark theme hook. Salla ships light only; these placeholders prove the sys tier
   can be re-mapped without touching components. */
:root[data-theme="dark"] {
  --sys-color-surface: #0f1f22;
  --sys-color-surface-input: #14272b;
  --sys-color-outline: #24393d;
  --sys-color-text-primary: #f3f7f7;
  --sys-color-text-secondary: #a7b6b8;
}

</style>
<style>

const DATA = {"pages": {"03-components/README": "# Components\n\nEvery component classified by **atomic level** (how it composes) and **Material category** (how you find it), with its **structure type** (how it is built). Generated from `catalog/components.json`.\n\n| Total | Existing in Figma / Storybook | Proposed (gap) | Page references |\n|---|---|---|---|\n| 92 | 79 | 10 | 3 |\n\n## By atomic level\n\n### Atoms (23)\n\nAtoms are the smallest usable UI units: a button, an icon, a checkbox. They do one thing, take tokens directly and never know about product data.\n\n| Component | Material category | Structure | Status | What it is |\n|---|---|---|---|---|\n| [Button](atoms/button.md) | Actions | 1 | existing | The single action trigger. |\n| [IconButton](atoms/icon-button.md) | Actions | 3 | proposed | Icon-only button. |\n| [Link](atoms/link.md) | Actions | 3 | proposed | Inline text action. |\n| [Icon](atoms/icon.md) | Communication | 2 | existing | A single glyph from the Salla icon set. |\n| [Checkbox](atoms/checkbox.md) | Selection | 3 | existing | Bare selection control with true / false / mixed states in two sizes. |\n| [Radio](atoms/radio.md) | Selection | 3 | existing | Bare single-choice control in two sizes. |\n| [Switch](atoms/toggle.md) | Selection | 3 | existing | On/off control (Material: Switch). |\n| [LoadingIndicator](atoms/loading-indicator.md) | Communication | 1 | existing | Spinner, dots or line progress in nine sizes from 8px to 88px. |\n| [StatusIndicator](atoms/status-indicator.md) | Communication | 1 | existing | The 10px coloured dot. |\n| [Avatar](atoms/avatar.md) | Data display | 1 | existing | Image, text initials, icon or fallback in six sizes, circular or rectangular. |\n| [Chip](atoms/chip.md) | Selection | 1 | existing | Compact tag used in table cells and multi-select fields. |\n| [Flag](atoms/flag.md) | Data display | 2 | existing | Country flag glyphs, one per ISO 3166 code (265 in Figma). |\n| [SocialIcon](atoms/social-icon.md) | Data display | 2 | existing | Brand logos (Facebook, Google, Google Ads, Meta, Snapchat, TikTok, YouTube, Instagram, X). |\n| [Illustration](atoms/illustration.md) | Communication | 2 | existing | Spot illustrations for empty states and onboarding, with web and mobile variants. |\n| [FieldLabel](atoms/label.md) | Text inputs | 1 | existing | Label line above a field: text, optional required mark, optional info icon. |\n| [HelperText](atoms/helper-text.md) | Text inputs | 1 | existing | Line under a field: hint, error, character count, variables hint or file delete action. |\n| [PasswordHint](atoms/password-hint.md) | Communication | 1 | existing | One requirement line (pending / success / danger) used by PasswordField. |\n| [StepperButton](atoms/stepper-button.md) | Actions | 1 | existing | The +/- buttons flanking QuantityField, including the delete-at-one variant. |\n| [TranslationToggle](atoms/translation-toggle.md) | Text inputs | 1 | existing | The small EN/AR language switch inside bilingual fields (Storybook: LingualField). |\n| [ProgressCircle](atoms/progress-circle.md) | Communication | 1 | existing | Circular determinate progress (25/50/75/100 in Figma, should accept any value). |\n| [StepIndicator](atoms/step-indicator.md) | Navigation | 1 | existing | One node of the Stepper: number or check in a circle with a connector. |\n| [Divider](atoms/divider.md) | Containment | 1 | proposed | Horizontal or vertical rule. |\n| [Text](atoms/text.md) | Communication | 1 | proposed | Typography primitive exposing the Material type roles (display, headline, title, body, label) that map onto the Figma Bold/Medium/Regular $text-* styles. |\n\n### Molecules (38)\n\nMolecules are small groups of atoms working as a unit: a labelled field, a status pill, a breadcrumb. They own a single, clear responsibility.\n\n| Component | Material category | Structure | Status | What it is |\n|---|---|---|---|---|\n| [BaseField (internal)](molecules/base-field.md) | Text inputs | 3 | existing | The internal base for every field: label + container (icon-start, control, subtext/unit, translation toggle, info) + helper text. |\n| [TextField](molecules/text-field.md) | Text inputs | 3 | existing | Single-line text entry. |\n| [TextareaField](molecules/textarea-field.md) | Text inputs | 3 | existing | Multi-line text entry with optional rich-text toolbar. |\n| [PasswordField](molecules/password-field.md) | Text inputs | 3 | existing | Masked entry with show/hide toggle and an optional requirements checklist (112 Figma variants collapse to four props). |\n| [EmailField](molecules/email-field.md) | Text inputs | 3 | existing | TextField pre-configured with type=email, mail icon and email validation. |\n| [AmountField](molecules/amount-field.md) | Text inputs | 3 | existing | Numeric / currency entry with the Saudi Riyal symbol as trailing unit. |\n| [PhoneField](molecules/phone-field.md) | Text inputs | 3 | existing | Phone entry with country-code picker (Flag + code) as leading control. |\n| [SearchField](molecules/search-field.md) | Text inputs | 3 | existing | Search entry with magnifier, clear button, recommendations and no-results states. |\n| [OtpField](molecules/otp-field.md) | Text inputs | 3 | existing | Single-digit boxes for verification codes. |\n| [QuantityField](molecules/quantity-field.md) | Text inputs | 3 | existing | Number entry with StepperButtons, compact and default sizes, and the hot-reload (inline save) variant used in tables. |\n| [SelectField](molecules/select-field.md) | Text inputs | 3 | existing | Single-choice dropdown field. |\n| [MultiSelectField](molecules/multi-select-field.md) | Text inputs | 3 | existing | Multi-choice dropdown field rendering selections as Chips (Storybook: Tags Input). |\n| [UploadField](molecules/upload-field.md) | Text inputs | 3 | existing | File picker with drag and drop: inline, single image, single video, multiple (row or column). |\n| [ColorPickerField](molecules/color-picker-field.md) | Text inputs | 3 | existing | Colour swatch + hex entry with a picker popover. |\n| [CheckboxField](molecules/checkbox-field.md) | Selection | 3 | existing | Checkbox + label + optional description / info tooltip. |\n| [RadioField](molecules/radio-field.md) | Selection | 3 | existing | Radio + label, used inside a RadioGroup. |\n| [RadioImage](molecules/radio-image.md) | Selection | 2 | existing | Selectable image card (visual radio) for templates, themes, layouts. |\n| [RadioColor](molecules/radio-color.md) | Selection | 2 | existing | Selectable colour swatch (visual radio) for product colour variants. |\n| [SwitchField](molecules/toggle-field.md) | Selection | 3 | existing | Switch + label with the switch at inline-start or inline-end. |\n| [Status](molecules/status.md) | Communication | 3 | existing | StatusIndicator + label in subtle (dot + text) or strong (pill) appearance. |\n| [Loading](molecules/loading.md) | Communication | 3 | existing | LoadingIndicator + localised label for block-level loading. |\n| [AvatarWithText](molecules/avatar-with-text.md) | Data display | 4 | existing | Avatar + primary and secondary text lines (customer, product, staff rows). |\n| [AvatarStack](molecules/avatar-stack.md) | Data display | 1 | existing | Overlapping or spaced row of Avatars with +N overflow. |\n| [Breadcrumb](molecules/breadcrumb.md) | Navigation | 4 | existing | Path navigation with icon, text, more (…) and separator items; collapses past 5 items and on mobile. |\n| [BreadcrumbItem](molecules/breadcrumb-item.md) | Navigation | 1 | existing | One breadcrumb node: icon, text or overflow menu trigger. |\n| [Tab](molecules/tab.md) | Navigation | 1 | existing | One tab, primary (dashboard top nav) or secondary (page sub-nav), contained or plain, with active/hover states. |\n| [NavigationItem](molecules/side-menu-item.md) | Navigation | 1 | existing | One entry of the side navigation (first / middle / last for grouping radius). |\n| [MenuItem](molecules/menu-item.md) | Containment | 1 | existing | Row inside MoreMenu: icon or image + label, optional danger tone; separators become Divider. |\n| [ListItem](molecules/list-item.md) | Containment | 4 | existing | Row inside DropdownList and pickers: plain, with description, with flag, with image; supports checkbox, selected, danger, disabled and 'feature' (upsell) states. |\n| [TableCell](molecules/table-cell.md) | Data display | 2 | existing | Typed cells: name, sub-name, image, products, amount, percentage, status, tags, markets (flag + text), variant, data (text / date-time / dropdown), actions (1-3 icons or toggle), checkbox, chip, disabled, sort and header. |\n| [CalendarCell](molecules/date-time-cell.md) | Selection | 1 | existing | Day, number and time cells used by the date/time picker. |\n| [AccountMenuTrigger](molecules/header-avatar.md) | Navigation | 1 | existing | Avatar + store name + chevron in the top bar that opens the account menu. |\n| [PageTitle](molecules/page-title.md) | Navigation | 4 | existing | Page heading row: back / breadcrumb, title, optional status and actions slot. |\n| [LearnMore](molecules/learn-more.md) | Communication | 1 | existing | Help card linking to documentation, default and small sizes, desktop and mobile. |\n| [GlobalSearch](molecules/global-search.md) | Text inputs | 1 | existing | Header search: collapsed button-only or full field. |\n| [FilterResults](molecules/filter-results.md) | Communication | 1 | existing | Applied-filters summary bar above a table with a clear action. |\n| [PanelHeader](molecules/panel-header.md) | Containment | 4 | existing | Title + actions row for Panel / Table containers, default and small. |\n| [InlineAlert](molecules/inline-alert.md) | Communication | 3 | existing | Compact, non-dismissible alert placed under a field or inside a card (Alertbox Type=Inline). |\n\n### Organisms (24)\n\nOrganisms are complex sections built from molecules and atoms: the data table, the top app bar, the dropdown list. They usually manage state or layout.\n\n| Component | Material category | Structure | Status | What it is |\n|---|---|---|---|---|\n| [Alert](organisms/alert.md) | Communication | 1 | existing | Contextual message with icon, optional title, body, optional button and close. |\n| [AlertBanner](organisms/alert-banner.md) | Communication | 2 | existing | Full-width page-level announcement (two layouts). |\n| [UpgradeCard](organisms/alert-upgrade.md) | Communication | 2 | existing | Plan-upgrade promo card, desktop and mobile. |\n| [DropdownList](organisms/dropdown-list.md) | Containment | 4 | existing | The floating list behind SelectField, MultiSelectField, pickers and menus: one to three layers, accordion, flags, images, checkboxes, descriptions, no-results and create-new states. |\n| [DateTimePicker](organisms/date-time-picker.md) | Selection | 5 | existing | Calendar and time picker popover built from CalendarCell. |\n| [MoreMenu](organisms/more-menu.md) | Containment | 4 | existing | Overflow (kebab) menu anchored to a trigger, three layouts, left/right placement. |\n| [NavigationDrawer](organisms/side-menu.md) | Navigation | 4 | existing | The dashboard side navigation (Material: navigation drawer) composed of NavigationItems and section headers. |\n| [TopAppBar](organisms/header.md) | Navigation | 4 | existing | Dark-teal top bar: logo, primary tabs, global search, notifications, account menu. |\n| [SecondaryNavBar](organisms/header-subcategory.md) | Navigation | 4 | existing | Second-level bar under the TopAppBar carrying secondary Tabs and a help / CTA area. |\n| [Tabs](organisms/tabs.md) | Navigation | 5 | existing | Tab list + panels. |\n| [DataTable](organisms/table.md) | Data display | 4 | existing | The merchant list view: header (title, tabs, search, filters), column headers with sort / select-all, typed cells, sticky action column, row selection with bulk bar, delete, edit sheet, pagination footer, mobile card rows, empty and filter-result states. |\n| [MobileRow](organisms/table-row-mobile.md) | Data display | 2 | existing | Card-style row for phones: order, product, customer and default layouts. |\n| [BulkEditSheet](organisms/bulk-edit-sheet.md) | Containment | 4 | existing | Side sheet opened from the DataTable bulk bar to edit selected rows. |\n| [EditSheet](organisms/edit-sheet.md) | Containment | 4 | existing | Inline edit side sheet for one row (default and minimum-cells layouts). |\n| [Stepper](organisms/stepper.md) | Navigation | 5 | existing | Two to five step progress for wizards, desktop and mobile. |\n| [ActionBar](organisms/action-bar.md) | Actions | 4 | existing | Confirm / cancel button group, floating or flat, desktop and mobile. |\n| [BottomSheet](organisms/bottom-sheet.md) | Containment | 4 | existing | Mobile modal surface sliding from the bottom. |\n| [Dialog](organisms/dialog.md) | Containment | 4 | proposed | Centered modal (Storybook: Modal). |\n| [Panel](organisms/panel.md) | Containment | 4 | proposed | Card container with PanelHeader, body and footer slots (Storybook: Panel). |\n| [Tooltip](organisms/tooltip.md) | Communication | 5 | existing | Hover / focus hint on a primary-container surface with a caret. |\n| [Toast](organisms/toast.md) | Communication | 1 | proposed | Transient bottom notification (Material: snackbar). |\n| [EmptyState](organisms/empty-state.md) | Communication | 4 | existing | Illustration + title + description + action for empty lists and no-results. |\n| [Pagination](organisms/pagination.md) | Navigation | 1 | existing | Table footer: page size, range label, previous / next and page numbers. |\n| [Map](organisms/map.md) | Data display | 2 | existing | Embedded map for addresses and branches. |\n\n### Templates (4)\n\nTemplates are page-level layouts with slots and no real content. They fix where organisms go.\n\n| Component | Material category | Structure | Status | What it is |\n|---|---|---|---|---|\n| [ListPage](templates/list-page.md) | Containment | 4 | existing | TopAppBar + SecondaryNavBar + PageTitle + DataTable in a Panel. |\n| [ListDetailPage](templates/list-detail.md) | Containment | 4 | proposed | Two-pane layout used by Orders: list on one side, detail on the other, collapsing to stacked on mobile. |\n| [FormPage](templates/form-page.md) | Containment | 4 | proposed | PageTitle + one or more Panels of fields + sticky ActionBar. |\n| [WizardPage](templates/wizard-page.md) | Navigation | 4 | proposed | Stepper + step content + ActionBar for onboarding and multi-step flows. |\n\n### Pages (3)\n\nPages are templates filled with real merchant data. They are documented as references to production, not built in the library.\n\n| Component | Material category | Structure | Status | What it is |\n|---|---|---|---|---|\n| [Orders list](pages/orders-list.md) | Data display | 4 | reference | s. |\n| [Products list](pages/products-list.md) | Data display | 4 | reference | s. |\n| [Order details](pages/order-details.md) | Containment | 4 | reference | s. |\n\n## By Material category\n\n### Actions (5)\n\n| Component | Atomic level | Structure | Status |\n|---|---|---|---|\n| [Button](atoms/button.md) | atom | 1 | existing |\n| [IconButton](atoms/icon-button.md) | atom | 3 | proposed |\n| [Link](atoms/link.md) | atom | 3 | proposed |\n| [StepperButton](atoms/stepper-button.md) | atom | 1 | existing |\n| [ActionBar](organisms/action-bar.md) | organism | 4 | existing |\n\n### Communication (18)\n\n| Component | Atomic level | Structure | Status |\n|---|---|---|---|\n| [Icon](atoms/icon.md) | atom | 2 | existing |\n| [LoadingIndicator](atoms/loading-indicator.md) | atom | 1 | existing |\n| [StatusIndicator](atoms/status-indicator.md) | atom | 1 | existing |\n| [Illustration](atoms/illustration.md) | atom | 2 | existing |\n| [PasswordHint](atoms/password-hint.md) | atom | 1 | existing |\n| [ProgressCircle](atoms/progress-circle.md) | atom | 1 | existing |\n| [Text](atoms/text.md) | atom | 1 | proposed |\n| [Status](molecules/status.md) | molec rivate base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **self (used by CheckboxField)**.\n\n## Source in Figma today\n\n- Figma node: `12411:21809`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `checkBox` | check Box | 18 | selected: false, mix, true; Status: default, disabled, focus; size: md-20px, sm-16px |\n\n---\n_Generated from `catalog/components.json` (id `checkbox`). Edit the catalog, not this file._\n", "03-components/atoms/flag": "# Flag\n\n> Country flag glyphs, one per ISO 3166 code (265 in Figma).\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Data display | 2 - Standalone | existing | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `code` | ISO 3166-1 alpha-2 |\n| `size` | `sm`, `md` |\n\n## Tokens\n\n- ref.size.icon.*\n\n## How to build it\n\nBuild as **separate, explicitly named components**. Share styling through tokens and small internal layout helpers, not through a shared prop bag.\n\n## Notes and migration\n\nShip as a sprite or lazy-loaded SVGs; do not bundle 265 inline SVGs in the base package.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Flag` | (top level) | - | - |\n\n---\n_Generated from `catalog/components.json` (id `flag`). Edit the catalog, not this file._\n", "03-components/atoms/loading-indicator": "# LoadingIndicator\n\n> Spinner, dots or line progress in nine sizes from 8px to 88px.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Communication | 1 - Configurable | existing | `Loader` |\n\n## Anatomy\n\n- animated shape\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `type` | `spinner`, `dots`, (primary label #004956)\n- sys.color.status.*.primary (danger #f55157, success #00af6c, warning #ffaf44, info #5196f3)\n- sys.color.feature.* (gradient orange 200->300, label orange 800)\n- sys.shape.small (8px)\n- sys.typography.label-md\n\n## RTL and localisation\n\niconStart/iconEnd are logical (inline-start / inline-end) and swap automatically under dir=rtl; do not mirror non-directional glyphs.\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Notes and migration\n\nFigma variant values carry a leading `--` (--primary); drop it in code. The 'link' appearance is a Button in Figma but reads as a Link to users; expose it as `Link` (see link.md) built on the same base. `feature` is a non-semantic upsell accent and must stay out of the semantic status palette.\n\n## Source in Figma today\n\n- Figma node: `14526:107536`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Button` | (top level) | - | - |\n\n---\n_Generated from `catalog/components.json` (id `button`). Edit the catalog, not this file._\n", "03-components/atoms/status-indicator": "# StatusIndicator\n\n> The 10px coloured dot. Base of Status.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Communication | 1 - Configurable | existing | _not in Storybook_ |\n\n## Anatomy\n\n- dot\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `color` | `success`, `danger`, `warning`, `info`, `neutral` |\n| `size` | `xs`, `sm`, `md`, `lg`, `xl`, `2xl` |\n\n## Tokens\n\n- sys.color.status.*.dark (success #008c56, danger #ca4146)\n- sys.shape.full\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_Base Status Indicator` | Status | 30 | Color: danger, info, neutral, success, warning; Size: 2xl, lg, md, sm, xl, xs |\n\n---\n_Generated from `catalog/components.json` (id `status-indicator`). Edit the catalog, not this file._\n", "03-components/atoms/radio": "# Radio\n\n> Bare single-choice control in two sizes. RadioField, RadioImage and RadioColor build on it.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Selection | 3 - Base + Global | existing | `Radio` |\n\n## Anatomy\n\n- ring\n- dot\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `checked` | boolean |\n| `size` | `sm`, `md` |\n| `disabled` | boolean |\n\n## States\n\n- default\n- focus\n- disabled\n\n## Tokens\n\n- sys.color.primary\n- sys.shape.full\n- sys.color.outline\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `radio` | radio Buttton | 12 | Active: Off, On; Status: Default, Disabled, Focus; size: md, sm |\n\n---\n_Generated from `catalog/components.json` (id `radio`). Edit the catalog, not this file._\n", "03-components/atoms/divider": "# Divider\n\n> Horizontal or vertical rule. Exists implicitly as the Separator variants inside Breadcrumb and MoreMenu.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Containment | 1 - Configurable | proposed | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `orientation` | `horizontal`, `vertical` |\n| `inset` | boolean |\n\n## Tokens\n\n- sys.color.outline\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n- Variant filter: `Type=Separator | Sperator`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_breadcrumbItem` | Bread crumb | 20 | Language: Arabic, English; Status: active, default, disabled, hover, onclick; Type: Icon, More, Separator, Text |\n| `_moreItems` | More Menu | 4 | Type: Icon, Image, Sperator; danger: Off, On |\n\n---\n_Generated from `catalog/components.json` (id `divider`). Edit the catalog, not this file._\n", "03-components/atoms/icon-button": "# IconButton\n\n> Icon-only button. Today this is Button with Layout=--circular and no label; promote it to a named global component so the accessible name is a required prop.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Actions | 3 - Base + Global | proposed | _not in Storybook_ |\n\n## Anatomy\n\n- container (circular)\n- icon\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `variant` | same as Button |\n| `appearance` | `filled`, `outlined`, `ghost` |\n| `size` | `sm`, `md`, `lg` |\n| `ariaLabel` | string (required) |\n\n## States\n\n- default\n- hover\n- pressed\n- loading\n- disabled\n- focus-visible\n\n## Tokens\n\n- comp.button.*\n- sys.shape.full\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **BaseButton**.\n\n## Notes and migration\n\nReplaces the ad-hoc icon buttons inside Table (_Table/Refresh Button, _Table/Pin, Table/Cell/Actions icons).\n\n## Source in Figma today\n\n- Variant filter: `Layout=--circular`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Button` | (top level) | - | - |\n\n---\n_Generated from `catalog/components.json` (id `icon-button`). Edit the catalog, not this file._\n", "03-components/atoms/toggle": "# Switch\n\n> On/off control (Material: Switch). Has a loading state, which is unusual and worth keeping because Salla toggles often trigger a server call.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Selection | 3 - Base + Global | existing | `Toggle` |\n\n## Anatomy\n\n- track\n- thumb\n- loading spinner (in thumb)\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `checked` | boolean |\n| `size` | `sm (16px)`, `default (24px, track 39px)` |\n| `loading` | boolean |\n| `disabled` | boolean |\n\n## States\n\n- off\n- on\n- loading\n- disabled\n- focus-visible\n\n## Tokens\n\n- comp.toggle.*\n- sys.color.primary\n- sys.shape.full\n\n## RTL and localisation\n\nThumb travels inline-start -> inline-end; on/off direction mirrors in RTL.\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\n## Notes and migration\n\nFigma exports the whole toggle as one SVG per variant; rebuild it from primitives so the track and thumb take tokens. Keep the name Toggle in Storybook for continuity, alias Switch in docs.\n\n## Source in Figma today\n\n- Figma node: `12411:21835`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Toggle` | Toggle | 20 | Language: Arabic, English; selected: false, true; disabled: false, true; loading: false, true; size: default-24px, sm-16px |\n\n---\n_Generated from `catalog/components.json` (id `toggle`). Edit the catalog, not this file._\n", "03-components/atoms/password-hint": "# PasswordHint\n\n> One requirement line (pending / success / danger) used by PasswordField.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Communication | 1 - Configurable | existing | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `state` | `pending`, `success`, `danger` |\n| `text` | string |\n\n## Tokens\n\n- sys.typography.body-xs\n- sys.color.status.*\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_passwordHints` | Inputs | 6 | Variant: Pending, danger, success; Langauge: Arabic, English |\n| `_passwordValidation` | Inputs | 2 | Language: Arabic, English |\n\n---\n_Generated from `catalog/components.json` (id `password-hint`). Edit the catalog, not this file._\n", "03-components/atoms/step-indicator": "# StepIndicator\n\n> One node of the Stepper: number or check in a circle with a connector.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Navigation | 1 - Configurable | existing | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `state` | `default`, `active`, `success` |\n| `last` | boolean |\n| `index` | number |\n\n## Tokens\n\n- sys.color.primary\n- sys.color.success-primary\n- sys.shape.full\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_Step base` | Steps | 8 | Type: Active, Default, Last, Success; Language: Arabic, English |\n\n---\n_Generated from `catalog/components.json` (id `step-indicator`). Edit the catalog, not this file._\n", "03-components/atoms/chip": "# Chip\n\n> Compact tag used in table cells and multi-select fields. Material: assist / filter / input chip.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| atom | Selection | 1 - Configurable | existing | `Tags Input (chips inside)` |\n\n## Anatomy\n\n- container\n- label\n- optional remove icon\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `kind` | `assist`, `filter`, `input` |\n| `selected` | boolean |\n| `removable` | boolean |\n| `color` | `neutral`, `primary` |\n\n## States\n\n- default\n- hover\n- pressed\n- selected\n- disabled\n\n## Tokens\n\n- sys.shape.full\n- sys.color.outline\n- sys.typography.label-sm\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Table/Cell/Chip` | Table | 6 | Count: Multi, One; Status: Default, Hover, press |\n| `_Table/Chips` | Table | 1 | Status: Gray |\n\n---\n_Generated from `catalog/components.json` (id `chip`). Edit the catalog, not this file._\n", "03-components/pages/products-list": "# Products list\n\n> s.salla.sa/products. ListPage template with ImageCell, AmountCell, QuantityField inline-save and MobileRow kind=product.\n\n| Atomic level | Material category | Structure type | Status | Storybook story |\n|---|---|---|---|---|\n| page | Data display | 4 - Slot / Composition | reference | _not in Storybook_ |\n\n## Props\n\n_No public props beyond the base._\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, | Storybook story |\n|---|---|---|---|---|\n| page | Data display | 4 - Slot / Composition | reference | _not in Storybook_ |\n\n## Props\n\n_No public props beyond the base._\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nTemplate: [ListPage](../templates/list-page.md).\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n---\n_Generated from `catalog/components.json` (id `orders-list`). Edit the catalog, not this file._\n", "00-overview/component-structure-types": "# Component structure types\n\nFive architectural patterns for building components, from the internal *Component Structure Types* document (Product Design, 2025-07-06), with the decision rules and the mapping to Salla components. Every entry in `catalog/components.json` declares one of these in its `structure` field.\n\n## Decision tree\n\n```\nDoes the component render UI?\n├─ No  → 5 Headless (hook / controller)\n└─ Yes\n   Is its main job to frame content supplied by the parent?\n   ├─ Yes → 4 Slot / Composition\n   └─ No\n      Do the variants differ in layout, behaviour or meaning (not just colour/size)?\n      ├─ Yes\n      │   Do they share significant logic or styling?\n      │   ├─ Yes → 3 Base + Global\n      │   └─ No  → 2 Standalone\n      └─ No  → 1 Configurable\n```\n\n## 1. Configurable (single component with internal logic)\n\nAll variations are props. Use when variations are small and visual (colour, size, icon), structure and interaction are the same, and the prop list stays readable.\n\n- **Salla examples:** `Button` (variant × appearance × size × layout), `LoadingIndicator`, `StatusIndicator`, `Avatar`, `Chip`, `Alert`, `HelperText`, `Pagination`.\n- **Pros:** one import, all variants discoverable from props, logic in one place.\n- **Cons:** becomes a god component if props pile up; unclear which combinations are valid.\n- **Salla rule:** more than ~8 props, or any prop that changes *behaviour* rather than *look*, is the signal to split. `InputWrapper` in Figma (24 variants covering text, dropdown, amount, upload, colour picker …) is the cautionary example; it is being split under pattern 3.\n\n## 2. Standalone (separate components with different names)\n\nEach significant variant is its own named component. Use when variants have distinct functions, layouts or semantics, when one component would need many mutually exclusive props, or when variants evolve independently.\n\n- **Salla examples:** `Icon` (one per glyph), `Flag`, `SocialIcon`, `Illustration`, `RadioImage` and `RadioColor`, the `TableCell` family (`NameCell`, `AmountCell`, `StatusCell`, `ActionsCell` …), `MobileRow` kinds, `AlertBanner` and `UpgradeCard` (distinct from `Alert`).\n- **Pros:** small APIs, clear separation, explicit choice by name.\n- **Cons:** possible duplication, more files.\n- **Salla rule:** standalone components that share look share it through tokens and a tiny private layout helper (e.g. `CellLayout`), never by copy-pasting CSS.\n\n## 3. Base + Global (inheritance / composition)\n\nA private base component holds shared logic and minimal styling; public \"global\" components configure it. Use when several components share significant logic but must be exposed as distinct entities, or when you want to control which configurations exist.\n\n- **Salla examples:**\n  - `BaseField` → `TextField`, `TextareaField`, `PasswordField`, `EmailField`, `AmountField`, `PhoneField`, `SearchField`, `OtpField`, `QuantityField`, `SelectField`, `MultiSelectField`, `UploadField`, `ColorPickerField`. This is the Figma `Inputs` section (27 frames) resolved into one base and thirteen globals.\n  - `BaseButton` → `Button`, `IconButton`, `Link`.\n  - `Checkbox` → `CheckboxField`; `Radio` → `RadioField`; `Switch` → `SwitchField`.\n  - `StatusIndicator` → `Status`; `LoadingIndicator` → `Loading`.\n  - `BaseAlert` → `Alert`, `InlineAlert`.\n- **Pros:** shared logic fixed once, controlled complexity, sensible defaults.\n- **Cons:** abstraction overhead; needs planning.\n- **Salla rule:** the base is never exported from the package index and never appears in Storybook navigation (it appears in Figma with the `_` prefix, which we keep for internal frames).\n\n## 4. Slot-based / composition\n\nThe component defines a frame and named slots; the parent supplies content. Use when the component's job is layout or wrapping, when content is application-specific, or when maximum flexibility is needed.\n\n- **Salla examples:** `DataTable` (header, footer, bulk-actions, cells), `TopAppBar` (start / center / end), `NavigationDrawer`, `Dialog` and `BottomSheet` (header / body / footer), `Panel`, `PageTitle` (leading / meta / actions), `ActionBar` (primary / secondary / start), `ListItem` (leading / title / description / trailing, the PDF's `listItemLayout`), `AvatarWithText`, `EmptyState`, all templates.\n- **Pros:** flexible, reusable, decoupled content, readable usage.\n- **Cons:** needs slot documentation; easy to over-use.\n- **Salla rule:** every slot is documented with what it accepts (component types) and a default. A component with one slot and no layout responsibility is a prop, not a slot component.\n\n## 5. Functional / headless (logic only)\n\nBehaviour, state and accessibility without rendering. Exposed as hooks or controllers. Use when logic must be reusable across different UIs or when consumers need full control over markup.\n\n- **Salla examples:** `useTabs` (Tabs), `useListbox` / `useMenu` (DropdownList, MoreMenu, SelectField), `useStepper` (Stepper), `useCalendar` (DateTimePicker), `useDialog` (Dialog, BottomSheet), `useTooltip`, `useDataTable` (sorting, selection, pagination).\n- **Pros:** full control over presentation, reusable logic, clean separation, easy re-theming.\n- **Cons:** more setup, not visible in Figma, needs strong documentation and examples.\n- **Salla rule:** every headless hook ships with a default UI component in the same folder (`Tabs` uses `useTabs`) so designers still have a Figma-visible counterpart, and with a usage example in Storybook's *Docs* tab.\n\n## Mapping summary\n\n| Structure | Count in catalog | Levels where it appears |\n|---|---|---|\n| 1 Configurable | see `docs/03-components/README.md` | mostly atoms, some molecules |\n| 2 Standalone | \" | atoms, molecules, a few organisms |\n| 3 Base + Global | \" | molecules (fields, selection controls) |\n| 4 Slot / Composition | \" | organisms, templates, pages |\n| 5 Headless | \" | organisms with keyboard / focus behaviour |\n\nThe exact list is generated in [`docs/03-components/README.md`](../03-components/README.md).\n", "00-overview/current-state-audit": "# Current state audit\n\nWhat Salla's design system contains today and where it diverges from the target structure. Sources: the `Merchant - Storybook DS` Figma library (branch `dnmyqzYKK9dUJjVHuIWMDS`, page *Main Components (Full)*, extracted 2026-09-22), the `Icons DS_V.1` Figma file (exported 2026-07-07), and the Twilight Storybook at `dashboard-ui-components.pages.dev` (37 components / 162 variants as of July 2026, captured in the salla-design-system skill; the host was not reachable from this environment so story names are taken from that capture).\n\n## 1. Inventory\n\n| Source | Size |\n|---|---|\n| Figma sections | 17 (`Header`, `Bread crumb`, `check Box`, `radio Buttton`, `Toggle`, `Loader`, `Status`, `Avatar`, `Alertbox`, `Inputs`, `Maps`, `Side menu`, `More Menu`, `Drop Down List`, `Table`, `Steps`) + 12 top-level frames outside any section (`Button`, `Icons/Filled`, `Icons/Outline`, `Flag`, `Illustration`, `Illustrations Collection`, `Social media icons`, `Action Buttons`, `searchbar`, `Learn More`, `Products Management`, `Header Primary Tabs`) |\n| Figma component frames | 117 (`catalog/figma-inventory.json`) |\n| Figma variant symbols | ~10,100 |\n| Figma variable collections | `03-Colors` (text / background / border / foreground roles), `04-Token` (Spacing/Sizes, Radius/Sizes). Collections 01 and 02 were not exposed to the MCP search; assumed to be primitives and typography |\n| Figma text styles | `Bold`, `Medium`, `Regular` × `$text-xs … $text-9xl` |\n| Icon library | 4,049 icon names × Style (Stroke 3,889 · Solid 3,889 · Bulk 5 · Twotone 3 · Duotone 3) × Type (Rounded, Sharp) |\n| Storybook components | 37 (Button, Input, LingualField, Textarea, Password, Search, Select, Tags Input, Qty, Checkbox, Radio, Toggle, Loader, Badge/Status, Avatar, AlertBox, Breadcrumb, Tabs, Dropdown, Table, Pagination, Header, Sidebar, Panel, Modal, Tooltip, ButtonsGroup, Steps, Date Picker, File Upload, Color Picker, Phone, Number …) |\n\nFull per-frame variant properties: `catalog/figma-inventory.json`. Classification of every frame: `docs/03-components/README.md`.\n\n## 2. What is working well\n\n- **Role-based colour variables.** `03-Colors` already names colours by role (`text/primary/link`, `background/status/info/lighter`, `border/default`). This maps directly onto Material system tokens.\n- **Base + variants pattern is already emergent.** `_TextInput` → `InputWrapper`, `checkBox` → `checkboxfield`, `_Base Status Indicator` → `Status`, `_Step base` → `Steps`, `_listItem` → `Drop Down List`. The `_` prefix for internal frames is a real convention.\n- **Bilingual coverage.** Almost every frame has `Language=Arabic|English`, and fields carry a translation toggle.\n- **Rich state coverage on fields and buttons.** Hover, pressed, loading, disabled, error and read-only are all designed.\n- **Typed table cells.** 18 cell types mirror what the product actually renders.\n- **Component descriptions with Arabic and English keywords** on the main component sets (Button, InputWrapper, Toggle, checkBox, Status …), which makes Figma search work in both languages.\n\n## 3. Structural issues\n\n| # | Issue | Evidence | Impact | Fix (target) |\n|---|---|---|---|---|\n| S1 | **No hierarchy.** Sections are a flat list mixing atoms (`check Box`), molecules (`Status`), organisms (`Table`) and a template (`Products Management`). | 17 sections, 12 orphan frames | Designers cannot tell what composes what; engineers cannot tell what to build first | Sections become `Atoms / Molecules / Organisms / Templates`, sub-grouped by Material category |\n| S2 | **God component for inputs.** `InputWrapper` has a `Variant` property with 12 values covering text, search, amount, colour picker, dropdown single/multiple/basic, email, upload … | 24 variants; 27 frames in `Inputs` | Unclear API; any change touches every field | Split into `BaseField` (internal) + 13 named field components (structure type 3) |\n| S3 | **Two spacing scales that contradict each other.** `spacing/3xs = 8px` but `Spacing/Sizes/3xs = 2px`; `spacing/2xs = 10px` but `Spacing/Sizes/2xs = 4px`; `spacing/xs = 12px` but `Spacing/Sizes/xs = 6px` | Button, Alertbox, Header use `spacing/*`; fields, Status, Side menu, Table use `Spacing/Sizes/*` | Same pixel value, two names; migrations break | `Spacing/Sizes` becomes the scale; alias table in `docs/02-styles/spacing.md` |\n| S4 | **Language and device as variant axes.** `Language=Arabic|English` and `--device=desktop|mobile` double or quadruple every component's variant count | `_passwordInput` has 112 variants; Alertbox 64 | Library size, maintenance cost, and it hides that RTL should be automatic | Language becomes a page-level toggle (Figma variable mode); device stays only where layout truly differs |\n| S5 | **Eight interaction states on fields.** `default, hover, preActive, Active, filled, Active-Filled, read-only, disabled` (+ error) | every input frame | Not implementable as CSS states; `preActive` and `Active-Filled` have no DOM equivalent | Material list: enabled, hover, focus, filled, read-only, disabled + orthogonal `error` |\n| S6 | **Components missing from Figma but present in Storybook / production.** Modal, Panel, Toast. (Tooltip exists as a component set, node `1933:1790`, but only inside `checkboxfield`; it needs its own frame.) | Storybook has Modal, Panel, Tooltip | Engineers build from code, designers from nothing | Added to catalog as `proposed`; design from the spec |\n| S7 | **Components in Figma without a Storybook story.** RadioImage, RadioColor, AvatarStack, Flag, Illustration, Learn More, More Menu layouts, Bulk Edit Sheet, Edit Sheet, mobile table rows, Maps | catalog `storybook: null` | Designed but not shipped | Prioritise in the build order |\n| S8 | **Assets stored as components.** `_AvatarplaholderImages`, `_BanksPlaceholderImages`, `Illustrations Collection`, 265 flags as variants | | Bloats the library; not tokenable | Move to `assets/`; keep one `Flag` / `Illustration` component with a `name` prop |\n| S9 | **Order-status presets baked into the Table.** `Table/Status` has 9 variants (`wating payment`, `delevery`, `deliverd`, `retrevied` …) | | Business data in the component layer | One `Status` molecule; the mapping order status → semantic type lives in data |\n| S10 | **Loader has nine sizes** (8 to 88px) while everything else has three to six | `_LoadingIndicator` | Inconsistent scale | Collapse to five with aliases |\n| S11 | **Elevation is only partly defined.** `Shadows/md` and `Shadows/lg` effect styles exist (More Menu, Tooltip, Table/Footer) but DropdownList, Bottom sheet, Bulk/Edit sheets and the floating ActionBar carry no shadow style | `shadow/lg/type-1|2/*` variables | Sheets ship with ad-hoc shadows | Map to `sys.elevation.0-4`, add `Shadows/sm|xl`, bind the remaining surfaces |\n| S12 | **Some hard-coded values escape the tokens.** Status pill radius `30px`, Alertbox `gap 4px`, LearnMore `gap 5px`, header tag radius `140px`, legacy `07--light-theme/*` and `spacing-xs/md/lg` variables, `radius/sm` resolving to 8px | design contexts on `Status`, `Alertbox`, `Learn More`, `Header`, `Table/Footer` | Theme changes miss them | Map to `sys.shape.full`, `sys.space.*`, `sys.color.*`; re-point `radius/sm` |\n\n## 4. Naming issues\n\n| Type | Examples (Figma today) | Rule |\n|---|---|---|\n| Typos | `seconadry`, `Trasnparet`, `Langauge`, `Langugae`, `radio Buttton`, `defaullt`, `Varient`, `Sperator`, `Fals`, `Selceted`, `delevery`, `deliverd`, `in prograss`, `retrevied`, `wating payment`, `bigCalenderItems`, `AvatarplaholderImages`, `Descreptive` | fix at source (they leak into token names such as `background/secondary/seconadry`) |\n| Inconsistent casing | `check Box`, `checkBox`, `checkboxfield`, `radiofield`, `toggleField`, `Toggle`, `searchInput`, `searchbar`, `upload input`, `Bread crumb` | PascalCase components, `_` for internals |\n| Leading `--` on variant values and some property names | `Variant=--primary`, `--selected=true`, `--device=desktop` | plain values, camelCase props |\n| Size vocab varies | `sm-16px`, `md-20px`, `default-24px`, `--md-40px`, `md- 48px`, `compact`, `Small` | `sm / md / lg` (+ `xs`, `xl` where needed), pixel value in the token |\n| Two names for one thing | `Toggle` / `toggleField` / `Switch`; `Header` / `Top bar`; `More Menu` / `Dropdown Menu`; `Modal` / `Dialog` | Material name in code, Salla name as documented alias |\n| Version in name | `_PhoneInputV1` | no versions in names |\n\nFull old → new mapping: [migration-map.md](migration-map.md).\n\n## 5. Gaps against Material Design\n\n| Material area | Salla today | Action |\n|---|---|---|\n| Foundations: design tokens (ref / sys / comp) | roles exist, no tiers, no JSON export | `tokens/tokens.json` introduces the tiers |\n| Foundations: layout / breakpoints | `desktop` / `mobile` variants only | `docs/01-foundations/layout.md` defines breakpoints and the grid |\n| Foundations: interaction states | per-component ad hoc | `docs/01-foundations/interaction-states.md` fixes the list |\n| Foundations: accessibility | not documented | `docs/01-foundations/accessibility.md` |\n| Styles: elevation | `Shadows/md`, `Shadows/lg` exist; not applied to sheets | mapped to `sys.elevation.*`, gaps listed in elevation.md |\n| Styles: motion | absent | proposed durations and easings |\n| Styles: shape | `Radius/Sizes` scale exists | mapped to Material shape names |\n| Components: snackbar / toast | absent | proposed |\n| Components: dialog | Storybook only | proposed spec |\n| Components: tooltip | exists (component set `1933:1790`) but has no frame on the components page | catalog entry `existing`, needs its own frame |\n| Components: date pickers | cells exist, picker organism not framed | catalog entry with headless plan |\n| Components: data table | rich | keep; Material 3 has no table, Salla's is a first-class Data display component |\n\n## 6. Bottom line\n\nThe content of the system is in good shape: the colour roles, the base/variant pattern and the bilingual coverage are already Material-like. The work is structural: introduce levels, split the input god component, unify the two spacing scales, take language and device out of the variant matrix, and fill five gaps (full elevation coverage, motion, dialog, toast, breakpoints).\n", "00-overview/migration-map": "# Migration map\n\nWhere every current Figma section, frame and Storybook story goes in the new structure. Use this to rename in Figma and to retitle Storybook stories. The per-frame variant properties are on each component page under *Source in Figma today*.\n\n## Figma sections → new sections\n\n| Figma section today | Frames | New Figma section | Notes |\n|---|---|---|---|\n| `Header` | header Avatar, Header, Page Title, Header Subcategory, Header Secondary Tabs, Primary Tabs List | `Organisms / Navigation` (TopAppBar, SecondaryNavBar, Tabs) · `Molecules / Navigation` (Tab, PageTitle, AccountMenuTrigger) | Tabs get their own organism with a headless hook |\n| `Bread crumb` | Breadcrumb, _breadcrumbItem | `Molecules / Navigation` | Separator variant becomes the `Divider` atom |\n| `check Box` | checkBox, checkboxfield | `Atoms / Selection` (Checkbox) · `Molecules / Selection` (CheckboxField) | |\n| `radio Buttton` | radio, radiofield, radioImage, radioColor | `Atoms / Selection` (Radio) · `Molecules / Selection` (RadioField, RadioImage, RadioColor) | |\n| `Toggle` | Toggle, toggleField | `Atoms / Selection` (Switch, alias Toggle) · `Molecules / Selection` (SwitchField) | |\n| `Loader` | _LoadingIndicator, Loading | `Atoms / Communication` (LoadingIndicator) · `Molecules / Communication` (Loading) | |\n| `Status` | _Base Status Indicator, Status | `Atoms / Communication` (StatusIndicator) · `Molecules / Communication` (Status) | |\n| `Avatar` | Avatar, AvatarWithText, AvatarStack, placeholder image sets | `Atoms / Data display` (Avatar) · `Molecules / Data display` (AvatarWithText, AvatarStack) · placeholder images → `assets/` | |\n| `Alertbox` | Alertbox, Alertbox_Banner, Alertbox_Upgrade | `Organisms / Communication` (Alert, AlertBanner, UpgradeCard) · `Molecules / Communication` (InlineAlert) | |\n| `Inputs` | 27 frames | `Molecules / Text inputs` (BaseField internal + 13 fields) · `Atoms / Text inputs` (FieldLabel, HelperText, TranslationToggle) · `Atoms / Actions` (StepperButton) · `Atoms / Communication` (PasswordHint) | `InputWrapper` is retired; `_Text-cursor` is dropped (a native caret) |\n| `Maps` | Maps | `Organisms / Data display` | |\n| `Side menu` | Side menu, sidemenu tab | `Organisms / Navigation` (NavigationDrawer) · `Molecules / Navigation` (NavigationItem) | |\n| `More Menu` | More Menu, _moreItems | `Organisms / Containment` (MoreMenu) · `Molecules / Containment` (MenuItem) | |\n| `Drop Down List` | Drop Down List, _listItem, _listTitle, _Date, _bigCalenderItems, _Time, Time | `Organisms / Containment` (DropdownList) · `Molecules / Containment` (ListItem) · `Organisms / Selection` (DateTimePicker) · `Molecules / Selection` (CalendarCell) | Calendar cells move out of the dropdown section |\n| `Table` | 41 frames | `Organisms / Data display` (DataTable, MobileRow, Pagination) · `Molecules / Data display` (TableCell family) · `Organisms / Containment` (BulkEditSheet, EditSheet, Panel) · `Molecules / Containment` (PanelHeader) · `Molecules / Communication` (FilterResults) | `Table/Status` presets become data; `_Table/Refresh Button`, `_Table/Pin` become IconButton uses |\n| `Steps` | Steps, _Step base | `Organisms / Navigation` (Stepper) · `Atoms / Navigation` (StepIndicator) | |\n| _(no section)_ `Button` | Button | `Atoms / Actions` (Button, IconButton, Link) | Link and IconButton are exposed as globals on the same base |\n| _(no section)_ `Icons/Filled`, `Icons/Outline` | | `Atoms / Communication` (Icon) with the `Icons DS_V.1` library as source | |\n| _(no section)_ `Flag`, `Social media icons`, `Illustration`, `Illustrations Collection` | | `Atoms / Data display` (Flag, SocialIcon) · `Atoms / Communication` (Illustration) · collections → `assets/` | |\n| _(no section)_ `Action Buttons` | | `Organisms / Actions` (ActionBar) | with `Action Bar/Confirm buttons`, `buttonsContainer` |\n| _(no section)_ `searchbar` | | `Molecules / Text inputs` (GlobalSearch) | |\n| _(no section)_ `Learn More` | | `Molecules / Communication` (LearnMore) | |\n| _(no section)_ `Header Primary Tabs` | | `Molecules / Navigation` (Tab kind=primary) | |\n| _(no section)_ `Products Management` | | `Templates` (ListPage) | |\n\n## Frame renames (old → new)\n\n| Old Figma name | New component | Level |\n|---|---|---|\n| `Button` | `Button` | atom |\n| `Button` Layout=--circular | `IconButton` | atom |\n| `Button` Appearance=--link / --link-auxiliary | `Link` | atom |\n| `checkBox` | `Checkbox` | atom |\n| `checkboxfield` | `CheckboxField` | molecule |\n| `radio` | `Radio` | atom |\n| `radiofield` | `RadioField` | molecule |\n| `radioImage` | `RadioImage` | molecule |\n| `radioColor` | `RadioColor` | molecule |\n| `Toggle` | `Switch` | atom |\n| `toggleField` | `SwitchField` | molecule |\n| `_LoadingIndicator` | `LoadingIndicator` | atom |\n| `Loading` | `Loading` | molecule |\n| `_Base Status Indicator` | `StatusIndicator` | atom |\n| `Status` | `Status` | molecule |\n| `Avatar` | `Avatar` | atom |\n| `AvatarWithText`, `header Avatar` | `AvatarWithText`, `AccountMenuTrigger` | molecule |\n| `AvatarStack` | `AvatarStack` | molecule |\n| `Alertbox` (Type=Default, white) | `Alert` | organism |\n| `Alertbox` (Type=Inline) | `InlineAlert` | molecule |\n| `Alertbox_Banner` | `AlertBanner` | organism |\n| `Alertbox_Upgrade` | `UpgradeCard` | organism |\n| `InputWrapper`, `_TextInput`, `_inputLabel`, `_inputTip`, `_Text-cursor` | `_BaseField` (internal) | molecule |\n| `_TextInput`, `_inputWithButton`, `_InputWithImage`, `_InputCounter` | `TextField` | molecule |\n| `_TextArea`, `_Rich-Text-Panel` | `TextareaField` | molecule |\n| `_passwordInput`, `_passwordHints`, `_passwordValidation` | `PasswordField`, `PasswordHint` | molecule, atom |\n| `_emailInput` | `EmailField` | molecule |\n| `_amountInput` | `AmountField` | molecule |\n| `_PhoneInputV1` | `PhoneField` | molecule |\n| `searchInput` | `SearchField` | molecule |\n| `_SingleDigit` | `OtpField` | molecule |\n| `Counter`, `_quantity-hotreload`, `_counter-buttons` | `QuantityField`, `StepperButton` | molecule, atom |\n| `_dropdown-single`, `basic-dropdown-single` | `SelectField` | molecule |\n| `_dropdown-multiple`, `basic-dropdown-multiple` | `MultiSelectField` | molecule |\n| `upload input` | `UploadField` | molecule |\n| `colorPicker` | `ColorPickerField` | molecule |\n| `_inputLabel` | `FieldLabel` | atom |\n| `_inputTip` | `HelperText` | atom |\n| `_Translation` | `TranslationToggle` | atom |\n| `_breadcrumbItem` | `BreadcrumbItem`, `Divider` | molecule, atom |\n| `Breadcrumb` | `Breadcrumb` | molecule |\n| `Header Secondary Tabs`, `Header Primary Tabs`, `Primary Tabs List - Dashboard only`, `_Table/Tabs Item` | `Tab` (molecule), `Tabs` (organism) | |\n| `Header` | `TopAppBar` | organism |\n| `Header Subcategory` | `SecondaryNavBar` | organism |\n| `Page Title` | `PageTitle` | molecule |\n| `Side menu`, `sidemenu tab` | `NavigationDrawer`, `NavigationItem` | organism, molecule |\n| `More Menu`, `_moreItems` | `MoreMenu`, `MenuItem` | organism, molecule |\n| `Drop Down List`, `_listItem`, `_listTitle` | `DropdownList`, `ListItem` | organism, molecule |\n| `_Date`, `_bigCalenderItems`, `_Time`, `Time` | `CalendarCell`, `DateTimePicker` | molecule, organism |\n| `Table`, `Table/Header`, `Table/Cells`, `Table/Delete`, `Table/Alertbox`, `_Table/*` | `DataTable` | organism |\n| `Table/Cell/*` (18) | `TableCell` family (`NameCell`, `AmountCell`, `StatusCell` …) | molecule |\n| `Table/Cell/Varient` | `VariantCell` | molecule |\n| `Table/Cell/Data` | `TextCell` / `DateCell` / `SelectCell` | molecule |\n| `Table/Footer` | `Pagination` | organism |\n| `Table/mobile *` | `MobileRow` | organism |\n| `Table/Bulk Edit Sheet` | `BulkEditSheet` | organism |\n| `Table/Edit Sheet` | `EditSheet` | organism |\n| `_Table/Panel Header`, `previewContainer` | `PanelHeader`, `Panel` | molecule, organism |\n| `_Table/Filter Results` | `FilterResults` | molecule |\n| `_Table/Chips`, `Table/Cell/Chip` | `Chip` | atom |\n| `_Percentage` | `ProgressCircle` | atom |\n| `Steps`, `_Step base` | `Stepper`, `StepIndicator` | organism, atom |\n| `Action Buttons`, `Action Bar/Confirm buttons`, `buttonsContainer` | `ActionBar` | organism |\n| `Bottom sheet` | `BottomSheet` | organism |\n| `searchbar` | `GlobalSearch` | molecule |\n| `Learn More` | `LearnMore` | molecule |\n| `Maps` | `Map` | organism |\n| `Flag` | `Flag` | atom |\n| `Social media icons` | `SocialIcon` | atom |\n| `Illustration`, `Illustrations Collection` | `Illustration`, `EmptyState` | atom, organism |\n| `Icons/Filled`, `Icons/Outline` | `Icon` | atom |\n| `Products Management` | `ListPage` | template |\n\n## Storybook story titles (old → new)\n\n| Story today | New title |\n|---|---|\n| Button | `Atoms / Actions / Button` |\n| Input, LingualField | `Molecules / Text inputs / TextField` |\n| Textarea | `Molecules / Text inputs / TextareaField` |\n| Password | `Molecules / Text inputs / PasswordField` |\n| Search | `Molecules / Text inputs / SearchField` |\n| Select | `Molecules / Text inputs / SelectField` |\n| Tags Input | `Molecules / Text inputs / MultiSelectField` |\n| Qty | `Molecules / Text inputs / QuantityField` |\n| Phone | `Molecules / Text inputs / PhoneField` |\n| Number / Price | `Molecules / Text inputs / AmountField` |\n| File Upload | `Molecules / Text inputs / UploadField` |\n| Color Picker | `Molecules / Text inputs / ColorPickerField` |\n| Checkbox | `Atoms / Selection / Checkbox` and `Molecules / Selection / CheckboxField` |\n| Radio | `Atoms / Selection / Radio` and `Molecules / Selection / RadioField` |\n| Toggle | `Atoms / Selection / Switch` and `Molecules / Selection / SwitchField` |\n| Loader | `Atoms / Communication / LoadingIndicator` and `Molecules / Communication / Loading` |\n| Badge / Status | `Molecules / Communication / Status` |\n| Avatar | `Atoms / Data display / Avatar` |\n| AlertBox | `Organisms / Communication / Alert` and `Molecules / Communication / InlineAlert` |\n| Breadcrumb | `Molecules / Navigation / Breadcrumb` |\n| Tabs | `Organisms / Navigation / Tabs` |\n| Dropdown / Dropdown Menu | `Organisms / Containment / DropdownList`, `Organisms / Containment / MoreMenu` |\n| Table | `Organisms / Data display / DataTable` |\n| Pagination | `Organisms / Navigation / Pagination` |\n| Header | `Organisms / Navigation / TopAppBar` |\n| Sidebar | `Organisms / Navigation / NavigationDrawer` |\n| Panel | `Organisms / Containment / Panel` |\n| Modal | `Organisms / Containment / Dialog` |\n| Tooltip | `Organisms / Communication / Tooltip` |\n| ButtonsGroup | `Organisms / Actions / ActionBar` |\n| Steps | `Organisms / Navigation / Stepper` |\n| Date Picker | `Organisms / Selection / DateTimePicker` |\n\n## Token renames (old Figma variable → new)\n\n| Figma variable | New token |\n|---|---|\n| `text/primary/primary`, `text/primary/link` (#004956) | `sys.color.text.brand` |\n| `background/primary/primary` (#004956) | `sys.color.primary` |\n| `background/secondary/seconadry`, `border/seconadry` (#a4ffe5) | `sys.color.primary-container`, `sys.color.outline-primary` |\n| `text/gray/white`, `background/default/white` | `sys.color.text.inverse`, `sys.color.surface` |\n| `background/default/input` | `sys.color.surface-input` |\n| `border/default` (#eee) | `sys.color.outline` |\n| `text/gray/light` (#666) | `sys.color.text.secondary` |\n| `text/gray/dark` (#333) | `sys.color.text.primary` |\n| `background/status/{success,danger,warning,info}/primary` | `sys.color.status.{…}.primary` |\n| `success/success-dark`, `danger/danger-dark` | `sys.color.status.{…}.dark` |\n| `success/success-darker`, `danger/danger-darker`, `text/status/info/darker` | `sys.color.status.{…}.darker` |\n| `danger/danger-lighter`, `background/status/info/lighter` | `sys.color.status.{…}.lighter` |\n| `border/status/info-light` | `sys.color.status.info.light` |\n| `color/support-non-semantic/orange/200|300`, `background/supporting-colors/orange/darker` | `sys.color.feature.gradient-start|end`, `sys.color.feature.on-feature` |\n| `spacing/6xs` 2 · `spacing/5xs` 4 · `spacing/3xs` 8 · `spacing/xs` 12 · `spacing/base` 16 · `spacing/2xl` 24 | `sys.space.3xs` · `2xs` · `xs` · `sm` · `md` · `xl` |\n| `Spacing/Sizes/3xs` 2 · `Spacing/Sizes/sm` 8 · `Spacing/Sizes/lg` 12 | `sys.space.3xs` · `xs` · `sm` |\n| `radius/md` 4 · `radius/xl` 8 · `radius/full` · `Radius/Sizes/*` | `sys.shape.extra-small` · `small` · `full` (see shape.md) |\n| `Typography/Family/Font` | `ref.font.family.base` |\n| `Typography/Weight/Regular|Medium|Bold` | `ref.font.weight.*` |\n| `Typography/Size/xs|sm|md` | `ref.font.size.*` |\n| `typography/line-height (Descreptive)/4|5|6` | `ref.font.lineHeight.4|5|6` |\n| `Bold/$text-base`, `Regular/$text-sm`, `Medium/$text-xs` … | `sys.typography.title-md`, `body-sm`, `label-sm` … (see typography.md) |\n\n## Suggested order of migration\n\n1. Tokens: add `01-Primitives` values to `tokens.json` (replace `assumed`), add elevation and motion, unify spacing.\n2. Figma: create the four level sections and move frames; rename per the table; fix typos in variables.\n3. Figma: replace `Language` variants with a variable mode; remove `--device` where layout is responsive.\n4. Code: build `BaseButton`, `BaseField`, `Checkbox`, `Radio`, `Switch`, `Icon` first; then the fields; then `DataTable`.\n5. Storybook: retitle stories; add Docs pages linking to the catalog.\n", "00-overview/methodology": "# Methodology: Atomic Design × Material Design\n\nSalla's design system uses two frameworks together. **Atomic Design** answers *how components compose*. **Material Design 3** answers *how the system is organised, named and tokenised*. Neither alone is enough: Atomic Design says nothing about tokens or categories, and Material's flat component list says nothing about which components are built from which.\n\n## 1. What we take from Material Design\n\nMaterial 3 organises its documentation into three top-level groups and we mirror them one-to-one.\n\n| Material group | Material contents | Salla folder | What lives there |\n|---|---|---|---|\n| **Foundations** | Accessibility, Adaptive design, Content design, Customization, Design tokens, Interaction states, Layout | `docs/01-foundations/` | The rules that apply to everything: token model, layout grid and breakpoints, interaction states, accessibility, Arabic/English content and RTL |\n| **Styles** | Color, Elevation, Icons, Motion, Shape, Typography | `docs/02-styles/` | The visual vocabulary. Each style page owns one token family. Salla adds *Spacing* (Material folds it into Layout) and *Illustrations* |\n| **Components** | Grouped by category: Actions, Communication, Containment, Navigation, Selection, Text inputs | `docs/03-components/` | The parts. We keep Material's six categories and add **Data display** for tables, avatars, flags and status, which Material 3 does not cover but the merchant dashboard is built on |\n\nWe also adopt Material's **three-tier token model**:\n\n```\nref.*   reference tokens   raw values, no meaning        ref.palette.teal.900 = #004956\nsys.*   system tokens      roles, theme-able             sys.color.primary = {ref.palette.teal.900}\ncomp.*  component tokens   per-component overrides only  comp.button.height-md = {ref.size.control.md}\n```\n\nProduct code and components use `sys.*`. Only the token build touches `ref.*`. `comp.*` exists only where a component needs a value that is not a plain system token. This is exactly how Material's `md.ref.*` / `md.sys.*` / `md.comp.*` tokens work, and it lets Salla theme (dark mode, white-label, partner apps) by re-mapping the `sys` tier without touching a component.\n\nOther Material conventions we adopt:\n\n- **Color roles, not color names**: `primary`, `on-primary`, `primary-container`, `surface`, `outline`. The Figma library already names colours by role (`text/primary`, `background/status/info`), so this is an alignment, not a rewrite.\n- **Type roles**: display / headline / title / body / label, each mapping to an existing `Bold|Medium|Regular / $text-*` Figma style.\n- **Shape scale**: none / extra-small / small / medium / large / full instead of raw radii.\n- **Interaction states** as a fixed list: enabled, hover, focus, pressed, dragged, disabled (plus selected / activated where relevant). Every stateful component documents these and no others.\n- **Component anatomy** diagrams with numbered parts, and a props table per component.\n\n## 2. What we take from Atomic Design\n\nMaterial lists ~35 components flat. Salla has 117 Figma frames and ~90 public components, many of which are built from each other (`_TextInput` → `TextField` → `DataTable`). Atomic Design gives us the vertical axis:\n\n| Level | Definition for Salla | Examples | Rule of thumb |\n|---|---|---|---|\n| **Atom** | Cannot be broken down further and still be useful. Takes tokens directly. No product data. | Button, Icon, Checkbox, Switch, Avatar, LoadingIndicator, StatusIndicator, Chip, Flag | If it needs another component to make sense, it is not an atom |\n| **Molecule** | A few atoms with one job. | TextField (label + input + helper), Status (dot + label), CheckboxField, Breadcrumb, Tab, ListItem, TableCell | Should be describable in one sentence without \"and\" |\n| **Organism** | A distinct section of the interface. Often stateful. Composed of molecules and atoms. | DataTable, TopAppBar, NavigationDrawer, DropdownList, Alert, Stepper, Dialog | Could appear on its own in a Storybook story with realistic data |\n| **Template** | Page skeleton with slots and placeholder content. | ListPage, ListDetailPage, FormPage, WizardPage | No real strings, no real data |\n| **Page** | Template + real content. | Orders list, Products list, Order details | Lives in the product, documented here as reference |\n\nNaming stays domain-neutral at atom and molecule level (`Button`, not `SaveButton`) and becomes domain-aware only at page level.\n\n## 3. How the two axes combine\n\nEvery component gets a coordinate on both axes. Material category is the **folder a designer opens**; atomic level is the **folder an engineer opens**. Storybook titles use both:\n\n```\nAtoms / Actions / Button\nMolecules / Text inputs / TextField\nOrganisms / Data display / DataTable\nTemplates / ListPage\n```\n\nThe catalog (`catalog/components.json`) is the single place where the coordinate is declared, and `docs/03-components/README.md` renders the matrix both ways.\n\n## 4. The third axis: structure type\n\nThe internal *Component Structure Types* document defines five build patterns. They are orthogonal to level and category and answer *how the engineer should implement it*:\n\n| # | Pattern | Typical level | Salla examples |\n|---|---|---|---|\n| 1 | Configurable | atom | Button, LoadingIndicator, Chip, Alert |\n| 2 | Standalone | atom / molecule | Icon, Flag, RadioImage, TableCell types, MobileRow |\n| 3 | Base + Global | molecule | BaseField → TextField / PasswordField / SearchField …; Checkbox → CheckboxField |\n| 4 | Slot / Composition | organism / template | DataTable, TopAppBar, Dialog, Panel, ListPage |\n| 5 | Headless | organism | Tabs (useTabs), DropdownList (useListbox), Stepper (useStepper), Tooltip |\n\nDetails and decision rules: [component-structure-types.md](component-structure-types.md).\n\n## 5. Principles\n\n1. **Tokens before components.** No hard-coded value in a component; if a value is missing, add a token first.\n2. **One source of truth per fact.** A component's props live in the catalog; its colours live in tokens; its Figma frame is linked, not copied.\n3. **Bilingual by default.** Every component is designed in Arabic and English and uses logical properties (`inline-start`, not `left`).\n4. **Accessible by construction.** Base components own focus, keyboard and ARIA so globals inherit it.\n5. **Small public API.** Prefer named globals (`PasswordField`) over a god component with a `variant` that changes behaviour.\n6. **Figma mirrors code.** Frame names, variant property names and token names match the catalog after migration.\n", "00-overview/naming-conventions": "# Naming conventions\n\nRules for component, prop, token, file and Figma names so the catalog, Figma, Storybook and code all say the same thing.\n\n## Components\n\n| Rule | Do | Don't |\n|---|---|---|\n| PascalCase, singular noun | `TextField`, `DataTable`, `NavigationItem` | `textfield`, `Tables`, `sidemenu tab` |\n| Domain-neutral below page level | `Status`, `ListItem` | `OrderStatus`, `ProductListItem` |\n| No version suffix in the name | `PhoneField` | `_PhoneInputV1` |\n| Field = control + label + helper | `CheckboxField`, `SwitchField`, `TextField` | `checkboxfield`, `toggleField`, `_TextInput` |\n| Internal bases prefixed `Base` in code, `_` in Figma | `BaseField`, `_TextInput` | exporting `InputWrapper` |\n| Material names where Material has one, Salla alias kept in docs | `Switch` (alias Toggle), `TopAppBar` (alias Header), `NavigationDrawer` (alias Side menu), `Dialog` (alias Modal) | inventing a third name |\n| Typed families use a shared suffix | `NameCell`, `AmountCell`, `StatusCell` | `Table/Cell/Varient`, `Table/Cell/Data` |\n\n## Props and variant properties\n\n| Rule | Do | Don't |\n|---|---|---|\n| camelCase | `iconStart`, `maxLength` | `icon-start`, `Icon Start` |\n| No `--` prefix on values | `variant=\"primary\"` | `Variant=--primary` |\n| Booleans are adjectives, no `?`, no `is` | `disabled`, `loading`, `richText` | `Rich text?`, `isDisabled`, `--disabled=true` |\n| Enumerations use the same words everywhere | `size: sm \\| md \\| lg` | `sm-16px`, `md- 48px`, `default-24px`, `compact` |\n| Language is a runtime context, not a variant | `dir` / `lang` on the root | `Language=Arabic/English` on every frame |\n| Device is a breakpoint, not a variant | responsive CSS; `device` only when layouts truly differ (TopAppBar, DataTable) | `--device=desktop` on Page Title |\n| State names are Material's | `enabled, hover, focus, pressed, disabled` (+ `selected`, `activated`, `error`) | `--preActive`, `--Active-Filled`, `--Active-Filled-with-one` |\n| Logical directions | `start`, `end`, `inline-start` | `left`, `right`, `Dir=Left` |\n\nFixed spellings for values seen in Figma today: `secondary` (not `seconadry`), `transparent` (not `Trasnparet`), `language` (not `Langauge` / `Langugae`), `variant` (not `Varient`), `separator` (not `Sperator`), `default` (not `defaullt`), `delivered` / `delivery` / `in-progress` / `retrieved` / `waiting-payment` / `waiting-review` (order statuses), `false` (not `Fals`).\n\n## Tokens\n\nFormat: `{tier}.{group}.{role}.{modifier}` in JSON, `--{tier}-{group}-{role}-{modifier}` in CSS.\n\n| Tier | Purpose | Examples |\n|---|---|---|\n| `ref` | raw values | `ref.palette.teal.900`, `ref.space.5`, `ref.font.size.sm` |\n| `sys` | roles | `sys.color.primary`, `sys.color.on-primary`, `sys.color.status.danger.primary`, `sys.space.md`, `sys.shape.small`, `sys.typography.label-md` |\n| `comp` | component | `comp.button.height-md`, `comp.alert.accent-width` |\n\nRules:\n\n- Colour roles follow Material: `primary`, `on-primary`, `primary-container`, `surface`, `outline`, `text.*`, `status.{success|danger|warning|info}.{lighter|light|primary|dark|darker}`.\n- The Figma collection `03-Colors` keeps its `text / background / border / foreground` grouping; the mapping to `sys.color.*` is one-to-one and listed in `docs/02-styles/color.md`.\n- One spacing scale. `spacing/*` and `Spacing/Sizes/*` (which currently disagree: `spacing/3xs = 8px` but `Spacing/Sizes/3xs = 2px`) both migrate to `sys.space.*`; see `docs/02-styles/spacing.md`.\n- Numeric ref scales (`ref.space.1..12`, `ref.palette.teal.100..900`) never appear in product code.\n\n## Files and folders\n\n| Thing | Convention | Example |\n|---|---|---|\n| Component doc | `docs/03-components/{level}s/{kebab-id}.md` | `docs/03-components/molecules/text-field.md` |\n| Catalog id | kebab-case, equals the doc filename | `text-field` |\n| Storybook title | `{Level}s / {Category} / {Name}` | `Molecules / Text inputs / TextField` |\n| Code folder (future) | `packages/ui/src/{level}s/{Name}/` with `{Name}.tsx`, `{Name}.stories.tsx`, `{Name}.test.tsx`, `index.ts` | `packages/ui/src/molecules/TextField/` |\n| Figma section | `{Level}s / {Category}` | `Molecules / Text inputs` |\n| Figma component | `{Name}` or `_{Name}` for internal | `TextField`, `_BaseField` |\n\n## Icons\n\n- Name only, no style suffix, in kebab-case: `add-01`, `arrow-down-01`, `information-circle`.\n- Style is a prop: `outline` (Figma *Stroke*) or `filled` (Figma *Solid*). Rounded is the only type shipped; Sharp, Bulk, Twotone and Duotone stay in the source library.\n- The legacy `sicon-*` font classes map one-to-one and are kept as aliases until the font is retired.\n", "01-foundations/design-tokens": "# Design tokens\n\nTokens are the named values every style and component is built from. Salla uses Material's three tiers.\n\n## Tiers\n\n| Tier | Prefix | Purpose | Who uses it | Example |\n|---|---|---|---|---|\n| Reference | `ref.` / `--ref-` | Raw palette, scales, fonts. No meaning. | Token build only | `ref.palette.teal.900 = #004956` |\n| System | `sys.` / `--sys-` | Roles. Theme-able. The public vocabulary. | Components, product code, Figma variables | `sys.color.primary = {ref.palette.teal.900}` |\n| Component | `comp.` / `--comp-` | Values a single component needs that are not plain system tokens. | That component's CSS only | `comp.button.height-md = {ref.size.control.md}` |\n\nRules:\n\n1. Product and component code reference `sys.*` (and their own `comp.*`). Never `ref.*`.\n2. A theme (dark, white-label, partner app) re-maps `sys.*` to different `ref.*`. Components do not change.\n3. A `comp.*` token must alias a `sys.*` or `ref.*` token; it never introduces a new raw value.\n4. Every raw value in Figma must exist in `ref.*`. If a design needs a value that is not in the scale, the scale is discussed first.\n\n## Files\n\n| File | Format | Consumer |\n|---|---|---|\n| `tokens/tokens.json` | W3C Design Tokens Community Group (DTCG) JSON with `$type` / `$value` | Style Dictionary / Tokens Studio / Figma variables sync |\n| `tokens/css/tokens.css` | CSS custom properties | Any web surface, Storybook, prototypes |\n| `tokens/tailwind/preset.js` | Tailwind preset mapped to the CSS variables | Twilight components and the merchant dashboard |\n\nThe JSON is the source. The CSS and Tailwind files are hand-maintained today and should be generated by Style Dictionary once the build is in place (`config: css/variables, tailwind/preset`).\n\n## Provenance\n\nEvery value in `tokens.json` names the Figma variable it was read from in its `$description`; the raw evidence (variable name → value, per frame) is in `catalog/figma-tokens-harvest.json`, gathered on 2026-09-22 from 20 component frames. Values tha
