<style>
/*
 * Salla Design System - CSS custom properties

  --ref-palette-amber-600: #d18f36;
  --ref-palette-amber-800: #8f5f22;
  --ref-palette-blue-50: #ecf3fe;
  --ref-palette-blue-200: #cbe0fb;
  --ref-palette-blue-500: #5196f3;

  --ref-font-size-2xl: 24px;
  --ref-font-size-3xl: 30px;
  --ref-font-size-4xl: 36px;
  --ref-font-size-5xl: 48px;
  --ref-font-line-height-4: 16px;
  --ref-font-line-height-5: 20px;
  --ref-font-line-height-6: 24px;

  /* ---------- REFERENCE: shadow (Figma Shadows/*) ---------- */

  /* ---------- REFERENCE: motion (proposed) ---------- */

  --sys-color-danger-primary: var(--ref-palette-red-500);

  --sys-color-danger-darker: var(--ref-palette-red-800);

  --sys-color-warning-darker: var(--ref-palette-amber-800);
  --sys-color-info-lighter: var(--ref-palette-blue-50);
  --sys-color-info-light: var(--ref-palette-blue-200);
  --sys-color-info-primary: var(--ref-palette-blue-500);

  --sys-color-upgrade-primary: var(--ref-palette-gold-200);
  --sys-color-upgrade-dark: var(--ref-palette-gold-500);

  /* ---------- SYSTEM: shape ---------- */
  --sys-shape-none: var(--ref-radius-none);
  --sys-shape-extra-small: var(--ref-radius-md);
  --sys-shape-small: var(--ref-radius-xl);
  --sys-shape-medium: var(--ref-radius-2xl);
  --sys-shape-large: var(--ref-radius-3xl);
  --sys-shape-full: var(--ref-radius-full);

  /* ---------- SYSTEM: typography (font shorthand values) ---------- */
  --sys-type-display-lg: var(--ref-font-weight-bold) var(--ref-font-size-5xl) / 1 var(--ref-font-family-base);
  --sys-type-headline-lg: var(--ref-font-weight-bold) var(--ref-font-size-2xl) / var(--ref-font-line-height-8) var(--ref-font-family-base);
  --sys-type-headline-md: var(--ref-font-weight-bold) var(--ref-font-size-xl) / var(--ref-font-line-height-7) var(--ref-font-family-base);
  --sys-type-title-lg: var(--ref-font-weight-bold) var(--ref-font-size-lg) / var(--ref-font-line-height-7) var(--ref-font-family-base);
  --sys-type-title-md: var(--ref-font-weight-bold) var(--ref-font-size-md) / var(--ref-font-line-height-6) var(--ref-font-family-base);
  --sys-type-title-sm: var(--ref-font-weight-bold) var(--ref-font-size-sm) / var(--ref-font-line-height-5) var(--ref-font-family-base);
  --sys-type-body-lg: var(--ref-font-weight-regular) var(--ref-font-size-md) / var(--ref-font-line-height-6) var(--ref-font-family-base);
  --sys-type-body-md: var(--ref-font-weight-regular) var(--ref-font-size-sm) / var(--ref-font-line-height-5) var(--ref-font-family-base);
  --sys-type-body-sm: var(--ref-font-weight-regular) var(--ref-font-size-xs) / var(--ref-font-line-height-4) var(--ref-font-family-base);
  --sys-type-label-lg: var(--ref-font-weight-medium) var(--ref-font-size-md) / var(--ref-font-line-height-6) var(--ref-font-family-base);
  --sys-type-label-md: var(--ref-font-weight-medium) var(--ref-font-size-sm) / var(--ref-font-line-height-5) var(--ref-font-family-base);
  --sys-type-label-sm: var(--ref-font-weight-medium) var(--ref-font-size-xs) / var(--ref-font-line-height-4) var(--ref-font-family-base);

  /* ---------- SYSTEM: elevation ---------- */
  --sys-elevation-0: none;
  --sys-elevation-1: var(--ref-shadow-sm);
  --sys-elevation-2: var(--ref-shadow-md);

  /* ---------- SYSTEM: focus ---------- */
  --sys-focus-ring: 0 0 0 2px var(--ref-palette-teal-100);

  /* ---------- COMPONENT ---------- */
  --comp-button-height-sm: var(--ref-size-control-sm);

  --comp-button-gap: var(--ref-space-2xs);
  --comp-button-border-width-filled: 2px;
  --comp-button-border-width-outlined: 1px;
  --comp-button-shape: var(--sys-shape-small);
  --comp-button-icon-size: var(--ref-size-icon-sm);

  --comp-text-field-min-height: var(--ref-size-control-md);
  --comp-text-field-padding-x: var(--ref-space-lg);
  --comp-text-field-padding-y: var(--ref-space-sm);
  --comp-text-field-gap: var(--ref-space-sm);
  --comp-text-field-shape: var(--sys-shape-small);
  --comp-text-field-label-gap: var(--ref-space-lg);

  --comp-checkbox-size-sm: 16px;
  --comp-checkbox-size-md: 20px;
  --comp-checkbox-padding: var(--ref-space-3xs);
  --comp-checkbox-shape: var(--sys-shape-extra-small);

  --comp-toggle-size-sm: 16px;
  --comp-toggle-size-default: 24px;
  --comp-toggle-track-width-default: 39px;

  --comp-status-height: 24px;
  --comp-status-dot-size: 10px;
  --comp-status-gap: var(--ref-space-2xs);
  --comp-status-padding-x: var(--ref-space-sm);

  --comp-alert-padding-x: var(--ref-space-4xl);
  --comp-alert-padding-y: var(--ref-space-2xl);
  --comp-alert-gap: var(--ref-space-sm);
  --comp-alert-accent-width: 3px;
  --comp-alert-icon-size: var(--ref-size-icon-md);
  --comp-alert-shape: var(--sys-shape-small);

  --comp-tab-indicator-width: 2px;
  --comp-tab-padding-y: var(--ref-space-sm);

  --comp-top-app-bar-padding-x: var(--ref-space-9xl);

  --comp-navigation-drawer-width: 225px;

  --comp-menu-width: 240px;

  --comp-tooltip-padding: var(--ref-space-lg);

/* Dark theme hook. Salla ships light only; these placeholders prove the sys tier
   can be re-mapped without touching components. */
:root[data-theme="dark"] {
  --sys-color-surface: #0f1f22;
  --sys-color-surface-input: #14272b;
  --sys-color-outline: #24393d;
  --sys-color-text-primary: #f3f7f7;
  --sys-color-text-secondary: #a7b6b8;
}

</style>
<style>

const DATA = {"pages": {"03-components/README": "# Components\n\nEvery component classified by **atomic level** (how it composes) and **Material category** (how you find it), with its **structure type** (how it is built). Generated from `catalog/components.json`.\n\n| Total | Existing | Proposed (gap) | Page references | In Figma and Storybook | Figma only | Storybook only |\n|---|---|---|---|---|---|---|\n| 101 | 92 | 6 | 3 | 66 | 21 | 7 |\n\n## By atomic level\n\n### Atoms (25)\n\nAtoms are the smallest usable UI units: a button, an icon, a checkbox. They do one thing, take tokens directly and never know about product data.\n\n| Component | Material category | Structure | Status | Sources | What it is |\n|---|---|---|---|---|---|\n| [Button](atoms/button.md) | Actions | 1 | existing | figma, storybook | The single action trigger. |\n| [IconButton](atoms/icon-button.md) | Actions | 3 | existing | figma, storybook | Icon-only button. |\n| [Link](atoms/link.md) | Actions | 3 | existing | figma, storybook | Inline text action. |\n| [Icon](atoms/icon.md) | Communication | 2 | existing | figma, storybook | A single glyph from the Salla icon set. |\n| [Checkbox](atoms/checkbox.md) | Selection | 3 | existing | figma, storybook | Bare selection control with true / false / mixed states in two sizes. |\n| [Radio](atoms/radio.md) | Selection | 3 | existing | figma, storybook | Bare single-choice control in two sizes. |\n| [Switch](atoms/toggle.md) | Selection | 3 | existing | figma, storybook | On/off control (Material: Switch). |\n| [LoadingIndicator](atoms/loading-indicator.md) | Communication | 1 | existing | figma, storybook | Spinner, dots or line progress in nine sizes from 8px to 88px. |\n| [StatusIndicator](atoms/status-indicator.md) | Communication | 1 | existing | figma, storybook | The 10px coloured dot. |\n| [Avatar](atoms/avatar.md) | Data display | 1 | existing | figma, storybook | Image, text initials, icon or fallback in six sizes, circular or rectangular. |\n| [Chip](atoms/chip.md) | Selection | 1 | existing | figma, storybook | Compact tag used in table cells and multi-select fields. |\n| [Flag](atoms/flag.md) | Data display | 2 | existing | figma | Country flag glyphs, one per ISO 3166 code (265 in Figma). |\n| [SocialIcon](atoms/social-icon.md) | Data display | 2 | existing | figma | Brand logos (Facebook, Google, Google Ads, Meta, Snapchat, TikTok, YouTube, Instagram, X). |\n| [Illustration](atoms/illustration.md) | Communication | 2 | existing | figma | Spot illustrations for empty states and onboarding, with web and mobile variants. |\n| [FieldLabel](atoms/label.md) | Text inputs | 1 | existing | figma | Label line above a field: text, optional required mark, optional info icon. |\n| [HelperText](atoms/helper-text.md) | Text inputs | 1 | existing | figma, storybook | Line under a field: hint, error, character count, variables hint or file delete action. |\n| [PasswordHint](atoms/password-hint.md) | Communication | 1 | existing | figma | One requirement line (pending / success / danger) used by PasswordField. |\n| [StepperButton](atoms/stepper-button.md) | Actions | 1 | existing | figma, storybook | The +/- buttons flanking QuantityField, including the delete-at-one variant. |\n| [TranslationToggle](atoms/translation-toggle.md) | Text inputs | 1 | existing | figma, storybook | The small EN/AR language switch inside bilingual fields (Storybook: LingualField). |\n| [ProgressCircle](atoms/progress-circle.md) | Communication | 1 | existing | figma | Circular determinate progress (25/50/75/100 in Figma, should accept any value). |\n| [StepIndicator](atoms/step-indicator.md) | Navigation | 1 | existing | figma | One node of the Stepper: number or check in a circle with a connector. |\n| [Divider](atoms/divider.md) | Containment | 1 | proposed | figma | Horizontal or vertical rule. |\n| [Text](atoms/text.md) | Communication | 1 | proposed | - | Typography primitive exposing the Material type roles (display, headline, title, body, label) that map onto the Figma Bold/Medium/Regular $text-* styles. |\n| [ProgressBar](atoms/progress-bar.md) | Communication | 1 | existing | storybook | Linear determinate progress with label, description, percentage and an optional secondary percentage. |\n| [Skeleton](atoms/skeleton.md) | Communication | 2 | existing | storybook | Loading placeholders shaped like the content they replace: inline, list entry, article, table, settings, header and full page layouts. |\n\n### Molecules (43)\n\nMolecules are small groups of atoms working as a unit: a labelled field, a status pill, a breadcrumb. They own a single, clear responsibility.\n\n| Component | Material category | Structure | Status | Sources | What it is |\n|---|---|---|---|---|---|\n| [BaseField (internal)](molecules/base-field.md) | Text inputs | 3 | existing | figma, storybook | The internal base for every field: label + container (icon-start, control, subtext/unit, translation toggle, info) + helper text. |\n| [TextField](molecules/text-field.md) | Text inputs | 3 | existing | figma, storybook | Single-line text entry. |\n| [TextareaField](molecules/textarea-field.md) | Text inputs | 3 | existing | figma, storybook | Multi-line text entry with optional rich-text toolbar. |\n| [PasswordField](molecules/password-field.md) | Text inputs | 3 | existing | figma, storybook | Masked entry with show/hide toggle and an optional requirements checklist (112 Figma variants collapse to four props). |\n| [EmailField](molecules/email-field.md) | Text inputs | 3 | existing | figma, storybook | TextField pre-configured with type=email, mail icon and email validation. |\n| [AmountField](molecules/amount-field.md) | Text inputs | 3 | existing | figma, storybook | Numeric / currency entry with the Saudi Riyal symbol as trailing unit. |\n| [PhoneField](molecules/phone-field.md) | Text inputs | 3 | existing | figma, storybook | Phone entry with country-code picker (Flag + code) as leading control. |\n| [SearchField](molecules/search-field.md) | Text inputs | 3 | existing | figma, storybook | Search entry with magnifier, clear button, recommendations and no-results states. |\n| [OtpField](molecules/otp-field.md) | Text inputs | 3 | existing | figma, storybook | Single-digit boxes for verification codes. |\n| [QuantityField](molecules/quantity-field.md) | Text inputs | 3 | existing | figma, storybook | Number entry with StepperButtons, compact and default sizes, and the hot-reload (inline save) variant used in tables. |\n| [SelectField](molecules/select-field.md) | Text inputs | 3 | existing | figma, storybook | Single-choice dropdown field. |\n| [MultiSelectField](molecules/multi-select-field.md) | Text inputs | 3 | existing | figma, storybook | Multi-choice dropdown field rendering selections as Chips (Storybook: Tags Input). |\n| [UploadField](molecules/upload-field.md) | Text inputs | 3 | existing | figma, storybook | File picker with drag and drop: inline, single image, single video, multiple (row or column). |\n| [ColorPickerField](molecules/color-picker-field.md) | Text inputs | 3 | existing | figma, storybook | Colour swatch + hex entry with a picker popover. |\n| [CheckboxField](molecules/checkbox-field.md) | Selection | 3 | existing | figma, storybook | Checkbox + label + optional description / info tooltip. |\n| [RadioField](molecules/radio-field.md) | Selection | 3 | existing | figma, storybook | Radio + label, used inside a RadioGroup. |\n| [RadioImage](molecules/radio-image.md) | Selection | 2 | existing | figma, storybook | Selectable image card (visual radio) for templates, themes, layouts. |\n| [RadioColor](molecules/radio-color.md) | Selection | 2 | existing | figma, storybook | Selectable colour swatch (visual radio) for product colour variants. |\n| [SwitchField](molecules/toggle-field.md) | Selection | 3 | existing | figma, storybook | Switch + label with the switch at inline-start or inline-end. |\n| [Status](molecules/status.md) | Communication | 3 | existing | figma, storybook | StatusIndicator + label in subtle (dot + text) or strong (pill) appearance. |\n| [Loading](molecules/loading.md) | Communication | 3 | existing | figma, storybook | LoadingIndicator + localised label for block-level loading. |\n| [AvatarWithText](molecules/avatar-with-text.md) | Data display | 4 | existing | figma, storybook | Avatar + primary and secondary text lines (customer, product, staff rows). |\n| [AvatarStack](molecules/avatar-stack.md) | Data display | 1 | existing | figma | Overlapping or spaced row of Avatars with +N overflow. |\n| [Breadcrumb](molecules/breadcrumb.md) | Navigation | 4 | existing | figma, storybook | Path navigation with icon, text, more (…) and separator items; collapses past 5 items and on mobile. |\n| [BreadcrumbItem](molecules/breadcrumb-item.md) | Navigation | 1 | existing | figma, storybook | One breadcrumb node: icon, text or overflow menu trigger. |\n| [Tab](molecules/tab.md) | Navigation | 1 | existing | figma, storybook | One tab, primary (dashboard top nav) or secondary (page sub-nav), contained or plain, with active/hover states. |\n| [NavigationItem](molecules/side-menu-item.md) | Navigation | 1 | existing | figma | One entry of the side navigation (first / middle / last for grouping radius). |\n| [MenuItem](molecules/menu-item.md) | Containment | 1 | existing | figma, storybook | Row inside MoreMenu: icon or image + label, optional danger tone; separators become Divider. |\n| [ListItem](molecules/list-item.md) | Containment | 4 | existing | figma, storybook | Row inside DropdownList and pickers: plain, with description, with flag, with image; supports checkbox, selected, danger, disabled and 'feature' (upsell) states. |\n| [TableCell](molecules/table-cell.md) | Data display | 2 | existing | figma, storybook | Typed cells: name, sub-name, image, products, amount, percentage, status, tags, markets (flag + text), variant, data (text / date-time / dropdown), actions (1-3 icons or toggle), checkbox, chip, disabled, sort and header. |\n| [CalendarCell](molecules/date-time-cell.md) | Selection | 1 | existing | figma, storybook | Day, number and time cells used by the date/time picker. |\n| [AccountMenuTrigger](molecules/header-avatar.md) | Navigation | 1 | existing | figma, storybook | Avatar + store name + chevron in the top bar that opens the account menu. |\n| [PageTitle](molecules/page-title.md) | Navigation | 4 | existing | figma | Page heading row: back / breadcrumb, title, optional status and actions slot. |\n| [LearnMore](molecules/learn-more.md) | Communication | 1 | existing | figma | Help card linking to documentation, default and small sizes, desktop and mobile. |\n| [GlobalSearch](molecules/global-search.md) | Text inputs | 1 | existing | figma, storybook | Header search: collapsed button-only or full field. |\n| [FilterResults](molecules/filter-results.md) | Communication | 1 | existing | figma | Applied-filters summary bar above a table with a clear action. |\n| [PanelHeader](molecules/panel-header.md) | Containment | 4 | existing | figma, storybook | Title + actions row for Panel / Table containers, default and small. |\n| [InlineAlert](molecules/inline-alert.md) | Communication | 3 | existing | figma, storybook | Compact, non-dismissible alert placed under a field or inside a card (Alertbox Type=Inline). |\n| [LingualField](molecules/lingual-field.md) | Text inputs | 3 | existing | figma, storybook | Bilingual wrapper that renders an Input, Textarea or rich-text Editor per merchant language with a language dropdown, per-language values and optional AI suggestion. |\n| [IconPicker](molecules/icon-picker.md) | Selection | 3 | existing | storybook | Trigger button opening a searchable, paginated icon grid (Hugeicons or Salla icons) inside a dropdown. |\n| [RangeSlider](molecules/range-slider.md) | Selection | 3 | existing | storybook | Slider with a paired numeric input for choosing a value within min / max. |\n| [Rate](molecules/rate.md) | Selection | 1 | existing | storybook | Star (half-step) or emoji rating, read-only or interactive, with themed fills. |\n| [TagsField](molecules/tags-field.md) | Text inputs | 3 | existing | figma, storybook | Free-form tag entry: type a value, press Add, manage the resulting Chips; max limit and validation. |\n\n### Organisms (26)\n\nOrganisms are complex sections built from molecules and atoms: the data table, the top app bar, the dropdown list. They usually manage state or layout.\n\n| Component | Material category | Structure | Status | Sources | What it is |\n|---|---|---|---|---|---|\n| [Alert](organisms/alert.md) | Communication | 1 | existing | figma, storybook | Contextual message with icon, optional title, body, optional button and close. |\n| [AlertBanner](organisms/alert-banner.md) | Communication | 2 | existing | figma, storybook | Full-width page-level announcement (two layouts). |\n| [UpgradeCard](organisms/alert-upgrade.md) | Communication | 2 | existing | figma, storybook | Plan-upgrade promo card, desktop and mobile. |\n| [DropdownList](organisms/dropdown-list.md) | Containment | 4 | existing | figma, storybook | The floating list behind SelectField, MultiSelectField, pickers and menus: one to three layers, accordion, flags, images, checkboxes, descriptions, no-results and create-new states. |\n| [DateTimePicker](organisms/date-time-picker.md) | Selection | 5 | existing | figma, storybook | Calendar and time picker popover built from CalendarCell. |\n| [MoreMenu](organisms/more-menu.md) | Containment | 4 | existing | figma, storybook | Overflow (kebab) menu anchored to a trigger, three layouts, left/right placement. |\n| [NavigationDrawer](organisms/side-menu.md) | Navigation | 4 | existing | figma | The dashboard side navigation (Material: navigation drawer) composed of NavigationItems and section headers. |\n| [TopAppBar](organisms/header.md) | Navigation | 4 | existing | figma | Dark-teal top bar: logo, primary tabs, global search, notifications, account menu. |\n| [SecondaryNavBar](organisms/header-subcategory.md) | Navigation | 4 | existing | figma | Second-level bar under the TopAppBar carrying secondary Tabs and a help / CTA area. |\n| [Tabs](organisms/tabs.md) | Navigation | 5 | existing | figma, storybook | Tab list + panels. |\n| [DataTable](organisms/table.md) | Data display | 4 | existing | figma, storybook | The merchant list view: header (title, tabs, search, filters), column headers with sort / select-all, typed cells, sticky action column, row selection with bulk bar, delete, edit sheet, pagination footer, mobile card rows, empty and filter-result states. |\n| [MobileRow](organisms/table-row-mobile.md) | Data display | 2 | existing | figma, storybook | Card-style row for phones: order, product, customer and default layouts. |\n| [BulkEditSheet](organisms/bulk-edit-sheet.md) | Containment | 4 | existing | figma | Side sheet opened from the DataTable bulk bar to edit selected rows. |\n| [EditSheet](organisms/edit-sheet.md) | Containment | 4 | existing | figma | Inline edit side sheet for one row (default and minimum-cells layouts). |\n| [Stepper](organisms/stepper.md) | Navigation | 5 | existing | figma | Two to five step progress for wizards, desktop and mobile. |\n| [ActionBar](organisms/action-bar.md) | Actions | 4 | existing | figma, storybook | Confirm / cancel button group, floating or flat, desktop and mobile. |\n| [BottomSheet](organisms/bottom-sheet.md) | Containment | 4 | existing | figma, storybook | Mobile modal surface sliding from the bottom. |\n| [Dialog](organisms/dialog.md) | Containment | 4 | existing | storybook | Centered modal (Storybook: Modal). |\n| [Panel](organisms/panel.md) | Containment | 4 | existing | figma, storybook | Card container with PanelHeader, body and footer slots (Storybook: Panel). |\n| [Tooltip](organisms/tooltip.md) | Communication | 5 | existing | figma, storybook | Hover / focus hint on a primary-container surface with a caret. |\n| [Toast](organisms/toast.md) | Communication | 1 | proposed | - | Transient bottom notification (Material: snackbar). |\n| [EmptyState](organisms/empty-state.md) | Communication | 4 | existing | figma, storybook | Illustration + title + description + action for empty lists and no-results. |\n| [Pagination](organisms/pagination.md) | Navigation | 1 | existing | figma, storybook | Table footer: page size, range label, previous / next and page numbers. |\n| [Map](organisms/map.md) | Data display | 2 | existing | figma, storybook | Embedded map for addresses and branches. |\n| [Accordion](organisms/accordion.md) | Containment | 4 | existing | storybook | Collapsible content container (progressive disclosure) with head and body slots, grouped auto-collapse, tight / relaxed layouts and light / transparent / feature themes. |\n| [RichTextEditor](organisms/rich-text-editor.md) | Text inputs | 3 | existing | figma, storybook | Quill-based rich text editor with configurable toolbar, html / text / json output, character limits, preview, product embeds, image picker and AI suggestion. |\n\n### Templates (4)\n\nTemplates are page-level layouts with slots and no real content. They fix where organisms go.\n\n| Component | Material category | Structure | Status | Sources | What it is |\n|---|---|---|---|---|---|\n| [ListPage](templates/list-page.md) | Containment | 4 | existing | figma | TopAppBar + SecondaryNavBar + PageTitle + DataTable in a Panel. |\n| [ListDetailPage](templates/list-detail.md) | Containment | 4 | proposed | - | Two-pane layout used by Orders: list on one side, detail on the other, collapsing to stacked on mobile. |\n| [FormPage](templates/form-page.md) | Containment | 4 | proposed | - | PageTitle + one or more Panels of fields + sticky ActionBar. |\n| [WizardPage](templates/wizard-page.md) | Navigation | 4 | proposed | - | Stepper + step content + ActionBar for onboarding and multi-step flows. |\n\n### Pages (3)\n\nPages are templates filled with real merchant data. They are documented as refer ents.pages.dev/?path=/docs/components-buttonsgroup) · 7 stories · A buttons group is a container that groups related buttons together, providing visual cohesion and proper spacing.\n\nRelated elements: `<s-button>`, `<s-dropdown>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `layout` | select | `horizontal` | `horizontal` | Layout direction of the buttons group, currently only horizontal is supported.. vertical will be supported soon |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-buttonsgroup--default), [Button Count Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-buttonsgroup--button-count-variants), [Theme Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-buttonsgroup--theme-variants), [With Dropdown](https://dashboard-ui-components.pages.dev/?path=/story/components-buttonsgroup--with-dropdown), [Dropdown In Middle](https://dashboard-ui-components.pages.dev/?path=/story/components-buttonsgroup--dropdown-in-middle), [Buttons With Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-buttonsgroup--buttons-with-icons), [With Disabled States](https://dashboard-ui-components.pages.dev/?path=/story/components-buttonsgroup--with-disabled-states)\n\n**Rendered markup (default story)**\n\n```html\n<s-buttons-group class=\"s-btn-group s-btn-group--horizontal hydrated\">\n  <s-button theme=\"white\" outlined=\"\" class=\"s-btn s-btn--white default md outlined ltr hydrated s-btn-group-item s-btn-group-item--start\" target=\"_self\">First Button<\/s-button>\n  <s-button theme=\"white\" outlined=\"\" class=\"s-btn s-btn--white default md outlined ltr hydrated s-btn-group-item s-btn-group-item--end\" target=\"_self\">Second Button<\/s-button>\n<\/s-buttons-group>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `action-bar`). Edit the catalog, not this file._\n", "03-components/organisms/table": "# DataTable\n\n> The merchant list view: header (title, tabs, search, filters), column headers with sort / select-all, typed cells, sticky action column, row selection with bulk bar, delete, edit sheet, pagination footer, mobile card rows, empty and filter-result states.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Data display | 4 - Slot / Composition | existing | figma, storybook | `<s-table>` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `columns` | array of {key, cell: TableCell type, sortable, sticky} |\n| `rows` | array |\n| `selectable` | boolean |\n| `status` | `default`, `selected`, `filter-results`, `no-results`, `scroll`, `actions-scroll`, `tabs`, `title`, `more-menu` |\n| `device` | `desktop`, `mobile` |\n| `header` | slot (PanelHeader \\| Tabs \\| FilterResults) |\n| `footer` | slot (Pagination) |\n| `bulkActions` | slot |\n\n## States\n\n- loading\n- empty\n- filtered-empty\n- selected\n- scrolling\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nHeadless layer: **useDataTable (sorting, selection, pagination state)**.\n\nComposes: [TableCell](../molecules/table-cell.md), [Checkbox](../atoms/checkbox.md), [Chip](../atoms/chip.md), [Status](../molecules/status.md), [MoreMenu](../organisms/more-menu.md), [Pagination](../organisms/pagination.md), [PanelHeader](../molecules/panel-header.md), [Tabs](../organisms/tabs.md), [FilterResults](../molecules/filter-results.md), [EmptyState](../organisms/empty-state.md).\n\n## Notes and migration\n\nRename Figma's Status=[delevery, deliverd, in prograss, retrevied, wating payment, wating review] presets (typos) to a data mapping in docs/03-components/molecules/status.md.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_Table/Tabs Item` | Table | 2 | Active: Off, On |\n| `_Table/Filter Results` | Table | 2 | Type: Close, Default |\n| `Table/Header` | Table | 4 | Device: Desktop, Mobile; Selected: Off, On |\n| `Table/Status` | Table | 9 | Status: cancelled, deleted, delevery, deliverd, in prograss, retrevied, shipped, wating payment, wating review |\n| `Table/Cells` | Table | 32 | Type: Actions Toggle, Actions one icon, Actions three icons, Actions two icons, Bulk Edit, Checkbox, Chips, Date & Time, Drop Down, Image + Text one line, Image + Text two lines, Images, Markets, Percentage, Price, Price with text, Products, Sort, Status, Tags, Text, Text + Flag; Scroll: Off, On; Selected: Off, On |\n| `Table` | Table | 18 | Status: Actions Scroll, Default, Filter Results, More Menu, No Results, Scroll Down, Selected, Tabs, Title, Title Scroll; Device: Desktop, Mobile |\n| `Table/Footer` | Table | 2 | Device: Desktop, Mobile |\n| `previewContainer` | Table | 2 | Type: Blog, Default |\n| `Table/Alertbox` | Table | 4 | Hover: Off, On; Device: Desktop, Mobile |\n| `Table/Delete` | Table | 2 | Location: Data, Header; Scroll: Off; Selected: Off; Deleted: Off |\n| `_Table/Panel Header` | Table | 2 | Size: Default, Small |\n| `_Table/Refresh Button` | Table | 2 | Active: Off, On |\n| `_Table/Pin` | Table | 2 | Pin: Off, On |\n\n## Source in the Twilight Storybook today\n\n### `<s-table>`\n\n[components-table](https://dashboard-ui-components.pages.dev/?path=/docs/components-table) · 9 stories · The table component is a customizable table that provides functionalities for sorting, pagination, and filtering.\n\nRelated elements: `<s-panel>`, `<s-panel-head>`, `<s-panel-body>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `children` | string |  |  |  |\n| `emptyPlaceholderDesc` | text | `undefined` |  | Description to display when there's no data |\n| `emptyPlaceholderIcon` | text | `undefined` |  | Icon to display when there's no data |\n| `emptyPlaceholderLabel` | text | `undefined` |  | Label to display when there's no data |\n| `fetchUrl` | text | `undefined` |  | Table data source url |\n| `hasNextPage` | boolean | `false` |  | Indicates if there is a next page available |\n| `hasPrevPage` | boolean | `false` |  | Indicates if there is a previous page available |\n| `headers` | array | `[\"Name\", \"Age\", \"Visits\", \"Progress\"]` |  | Table headers |\n| `items` | array | `TABLE_ITEMS` |  | Table data |\n| `itemsPerPage` | string | `[\"10\", \"20\", \"30\", \"40\", \"50\"]` |  | Items per page |\n| `layout` | string | `scroll` |  | Table layout, scroll or responsive, default is scroll |\n| `loading` | boolean | `false` |  | Loading state |\n| `pagination` | boolean | `true` |  | Table pagination |\n| `searchPlaceholder` | string | `Search...` |  | Table search placeholder |\n| `searchable` | boolean | `false` |  | Enable table search |\n| `selectable` | boolean | `false` |  | Enable table row selection |\n| `sortBy` | object | `undefined` |  | Sorting configuration for columns in the table |\n| `sortable` | boolean | `false` |  | Enable table sorting |\n| `transform` | object | `undefined` |  | Transform data before passing to the component |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onNextButtonClicked` | Event emitted when next page button is clicked |\n| `onPrevButtonClicked` | Event emitted when previous page button is clicked |\n| `onSelect` | Event emitted when single or all rows are selected |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-table--default), [With Search](https://dashboard-ui-components.pages.dev/?path=/story/components-table--with-search), [Sorting](https://dashboard-ui-components.pages.dev/?path=/story/components-table--sorting), [Selection](https://dashboard-ui-components.pages.dev/?path=/story/components-table--selection), [Custom Pagination](https://dashboard-ui-components.pages.dev/?path=/story/components-table--custom-pagination), [Empty State](https://dashboard-ui-components.pages.dev/?path=/story/components-table--empty-state), [Responsive Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-table--responsive-layout), [Custom Slots](https://dashboard-ui-components.pages.dev/?path=/story/components-table--custom-slots), [All Features](https://dashboard-ui-components.pages.dev/?path=/story/components-table--all-features)\n\n**Rendered markup (default story)**\n\n```html\n<s-panel no-padding=\"\" class=\"s-panel no-padding ltr\">\n  <s-panel-head data-collapsed=\"true\" class=\"hydrated\">\n    <h2 slot=\"title\">Table Component<\/h2>\n  <\/s-panel-head>\n  <s-panel-body>\n    <s-table items=\"[{&quot;name&quot;:&quot;John Wick&quot;,&quot;age&quot;:&quot;24&quot;,&quot;visits&quot;:&quot;100&quot;,&quot;progress&quot;:&quot;54&quot;},{&quot;name&quot;:&quot;James Bond&quot;,&quot;age&quot;:&quot;24&quot;,&quot;visits&quot;:&quot;100&quot;,&quot;progress&quot;:&quot;54&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot;,&quot;progress&quot;:&quot;68&quot;,&quot;options&quot;:&quot;&quot;},{&quot;name&quot;:&quot;Joe&quot;,&quot;age&quot;:&quot;45&quot;,&quot;visits&quot;:&quot;20&quot\n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `table`). Edit the catalog, not this file._\n", "03-components/organisms/empty-state": "# EmptyState\n\n> Illustration + title + description + action for empty lists and no-results.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|--- les/tab.md).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Header Secondary Tabs` | Header | 12 | Language: Arabic, English; state: active, default, hover; Contained: Off, On |\n| `Primary Tabs List - Dashboard only` | Header | 2 | Language: Arabic, English |\n| `_Table/Tabs Item` | Table | 2 | Active: Off, On |\n\n## Source in the Twilight Storybook today\n\n### `<s-tabs-group>`\n\n[components-tabs](https://dashboard-ui-components.pages.dev/?path=/docs/components-tabs) · 5 stories · The `s-tabs-group` component represents a group of tabs in a tabbed interface. It handles the display of tab headers and bodies, providing properties for customization, using the `s-tab-head` and `s-tab-body` components. to create a tabbed interface.\n\nRelated elements: `<s-tab-head>`, `<s-tab-body>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `id` | string | `''` |  | Tabs group unique identifier |\n| `loading` | boolean | `false` |  | Loading state |\n| `name` | string | `''` |  | Tabs group unique name |\n| `theme` | string | `default` | `default`, `stack`, `buttons`, `underline` | Tabs group theme style, you can choose between 'default', 'stack', 'buttons' and 'underline' |\n| `wide` | boolean | `true` |  | Enable full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `tabChanged` | Emitted when the active tab changes. Provides index, value, and payload information. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-tabs--default), [Stack](https://dashboard-ui-components.pages.dev/?path=/story/components-tabs--stack), [Buttons](https://dashboard-ui-components.pages.dev/?path=/story/components-tabs--buttons), [Underline](https://dashboard-ui-components.pages.dev/?path=/story/components-tabs--underline), [Fit Width](https://dashboard-ui-components.pages.dev/?path=/story/components-tabs--fit-width)\n rnal layout helpers, not through a shared prop bag.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Alertbox_Upgrade` | Alertbox | 2 | Device: Desktop, Mobile |\n\n## Source in the Twilight Storybook today\n\n### `<s-alert-box>` — theme=feature\n\n[components-alertbox](https://dashboard-ui-components.pages.dev/?path=/docs/components-alertbox) · 11 stories · A message box provides contextual feedback to users. It can be used to display success, warning, error, or info messages.\n\nRelated elements: `<s-alert-box-action>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `centerAlign` | boolean |  |  | set to true to center the alert box content |\n| `closable` | boolean | `false` |  | Show close button, if you want user to to be able to close the alert box |\n| `horizontal` | boolean |  |  | If true, the alert box will be displayed in a horizontal layout. |\n| `layout` | string | `default` | `default`, `flat` | Alert box Layout, you can set layout to default or flat |\n| `theme` | string | `default` | `default`, `secondary`, `danger`, `warning`, `info`, `feature` | Alert box Theme, you can set theme to default, secondary, danger, warning, info or feature |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onclick` | Emitted when the alert box is clicked. |\n| `onclose` | Emitted when the alert box is closed. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--default), [Secondary](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--secondary), [Danger](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--danger), [Warning](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--warning), [Info](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--info), [Feature](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--feature), [Flat](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--flat), [Closable](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--closable), [Horizontal](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--horizontal), [Center Align](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--center-align), [Custom Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--custom-slot)\n\n**Rendered markup (default story)**\n\n```html\n<s-alert-box theme=\"default\" layout=\"default\" class=\"s-alert-box s-alert-box--default default ltr hydrated\">\n  <i slot=\"icon\" class=\"hgi-stroke hgi-alert-02\">\n  <\/i>\n  <h4 slot=\"title\">AlertBox Title<\/h4>\n  <article slot=\"desc\">\n    <p>This is a default alert description.<\/p>\n  <\/article>\n  <div slot=\"action\">\n    <s-alert-box-action slot=\"action\" layout=\"btn\" theme=\"default\" href=\"https://example.com\" target=\"_blank\" class=\"hydrated\">Primary Action<\/s-alert-box-action>\n    <s-alert-box-action slot=\"action\" layout=\"outlined\" theme=\"default\" href=\"https://example.com\" target=\"_blank\" class=\"hydrated\">Secondary Action<\/s-alert-box-action>\n  <\/div>\n<\/s-alert-box>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `alert-upgrade`). Edit the catalog, not this file._\n", "03-components/organisms/dropdown-list": "# DropdownList\n\n> The floating list behind SelectField, MultiSelectField, pickers and menus: one to three layers, accordion, flags, images, checkboxes, descriptions, no-results and create-new states.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Containment | 4 - Slot / Composition | existing | figma, storybook | `<s-dropdown>, <s-select> (overlay list)` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `variant` | `one-layer`, `accordion`, `three-layers`, `no-results`, `no-results-with-add` |\n| `items` | array |\n| `checkbox` | boolean |\n| `icon` | boolean |\n| `description` | boolean |\n| `searchable` | boolean |\n\n## States\n\n- open\n- closed\n- loading\n- empty\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nHeadless layer: **useListbox / useMenu (structure 5) supplies keyboard navigation, typeahead and selection; DropdownList is the UI.**.\n\nComposes: [ListItem](../molecules/list-item.md), [SearchField](../molecules/search-field.md), [Checkbox](../atoms/checkbox.md), [Flag](../atoms/flag.md), [Avatar](../atoms/avatar.md).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Drop Down List` | Drop Down List | 34 | Language: Arabic, English; Variant: Accordion, No Results, No Results with add, One Layer, One Layer - Flag, One Layer - Image, Three layers, Two Layers; Checkbox: False, True; Icon: False, True; Description: False, True |\n| `_listItem` | Drop Down List | 50 | Language: Arabic, English; Variant: item, item-description, item-flag, item-image; danger: False, True; selected: False, True; disabled: false, true; feature: false, true |\n| `_listTitle` | Drop Down List | 8 | Language: Arabic, English; Variant: Category, Search Active, Search Default, Subcategory |\n\n## Source in the Twilight Storybook today\n\n### `<s-dropdown>`\n\n[components-dropdown](https://dashboard-ui-components.pages.dev/?path=/docs/components-dropdown) · 13 stories · A dropdown component that displays a list of selectable items. It supports various states, search functionality, and different toggle elements.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `active` | boolean | `false` |  | Active state of the dropdown |\n| `autoComplete` | boolean | `false` |  | Enables autocomplete functionality |\n| `children` | string |  |  |  |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `isOnClick` | boolean | `false` |  | Enables click event handling |\n| `items` | array | `[]` |  | Items for the dropdown menu |\n| `layout` | select | `start` | `start`, `end`, `expanded` | Dropdown layout |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean | `false` |  | Enables multiple item selection |\n| `overlayAlignment` | select | `start` | `start`, `end` | Horizontal alignment preference for the dropdown overlay |\n| `searchPlaceholder` | text | `undefined` |  | Placeholder text for the search input |\n| `searchQuery` | text | `undefined` |  | Initial search query |\n| `searchable` | boolean | `false` |  | Enables search functionality |\n| `selectable` | boolean | `false` |  | Enables item selection |\n| `sheetTitle` | text |  |  | Optional title shown in the mobile sheet header |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `itemClick` | Event emitted when an item in the dropdown is clicked. Provides the item's route or identifier. |\n| `onclick` | Event emitted when the dropdown toggle button is clicked. This is the main click event for opening/closing the dropdown. |\n| `onclose` | Event emitted when the dropdown menu is closed. Useful for tracking dropdown visibility state and cleanup operations. |\n| `onopen` | Event emitted when the dropdown menu is opened. Useful for tracking dropdown visibility state. |\n| `onselected` | Event emitted when an item is selected in the dropdown. Provides comprehensive information about the selected item including id, label, value, and icon. |\n| `searchValueChange` | Event emitted when the search input value changes (only when searchable or autocomplete is enabled). Useful for implementing custom search logic or autocomplete functionality. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--default), [Selectable](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--selectable), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--searchable), [Layout Start](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-start), [Layout End](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-end), [Overlay Alignment End](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--overlay-alignment-end), [Layout Expanded](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-expanded), [Multiselect](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--multiselect), [With Images](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--with-images), [With Descriptions](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--with-descriptions), [Custom Toggle](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--custom-toggle), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--loading), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--disabled)\n\n**Rendered markup (default story)**\n\n```html\n<s-dropdown layout=\"start\" items=\"[{&quot;id&quot;:0,&quot;label&quot;:&quot;Sort Items&quot;,&quot;value&quot;:&quot;sort&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-sorting-01&quot;},{&quot;id&quot;:1,&quot;label&quot;:&quot;Copy Items&quot;,&quot;value&quot;:&quot;copy&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-copy-01&quot;,&quot;route&quot;:&quot;/&quot;},{&quot;id&quot;:2,&quot;label&quot;:&quot;Export Items&quot;,&quot;value&quot;:&quot;export&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-share-05&quot;,&quot;route&quot;:&quot;/&quot;},{&quot;id&quot;:3,&quot;label&quot;:&quot;Delete Items&quot;,&quot;value&quot;:&quot;delete&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-delete-02&quot;,&quot;route&quot;:&quot;/&quot;},{&quot;id&quot;:4,&quot;label&quot;:&quot;Settings&quot;,&quot;value&quot;:&quot;settings&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-settings-01&quot;}]\" class=\"start ltr hydrated\">\n  <s-button data-toggle=\"true\" slot=\"dropdown-head\" outlined=\"\" class=\"s-btn s-btn--default default md outlined ltr hydrated\" theme=\"default\" target=\"_self\">\n    <i class=\"hgi-stroke h\n<!-- … truncated … -->\n```\n\n### `<s-select>` — overlay list\n\n[components-select](https://dashboard-ui-components.pages.dev/?path=/docs/components-select) · 29 stories · Select component provides a dropdown interface for choosing from a list of options. It supports single and multiple selection, search functionality, grouping, and various customization options.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `addMissingItem` | boolean | `false` |  | Allow adding new items |\n| `allowParentSelect` | boolean | `true` |  | When false and layout is drawer, clicking a parent item opens the drawer/toggles children instead of selecting the parent. When true, parent items remain selectable. |\n| `autocomplete` | boolean |  |  | Enables this option to fetch items from server dynamically based on the search query |\n| `cancelLabel` | text |  |  | Label of the cancel action. Defaults to the translated \"Cancel\". |\n| `children` | string |  |  |  |\n| `confirmLabel` | text |  |  | Label of the confirm action. Defaults to the translated \"Save\". |\n| `confirmable` | boolean |  |  | Buffers the selection behind sticky confirm/cancel actions at the end of the dropdown. No `selectChange` is emitted while the dropdown is open — confirm emits it once (plus `selectConfirm`), cancel emits `selectCancel` and restores the value the dropdown opened with. |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | text | `undefined` |  | HTML content to render in the end slot |\n| `hasError` | boolean |  |  | Error state |\n| `hideClearButton` | boolean | `false` |  | Hide the clear button, useful in certain cases |\n| `items` | array | `[]` |  | Options for the select |\n| `layout` | select | `default` | `default`, `drawer` | Layout mode for the select dropdown |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean |  |  | Enables multiple selection mode, you can then choose either tags or count of selected items, count is default |\n| `overlayAlignment` | string | `start` | `start`, `end` | Horizontal alignment preference for the dropdown overlay |\n| `placeholder` | string |  |  | Placeholder text |\n| `readonly` | boolean | `false` |  | The value cannot change, but the component stays usable: the dropdown still opens and closes, and the search box still filters. Selecting, select-all, add-new, drawer navigation, the clear button and tag removal are all locked. Use it for async work that must not be interrupted, or for view-only permissions; unlike `disabled`, it never greys out the whole component or force-closes the overlay. |\n| `required` | boolean |  |  | Required state |\n| `responsive` | boolean |  |  | Responsive mode |\n| `searchPlaceholder` | text | `undefined` |  | Search input placeholder |\n| `searchable` | boolean |  |  | Enables search functionality |\n| `selectAll` | boolean |  |  | Shows a select-all row in the dropdown. Works only when multiselect is enabled. |\n| `sheetTitle` | text |  |  | Optional title shown in the mobile sheet header |\n| `size` | select |  | `md`, `lg` | Size of the select component |\n| `tags` | boolean |  |  | Display selections as tags |\n| `toggleSlot` | text | `undefined` |  | HTML content to render in the toggle slot. When provided, replaces the default input-wrapper. Element should have data-toggle attribute. |\n| `value` | string |  |  | Selected value(s) |\n| `wide` | boolean |  |  | Full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `addNewItem` | Emitted when user clicks to add a missing item. Provides value and searchString. |\n| `optionsChange` | Emitted when the value of options changes. |\n| `searchValueChange` | Emitted when the search value changes in searchable mode. |\n| `selectChange` | Emitted when the value of the select component changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-select--default), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-select--searchable), [Auto Complete](https://dashboard-ui-components.pages.dev/?path=/story/components-select--auto-complete), [With End Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-slot), [With End Overlay Alignment](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-overlay-alignment), [With Toggle Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-toggle-slot), [With Groups And Thumbnails](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-groups-and-thumbnails), [Nested Options](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-options), [Drawer Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout), [Drawer Layout No Parent Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout-no-parent-select), [Nested With Child Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-with-child-icons), [Multi Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select), [Multi Select Tags Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select-tags-layout), [Multi Select With Select All](https://dashboard-ui-components.page nerated from `catalog/components.json` (id `dropdown-list`). Edit the catalog, not this file._\n", "03-components/organisms/README": "# Organisms\n\nOrganisms are complex sections built from molecules and atoms: the data table, the top app bar, the dropdown list. They usually manage state or layout.\n\n| Component | Material category | Structure | Status |\n|---|---|---|---|\n| [Alert](alert.md) | Communication | 1 | existing |\n| [AlertBanner](alert-banner.md) | Communication | 2 | existing |\n| [UpgradeCard](alert-upgrade.md) | Communication | 2 | existing |\n| [DropdownList](dropdown-list.md) | Containment | 4 | existing |\n| [DateTimePicker](date-time-picker.md) | Selection | 5 | existing |\n| [MoreMenu](more-menu.md) | Containment | 4 | existing |\n| [NavigationDrawer](side-menu.md) | Navigation | 4 | existing |\n| [TopAppBar](header.md) | Navigation | 4 | existing |\n| [SecondaryNavBar](header-subcategory.md) | Navigation | 4 | existing |\n| [Tabs](tabs.md) | Navigation | 5 | existing |\n| [DataTable](table.md) | Data display | 4 | existing |\n| [MobileRow](table-row-mobile.md) | Data display | 2 | existing |\n| [BulkEditSheet](bulk-edit-sheet.md) | Containment | 4 | existing |\n| [EditSheet](edit-sheet.md) | Containment | 4 | existing |\n| [Stepper](stepper.md) | Navigation | 5 | existing |\n| [ActionBar](action-bar.md) | Actions | 4 | existing |\n| [BottomSheet](bottom-sheet.md) | Containment | 4 | existing |\n| [Dialog](dialog.md) | Containment | 4 | existing |\n| [Panel](panel.md) | Containment | 4 | existing |\n| [Tooltip](tooltip.md) | Communication | 5 | existing |\n| [Toast](toast.md) | Communication | 1 | proposed |\n| [EmptyState](empty-state.md) | Communication | 4 | existing |\n| [Pagination](pagination.md) | Navigation | 1 | existing |\n| [Map](map.md) | Data display | 2 | existing |\n| [Accordion](accordion.md) | Containment | 4 | existing |\n| [RichTextEditor](rich-text-editor.md) | Text inputs | 3 | existing |\n", "03-components/organisms/dialog": "# Dialog\n\n> Centered modal (Storybook: Modal). Overlay, positioning, focus trap and close button; content via slots.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Containment | 4 - Slot / Composition | existing | storybook | `<s-modal>` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `open` | boolean |\n| `size` | `sm`, `md`, `lg` |\n| `header` | slot |\n| `body` | slot |\n| `footer` | slot (ActionBar) |\n| `dismissible` | boolean |\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nHeadless layer: **useDialog (focus trap, escape, scroll lock)**.\n\n## Notes and migration\n\nTwilight ships <s-modal> with <s-modal-head|body|footer> slots (sizes sm/md/lg/xlg, theme default/light). Missing from the Figma library: design it from the Storybook.\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n### `<s-modal>`\n\n[components-modal](https://dashboard-ui-components.pages.dev/?path=/docs/components-modal) · 1 stories · A modal component that displays a list of selectable items. It supports various states, search functionality, and different toggle elements.\n\nRelated elements: `<s-button>`, `<s-modal-head>`, `<s-modal-body>`, `<s-modal-footer>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `closable` | boolean | `false` |  | Backdrop clickable to close the modal |\n| `size` | string | `md` |  | Modal size, sm, md, lg, xlg |\n| `theme` | string | `default` |  | Modal theme, default or light |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onclose` | Emitted when the modal closes. |\n| `onopen` | Emitted when the modal opens. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-modal--default)\n\n**Rendered markup (default story)**\n\n```html\n<div class=\"relative w-full h-full min-h-[600px] flex items-center justify-center\">\n  <s-button id=\"s_modal_toggle_s_modal\" class=\"s-btn s-btn--default default md ltr hydrated\" theme=\"default\" target=\"_self\">Show Modal<\/s-button>\n  <s-modal id=\"s_modal\" name=\"\" size=\"md\" theme=\"default\" class=\"s-modal s-modal--default md hydrated\" role=\"dialog\" data-scrollable=\"\" scrollable=\"\">\n    <s-modal-head class=\"hydrated\">\n      <h4 class=\"text-base font-bold\">Modal Title<\/h4>\n      <s-button size=\"sm\" theme=\"danger\" outlined=\"\" data-modal-close=\"\" class=\"s-btn s-btn--danger default sm outlined ltr hydrated\" target=\"_self\">\n        <i class=\"hgi-stroke hgi-cancel-01\">\n        <\/i>\n      <\/s-button>\n    <\/s-modal-head>\n    <s-modal-body class=\"hydrated\">\n      <div class=\"flex flex-col w-full gap-4\">\n        <article class=\"text-sm leading-[1.5]\">\n          <h4 class=\"block font-bold mb-2\">Sample Content<\/h4>\n          <p>This is the default modal content. You can customize it using the content control.<\/p>\n        <\/article>\n      <\/div>\n    <\/s-modal-body>\n    <s-modal-footer class=\"hydrated\"\n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `dialog`). Edit the catalog, not this file._\n", "03-components/organisms/header": "# TopAppBar\n\n> Dark-teal top bar: logo, primary tabs, global search, notifications, account menu. Desktop and mobile.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| organism | Navigation | 4 - Slot / Composition | existing | figma | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `device` | `desktop`, `mobile` |\n| `start` | slot (logo, drawer toggle) |\n| `center` | slot (Tabs) |\n| `end` | slot (GlobalSearch, IconButtons, AccountMenuTrigger) |\n\n## /dashboard-ui-components.pages.dev/?path=/docs/components-dropdown) · 13 stories · A dropdown component that displays a list of selectable items. It supports various states, search functionality, and different toggle elements.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `active` | boolean | `false` |  | Active state of the dropdown |\n| `autoComplete` | boolean | `false` |  | Enables autocomplete functionality |\n| `children` | string |  |  |  |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `isOnClick` | boolean | `false` |  | Enables click event handling |\n| `items` | array | `[]` |  | Items for the dropdown menu |\n| `layout` | select | `start` | `start`, `end`, `expanded` | Dropdown layout |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean | `false` |  | Enables multiple item selection |\n| `overlayAlignment` | select | `start` | `start`, `end` | Horizontal alignment preference for the dropdown overlay |\n| `searchPlaceholder` | text | `undefined` |  | Placeholder text for the search input |\n| `searchQuery` | text | `undefined` |  | Initial search query |\n| `searchable` | boolean | `false` |  | Enables search functionality |\n| `selectable` | boolean | `false` |  | Enables item selection |\n| `sheetTitle` | text |  |  | Optional title shown in the mobile sheet header |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `itemClick` | Event emitted when an item in the dropdown is clicked. Provides the item's route or identifier. |\n| `onclick` | Event emitted when the dropdown toggle button is clicked. This is the main click event for opening/closing the dropdown. |\n| `onclose` | Event emitted when the dropdown menu is closed. Useful for tracking dropdown visibility state and cleanup operations. |\n| `onopen` | Event emitted when the dropdown menu is opened. Useful for tracking dropdown visibility state. |\n| `onselected` | Event emitted when an item is selected in the dropdown. Provides comprehensive information about the selected item including id, label, value, and icon. |\n| `searchValueChange` | Event emitted when the search input value changes (only when searchable or autocomplete is enabled). Useful for implementing custom search logic or autocomplete functionality. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--default), [Selectable](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--selectable), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--searchable), [Layout Start](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-start), [Layout End](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-end), [Overlay Alignment End](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--overlay-alignment-end), [Layout Expanded](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--layout-expanded), [Multiselect](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--multiselect), [With Images](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--with-images), [With Descriptions](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--with-descriptions), [Custom Toggle](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--custom-toggle), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--loading), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-dropdown--disabled)\n\n**Rendered markup (default story)**\n\n```html\n<s-dropdown layout=\"start\" items=\"[{&quot;id&quot;:0,&quot;label&quot;:&quot;Sort Items&quot;,&quot;value&quot;:&quot;sort&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-sorting-01&quot;},{&quot;id&quot;:1,&quot;label&quot;:&quot;Copy Items&quot;,&quot;value&quot;:&quot;copy&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-copy-01&quot;,&quot;route&quot;:&quot;/&quot;},{&quot;id&quot;:2,&quot;label&quot;:&quot;Export Items&quot;,&quot;value&quot;:&quot;export&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-share-05&quot;,&quot;route&quot;:&quot;/&quot;},{&quot;id&quot;:3,&quot;label&quot;:&quot;Delete Items&quot;,&quot;value&quot;:&quot;delete&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-delete-02&quot;,&quot;route&quot;:&quot;/&quot;},{&quot;id&quot;:4,&quot;label&quot;:&quot;Settings&quot;,&quot;value&quot;:&quot;settings&quot;,&quot;icon&quot;:&quot;hgi-stroke hgi-settings-01&quot;}]\" class=\"start ltr hydrated\">\n  <s-button data-toggle=\"true\" slot=\"dropdown-head\" outlined=\"\" class=\"s-btn s-btn--default default md outlined ltr hydrated\" theme=\"default\" target=\"_self\">\n    <i class=\"hgi-stroke h\n<!-- … truncated … -->\n```\n\n### `<s-select>` — mobile sheet (sheetTitle)\n\n[components-select](https://dashboard-ui-components.pages.dev/?path=/docs/components-select) · 29 stories · Select component provides a dropdown interface for choosing from a list of options. It supports single and multiple selection, search functionality, grouping, and various customization options.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `addMissingItem` | boolean | `false` |  | Allow adding new items |\n| `allowParentSelect` | boolean | `true` |  | When false and layout is drawer, clicking a parent item opens the drawer/toggles children instead of selecting the parent. When true, parent items remain selectable. |\n| `autocomplete` | boolean |  |  | Enables this option to fetch items from server dynamically based on the search query |\n| `cancelLabel` | text |  |  | Label of the cancel action. Defaults to the translated \"Cancel\". |\n| `children` | string |  |  |  |\n| `confirmLabel` | text |  |  | Label of the confirm action. Defaults to the translated \"Save\". |\n| `confirmable` | boolean |  |  | Buffers the selection behind sticky confirm/cancel actions at the end of the dropdown. No `selectChange` is emitted while the dropdown is open — confirm emits it once (plus `selectConfirm`), cancel emits `selectCancel` and restores the value the dropdown opened with. |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | text | `undefined` |  | HTML content to render in the end slot |\n| `hasError` | boolean |  |  | Error state |\n| `hideClearButton` | boolean | `false` |  | Hide the clear button, useful in certain cases |\n| `items` | array | `[]` |  | Options for the select |\n| `layout` | select | `default` | `default`, `drawer` | Layout mode for the select dropdown |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean |  |  | Enables multiple selection mode, you can then choose either tags or count of selected items, count is default |\n| `overlayAlignment` | string | `start` | `start`, `end` | Horizontal alignment preference for the dropdown overlay |\n| `placeholder` | string |  |  | Placeholder text |\n| `readonly` | boolean | `false` |  | The value cannot change, but the component stays usable: the dropdown still opens and closes, and the search box still filters. Selecting, select-all, add-new, drawer navigation, the clear button and tag removal are all locked. Use it for async work that must not be interrupted, or for view-only permissions; unlike `disabled`, it never greys out the whole component or force-closes the overlay. |\n| `required` | boolean |  |  | Required state |\n| `responsive` | boolean |  |  | Responsive mode |\n| `searchPlaceholder` | text | `undefined` |  | Search input placeholder |\n| `searchable` | boolean |  |  | Enables search functionality |\n| `selectAll` | boolean |  |  | Shows a select-all row in the dropdown. Works only when multiselect is enabled. |\n| `sheetTitle` | text |  |  | Optional title shown in the mobile sheet header |\n| `size` | select |  | `md`, `lg` | Size of the select component |\n| `tags` | boolean |  |  | Display selections as tags |\n| `toggleSlot` | text | `undefined` |  | HTML content to render in the toggle slot. When provided, replaces the default input-wrapper. Element should have data-toggle attribute. |\n| `value` | string |  |  | Selected value(s) |\n| `wide` | boolean |  |  | Full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `addNewItem` | Emitted when user clicks to add a missing item. Provides value and searchString. |\n| `optionsChange` | Emitted when the value of options changes. |\n| `searchValueChange` | Emitted when the search value changes in searchable mode. |\n| `selectChange` | Emitted when the value of the select component changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-select--default), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-select--searchable), [Auto Complete](https://dashboard-ui-components.pages.dev/?path=/story/components-select--auto-complete), [With End Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-slot), [With End Overlay Alignment](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-overlay-alignment), [With Toggle Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-toggle-slot), [With Groups And Thumbnails](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-groups-and-thumbnails), [Nested Options](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-options), [Drawer Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout), [Drawer Layout No Parent Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout-no-parent-select), [Nested With Child Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-with-child-icons), [Multi Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select), [Multi Select Tags Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select-tags-layout), [Multi Select With Select All](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select-with-select-all), [Add Missing Item](https://dashboard-ui-components.pages.dev/?path=/story/components-select--add-missing-item), [Hide Clear Button](https://dashboard-ui-components.pages.dev/?path=/story/components-select--hide-clear-button), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-select--loading), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-select--has-error), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled), [Disabled Item](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled-item), [Disabled Nested Item](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled-nested-item), [Disabled Item Multiselect](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled-item-multiselect), [Readonly](https://dashboard-ui-components.pages.dev/?path=/story/components-select--readonly), [Readonly Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-select--readonly-searchable), [Readonly Multiselect](https://dashboard-ui-components.pages.dev/?path=/story/components-select--readonly-multiselect), [Readonly Nested](https://dashboard-ui-components.pages.dev/?path=/story/components-select--readonly-nested), [Readonly Drawer](https://dashboard-ui-components.pages.dev/?path=/story/components-select--readonly-drawer), [Readonly While Saving](https://dashboard-ui-components.pages.dev/?path=/story/components-select--readonly-whi --|---|---|---|---|---|\n| organism | Communication | 2 - Standalone | existing | figma, storybook | `<s-alert-box> (horizontal, centerAlign)` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `layout` | `1`, `2` |\n| `title` | string |\n| `action` | slot |\n| `dismissible` | boolean |\n\n## How to build it\n\nBuild as **separate, explicitly named components**. Share styling through tokens and small internal layout helpers, not through a shared prop bag.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Alertbox_Banner` | Alertbox | 2 | Type: Type1, Type2 |\n\n## Source in the Twilight Storybook today\n\n### `<s-alert-box>` — horizontal, centerAlign\n\n[components-alertbox](https://dashboard-ui-components.pages.dev/?path=/docs/components-alertbox) · 11 stories · A message box provides contextual feedback to users. It can be used to display success, warning, error, or info messages.\n\nRelated elements: `<s-alert-box-action>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `centerAlign` | boolean |  |  | set to true to center the alert box content |\n| `closable` | boolean | `false` |  | Show close button, if you want user to to be able to close the alert box |\n| `horizontal` | boolean |  |  | If true, the alert box will be displayed in a horizontal layout. |\n| `layout` | string | `default` | `default`, `flat` | Alert box Layout, you can set layout to default or flat |\n| `theme` | string | `default` | `default`, `secondary`, `danger`, `warning`, `info`, `feature` | Alert box Theme, you can set theme to default, secondary, danger, warning, info or feature |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onclick` | Emitted when the alert box is clicked. |\n| `onclose` | Emitted when the alert box is closed. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--default), [Secondary object | `[]` |  | Weekdays to disable selection for. 0 = Sunday, 6 = Saturday. Accepts numbers (0–6) or day names/abbreviations, e.g. ['sun', 'monday'] |\n| `hasError` | boolean | `false` |  | Error state |\n| `inline` | boolean | `false` |  | Inline calendar |\n| `is24Hr` | boolean | `false` |  | Enable 24 hour format |\n| `isOpen` | boolean | `false` |  | Open calendar popup on start (only works when inline is false) |\n| `layout` | select | `start` | `start`, `end` | Calendar layout |\n| `loading` | boolean | `false` |  | Loading state |\n| `maxDate` | text | `null` |  | Maximum date selectable |\n| `minDate` | text | `null` |  | Minimum date selectable |\n| `placeholder` | string | `Select value` |  | Field placeholder |\n| `portal` | boolean | `false` |  | If true, appends the calendar dropdown to the body instead of attaching it to the input. Useful for avoiding overflow issues in containers with overflow: hidden. |\n| `required` | boolean | `false` |  | Required field |\n| `type` | select | `single` | `range`, `time`, `single`, `multiple` | Calendar type, range, time, single or multiple |\n| `value` | text | `[]` |  | Current value of the calendar (string or array of strings) for multiple values |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `dateRangeChanged` | Emitted when the date range changes. |\n| `valueChanged` | Emitted when the calendar value changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-calendar--default), [Single](https://dashboard-ui-components.pages.dev/?path=/story/components-calendar--single), [Multiple](https://dashboard-ui-components.pages.dev/?path=/story/components-calendar--multiple), [Range](https://dashboard-ui-components.pages.dev/?path=/story/components-calendar--range), [Time](https://dashboard-ui-components.pages.dev/?path=/story/components-calendar--time), [Initial Value](https://dashboard-ui-components.pages.dev/?path=/story/components-calendar--initial-value), [
