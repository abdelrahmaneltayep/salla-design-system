secondary | `sys.color.text.secondary` | `#666666` | `text/gray/light` (placeholder, helper text) |\n| Text tertiary | `sys.color.text.tertiary` | `#737373` | `text/gray/lighter` (inactive tab, breadcrumb ancestors, neutral status) |\n| Text disabled | `sys.color.text.disabled` | `#bbbbbb` | `text/gray/disabled` |\n| Text inverse | `sys.color.text.inverse` | `#ffffff` | `text/gray/white` |\n\n## Status colours\n\nFive statuses × five shades, all observed except where noted.\n\n| Status | lighter (fill) | light (border) | primary | dark (dot) | darker (text) |\n|---|---|---|---|---|---|\n| Success | `#effbf6` | `#97e7c8` | `#00af6c` | `#008c56` | `#005232` |\n| Danger | `#feecec` | `#fbb9bc` | `#f55157` | `#ca4146` | `#7a1f1e` |\n| Warning | `#fff9eb` | `#ffe7c7` | `#ffaf44` | `#d18f36` | `#8f5f22` |\n| Info | `#ecf3fe` | `#cbe0fb` | `#5196f3` | `#417ac8` | `#204374` |\n| Neutral | `#eeeeee` | `#dddddd` | `#bbbbbb` | `#bbbbbb` | `#737373` |\n\nFigma variables per shade: `{status}/{status}-lighter`, `border/status/{status}-light`, `background/status/{status}/primary` (also `{status}/{status}`), `{status}/{status}-dark`, `{status}/{status}-darker` (also `text/status/{status}/darker`). Neutral uses `background/default/neutrals-dark`, `border/hover`, `background/default/neutrals-darkest`, `text/gray/lighter`.\n\nHow components use the shades:\n\n| Component | fill | border / accent | dot | text |\n|---|---|---|---|---|\n| `Button` filled status | `primary` | `primary` (2px) | – | `text.inverse` |\n| `Alert` | `lighter` | `light` (3px inline-start) | – | `darker` |\n| `Status` subtle | – | – | `dark` | `darker` |\n| `Status` strong | `lighter` | – | `dark` | `darker` |\n| `Table/Status` | `lighter` | `light` (1px) | `dark` | `darker` |\n| `TextField` focus underline | – | `info.primary` (2px) | – | – |\n| `TextField` error | – | `danger.primary` | – | `danger.primary` |\n| `MenuItem` danger | – | – | – | `danger.primary` |\n\n## Accent roles (non-semantic)\n\n| Role | Token | Values | Figma | Use |\n|---|---|---|---|---|\n| Feature | `sys.color.feature.*` | gradient `#ffd8c2 → #ffaf83`, text `#883000` | `color/support-non-semantic/orange/200|300`, `background/supporting-colors/orange/darker` | `Button variant=feature`, `ListItem feature` |\n| Upgrade | `sys.color.upgrade.*` | lighter `#fffbea`, primary `#ffe895`, dark `#d1b44c`, darker `#554300` | `background/supporting-colors/gold/*`, `border/upgrade/dark`, `text/upgrade/darker` | `UpgradeCard`, crown CTA |\n\n## Code palette (Twilight) vs Figma\n\nThe Storybook stores colours as rounded HSL channels on `:root` (`--primary: 189 100% 17%`), so the computed hex drifts from the Figma hex by 1-3 units per channel on most roles. Invisible on screen, but it makes design-to-code QA report false diffs. Comparison of every role that exists in both (`catalog/storybook-tokens.json` vs `catalog/figma-tokens-harvest.json`):\n\n| Twilight token | Code hex | Figma variable | Figma hex | Δ (max channel) |\n|---|---|---|---|---|\n| `primary` | `#004A57` | `text/primary/primary` | `#004956` | 1 |\n| `primary-200` | `#95C8D0` | `text/primary/disabled` | `#95C8D0` | same |\n| `secondary` | `#A3FFE5` | `background/secondary/seconadry` | `#A4FFE5` | 1 |\n| `secondary-200` | `#E5FFF9` | `background/secondary/lighter` | `#E6FFF9` | 1 |\n| `secondary-300` | `#DBFFF6` | `border/seconadry-hover` | `#DBFFF6` | same |\n| `success` | `#00AD6B` | `background/status/success/primary` | `#00AF6C` | 2 |\n| `success-100` | `#EFFBF6` | `success/success-lighter` | `#EFFBF6` | same |\n| `success-200` | `#97E7C9` | `border/status/success-light` | `#97E7C8` | 1 |\n| `success-600` | `#008A55` | `success/success-dark` | `#008C56` | 2 |\n| `success-800` | `#005232` | `success/success-darker` | `#005232` | same |\n| `danger` | `#F55157` | `danger/danger` | `#F55157` | same |\n| `danger-100` | `#FEECEC` | `danger/danger-lighter` | `#FEECEC` | same |\n| `danger-300` | `#FBB7BA` | `border/status/danger-light` | `#FBB9BC` | 2 |\n| `danger-600` | `#C94045` | `danger/danger-dark` | `#CA4146` | 1 |\n| `danger-800` | `#7B1F1E` | `danger/danger-darker` | `#7A1F1E` | 1 |\n| `warning` | `#FFAD42` | `background/status/warning/primary` | `#FFAF44` | 2 |\n| `warning-100` | `#FFF6EB` | `warning/warning-lighter` | `#FFF9EB` | 3 |\n| `warning-200` | `#FFE7C7` | `border/status/warning-light` | `#FFE7C7` | same |\n| `warning-600` | `#D28F37` | `warning/warning-dark` | `#D18F36` | 1 |\n| `warning-800` | `#916122` | `warning/warning-darker` | `#8F5F22` | 2 |\n| `info` | `#5399F3` | `background/status/info/primary` | `#5196F3` | 3 |\n| `info-100` | `#ECF3FE` | `info/info-lighter` | `#ECF3FE` | same |\n| `info-200` | `#CBE0FB` | `border/status/info-light` | `#CBE0FB` | same |\n| `info-600` | `#4179C8` | `info/info-dark` | `#417AC8` | 1 |\n| `info-800` | `#204374` | `info/info-darker` | `#204374` | same |\n| `gray` | `#BABABA` | `text/gray/disabled` | `#BBBBBB` | 1 |\n| `gray-400` | `#EDEDED` | `border/default` | `#EEEEEE` | 1 |\n| `gray-500` | `#DEDEDE` | `border/hover` | `#DDDDDD` | 1 |\n| `dark` / `dark-100` / `dark-200` | `#333333` / `#737373` / `#666666` | `text/gray/dark` / `lighter` / `light` | same | same |\n| `gold` | `#FFE894` | `background/supporting-colors/gold/primary` | `#FFE895` | 1 |\n| `gold-100` | `#FFFBEB` | `background/supporting-colors/gold/lighter` | `#FFFBEA` | 1 |\n| `gold-300` | `#D1B44D` | `background/supporting-colors/gold/dark` | `#D1B44C` | 1 |\n| `gold-400` | `#574400` | `text/upgrade/darker` | `#554300` | 2 |\n| `orange` | `#FFAF85` | `color/support-non-semantic/orange/300` | `#FFAF83` | 2 |\n| `orange-200` | `#FFD8C2` | `color/support-non-semantic/orange/200` | `#FFD8C2` | same |\n| `orange-400` | `#8A3000` | `background/supporting-colors/orange/darker` | `#883000` | 2 |\n\n14 of 38 shared roles match exactly; 24 drift by 1-3 units. **Decision:** the Figma hex is the source of truth (`ref.palette.*`); regenerate the Twilight HSL channels from it so the two are byte-identical.\n\nCode also ships ramps the design library does not have: `primary-100 … 700`, `secondary-100 … 700`, 8-step status ramps, and the product-line accents `mahally` (`#FF5029` ramp), `blue` (`#94F1FF` ramp), `pink` (`#FF8FA5` ramp) and the `moshammer` AI gradient (`#ffe894 → #ffaf85 → #e4bd90 → #2cf2c7 → #94f1ff`). Keep those as application-level variables outside the system palette until a design decision adds them.\n\n## Reference palette\n\n`ref.palette.{teal, gray, green, red, amber, blue, orange, gold}.{step}` in `tokens/tokens.json`. Steps are named by lightness (50 lightest → 900 darkest); every step listed was observed in Figma.\n\n## Contrast\n\nSee [accessibility.md](../01-foundations/accessibility.md#colour-and-contrast). Filled `success`, `warning`, `danger` and `info` Buttons with white labels do not reach AA at 14px; the `dark` shades do (danger 4.8:1) or nearly do (success 4.3:1).\n\n## Dark theme\n\nNot shipped. `tokens/css/tokens.css` includes a `[data-theme=\"dark\"]` block with placeholder values that proves the `sys` tier is theme-able. Legacy variables from the `07--light-theme/*` collection (`color-white-drop-menu`, `color-gray-200`) still appear on a few frames and should be re-pointed to the roles above.\n", "02-styles/spacing": "# Spacing\n\nThe scale is the Figma **`Spacing/Sizes`** collection (`04-Token`), adopted verbatim. Values were read from Figma on 2026-09-22; the older `spacing/*` variables that some frames still use are mapped below.\n\n## The scale\n\n| Token | Value | Figma `Spacing/Sizes` | Older `spacing/*` alias | Observed use |\n|---|---|---|---|---|\n| `ref.space.none` | 0 | `none` ✓ | – | |\n| `ref.space.3xs` | 2px | `3xs` ✓ | `spacing/6xs` ✓ | Checkbox inner padding, TranslationToggle gap, Alert icon offset |\n| `ref.space.2xs` | 4px | `2xs` ✓ | `spacing/5xs` ✓ | Button icon–label gap, Status dot–label gap, Alert title–body gap, Button sm vertical padding |\n| `ref.space.xs` | 6px | `xs` ✓ | `spacing/4xs` ✓ | Table/Status vertical padding, Loader padding |\n| `ref.space.sm` | 8px | `sm` ✓ | `spacing/3xs` ✓ | Button / field vertical padding, field gap, Status horizontal padding, Tab vertical padding, Alert gap |\n| `ref.space.md` | 10px | `md` ✓ | `spacing/2xs` ✓ | UpgradeCard CTA vertical padding, page-size select, primary Tabs gap |\n| `ref.space.lg` | 12px | `lg` ✓ | `spacing/xs` ✓ | Button / field horizontal padding, MenuItem padding, label–field gap, Tooltip padding |\n| `ref.space.xl` | 14px | `xl` ✓ | – | mobile gutters (PageTitle, Table/Footer) |\n| `ref.space.2xl` | 16px | `2xl` ✓ | `spacing/base` ✓ | card padding, TopAppBar vertical padding, Alert vertical padding, NavigationItem padding, primary Tab horizontal padding |\n| `ref.space.3xl` | 20px | `3xl` ✓ | – | TopAppBar gap |\n| `ref.space.4xl` | 24px | `4xl` ✓ | `spacing/2xl` ✓ | Alert horizontal padding, Pagination gap, SecondaryNavBar gap |\n| `ref.space.5xl` | 26px | `5xl` ✓ | – | Table/Footer desktop horizontal padding (off-grid, see below) |\n| `ref.space.6xl` | 32px | `6xl` | – | not observed |\n| `ref.space.7xl` | 40px | `7xl` | – | not observed |\n| `ref.space.8xl` | 48px | `8xl` | – | not observed |\n| `ref.space.9xl` | 56px | `9xl` ✓ | `spacing/7xl` ✓ | **desktop page gutter** (TopAppBar, SecondaryNavBar, PageTitle, Breadcrumb) |\n\n## Semantic aliases\n\nComponents use role names so intent reads in the CSS:\n\n| Alias | → | Use |\n|---|---|---|\n| `sys.space.hairline` | `3xs` 2px | inner padding of tiny controls |\n| `sys.space.tight` | `2xs` 4px | icon ↔ label |\n| `sys.space.compact` | `sm` 8px | control vertical padding, sibling gaps in a row |\n| `sys.space.default` | `lg` 12px | control horizontal padding, list item padding |\n| `sys.space.comfortable` | `2xl` 16px | card / bar padding |\n| `sys.space.loose` | `3xl` 20px | bar item gap |\n| `sys.space.section` | `4xl` 24px | between sections, alert side padding |\n| `sys.space.gutter` | `9xl` 56px | page side gutter (desktop) |\n\n## The two-scale problem, resolved\n\nFigma still carries two variable sets with **the same names for different values**:\n\n| Name | `spacing/*` (older) | `Spacing/Sizes/*` (04-Token) |\n|---|---|---|\n| `3xs` | 8px | 2px |\n| `2xs` | 10px | 4px |\n| `xs` | 12px | 6px |\n| `2xl` | 24px | 16px |\n\n`Button`, `Alertbox`, `Page Title` and `Header` use the older set; `_TextInput`, `checkBox`, `Status`, `Side menu`, `More Menu`, `Table/*` use `Spacing/Sizes`. The value is always the same physical pixel; only the name differs. **Decision: `Spacing/Sizes` is the scale**, because it is the newer collection, it is complete (`none … 9xl`), and most component frames already use it. Re-point the older `spacing/*` variables per the alias column above, then delete them.\n\nTwo values are off the 4px grid and worth a design decision: `xl` = 14px (used as the mobile gutter) and `5xl` = 26px (Table/Footer). Recommend 16px and 24px.\n\n## Rules\n\n- Padding inside atoms and molecules comes from `comp.*` tokens that alias `ref.space.*`.\n- Gaps between siblings use the semantic aliases.\n- No values outside the scale; legacy hard-coded `gap-[5px]`, `p-[10px]` seen on a few frames are migration targets.\n", "02-styles/shape": "# Shape\n\nCorner radii as a Material shape scale. Salla's default corner is **8px**; the system is rounded but not pill-shaped except for status chips, avatars, switches and tags.\n\n## Scale\n\n| Shape role | Token | Value | Figma variable | Observed on |\n|---|---|---|---|---|\n| None | `sys.shape.none` | 0 | `Radius/Sizes/None` | table cells, full-bleed banners |\n| Extra small | `sys.shape.extra-small` | 4px ✓ | `radius/md` | Checkbox, secondary Tab, primary Tab, Tooltip, product image in MenuItem |\n| Small | `sys.shape.small` | 8px ✓ | `radius/xl`, `Radius/Sizes/xl` | **Button, fields, Alert, UpgradeCard, NavigationDrawer, MoreMenu, page-size select, video thumbnail** |\n| Medium | `sys.shape.medium` | 12px | `Radius/Sizes/2xl` (value not observed) | side sheets |\n| Large | `sys.shape.large` | 16px ✓ | `Radius/Sizes/3xl` | LearnMore card, Dialog, BottomSheet top corners |\n| Full | `sys.shape.full` | 9999px ✓ | `radius/full`, `Radius/Sizes/Full` | Status, Avatar, Switch, header tag, crown badge |\n\n## Reference scale\n\n`ref.radius.{none 0, sm 2, md 4, lg 6, xl 8, 2xl 12, 3xl 16, 4xl 24, 5xl 32, full}` mirrors Figma `Radius/Sizes/{None, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, Full}`. `md`, `xl`, `3xl` and `full` were verified; the rest follow the scale.\n\n## What the Twilight code ships today\n\nThe Storybook roundness scale matches the reference scale exactly: `rounded-sm` 2px, `rounded` 4px, `rounded-md` 6px, `rounded-lg` 8px, `rounded-xl` 12px, `rounded-2xl` 16px, `rounded-3xl` 24px, `rounded-4xl` 32px. Note the off-by-one naming against Figma: Tailwind `rounded-lg` (8px) is Figma `radius/xl` (8px) and `sys.shape.small`. The Tailwind preset in this repo exposes the Material names (`rounded-small`) so the mismatch disappears in product code.\n\n## Issues found in Figma\n\n- The old variable **`radius/sm` resolves to 8px** (seen on the header avatar chip and the page-size select) while `radius/xl` is also 8px. `radius/sm` must be re-pointed to 2px or the instances moved to `radius/xl`.\n- `Status` hard-codes `30px` and `Radius/Sizes/full` sometimes resolves to `8888px` / `8749px` instead of `9999px` (scaled instances). All map to `sys.shape.full`.\n- Header tag uses `radius/xl` overridden to `140px`; map to `sys.shape.full`.\n\n## Rules\n\n- Nested surfaces step down one role (LearnMore large → Button small → Chip extra-small).\n- In RTL, start/end corner radii mirror automatically when written with logical properties (`border-start-start-radius`).\n- Cut corners and asymmetric shapes are not used, except the MoreMenu sub-menu which squares the corner touching its parent.\n", "02-styles/illustrations": "# Illustrations\n\nSpot illustrations for empty states, onboarding and success moments. Source frames: `Illustration` (variant web / mobile) and `Illustrations Collection` (20 named pieces) in the Merchant DS.\n\n## Inventory (from Figma)\n\n`search field not found` · `product custom fields` · `product options` · `add brands` · `export template` · `no values` · `add template` · `add category` · `classifications` · `no codes` · `add products` · `product measurements` · `add to cart` · `info settings` · `order filters empty` · (5 more in the collection frame)\n\n## Usage\n\n- Illustrations appear only inside `EmptyState` (organism) and onboarding `WizardPage` steps. Never as decoration in forms or tables.\n- One illustration per screen state.\n- Two sizes: `web` (~200px) and `mobile` (~140px), chosen by window size class.\n- Illustrations use the brand palette (`ref.palette.teal.*`, `gray.*`) plus at most one status accent; they must read in both LTR and RTL without mirroring (avoid text and directional arrows inside artwork).\n\n## Component\n\n```\n<Illustration name=\"add-products\" device=\"web\" />\n```\n\nNames migrate to kebab-case ids (`order-filters-empty`). The collection frame becomes `assets/illustrations/` with one SVG per id; `Illustration` is a thin atom that loads by id.\n\n## Adding a new illustration\n\n1. Draw at 200×200 on the web artboard, export mobile at 140.\n2. Add to `Illustrations Collection` with the kebab-case id as the layer name.\n3. Add the id to `assets/illustrations/index.json` and reference it from the `EmptyState` story.\n", "02-styles/motion": "# Motion\n\nMaterial's motion system reduced to what the dashboard needs. **No motion tokens exist in Figma today.** The Twilight code ships a single `--transition-duration: 250ms`; the tokens below split that into three durations so small state changes feel quicker than surface transitions.\n\n## Tokens\n\n| Token | Value | Use |\n|---|---|---|\n| `ref.duration.short` | 100ms | state changes: hover, pressed, focus ring, checkbox tick |\n| `ref.duration.medium` | 200ms | enter / exit of small surfaces: DropdownList, MoreMenu, Tooltip, Toast |\n| `ref.duration.long` | 300ms | enter / exit of large surfaces: Dialog, BottomSheet, side sheets, NavigationDrawer |\n| `ref.easing.standard` | `cubic-bezier(0.2, 0, 0, 1)` | everything entering or changing state |\n| `ref.easing.emphasized` | `cubic-bezier(0.3, 0, 0.8, 0.15)` | exits (accelerate out) |\n\n## Patterns\n\n| Pattern | Spec |\n|---|---|\n| Fade | opacity 0 → 1, `medium`, `standard` |\n| Fade through | outgoing fades over first 30%, incoming fades in with 4px rise |\n| Slide (sheets) | translate 100% → 0 on the inline / block edge, `long`, `standard`; exit `emphasized` |\n| Scale (menus) | 0.95 → 1 with fade, `medium`, transform-origin at the trigger |\n| Loading | `LoadingIndicator` spinner 1s linear infinite; dots 1.2s; line indeterminate 2s |\n| Switch thumb | 100ms `standard` translate; loading spinner fades in inside the thumb |\n| Skeleton | shimmer 1.5s linear infinite, disabled under reduced motion |\n\n## Rules\n\n- Animate only `opacity`, `transform`, `color`, `background-color`, `border-color`, `box-shadow`. Never `width`, `height`, `top`, `left`.\n- Hover and pressed never move or scale elements.\n- Honour `prefers-reduced-motion: reduce`: durations 0, spinners become static, shimmer off.\n- RTL: slide directions use logical axes (`translateX` sign flips with `dir`).\n", "02-styles/elevation": "# Elevation\n\nMaterial's elevation levels mapped onto the Figma **`Shadows/*`** effect styles. Two styles were observed on 2026-09-22 (`Shadows/md`, `Shadows/lg`); they follow the Tailwind shadow scale with a cool black `rgb(18 18 23)`, so `sm` and `xl` are filled in on the same scale.\n\n| Level | Token | Figma style | Shadow | Observed on |\n|---|---|---|---|---|\n| 0 | `sys.elevation.0` | – | none | page, Panel (Salla's default is flat with an outline) |\n| 1 | `sys.elevation.1` | `Shadows/sm` (not observed) | `0 1px 2px 0 rgb(18 18 23 / .06)` | raised Panel, sticky table header |\n| 2 | `sys.elevation.2` | `Shadows/md` ✓ | `0 4px 6px -1px rgb(18 18 23 / .08), 0 2px 4px -1px rgb(18 18 23 / .05)` | Table/Footer on mobile (sticky bottom bar, shadow flipped upward) |\n| 3 | `sys.elevation.3` | `Shadows/lg` ✓ | `0 10px 15px -3px rgb(18 18 23 / .08), 0 4px 6px -2px rgb(18 18 23 / .05)` | MoreMenu, Tooltip, DropdownList |\n| 4 | `sys.elevation.4` | `Shadows/xl` (not observed) | `0 20px 25px -5px rgb(18 18 23 / .10), 0 8px 10px -6px rgb(18 18 23 / .05)` | Dialog, BottomSheet, side sheets |\n\nFigma variables behind the styles: `shadow/{size}/type-{1,2}/{position-x, position-y, blur, spread, color}`.\n\n## What the Twilight code ships today\n\nThe Storybook's Tailwind config carries its own shadow scale, which does **not** match the Figma effect styles:\n\n| Tailwind class | Value in code | Closest Figma / system token |\n|---|---|---|\n| `shadow-xs` | `0 1px 2px 0 rgba(18,18,23,.05)` | `sys.elevation.1` |\n| `shadow` | `0 2px 4px -1px rgba(18,18,23,.06)` | `sys.elevation.1` |\n| `shadow-sm` | `0 2px 4px 0 rgba(0,0,0,.08)` | – (pure black, legacy) |\n| `shadow-md` | `0 4px 6px 0 rgba(0,0,0,.12)` | – (pure black, legacy) |\n| `shadow-lg` | `0 4px 6px -2px rgba(18,18,23,.05)` | only the second layer of Figma `Shadows/lg` |\n| `shadow-xl` | `0 10px 10px -5px rgba(18,18,23,.04)` | `sys.elevation.3` (approx.) |\n| `shadow-2xl` | `0 25px 50px -12px rgba(18,18,23,.25)` | `sys.elevation.4` |\n| `shadow-smooth` | `0 6px 8px 0 rgba(0,0,0,.02)` | – |\n| `shadow-top` / `shadow-bottom` | `0 ∓4px 16px -4px rgba(0,0,0,.15)` | sticky bars (`Table/Footer` mobile) |\n\nDecision: the system scale is the Figma one (`sys.elevation.0-4`); the Tailwind preset in this repo maps `shadow-elevation-*` to it. The legacy pure-black classes should be retired when components move to the preset.\n\n## Rules\n\n- Salla is **flat-first**: containment is shown with `sys.color.outline` borders; elevation is reserved for surfaces that float above the page (menus, tooltips, sheets, dialogs) and for drag states.\n- Elevation never changes on hover for cards or rows; hover uses colour (see [interaction-states.md](../01-foundations/interaction-states.md)).\n- Scrim under Dialog and BottomSheet: `sys.color.scrim` = `rgb(0 0 0 / .4)` (proposed).\n- Tonal elevation (Material's surface tint) is not used; Salla surfaces stay white.\n\n## To do in Figma\n\n- Confirm `Shadows/sm` and `Shadows/xl` exist; if not, add them with the values above.\n- Bind `Drop Down List`, `Bottom sheet`, `Table/Bulk Edit Sheet`, `Table/Edit Sheet` and `Action Buttons Type=Float` to a shadow style (they carry none today).\n", "02-styles/icons": "# Icons\n\nSource: the `Icons DS_V.1` Figma library (exported 2026-07-07). Inventory: `assets/icons/icon-inventory.json`.\n\n## What the library contains\n\n| Property | Values | Count |\n|---|---|---|\n| Names | kebab-case, numbered where a family has several forms (`search-01`, `search-02`, `mail-open-01`) | **4,049** unique |\n| Style | Stroke (3,889), Solid (3,889), Bulk (5), Twotone (3), Duotone (3) | |\n| Type | Rounded (default), Sharp (3) | |\n| Categories | Add Remove Delete · Alert Notification · Arrows · Artificial Intelligence · Award Reward · Bookmark Favourite · Brand logo · Building Landmark Places · Business and finance · Chat Bubbles · Check Validation · Cloth Accessories · Date and Time · Download Upload · Edit Formatting · Files Folders · Filter Sorting · Food Drink · Game Sports · Geometric Shapes · Global Map · Gym Fitness · Hand Gestures · Image Camera Video · Layout Borders · Link Unlink · Login Logout · More Menu · Mouse Cursors · Science Technology · Smiley Emojis · Wifi Signal · … | 60 category frames |\n\nThe Merchant DS consumes the set through two frames, `Icons/Outline` and `Icons/Filled`, and names instances `{name}-outline` / `{name}-filled` (`add-01-outline`, `arrow-down-01-outline`, `cancel-01-outline`, `information-circle-outline`, `file-01-outline`, `star-outline` were seen in component code).\n\nThe library is **Hugeicons**. The Twilight code confirms it: `<s-icon>` accepts Hugeicons classes `hgi-stroke hgi-{name}` (outline) and `hgi-solid hgi-{name}` (filled), plus the older Salla font as `sicon-light-{name}` / `s-light-{name}`; `IconPicker` switches between the two sources. So the three naming schemes today are `{name}-outline` (Figma), `hgi-stroke hgi-{name}` (code) and `sicon-*` (legacy font).\n\n## Shipped subset\n\nShip **Stroke** (as `outline`) and **Solid** (as `filled`), **Rounded** only. Bulk, Twotone, Duotone and Sharp stay in the source library; they are not part of the system.\n\n## The Icon atom\n\n```\n<Icon name=\"add-01\" style=\"outline\" size=\"sm\" />\n```\n\n| Prop | Values | Default |\n|---|---|---|\n| `name` | any inventory name | required |\n| `style` | `outline` (Stroke), `filled` (Solid) | `outline` |\n| `size` | `sm` 16 ✓, `md` 18 ✓, `lg` 20, `xl` 24 | `sm` in buttons and fields, `md` in alerts |\n| `mirrorInRtl` | boolean | true for directional glyphs |\n| `label` | string; omit for decorative icons (`aria-hidden`) | – |\n\nColour is `currentColor`; icons never carry their own colour tokens.\n\n## Sizes in context (verified)\n\n| Context | Size |\n|---|---|\n| Button, IconButton, field leading / trailing icons | 16px |\n| Alert, Status leading icon | 18px |\n| NavigationItem, Tab | 20px |\n| EmptyState, MobileRow leading | 24px |\n\n## Naming and migration\n\n| Today | New |\n|---|---|\n| `add-01-outline` (Figma instance) | `name=\"add-01\" style=\"outline\"` |\n| `hgi-stroke hgi-add-01` (Twilight `<s-icon icon>`) | `name=\"add-01\" style=\"outline\"` |\n| `hgi-solid hgi-add-01` | `name=\"add-01\" style=\"filled\"` |\n| `sicon-light-salla`, `s-light-tick-02` (legacy Salla font) | alias table → Hugeicons name; retire the font after migration |\n| `Style=Stroke, Type=Rounded` (library variant) | `style=\"outline\"` |\n| `Style=Solid, Type=Rounded` | `style=\"filled\"` |\n\n## Delivery\n\n- SVG sprite per style, generated from the Figma export; tree-shakeable named exports for frameworks.\n- The 265 `Flag` glyphs and the brand `SocialIcon` set are separate atoms and separate sprites.\n- Directional icons (arrows, chevrons, undo/redo, login/logout, indent) are tagged `mirror: true` in the inventory build so `mirrorInRtl` defaults correctly.\n", "00-overview/introduction": "# Salla Design System\n\nThe merchant dashboard design system for Salla, restructured on **Atomic Design** (Brad Frost) with **Material Design 3** as the structural reference.\n\nIt takes what Salla has today, the `Merchant - Storybook DS` Figma library (17 sections, 117 component frames, ~10,000 variants) and the public Twilight Storybook at `dashboard-ui-components.pages.dev`, and reorganises it into a layered system: tokens, foundations, styles, and components sorted by atomic level and Material category.\n\n> Status: **v0.2 - structure, tokens and documentation**. Token values are read from the Figma library (`catalog/figma-tokens-harvest.json`). Component code is not in this repo yet; every component page carries a build plan (structure type, props, tokens) so implementation can start from it.\n\n**Browse the docs:** run `python3 scripts/build-site.py` and open `site/index.html`, a single-file site with foundations, styles, every component page and live token-rendered examples.\n\n## How the system is layered\n\n```\n┌───────────────────────────────────────────────────────────────┐\n│  PAGES        real merchant screens (Orders, Products ...)     │  Atomic: pages\n├───────────────────────────────────────────────────────────────┤\n│  TEMPLATES    list page, list-detail, form page, wizard        │  Atomic: templates\n├───────────────────────────────────────────────────────────────┤\n│  ORGANISMS    Header, Table, DropDownList, Alertbox, Steps ... │  Atomic: organisms\n├───────────────────────────────────────────────────────────────┤\n│  MOLECULES    TextField, CheckboxField, Status, Breadcrumb ... │  Atomic: molecules\n├───────────────────────────────────────────────────────────────┤\n│  ATOMS        Button, Icon, Checkbox, Toggle, Avatar, Loader   │  Atomic: atoms\n├───────────────────────────────────────────────────────────────┤\n│  STYLES       color · typography · spacing · shape · elevation │  Material: Styles\n│               icons · illustrations · motion                   │\n├───────────────────────────────────────────────────────────────┤\n│  FOUNDATIONS  tokens · layout · interaction states · a11y      │  Material: Foundations\n│               content & localisation (AR/EN, RTL)              │\n└───────────────────────────────────────────────────────────────┘\n```\n\nEvery component is classified on three axes:\n\n| Axis | Values | Why |\n|---|---|---|\n| **Atomic level** | atom · molecule · organism · template · page | Where it sits in the composition hierarchy |\n| **Material category** | Actions · Communication · Containment · Navigation · Selection · Text inputs · Data display | How designers find it (Material's component taxonomy, plus Data display for tables) |\n| **Structure type** | 1 Configurable · 2 Standalone · 3 Base + Global · 4 Slot / Composition · 5 Headless | How engineers build it, from the internal *Component Structure Types* document |\n\n\n## Quick start\n\n```bash\n# Regenerate the component docs after editing catalog/components.json\npython3 scripts/build-catalog.py\n\n# Preview tokens and atoms\nopen preview/index.html\n```\n\nUse the tokens in product code:\n\n```css\n@import \"salla-design-system/tokens/css/tokens.css\";\n.my-card { background: var(--sys-color-surface); border-radius: var(--sys-shape-small); padding: var(--sys-space-md); }\n```\n\n```js\n// tailwind.config.js\nmodule.exports = { presets: [require('./tokens/tailwind/preset')], content: ['./src/**/*.{html,js,ts,vue}'] };\n```\n\n## Sources of truth\n\n| Source | What it gives us | Where it is captured |\n|---|---|---|\n| Figma `Merchant - Storybook DS` (file `zuGhoKg2BaBIYUreKuSBGY`, branch `dnmyqzYKK9dUJjVHuIWMDS`, page *Main Components (Full)*) | Component anatomy, variants, states, token names and values | `catalog/figma-inventory.json`, `tokens/tokens.json` |\n| Figma `Icons DS_V.1` | Icon set: 4,049 names, Stroke/Solid/Bulk/Twotone/Duotone × Rounded/Sharp | `assets/icons/icon-inventory.json`, `docs/02-styles/icons.md` |\n| Storybook `dashboard-ui-components.pages.dev` (Twilight web components, 38 components / 405 stories, captured 2026-09-22) | Shipped tags, props, events, slots, stories, code tokens | `catalog/storybook-twilight.md` (capture), `catalog/storybook-inventory.json`, `catalog/storybook-tokens.json`, `catalog/components.json` → `twilight` field |\n| *Component Structure Types* (internal PDF, 2025-07-06) | The five build patterns | `docs/00-overview/component-structure-types.md` |\n| Material Design 3 (m3.material.io) | Foundations / Styles / Components structure, token tiers, category taxonomy | `docs/00-overview/methodology.md` |\n\n## Next steps\n\n1. Confirm the values marked `assumed` in `tokens/tokens.json` against Figma and add elevation styles to the library.\n2. Rename Figma frames and variables per `docs/00-overview/migration-map.md` (typos, `--` prefixes, the two spacing scales).\n3. Implement atoms first (Button, Icon, Checkbox, Radio, Toggle, Loader, Avatar) as Base + Global or Configurable components, then molecules, following each component page's build plan.\n4. Wire Storybook to the same catalog so story titles follow `Level / Category / Component`.\n"}, "nav": [["Overview", [["00-overview/introduction", "Introduction"], ["00-overview/methodology", "Atomic × Material"], ["00-overview/component-structure-types", "Structure types"], ["00-overview/naming-conventions", "Naming conventions"], ["00-overview/current-state-audit", "Current state audit"], ["00-overview/migration-map", "Migration map"]]], ["Foundations", [["01-foundations/design-tokens", "Design tokens"], ["01-foundations/layout", "Layout & adaptive"], ["01-foundations/interaction-states", "Interaction states"], [" // resolve a relative markdown link from a page id to another page id
function resolveLink(fromId, href) {
  if (/^(https?:|mailto:|#)/.test(href)) return href;
  let [path, anchor] = href.split("#");
  if (!path) return "#" + anchor;
  if (!path.endsWith(".md")) return href;
  path = path.replace(/\.md$/, "");
  const base = fromId.split("/").slice(0, -1);
  for (const seg of path.split("/")) {
    if (seg === "..") base.pop(); else if (seg !== ".") base.push(seg);
  }
  const id = base.join("/");
  return "#/" + id + (anchor ? "#" + anchor : "");
}

function colorize(html) {
  return html.replace(/<code>(#[0-9a-fA-F]{6})<\/code>/g, (m, hex) => `<code><span class="swatch-inline" style="background:${hex}"></span>${hex}</code>`);
}

// Minimal fallback renderer so the site still reads if the marked CDN is unreachable.
function fallbackMarkdown(id, md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/_([^_]+)_/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => `<a href="${resolveLink(id, h)}">${t}</a>`);
  const lines = md.split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) { const buf = []; i++; while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    const h = l.match(/^(#{1,6})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (l.startsWith("|")) { const rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]); const cells = r => r.replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, "|"))); const head = cells(rows[0]); const body = rows.slice(2); out.push(`<div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue; }
    if (/^\s*[-*]\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, "")); out.push(`<ul>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); continue; }
    if (/^\s*\d+\.\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/, "")); out.push(`<ol>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`); continue; }
    if (l.startsWith(">")) { const buf = []; while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`); continue; }
    if (l.trim() === "---") { out.push("<hr>"); i++; continue; }
    if (l.trim() === "") { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() !== "" && !/^(#|\||```|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return colorize(out.join("\n"));
}

function renderMarkdown(id, md) {
  if (typeof marked === "undefined") return fallbackMarkdown(id, md);
  const renderer = new marked.Renderer();
  const origLink = renderer.link.bind(renderer);
  renderer.link = (href, title, text) => {
    if (typeof href === "object") { const t = href; href = t.href; title = t.title; text = t.text; }
    const target = resolveLink(id, href);
    const ext = /^https?:/.test(target) ? ' target="_blank" rel="noopener"' : "";
    return `<a href="${target}"${ext}>${text}</a>`;
  };
  marked.use({ renderer, gfm: true, breaks: false });
  let html = marked.parse(md);
  html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  return colorize(html);
}

  const fl = document.getElementById("fl").value, fc = document.getElementById("fc").value, fs = document.getElementById("fs").value, ft = document.getElementById("ft").value, fo = document.getElementById("fo").value;
  const srcOk = c => { const s = c.sources || []; if (!fo) return true; if (fo === "both") return s.length === 2; if (fo === "none") return s.length === 0; return s.length === 1 && s[0] === fo; };
  const list = DATA.catalog.components.filter(c => (!q || (c.name + " " + c.id + " " + c.summary + " " + (c.storybook || "")).toLowerCase().includes(q)) && (!fl || c.level === fl) && (!fc || c.category === fc) && (!fs || String(c.structure) === fs) && (!ft || c.status === ft) && srcOk(c));
  const el = document.getElementById("cards");
  el.innerHTML = list.length ? list.map(c => `<a class="card" href="#/03-components/${LEVEL_DIR[c.level]}/${c.id}"><b>${c.name}</b><span>${c.summary.split(". ")[0]}.</span><div class="meta"><i>${c.level}</i><i>${c.category}</i><i>structure ${c.structure}</i>${(c.sources || []).map(s => `<i>${s === "storybook" ? "twilight" : s}</i>`).join("")}${DATA.examples[c.id] ? "<i>live</i>" : ""}</div></a>`).join("") : `<div class="empty">No components match.</div>`;
}

function render() {
  const id = currentId();
  const content = document.getElementById("content");
  const md = DATA.pages[id];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.id === id));
  const active = document.querySelector("#nav a.active");
  if (active) { active.closest("details").open = true; }
  const parts = id.split("/");
  const compId = parts[0] === "03-components" && parts.length === 3 ? parts[2] : null;
  const c = compId ? byId[compId] : null;
  document.getElementById("crumbs").innerHTML = parts.slice(0, -1).map(p => p.replace(/^\d+-/, "")).join(" / ") + (parts.length > 1 ? " / " : "") + `<b>${c ? c.name : (parts.at(-1) === "README" ? "Index" : parts.at(-1).replace(/-/g, " "))}</b>`;

  if (id === "03-components/README") {
    content.innerHTML = componentsIndex();
    ["fq", "fl", "fc", "fs", "ft", "fo"].forEach(i => document.getElementById(i).addEventListener("input", drawCards));
    drawCards();
  } else if (md !== undefined) {
    let html = renderMarkdown(id, md);
    if (c) {
      html = html.replace(/(<\/h1>)/, "$1" + componentHeader(c) + exampleBlock(c.id));
    }
    if (id === "00-overview/introduction") {
      html = html.replace(/(<\/h1>)/, "$1");
      html = `<div class="hero"><h1>Salla Design System</h1><p>The merchant dashboard design system, restructured on <span class="mint">Atomic Design</span> with <span class="mint">Material Design 3</span> as the structural reference. Tokens and component specs are read directly from the Merchant – Storybook DS Figma library.</p></div>
        <div class="stat-row"><div class="stat"><b>${DATA.catalog.components.length}</b><span>components catalogued</span></div><div class="stat"><b>117</b><span>Figma frames mapped</span></div><div class="stat"><b>${DATA.harvestMeta.colors}</b><span>colour variables verified</span></div><div class="stat"><b>4,049</b><span>icons inventoried</span></div></div>` + html.replace(/^[\s\S]*?<\/h1>/, "");
    }
    content.innerHTML = html;
  } else {
    content.innerHTML = `<h1>Not found</h1><p>No page at <code>${id}</code>.</p>`;
  }
  // pager
  const flat = [...DATA.nav, ["Components", [["03-components/README", "Components index"]]], ...DATA.compNav].flatMap(([g, items]) => items.map(([i, l]) => ({ id: i, label: l, group: g })));
  const idx = flat.findIndex(p => p.id === id);
  if (idx >= 0) {
    const prev = flat[idx - 1], next = flat[idx + 1];
    content.insertAdjacentHTML("beforeend", `<div class="pager"><span>${prev ? `<a href="#/${prev.id}"><small>Previous</small>← ${prev.label}</a>` : ""}</span><span style="text-align:end">${next ? `<a href="#/${next.id}"><small>Next</small>${next.label} →</a>` : ""}</span></div>`);
  }
  const anchor = location.hash.split("#")[2];
  if (anchor) { const t = document.getElementById(anchor); if (t) t.scrollIntoView(); } else { window.scrollTo(0, 0); }
  closeSide();
}

// ---------- chrome ----------
function openSide() { document.getElementById("side").classList.add("open"); document.getElementById("scrim").hidden = false; }
function closeSide() { document.getElementById("side").classList.remove("open"); document.getElementById("scrim").hidden = true; }
document.getElementById("menuBtn").addEventListener("click", openSide);
document.getElementById("scrim").addEventListener("click", closeSide);
document.getElementById("dirBtn").addEventListener("click", () => {
  exampleDir = exampleDir === "ltr" ? "rtl" : "ltr";
  try { localStorage.setItem("sds-example-dir", exampleDir); } catch (e) {}
  document.getElementById("dirBtn").textContent = "Examples: " + exampleDir.toUpperCase();
  document.querySelectorAll(".example__stage").forEach(s => { s.dir = exampleDir; s.classList.toggle("rtl", exampleDir === "rtl"); });
});
document.getElementById("dirBtn").textContent = "Examples: " + exampleDir.toUpperCase();
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("hidden", !!q && !a.dataset.text.includes(q)));
  document.querySelectorAll("#nav details").forEach(d => { if (q) d.open = true; });
});
buildNav();
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
