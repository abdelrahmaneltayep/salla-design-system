 size=\"md\" layout=\"start\" wide=\"\" class=\"s-toggle w-full start md ltr hydrated\">\n<\/s-toggle>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `toggle`). Edit the catalog, not this file._\n", "03-components/atoms/password-hint": "# PasswordHint\n\n> One requirement line (pending / success / danger) used by PasswordField.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Communication | 1 - Configurable | existing | figma | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `state` | `pending`, `success`, `danger` |\n| `text` | string |\n\n## Tokens\n\n- sys.typography.body-xs\n- sys.color.status.*\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_passwordHints` | Inputs | 6 | Variant: Pending, danger, success; Langauge: Arabic, English |\n| `_passwordValidation` | Inputs | 2 | Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `password-hint`). Edit the catalog, not this file._\n", "03-components/atoms/step-indicator": "# StepIndicator\n\n> One node of the Stepper: number or check in a circle with a connector.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Navigation | 1 - Configurable | existing | figma | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `state` | `default`, `active`, `success` |\n| `last` | boolean |\n| `index` | number |\n\n## Tokens\n\n- sys.color.primary\n- sys.color.success-primary\n- sys.shape.full\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_Step base` | Steps | 8 | Type: Active, Default, Last, Success; Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `step-indicator`). Edit the catalog, not this file._\n", "03-components/atoms/chip": "# Chip\n\n> Compact tag used in table cells and multi-select fields. Material: assist / filter / input chip.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Selection | 1 - Configurable | existing | figma, storybook | `<s-tag>` |\n\n## Anatomy\n\n- container\n- label\n- optional remove icon\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `kind` | `assist`, `filter`, `input` |\n| `selected` | boolean |\n| `removable` | boolean |\n| `color` | `neutral`, `primary` |\n\n## States\n\n- default\n- hover\n- pressed\n- selected\n- disabled\n\n## Tokens\n\n- sys.shape.full\n- sys.color.outline\n- sys.typography.label-sm\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Table/Cell/Chip` | Table | 6 | Count: Multi, One; Status: Default, Hover, press |\n| `_Table/Chips` | Table | 1 | Status: Gray |\n\n## Source in the Twilight Storybook today\n\n### `<s-tag>`\n\n[components-tag](https://dashboard-ui-components.pages.dev/?path=/docs/components-tag) · 13 stories · A tag is a visual element used for categorization, labeling, or marking content. Tags can be customized with different themes, sizes, and behaviors.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `closable` | boolean | `false` |  | Enable closable tag |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `feature` | boolean | `true` |  | Show feature tag for a certain element |\n| `label` | string |  |  |  |\n| `layout` | select | `default` | `default`, `status` | Tag layout |\n| `nowrap` | boolean | `true` |  | Prevent text wrapping inside the tag |\n| `outlined` | boolean | `false` |  | Outlined state |\n| `size` | select | `md` | `sm`, `md` | Tag size |\n| `theme` | select | `default` | `default`, `secondary`, `success`, `danger`, `warning`, `info`, `white`, `transparent`, `feature`, `mahally` | Tag theme |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onclose` | Emitted when the tag is closed. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--default), [Theme Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--theme-variants), [Size Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--size-variants), [Outlined Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--outlined-variants), [Status Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--status-layout), [Closable](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--closable), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--disabled), [Closable Theme Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--closable-theme-variants), [Long Text](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--long-text), [No Wrap](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--no-wrap), [With Feature](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--with-feature), [Disabled Feature](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--disabled-feature), [Mixed Examples](https://dashboard-ui-components.pages.dev/?path=/story/components-tag--mixed-examples)\n\n**Rendered markup (default story)**\n\n```html\n<s-tag class=\"s-tag s-tag--default whitespace-nowrap md ltr hydrated\">New<\/s-tag>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `chip`). Edit the catalog, not this file._\n", "03-components/pages/products-list": "# Products list\n\n> s.salla.sa/products. ListPage template with ImageCell, AmountCell, QuantityField inline-save and MobileRow kind=product.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| page | Data display | 4 - Slot / Composition | reference | figma | _not in Storybook_ |\n\n## Props\n\n_No public props beyond the base._\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nTemplate: [ListPage](../templates/list-page.md).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Products Management` | (top level) | - | - |\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `products-list`). Edit the catalog, not this file._\n", "03-components/pages/README": "# Pages\n\nPages are templates filled with real merchant data. They are documented as references to production, not built in the library.\n\n| Component | Material category | Structure | Status |\n|---|---|---|---|\n| [Orders list](orders-list.md) | Data display | 4 | reference |\n| [Products list](products-list.md) | Data display | 4 | reference |\n| [Order details](order-details.md) | Containment | 4 | reference |\n", "03-components/pages/order-details": "# Order details\n\n> s.salla.sa/orders/{id}. ListDetailPage template with Panels, Stepper for fulfilment progress and AvatarWithText for the customer.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| page | Containment | 4 - Slot / Composition | reference | none yet | _not in Storybook_ |\n\n## Props\n\n_No public props beyond the base._\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nTemplate: [ListDetailPage](../templates/list-detail.md).\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `order-details`). Edit the catalog, not this file._\n", "03-components/pages/orders-list": "# Orders list\n\n> s.salla.sa/orders. ListPage template with the order-status Status mapping and MobileRow kind=order.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| page | Data display | 4 - Slot / Composition | reference | none yet | _not in Storybook_ |\n\n## Props\n\n_No public props beyond the base._\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\nTemplate: [ListPage](../templates/list-page.md).\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `orders-list`). Edit the catalog, not this file._\n", "00-overview/component-structure-types": "# Component structure types\n\nFive architectural patterns for building components, from the internal *Component Structure Types* document (Product Design, 2025-07-06), with the decision rules and the mapping to Salla components. Every entry in `catalog/components.json` declares one of these in its `structure` field.\n\n## Decision tree\n\n```\nDoes the component render UI?\n├─ No  → 5 Headless (hook / controller)\n└─ Yes\n   Is its main job to frame content supplied by the parent?\n   ├─ Yes → 4 Slot / Composition\n   └─ No\n      Do the variants differ in layout, behaviour or meaning (not just colour/size)?\n      ├─ Yes\n      │   Do they share significant logic or styling?\n      │   ├─ Yes → 3 Base + Global\n      │   └─ No  → 2 Standalone\n      └─ No  → 1 Configurable\n```\n\n## 1. Configurable (single component with internal logic)\n\nAll variations are props. Use when variations are small and visual (colour, size, icon), structure and interaction are the same, and the prop list stays readable.\n\n- **Salla examples:** `Button` (variant × appearance × size × layout), `LoadingIndicator`, `StatusIndicator`, `Avatar`, `Chip`, `Alert`, `HelperText`, `Pagination`.\n- **Pros:** one import, all variants discoverable from props, logic in one place.\n- **Cons:** becomes a god component if props pile up; unclear which combinations are valid.\n- **Salla rule:** more than ~8 props, or any prop that changes *behaviour* rather than *look*, is the signal to split. `InputWrapper` in Figma (24 variants covering text, dropdown, amount, upload, colour picker …) is the cautionary example; it is being split under pattern 3.\n\n## 2. Standalone (separate components with different names)\n\nEach significant variant is its own named component. Use when variants have distinct functions, layouts or semantics, when one component would need many mutually exclusive props, or when variants evolve independently.\n\n- **Salla examples:** `Icon` (one per glyph), `Flag`, `SocialIcon`, `Illustration`, `RadioImage` and `RadioColor`, the `TableCell` family (`NameCell`, `AmountCell`, `StatusCell`, `ActionsCell` …), `MobileRow` kinds, `AlertBanner` and `UpgradeCard` (distinct from `Alert`).\n- **Pros:** small APIs, clear separation, explicit choice by name.\n- **Cons:** possible duplication, more files.\n- **Salla rule:** standalone components that share look share it through tokens and a tiny private layout helper (e.g. `CellLayout`), never by copy-pasting CSS.\n\n## 3. Base + Global (inheritance / composition)\n\nA private base component holds shared logic and minimal styling; public \"global\" components configure it. Use when several components share significant logic but must be exposed as distinct entities, or when you want to control which configurations exist.\n\n- **Salla examples:**\n  - `BaseField` → `TextField`, `TextareaField`, `PasswordField`, `EmailField`, `AmountField`, `PhoneField`, `SearchField`, `OtpField`, `QuantityField`, `SelectField`, `MultiSelectField`, `UploadField`, `ColorPickerField`. This is the Figma `Inputs` section (27 frames) resolved into one base and thirteen globals.\n  - `BaseButton` → `Button`, `IconButton`, `Link`.\n  - `Checkbox` → `CheckboxField`; `Radio` → `RadioField`; `Switch` → `SwitchField`.\n  - `StatusIndicator` → `Status`; `LoadingIndicator` → `Loading`.\n  - `BaseAlert` → `Alert`, `InlineAlert`.\n- **Pros:** shared logic fixed once, controlled complexity, sensible defaults.\n- **Cons:** abstraction overhead; needs planning.\n- **Salla rule:** the base is never exported from the package index and never appears in Storybook navigation (it appears in Figma with the `_` prefix, which we keep for internal frames).\n\n## 4. Slot-based / composition\n\nThe component defines a frame and named slots; the parent supplies content. Use when the component's job is layout or wrapping, when content is application-specific, or when maximum flexibility is needed.\n\n- **Salla examples:** `DataTable` (header, footer, bulk-actions, cells), `TopAppBar` (start / center / end), `NavigationDrawer`, `Dialog` and `BottomSheet` (header / body / footer), `Panel`, `PageTitle` (leading / meta / actions), `ActionBar` (primary / secondary / start), `ListItem` (leading / title / description / trailing, the PDF's `listItemLayout`), `AvatarWithText`, `EmptyState`, all templates.\n- **Pros:** flexible, reusable, decoupled content, readable usage.\n- **Cons:** needs slot documentation; easy to over-use.\n- **Salla rule:** every slot is documented with what it accepts (component types) and a default. A component with one slot and no layout responsibility is a prop, not a slot component.\n\n## 5. Functional / headless (logic only)\n\nBehaviour, state and accessibility without rendering. Exposed as hooks or controllers. Use when logic must be reusable across different UIs or when consumers need full control over markup.\n\n- **Salla examples:** `useTabs` (Tabs), `useListbox` / `useMenu` (DropdownList, MoreMenu, SelectField), `useStepper` (Stepper), `useCalendar` (DateTimePicker), `useDialog` (Dialog, BottomSheet), `useTooltip`, `useDataTable` (sorting, selection, pagination).\n- **Pros:** full control over presentation, reusable logic, clean separation, easy re-theming.\n- **Cons:** more setup, not visible in Figma, needs strong documentation and examples.\n- **Salla rule:** every headless hook ships with a default UI component in the same folder (`Tabs` uses `useTabs`) so designers still have a Figma-visible counterpart, and with a usage example in Storybook's *Docs* tab.\n\n## Mapping summary\n\n| Structure | Count in catalog | Levels where it appears |\n|---|---|---|\n| 1 Configurable | see `docs/03-components/README.md` | mostly atoms, some molecules |\n| 2 Standalone | \" | atoms, molecules, a few organisms |\n| 3 Base + Global | \" | molecules (fields, selection controls) |\n| 4 Slot / Composition | \" | organisms, templates, pages |\n| 5 Headless | \" | organisms with keyboard / focus behaviour |\n\nThe exact list is generated in [`docs/03-components/README.md`](../03-components/README.md).\n", "00-overview/current-state-audit": "# Current state audit\n\nWhat Salla's design system contains today and where it diverges from the target structure. Sources: the `Merchant - Storybook DS` Figma library (branch `dnmyqzYKK9dUJjVHuIWMDS`, page *Main Components (Full)*, extracted 2026-09-22), the `Icons DS_V.1` Figma file (exported 2026-07-07), and the Twilight Storybook at `dashboard-ui-components.pages.dev` (38 components / 405 stories / 411 props, full capture of 2026-09-22 in `catalog/storybook-twilight.md`, parsed into `catalog/storybook-inventory.json`).\n\n## 1. Inventory\n\n| Source | Size |\n|---|---|\n| Figma sections | 17 (`Header`, `Bread crumb`, `check Box`, `radio Buttton`, `Toggle`, `Loader`, `Status`, `Avatar`, `Alertbox`, `Inputs`, `Maps`, `Side menu`, `More Menu`, `Drop Down List`, `Table`, `Steps`) + 12 top-level frames outside any section (`Button`, `Icons/Filled`, `Icons/Outline`, `Flag`, `Illustration`, `Illustrations Collection`, `Social media icons`, `Action Buttons`, `searchbar`, `Learn More`, `Products Management`, `Header Primary Tabs`) |\n| Figma component frames | 117 (`catalog/figma-inventory.json`) |\n| Figma variant symbols | ~10,100 |\n| Figma variable collections | `03-Colors` (text / background / border / foreground roles), `04-Token` (Spacing/Sizes, Radius/Sizes). Collections 01 and 02 were not exposed to the MCP search; assumed to be primitives and typography |\n| Figma text styles | `Bold`, `Medium`, `Regular` × `$text-xs … $text-9xl` |\n| Icon library | 4,049 icon names × Style (Stroke 3,889 · Solid 3,889 · Bulk 5 · Twotone 3 · Duotone 3) × Type (Rounded, Sharp) |\n| Storybook (Twilight) components | 38 Stencil web components (`s-*`): Accordion, AlertBox, Avatar, Breadcrumbs, Button, ButtonsGroup, Calendar, Checkbox, ColorPicker, Dropdown, Editor, Icon, IconPicker, Input, Item, LingualField, Loader, Maps, Modal, OTP, Panel, Placeholder, Progress Bar, Qty, Radio, Range Slider, Rate, Select, Skeleton, Table, Tabs, Tag, Tags Input, Telephone Input, Textarea, Toggle, Tooltip, Uploader. 405 stories, 411 props, 125 root CSS variables |\n\nFull per-frame variant properties: `catalog/figma-inventory.json`. Classification of every frame: `docs/03-components/README.md`.\n\n## 2. What is working well\n\n- **Role-based colour variables.** `03-Colors` already names colours by role (`text/primary/link`, `background/status/info/lighter`, `border/default`). This maps directly onto Material system tokens.\n- **Base + variants pattern is already emergent.** `_TextInput` → `InputWrapper`, `checkBox` → `checkboxfield`, `_Base Status Indicator` → `Status`, `_Step base` → `Steps`, `_listItem` → `Drop Down List`. The `_` prefix for internal frames is a real convention.\n- **Bilingual coverage.** Almost every frame has `Language=Arabic|English`, and fields carry a translation toggle.\n- **Rich state coverage on fields and buttons.** Hover, pressed, loading, disabled, error and read-only are all designed.\n- **Typed table cells.** 18 cell types mirror what the product actually renders.\n- **Component descriptions with Arabic and English keywords** on the main component sets (Button, InputWrapper, Toggle, checkBox, Status …), which makes Figma search work in both languages.\n\n## 3. Structural issues\n\n| # | Issue | Evidence | Impact | Fix (target) |\n|---|---|---|---|---|\n| S1 | **No hierarchy.** Sections are a flat list mixing atoms (`check Box`), molecules (`Status`), organisms (`Table`) and a template (`Products Management`). | 17 sections, 12 orphan frames | Designers cannot tell what composes what; engineers cannot tell what to build first | Sections become `Atoms / Molecules / Organisms / Templates`, sub-grouped by Material category |\n| S2 | **God component for inputs.** `InputWrapper` has a `Variant` property with 12 values covering text, search, amount, colour picker, dropdown single/multiple/basic, email, upload … | 24 variants; 27 frames in `Inputs` | Unclear API; any change touches every field | Split into `BaseField` (internal) + 13 named field components (structure type 3) |\n| S3 | **Two spacing scales that contradict each other.** `spacing/3xs = 8px` but `Spacing/Sizes/3xs = 2px`; `spacing/2xs = 10px` but `Spacing/Sizes/2xs = 4px`; `spacing/xs = 12px` but `Spacing/Sizes/xs = 6px` | Button, Alertbox, Header use `spacing/*`; fields, Status, Side menu, Table use `Spacing/Sizes/*` | Same pixel value, two names; migrations break | `Spacing/Sizes` becomes the scale; alias table in `docs/02-styles/spacing.md` |\n| S4 | **Language and device as variant axes.** `Language=Arabic|English` and `--device=desktop|mobile` double or quadruple every component's variant count | `_passwordInput` has 112 variants; Alertbox 64 | Library size, maintenance cost, and it hides that RTL should be automatic | Language becomes a page-level toggle (Figma variable mode); device stays only where layout truly differs |\n| S5 | **Eight interaction states on fields.** `default, hover, preActive, Active, filled, Active-Filled, read-only, disabled` (+ error) | every input frame | Not implementable as CSS states; `preActive` and `Active-Filled` have no DOM equivalent | Material list: enabled, hover, focus, filled, read-only, disabled + orthogonal `error` |\n| S6 | **Components in Storybook but missing from Figma.** Modal, Accordion, Editor (rich text), IconPicker, Progress Bar, Range Slider, Rate, Skeleton; Panel and Tooltip exist in Figma only as fragments (`_Table/Panel Header`, tooltip inside `checkboxfield`). Toast is in neither. | `sources: [\"storybook\"]` in the catalog | Engineers build from code, designers from nothing | Catalog entries carry the Twilight props; design the Figma frames from them |\n| S7 | **Components in Figma without a Twilight component.** Steps (Stepper), Header / TopAppBar, Header Subcategory, Side menu (NavigationDrawer), Page Title, Learn More, AvatarStack, Flag, Social icons, Illustrations, Bulk Edit Sheet, Edit Sheet, Filter Results, ProgressCircle, Divider | `sources: [\"figma\"]` in the catalog (21 entries) | Designed but built ad hoc in the app | Prioritise in the build order; Steps and the app shell first |\n| S8 | **Assets stored as components.** `_AvatarplaholderImages`, `_BanksPlaceholderImages`, `Illustrations Collection`, 265 flags as variants | | Bloats the library; not tokenable | Move to `assets/`; keep one `Flag` / `Illustration` component with a `name` prop |\n| S9 | **Order-status presets baked into the Table.** `Table/Status` has 9 variants (`wating payment`, `delevery`, `deliverd`, `retrevied` …) | | Business data in the component layer | One `Status` molecule; the mapping order status → semantic type lives in data |\n| S10 | **Loader has nine sizes** (8 to 88px) while everything else has three to six | `_LoadingIndicator` | Inconsistent scale | Collapse to five with aliases |\n| S11 | **Elevation is only partly defined.** `Shadows/md` and `Shadows/lg` effect styles exist (More Menu, Tooltip, Table/Footer) but DropdownList, Bottom sheet, Bulk/Edit sheets and the floating ActionBar carry no shadow style | `shadow/lg/type-1|2/*` variables | Sheets ship with ad-hoc shadows | Map to `sys.elevation.0-4`, add `Shadows/sm|xl`, bind the remaining surfaces |\n| S13 | **Code palette drifts from Figma by 1-3 channel units on most brand and status colours** (`--primary #004A57` vs Figma `#004956`, `--secondary #A3FFE5` vs `#a4ffe5`, `--success #00AD6B` vs `#00af6c`, `--warning #FFAD42` vs `#ffaf44`, `--info #5399F3` vs `#5196f3`, `--gray-400 #EDEDED` vs `#eee`) because code stores rounded HSL channels. Code also carries extra ramps (primary/secondary 100-700, mahally, blue, pink, moshammer gradient) and a different shadow scale | `catalog/storybook-tokens.json` vs `catalog/figma-tokens-harvest.json`; table in color.md | Designs and builds never match pixel-for-pixel; QA flags false diffs | Pick one source (Figma hex) and regenerate the HSL variables from it; retire duplicate ramps |\n| S12 | **Some hard-coded values escape the tokens.** Status pill radius `30px`, Alertbox `gap 4px`, LearnMore `gap 5px`, header tag radius `140px`, legacy `07--light-theme/*` and `spacing-xs/md/lg` variables, `radius/sm` resolving to 8px | design contexts on `Status`, `Alertbox`, `Learn More`, `Header`, `Table/Footer` | Theme changes miss them | Map to `sys.shape.full`, `sys.space.*`, `sys.color.*`; re-point `radius/sm` |\n\n## 4. Naming issues\n\n| Type | Examples (Figma today) | Rule |\n|---|---|---|\n| Typos | `seconadry`, `Trasnparet`, `Langauge`, `Langugae`, `radio Buttton`, `defaullt`, `Varient`, `Sperator`, `Fals`, `Selceted`, `delevery`, `deliverd`, `in prograss`, `retrevied`, `wating payment`, `bigCalenderItems`, `AvatarplaholderImages`, `Descreptive` | fix at source (they leak into token names such as `background/secondary/seconadry`) |\n| Inconsistent casing | `check Box`, `checkBox`, `checkboxfield`, `radiofield`, `toggleField`, `Toggle`, `searchInput`, `searchbar`, `upload input`, `Bread crumb` | PascalCase components, `_` for internals |\n| Leading `--` on variant values and some property names | `Variant=--primary`, `--selected=true`, `--device=desktop` | plain values, camelCase props |\n| Size vocab varies | `sm-16px`, `md-20px`, `default-24px`, `--md-40px`, `md- 48px`, `compact`, `Small` | `sm / md / lg` (+ `xs`, `xl` where needed), pixel value in the token |\n| Two names for one thing | `Toggle` / `toggleField` / `Switch`; `Header` / `Top bar`; `More Menu` / `Dropdown Menu`; `Modal` / `Dialog` | Material name in code, Salla name as documented alias |\n| Version in name | `_PhoneInputV1` | no versions in names |\n\nFull old → new mapping: [migration-map.md](migration-map.md).\n\n## 5. Gaps against Material Design\n\n| Material area | Salla today | Action |\n|---|---|---|\n| Foundations: design tokens (ref / sys / comp) | roles exist, no tiers, no JSON export | `tokens/tokens.json` introduces the tiers |\n| Foundations: layout / breakpoints | `desktop` / `mobile` variants only | `docs/01-foundations/layout.md` defines breakpoints and the grid |\n| Foundations: interaction states | per-component ad hoc | `docs/01-foundations/interaction-states.md` fixes the list |\n| Foundations: accessibility | not documented | `docs/01-foundations/accessibility.md` |\n| Styles: elevation | `Shadows/md`, `Shadows/lg` exist; not applied to sheets | mapped to `sys.elevation.*`, gaps listed in elevation.md |\n| Styles: motion | absent | proposed durations and easings |\n| Styles: shape | `Radius/Sizes` scale exists | mapped to Material shape names |\n| Components: snackbar / toast | absent | proposed |\n| Components: dialog | Storybook only | proposed spec |\n| Components: tooltip | exists (component set `1933:1790`) but has no frame on the components page | catalog entry `existing`, needs its own frame |\n| Components: date pickers | cells exist, picker organism not framed | catalog entry with headless plan |\n| Components: data table | rich | keep; Material 3 has no table, Salla's is a first-class Data display component |\n\n## 6. Bottom line\n\nThe content of the system is in good shape: the colour roles, the base/variant pattern and the bilingual coverage are already Material-like. The work is structural: introduce levels, split the input god component, unify the two spacing scales, take language and device out of the variant matrix, and fill five gaps (full elevation coverage, motion, dialog, toast, breakpoints).\n", "00-overview/migration-map": "# Migration map\n\nWhere every current Figma section, frame and Storybook story goes in the new structure. Use this to rename in Figma and to retitle Storybook stories. The per-frame variant properties are on each component page under *Source in Figma today*.\n\n## Figma sections → new sections\n\n| Figma section today | Frames | New Figma section | Notes |\n|---|---|---|---|\n| `Header` | header Avatar, Header, Page Title, Header Subcategory, Header Secondary Tabs, Primary Tabs List | `Organisms / Navigation` (TopAppBar, SecondaryNavBar, Tabs) · `Molecules / Navigation` (Tab, PageTitle, AccountMenuTrigger) | Tabs get their own organism with a headless hook |\n| `Bread crumb` | Breadcrumb, _breadcrumbItem | `Molecules / Navigation` | Separator variant becomes the `Divider` atom |\n| `check Box` | checkBox, checkboxfield | `Atoms / Selection` (Checkbox) · `Molecules / Selection` (CheckboxField) | |\n| `radio Buttton` | radio, radiofield, radioImage, radioColor | `Atoms / Selection` (Radio) · `Molecules / Selection` (RadioField, RadioImage, RadioColor) | |\n| `Toggle` | Toggle, toggleField | `Atoms / Selection` (Switch, alias Toggle) · `Molecules / Selection` (SwitchField) | |\n| `Loader` | _LoadingIndicator, Loading | `Atoms / Communication` (LoadingIndicator) · `Molecules / Communication` (Loading) | |\n| `Status` | _Base Status Indicator, Status | `Atoms / Communication` (StatusIndicator) · `Molecules / Communication` (Status) | |\n| `Avatar` | Avatar, AvatarWithText, AvatarStack, placeholder image sets | `Atoms / Data display` (Avatar) · `Molecules / Data display` (AvatarWithText, AvatarStack) · placeholder images → `assets/` | |\n| `Alertbox` | Alertbox, Alertbox_Banner, Alertbox_Upgrade | `Organisms / Communication` (Alert, AlertBanner, UpgradeCard) · `Molecules / Communication` (InlineAlert) | |\n| `Inputs` | 27 frames | `Molecules / Text inputs` (BaseField internal + 13 fields) · `Atoms / Text inputs` (FieldLabel, HelperText, TranslationToggle) · `Atoms / Actions` (StepperButton) · `Atoms / Communication` (PasswordHint) | `InputWrapper` is retired; `_Text-cursor` is dropped (a native caret) |\n| `Maps` | Maps | `Organisms / Data display` | |\n| `Side menu` | Side menu, sidemenu tab | `Organisms / Navigation` (NavigationDrawer) · `Molecules / Navigation` (NavigationItem) | |\n| `More Menu` | More Menu, _moreItems | `Organisms / Containment` (MoreMenu) · `Molecules / Containment` (MenuItem) | |\n| `Drop Down List` | Drop Down List, _listItem, _listTitle, _Date, _bigCalenderItems, _Time, Time | `Organisms / Containment` (DropdownList) · `Molecules / Containment` (ListItem) · `Organisms / Selection` (DateTimePicker) · `Molecules / Selection` (CalendarCell) | Calendar cells move out of the dropdown section |\n| `Table` | 41 frames | `Organisms / Data display` (DataTable, MobileRow, Pagination) · `Molecules / Data display` (TableCell family) · `Organisms / Containment` (BulkEditSheet, EditSheet, Panel) · `Molecules / Containment` (PanelHeader) · `Molecules / Communication` (FilterResults) | `Table/Status` presets become data; `_Table/Refresh Button`, `_Table/Pin` become IconButton uses |\n| `Steps` | Steps, _Step base | `Organisms / Navigation` (Stepper) · `Atoms / Navigation` (StepIndicator) | |\n| _(no section)_ `Button` | Button | `Atoms / Actions` (Button, IconButton, Link) | Link and IconButton are exposed as globals on the same base |\n| _(no section)_ `Icons/Filled`, `Icons/Outline` | | `Atoms / Communication` (Icon) with the `Icons DS_V.1` library as source | |\n| _(no section)_ `Flag`, `Social media icons`, `Illustration`, `Illustrations Collection` | | `Atoms / Data display` (Flag, SocialIcon) · `Atoms / Communication` (Illustration) · collections → `assets/` | |\n| _(no section)_ `Action Buttons` | | `Organisms / Actions` (ActionBar) | with `Action Bar/Confirm buttons`, `buttonsContainer` |\n| _(no section)_ `searchbar` | | `Molecules / Text inputs` (GlobalSearch) | |\n| _(no section)_ `Learn More` | | `Molecules / Communication` (LearnMore) | |\n| _(no section)_ `Header Primary Tabs` | | `Molecules / Navigation` (Tab kind=primary) | |\n| _(no section)_ `Products Management` | | `Templates` (ListPage) | |\n\n## Frame renames (old → new)\n\n| Old Figma name | New component | Level |\n|---|---|---|\n| `Button` | `Button` | atom |\n| `Button` Layout=--circular | `IconButton` | atom |\n| `Button` Appearance=--link / --link-auxiliary | `Link` | atom |\n| `checkBox` | `Checkbox` | atom |\n| `checkboxfield` | `CheckboxField` | molecule |\n| `radio` | `Radio` | atom |\n| `radiofield` | `RadioField` | molecule |\n| `radioImage` | `RadioImage` | molecule |\n| `radioColor` | `RadioColor` | molecule |\n| `Toggle` | `Switch` | atom |\n| `toggleField` | `SwitchField` | molecule |\n| `_LoadingIndicator` | `LoadingIndicator` | atom |\n| `Loading` | `Loading` | molecule |\n| `_Base Status Indicator` | `StatusIndicator` | atom |\n| `Status` | `Status` | molecule |\n| `Avatar` | `Avatar` | atom |\n| `AvatarWithText`, `header Avatar` | `AvatarWithText`, `AccountMenuTrigger` | molecule |\n| `AvatarStack` | `AvatarStack` | molecule |\n| `Alertbox` (Type=Default, white) | `Alert` | organism |\n| `Alertbox` (Type=Inline) | `InlineAlert` | molecule |\n| `Alertbox_Banner` | `AlertBanner` | organism |\n| `Alertbox_Upgrade` | `UpgradeCard` | organism |\n| `InputWrapper`, `_TextInput`, `_inputLabel`, `_inputTip`, `_Text-cursor` | `_BaseField` (internal) | molecule |\n| `_TextInput`, `_inputWithButton`, `_InputWithImage`, `_InputCounter` | `TextField` | molecule |\n| `_TextArea`, `_Rich-Text-Panel` | `TextareaField` | molecule |\n| `_passwordInput`, `_passwordHints`, `_passwordValidation` | `PasswordField`, `PasswordHint` | molecule, atom |\n| `_emailInput` | `EmailField` | molecule |\n| `_amountInput` | `AmountField` | molecule |\n| `_PhoneInputV1` | `PhoneField` | molecule |\n| `searchInput` | `SearchField` | molecule |\n| `_SingleDigit` | `OtpField` | molecule |\n| `Counter`, `_quantity-hotreload`, `_counter-buttons` | `QuantityField`, `StepperButton` | molecule, atom |\n| `_dropdown-single`, `basic-dropdown-single` | `SelectField` | molecule |\n| `_dropdown-multiple`, `basic-dropdown-multiple` | `MultiSelectField` | molecule |\n| `upload input` | `UploadField` | molecule |\n| `colorPicker` | `ColorPickerField` | molecule |\n| `_inputLabel` | `FieldLabel` | atom |\n| `_inputTip` | `HelperText` | atom |\n| `_Translation` | `TranslationToggle` | atom |\n| `_breadcrumbItem` | `BreadcrumbItem`, `Divider` | molecule, atom |\n| `Breadcrumb` | `Breadcrumb` | molecule |\n| `Header Secondary Tabs`, `Header Primary Tabs`, `Primary Tabs List - Dashboard only`, `_Table/Tabs Item` | `Tab` (molecule), `Tabs` (organism) | |\n| `Header` | `TopAppBar` | organism |\n| `Header Subcategory` | `SecondaryNavBar` | organism |\n| `Page Title` | `PageTitle` | molecule |\n| `Side menu`, `sidemenu tab` | `NavigationDrawer`, `NavigationItem` | organism, molecule |\n| `More Menu`, `_moreItems` | `MoreMenu`, `MenuItem` | organism, molecule |\n| `Drop Down List`, `_listItem`, `_listTitle` | `DropdownList`, `ListItem` | organism, molecule |\n| `_Date`, `_bigCalenderItems`, `_Time`, `Time` | `CalendarCell`, `DateTimePicker` | molecule, organism |\n| `Table`, `Table/Header`, `Table/Cells`, `Table/Delete`, `Table/Alertbox`, `_Table/*` | `DataTable` | organism |\n| `Table/Cell/*` (18) | `TableCell` family (`NameCell`, `AmountCell`, `StatusCell` …) | molecule |\n| `Table/Cell/Varient` | `VariantCell` | molecule |\n| `Table/Cell/Data` | `TextCell` / `DateCell` / `SelectCell` | molecule |\n| `Table/Footer` | `Pagination` | organism |\n| `Table/mobile *` | `MobileRow` | organism |\n| `Table/Bulk Edit Sheet` | `BulkEditSheet` | organism |\n| `Table/Edit Sheet` | `EditSheet` | organism |\n| `_Table/Panel Header`, `previewContainer` | `PanelHeader`, `Panel` | molecule, organism |\n| `_Table/Filter Results` | `FilterResults` | molecule |\n| `_Table/Chips`, `Table/Cell/Chip` | `Chip` | atom |\n| `_Percentage` | `ProgressCircle` | atom |\n| `Steps`, `_Step base` | `Stepper`, `StepIndicator` | organism, atom |\n| `Action Buttons`, `Action Bar/Confirm buttons`, `buttonsContainer` | `ActionBar` | organism |\n| `Bottom sheet` | `BottomSheet` | organism |\n| `searchbar` | `GlobalSearch` | molecule |\n| `Learn More` | `LearnMore` | molecule |\n| `Maps` | `Map` | organism |\n| `Flag` | `Flag` | atom |\n| `Social media icons` | `SocialIcon` | atom |\n| `Illustration`, `Illustrations Collection` | `Illustration`, `EmptyState` | atom, organism |\n| `Icons/Filled`, `Icons/Outline` | `Icon` | atom |\n| `Products Management` | `ListPage` | template |\n\n## Twilight components → catalog (old → new)\n\nEvery Twilight web component and where it lands. The full props / events / stories per tag are on each component page under *Source in the Twilight Storybook today*.\n\n| Twilight tag | Storybook entry | New component(s) | Level |\n|---|---|---|---|\n| `<s-accordion>` | Accordion | Accordion | organism |\n| `<s-alert-box>` | AlertBox | Alert (default), InlineAlert (layout=flat), AlertBanner (horizontal), UpgradeCard (theme=feature) | organism / molecule |\n| `<s-avatar>` | Avatar | Avatar, AvatarWithText (label + desc), AccountMenuTrigger | atom / molecule |\n| `<s-breadcrumbs>` | Breadcrumbs | Breadcrumb, BreadcrumbItem | molecule |\n| `<s-button>` | Button | Button, IconButton (layout=circular), Link (href) | atom |\n| `<s-buttons-group>` | ButtonsGroup | ActionBar | organism |\n| `<s-calendar>` | Calendar | DateTimePicker, CalendarCell | organism / molecule |\n| `<s-checkbox>` | Checkbox | Checkbox, CheckboxField | atom / molecule |\n| `<s-color-picker>` | ColorPicker | ColorPickerField | molecule |\n| `<s-dropdown>` | Dropdown | MoreMenu, DropdownList, MenuItem, BottomSheet (mobile sheet) | organism / molecule |\n| `<s-editor>` | Editor | RichTextEditor | organism |\n| `<s-icon>` | Icon | Icon | atom |\n| `<s-icon-picker>` | IconPicker | IconPicker | molecule |\n| `<s-input>` | Input | TextField, PasswordField, EmailField, AmountField, SearchField, GlobalSearch, HelperText (desc), BaseField | molecule |\n| `<s-list-item>` | Item | ListItem, MenuItem | molecule |\n| `<s-lingual-field>` | LingualField | LingualField, TranslationToggle | molecule / atom |\n| `<s-loader>` | Loader | LoadingIndicator, Loading | atom / molecule |\n| `<s-maps>` | Maps | Map | organism |\n| `<s-modal>` | Modal | Dialog | organism |\n| `<s-otp>` | OTP | OtpField | molecule |\n| `<s-panel>` | Panel | Panel, PanelHeader | organism / molecule |\n| `<s-placeholder>` | Placeholder | EmptyState | organism |\n| `<s-progress-bar>` | Progress Bar | ProgressBar | atom |\n| `<s-qty>` | Qty | QuantityField, StepperButton | molecule / atom |\n| `<s-radio>` | Radio | Radio, RadioField, RadioImage (layout=image), RadioColor (layout=color) | atom / molecule |\n| `<s-range-slider>` | Range Slider | RangeSlider | molecule |\n| `<s-rate>` | Rate | Rate | molecule |\n| `<s-select>` | Select | SelectField, MultiSelectField, DropdownList, SearchField (autocomplete) | molecule / organism |\n| `<s-skeleton>` | Skeleton | Skeleton | atom |\n| `<s-table>` | Table | DataTable, TableCell, MobileRow (layout=responsive), Pagination | organism / molecule |\n| `<s-tabs-group>` | Tabs | Tabs, Tab (`<s-tab-head>`) | organism / molecule |\n| `<s-tag>` | Tag | Chip, Status (layout=status), StatusIndicator | atom / molecule |\n| `<s-tags>` | Tags Input | TagsField | molecule |\n| `<s-tel-input>` | Telephone Input | PhoneField | molecule |\n| `<s-textarea>` | Textarea | TextareaField | molecule |\n| `<s-toggle>` | Toggle | Switch, SwitchField | atom / molecule |\n| `<s-tooltip>` | Tooltip | Tooltip | organism |\n| `<s-uploader>` | Uploader | UploadField | molecule |\n\nStorybook title convention after migration: `{Level}s / {Category} / {Name}` (e.g. `Molecules / Text inputs / TextField`), one story per global component rather than one story per Twilight tag.\n\n## Token renames (old Figma variable → new)\n\n| Figma variable | New token |\n|---|---|\n| `text/primary/primary`, `text/primary/link` (#004956) | `sys.color.text.brand` |\n| `background/primary/primary` (#004956) | `sys.color.primary` |\n| `background/secondary/seconadry`, `border/seconadry` (#a4ffe5) | `sys.color.primary-container`, `sys.color.outline-primary` |\n| `text/gray/white`, `background/default/white` | `sys.color.text.inverse`, `sys.color.surface` |\n| `background/default/input` | `sys.color.surface-input` |\n| `border/default` (#eee) | `sys.color.outline` |\n| `text/gray/light` (#666) | `sys.color.text.secondary` |\n| `text/gray/dark` (#333) | `sys.color.text.primary` |\n| `background/status/{success,danger,warning,info}/primary` | `sys.color.status.{…}.primary` |\n| `success/success-dark`, `danger/danger-dark` | `sys.color.status.{…}.dark` |\n| `success/success-darker`, `danger/danger-darker`, `text/status/info/darker` | `sys.color.status.{…}.darker` |\n| `danger/danger-lighter`, `background/status/info/lighter` | `sys.color.status.{…}.lighter` |\n| `border/status/info-light` | `sys.color.status.info.light` |\n| `color/support-non-semantic/orange/200|300`, `background/supporting-colors/orange/darker` | `sys.color.feature.gradient-start|end`, `sys.color.feature.on-feature` |\n| `spacing/6xs` 2 · `spacing/5xs` 4 · `spacing/3xs` 8 · `spacing/xs` 12 · `spacing/base` 16 · `spacing/2xl` 24 | `sys.space.3xs` · `2xs` · `xs` · `sm` · `md` · `xl` |\n| `Spacing/Sizes/3xs` 2 · `Spacing/Sizes/sm` 8 · `Spacing/Sizes/lg` 12 | `sys.space.3xs` · `xs` · `sm` |\n| `radius/md` 4 · `radius/xl` 8 · `radius/full` · `Radius/Sizes/*` | `sys.shape.extra-small` · `small` · `full` (see shape.md) |\n| `Typography/Family/Font` | `ref.font.family.base` |\n| `Typography/Weight/Regular|Medium|Bold` | `ref.font.weight.*` |\n| `Typography/Size/xs|sm|md` | `ref.font.size.*` |\n| `typography/line-height (Descreptive)/4|5|6` | `ref.font.lineHeight.4|5|6` |\n| `Bold/$text-base`, `Regular/$text-sm`, `Medium/$text-xs` … | `sys.typography.title-md`, `body-sm`, `label-sm` … (see typography.md) |\n\n## Suggested order of migration\n\n1. Tokens: add `01-Primitives` values to `tokens.json` (replace `assumed`), add elevation and motion, unify spacing.\n2. Figma: create the four level sections and move frames; rename per the table; fix typos in variables.\n3. Figma: replace `Language` variants with a variable mode; remove `--device` where layout is responsive.\n4. Code: build `BaseButton`, `BaseField`, `Checkbox`, `Radio`, `Switch`, `Icon` first; then the fields; then `DataTable`.\n5. Storybook: retitle stories; add Docs pages linking to the catalog.\n", "00-overview/methodology": "# Methodology: Atomic Design × Material Design\n\nSalla's design system uses two frameworks together. **Atomic Design** answers *how components compose*. **Material Design 3** answers *how the system is organised, named and tokenised*. Neither alone is enough: Atomic Design says nothing about tokens or categories, and Material's flat component list says nothing about which components are built from which.\n\n## 1. What we take from Material Design\n\nMaterial 3 organises its documentation into three top-level groups and we mirror them one-to-one.\n\n| Material group | Material contents | Salla folder | What lives there |\n|---|---|---|---|\n| **Foundations** | Accessibility, Adaptive design, Content design, Customization, Design tokens, Interaction states, Layout | `docs/01-foundations/` | The rules that apply to everything: token model, layout grid and breakpoints, interaction states, accessibility, Arabic/English content and RTL |\n| **Styles** | Color, Elevation, Icons, Motion, Shape, Typography | `docs/02-styles/` | The visual vocabulary. Each style page owns one token family. Salla adds *Spacing* (Material folds it into Layout) and *Illustrations* |\n| **Components** | Grouped by category: Actions, Communication, Containment, Navigation, Selection, Text inputs | `docs/03-components/` | The parts. We keep Material's six categories and add **Data display** for tables, avatars, flags and status, which Material 3 does not cover but the merchant dashboard is built on |\n\nWe also adopt Material's **three-tier token model**:\n\n```\nref.*   reference tokens   raw values, no meaning        ref.palette.teal.900 = #004956\nsys.*   system tokens      roles, theme-able             sys.color.primary = {ref.palette.teal.900}\ncomp.*  component tokens   per-component overrides only  comp.button.height-md = {ref.size.control.md}\n```\n\nProduct code and components use `sys.*`. Only the token build touches `ref.*`. `comp.*` exists only where a component needs a value that is not a plain system token. This is exactly how Material's `md.ref.*` / `md.sys.*` / `md.comp.*` tokens work, and it lets Salla theme (dark mode, white-label, partner apps) by re-mapping the `sys` tier without touching a component.\n\nOther Material conventions we adopt:\n\n- **Color roles, not color names**: `primary`, `on-primary`, `primary-container`, `surface`, `outline`. The Figma library already names colours by role (`text/primary`, `background/status/info`), so this is an alignment, not a rewrite.\n- **Type roles**: display / headline / title / body / label, each mapping to an existing `Bold|Medium|Regular / $text-*` Figma style.\n- **Shape scale**: none / extra-small / small / medium / large / full instead of raw radii.\n- **Interaction states** as a fixed list: enabled, hover, focus, pressed, dragged, disabled (plus selected / activated where relevant). Every stateful component documents these and no others.\n- **Component anatomy** diagrams with numbered parts, and a props table per component.\n\n## 2. What we take from Atomic Design\n\nMaterial lists ~35 components flat. Salla has 117 Figma frames and ~90 public components, many of which are built from each other (`_TextInput` → `TextField` → `DataTable`). Atomic Design gives us the vertical axis:\n\n| Level | Definition for Salla | Examples | Rule of thumb |\n|---|---|---|---|\n| **Atom** | Cannot be broken down further and still be useful. Takes tokens directly. No product data. | Button, Icon, Checkbox, Switch, Avatar, LoadingIndicator, StatusIndicator, Chip, Flag | If it needs another component to make sense, it is not an atom |\n| **Molecule** | A few atoms with one job. | TextField (label + input + helper), Status (dot + label), CheckboxField, Breadcrumb, Tab, ListItem, TableCell | Should be describable in one sentence without \"and\" |\n| **Organism** | A distinct section of the interface. Often stateful. Composed of molecules and atoms. | DataTable, TopAppBar, NavigationDrawer, DropdownList, Alert, Stepper, Dialog | Could appear on its own in a Storybook story with realistic data |\n| **Template** | Page skeleton with slots and placeholder content. | ListPage, ListDetailPage, FormPage, WizardPage | No real strings, no real data |\n| **Page** | Template + real content. | Orders list, Products list, Order details | Lives in the product, documented here as reference |\n\nNaming stays domain-neutral at atom and molecule level (`Button`, not `SaveButton`) and becomes domain-aware only at page level.\n\n## 3. How the two axes combine\n\nEvery component gets a coordinate on both axes. Material category is the **folder a designer opens**; atomic level is the **folder an engineer opens**. Storybook titles use both:\n\n```\nAtoms / Actions / Button\nMolecules / Text inputs / TextField\nOrganisms / Data display / DataTable\nTemplates / ListPage\n```\n\nThe catalog (`catalog/components.json`) is the single place where the coordinate is declared, and `docs/03-components/README.md` renders the matrix both ways.\n\n## 4. The third axis: structure type\n\nThe internal *Component Structure Types* document defines five build patterns. They are orthogonal to level and category and answer *how the engineer should implement it*:\n\n| # | Pattern | Typical level | Salla examples |\n|---|---|---|---|\n| 1 | Configurable | atom | Button, LoadingIndicator, Chip, Alert |\n| 2 | Standalone | atom / molecule | Icon, Flag, RadioImage, TableCell types, MobileRow |\n| 3 | Base + Global | molecule | BaseField → TextField / PasswordField / SearchField …; Checkbox → CheckboxField |\n| 4 | Slot / Composition | organism / template | DataTable, TopAppBar, Dialog, Panel, ListPage |\n| 5 | Headless | organism | Tabs (useTabs), DropdownList (useListbox), Stepper (useStepper), Tooltip |\n\nDetails and decision rules: [component-structure-types.md](component-structure-types.md).\n\n## 5. Principles\n\n1. **Tokens before components.** No hard-coded value in a component; if a value is missing, add a token first.\n2. **One source of truth per fact.** A component's props live in the catalog; its colours live in tokens; its Figma frame is linked, not copied.\n3. **Bilingual by default.** Every component is designed in Arabic and English and uses logical properties (`inline-start`, not `left`).\n4. **Accessible by construction.** Base components own focus, keyboard and ARIA so globals inherit it.\n5. **Small public API.** Prefer named globals (`PasswordField`) over a god component with a `variant` that changes behaviour.\n6. **Figma mirrors code.** Frame names, variant property names and token names match the catalog after migration.\n", "00-overview/naming-conventions": "# Naming conventions\n\nRules for component, prop, token, file and Figma names so the catalog, Figma, Storybook and code all say the same thing.\n\n## Components\n\n| Rule | Do | Don't |\n|---|---|---|\n| PascalCase, singular noun | `TextField`, `DataTable`, `NavigationItem` | `textfield`, `Tables`, `sidemenu tab` |\n| Domain-neutral below page level | `Status`, `ListItem` | `OrderStatus`, `ProductListItem` |\n| No version suffix in the name | `PhoneField` | `_PhoneInputV1` |\n| Field = control + label + helper | `CheckboxField`, `SwitchField`, `TextField` | `checkboxfield`, `toggleField`, `_TextInput` |\n| Internal bases prefixed `Base` in code, `_` in Figma | `BaseField`, `_TextInput` | exporting `InputWrapper` |\n| Material names where Material has one, Salla alias kept in docs | `Switch` (alias Toggle), `TopAppBar` (alias Header), `NavigationDrawer` (alias Side menu), `Dialog` (alias Modal) | inventing a third name |\n| Typed families use a shared suffix | `NameCell`, `AmountCell`, `StatusCell` | `Table/Cell/Varient`, `Table/Cell/Data` |\n\n## Props and variant properties\n\n| Rule | Do | Don't |\n|---|---|---|\n| camelCase | `iconStart`, `maxLength` | `icon-start`, `Icon Start` |\n| No `--` prefix on values | `variant=\"primary\"` | `Variant=--primary` |\n| Booleans are adjectives, no `?`, no `is` | `disabled`, `loading`, `richText` | `Rich text?`, `isDisabled`, `--disabled=true` |\n| Enumerations use the same words everywhere | `size: sm \\| md \\| lg` | `sm-16px`, `md- 48px`, `default-24px`, `compact` |\n| Language is a runtime context, not a variant | `dir` / `lang` on the root | `Language=Arabic/English` on every frame |\n| Device is a breakpoint, not a variant | responsive CSS; `device` only when layouts truly differ (TopAppBar, DataTable) | `--device=desktop` on Page Title |\n| State names are Material's | `enabled, hover, focus, pressed, disabled` (+ `selected`, `activated`, `error`) | `--preActive`, `--Active-Filled`, `--Active-Filled-with-one` |\n| Logical directions | `start`, `end`, `inline-start` | `left`, `right`, `Dir=Left` |\n\nFixed spellings for values seen in Figma today: `secondary` (not `seconadry`), `transparent` (not `Trasnparet`), `language` (not `Langauge` / `Langugae`), `variant` (not `Varient`), `separator` (not `Sperator`), `default` (not `defaullt`), `delivered` / `delivery` / `in-progress` / `retrieved` / `waiting-payment` / `waiting-review` (order statuses), `false` (not `Fals`).\n\n## Tokens\n\nFormat: `{tier}.{group}.{role}.{modifier}` in JSON, `--{tier}-{group}-{role}-{modifier}` in CSS.\n\n| Tier | Purpose | Examples |\n|---|---|---|\n| `ref` | raw values | `ref.palette.teal.900`, `ref.space.5`, `ref.font.size.sm` |\n| `sys` | roles | `sys.color.primary`, `sys.color.on-primary`, `sys.color.status.danger.primary`, `sys.space.md`, `sys.shape.small`, `sys.typography.label-md` |\n| `comp` | component | `comp.button.height-md`, `comp.alert.accent-width` |\n\nRules:\n\n- Colour roles follow Material: `primary`, `on-primary`, `primary-container`, `surface`, `outline`, `text.*`, `status.{success|danger|warning|info}.{lighter|light|primary|dark|darker}`.\n- The Figma collection `03-Colors` keeps its `text / background / border / foreground` grouping; the mapping to `sys.color.*` is one-to-one and listed in `docs/02-styles/color.md`.\n- One spacing scale. `spacing/*` and `Spacing/Sizes/*` (which currently disagree: `spacing/3xs = 8px` but `Spacing/Sizes/3xs = 2px`) both migrate to `sys.space.*`; see `docs/02-styles/spacing.md`.\n- Numeric ref scales (`ref.space.1..12`, `ref.palette.teal.100..900`) never appear in product code.\n\n## Files and folders\n\n| Thing | Convention | Example |\n|---|---|---|\n| Component doc | `docs/03-components/{level}s/{kebab-id}.md` | `docs/03-components/molecules/text-field.md` |\n| Catalog id | kebab-case, equals the doc filename | `text-field` |\n| Storybook title | `{Level}s / {Category} / {Name}` | `Molecules / Text inputs / TextField` |\n| Code folder (future) | `packages/ui/src/{level}s/{Name}/` with `{Name}.tsx`, `{Name}.stories.tsx`, `{Name}.test.tsx`, `index.ts` | `packages/ui/src/molecules/TextField/` |\n| Figma section | `{Level}s / {Category}` | `Molecules / Text inputs` |\n| Figma component | `{Name}` or `_{Name}` for internal | `TextField`, `_BaseField` |\n\n## Icons\n\n- Name only, no style suffix, in kebab-case: `add-01`, `arrow-down-01`, `information-circle`.\n- Style is a prop: `outline` (Figma *Stroke*) or `filled` (Figma *Solid*). Rounded is the only type shipped; Sharp, Bulk, Twotone and Duotone stay in the source library.\n- The legacy `sicon-*` font classes map one-to-one and are kept as aliases until the font is retired.\n", "01-foundations/design-tokens": "# Design tokens\n\nTokens are the named values every style and component is built from. Salla uses Material's three tiers.\n\n## Tiers\n\n| Tier | Prefix | Purpose | Who uses it | Example |\n|---|---|---|---|---|\n| Reference | `ref.` / `--ref-` | Raw palette, scales, fonts. No meaning. | Token build only | `ref.palette.teal.900 = #004956` |\n| System | `sys.` / `--sys-` | Roles. Theme-able. The public vocabulary. | Components, product code, Figma variables | `sys.color.primary = {ref.palette.teal.900}` |\n| Component | `comp.` / `--comp-` | Values a single component needs that are not plain system tokens. | That component's CSS only | `comp.button.height-md = {ref.size.control.md}` |\n\nRules:\n\n1. Product and component code reference `sys.*` (and their own `comp.*`). Never `ref.*`.\n2. A theme (dark, white-label, partner app) re-maps `sys.*` to different `ref.*`. Components do not change.\n3. A `comp.*` token must alias a `sys.*` or `ref.*` token; it never introduces a new raw value.\n4. Every raw value in Figma must exist in `ref.*`. If a design needs a value that is not in the scale, the scale is discussed first.\n\n## Files\n\n| File | Format | Consumer |\n|---|---|---|\n| `tokens/tokens.json` | W3C Design Tokens Community Group (DTCG) JSON with `$type` / `$value` | Style Dictionary / Tokens Studio / Figma variables sync |\n| `tokens/css/tokens.css` | CSS custom properties | Any web surface, Storybook, prototypes |\n| `tokens/tailwind/preset.js` | Tailwind preset mapped to the CSS variables | Twilight components and the merchant dashboard |\n\nThe JSON is the source. The CSS and Tailwind files are hand-maintained today and should be generated by Style Dictionary once the build is in place (`config: css/variables, tailwind/preset`).\n\n## Provenance\n\nEvery value in `tokens.json` names the Figma variable it was read from in its `$description`; the raw evidence (variable name → value, per frame) is in `catalog/figma-tokens-harvest.json`, gathered on 2026-09-22 from 20 component frames. Values that were not observed (type sizes above 2xl, radius sm/lg/2xl/4xl/5xl, space 6xl–8xl, shadows sm/xl, motion) are marked `not observed` / `not in Figma` and follow the same scale the observed values sit on.\n\n## Figma mapping\n\n| Figma collection | Token tier | Notes |\n|---|---|---|\n| `01-*` (primitives, not inspected) | `ref.palette`, `ref.space`, `ref.radius` | assumed to hold the raw scales |\n| `02-*` (typography, not inspected) | `ref.font.*` | |\n| `03-Colors` (`text / background / border / foreground` × role) | `sys.color.*` | one-to-one, see `docs/02-styles/color.md` |\n| `04-Token` (`Spacing/Sizes`, `Radius/Sizes`) | `sys.space.*`, `sys.shape.*` | must absorb the older `spacing/*` and `radius/*` variables |\n| Text styles `Bold|Medium|Regular / $text-*` | `sys.typography.*` | see `docs/02-styles/typography.md` |\n| (none) | `sys.elevation.*`, `ref.duration.*`, `ref.easing.*` | to be added as effect styles / variables |\n\n## Twilight (code) mapping\n\nThe Storybook components read colours as bare HSL channels on `:root` (`--primary: 189 100% 17%`, used as `hsl(var(--primary))` or the Tailwind class `bg-primary`). The full list of 125 root variables is in `catalog/storybook-tokens.json`. Mapping of the roles that matter:\n\n| Twilight variable / class | System token | Note |\n|---|---|---|\n| `--primary`, `bg-primary` | `sys.color.primary` | code `#004A57`, Figma `#004956` (see color.md drift table) |\n| `--primary-200` | `sys.color.primary-disabled` | |\n| `--secondary`, `bg-secondary` | `sys.color.primary-container` | code `#A3FFE5`, Figma `#a4ffe5` |\n| `--secondary-200` / `-300` | `sys.color.primary-container-subtle` / `-hover` | |\n| `--success`, `--danger`, `--warning`, `--info` (+ `-100 … -800`) | `sys.color.status.*` | code ramps have 8 steps; the system keeps the 5 Figma shades and maps `-100` lighter, `-200` light, base primary, `-600` dark, `-800` darker |\n| `--gray-400`, `--gray-500`, `--gray` | `sys.color.outline`, `outline-hover`, `text.disabled` | |\n| `--dark`, `--dark-200`, `--dark-100` | `sys.color.text.primary`, `text.secondary`, `text.tertiary` | |\n| `--gold*`, `--orange*` | `sys.color.upgrade.*`, `sys.color.feature.*` | |\n| `--mahally*`, `--blue*`, `--pink*`, `--moshammer*` | not in the system | product-line accents (Mahally marketplace, Moshammer AI gradient); keep as app-level variables |\n| `--font-main`, `--font-base` | `ref.font.family.base`, `ref.font.size.sm` | |\n| `--sm-height` / `--md-height` / `--lg-height` | `ref.size.control.sm / md / lg` | |\n| `--nav-height`, `--action-bar-height` | `comp.top-app-bar.*`, ActionBar | |\n| `--breakpoint-*` | layout.md | |\n| `--transition-duration` | `ref.duration.medium` | |\n| `rounded-*` | `ref.radius.*` | identical scale, shifted names (shape.md) |\n| `shadow-*` | `sys.elevation.*` | different values (elevation.md) |\n\n## Naming\n\nSee [naming-conventions.md](../00-overview/naming-conventions.md#tokens).\n", "01-foundations/interaction-states": "# Interaction states\n\nOne fixed vocabulary of states for every interactive component, following Material's *Interaction states*. Components document these and no others.\n\n## The list\n\n| State | Trigger | Visual rule | CSS / ARIA |\n|---|---|---|---|\n| **Enabled** | default | as designed | – |\n| **Hover** | pointer over | surface darkens ~4–8%; outlined and link variants gain a tinted background | `:hover` |\n| **Focus** | keyboard focus | 2px ring `sys.focus.ring-color` (#a4ffe5) offset 2px; never removed | `:focus-visible` |\n| **Pressed** | pointer down / Enter | surface darkens ~12%; no scale transforms | `:active` |\n| **Dragged** | drag in progress (UploadField, sortable rows) | elevation 3, 90% opacity | `[data-dragging]` |\n| **Disabled** | `disabled` | 38% opacity on content, no hover/pressed, `cursor: not-allowed` | `:disabled`, `aria-disabled` |\n| **Loading** | `loading` | content replaced or overlaid by `LoadingIndicator`, width preserved, pointer events off | `aria-busy` |\n| **Selected** | on/checked (Checkbox, Radio, Switch, Chip, Tab, ListItem, table row) | primary fill or primary outline | `aria-checked` / `aria-selected` |\n| **Activated** | current navigation target (NavigationItem, Tab, BreadcrumbItem) | primary text + indicator | `aria-current` |\n| **Error** | validation failed (fields) | outline and helper text `sys.color.status.danger.primary`; orthogonal to the states above | `aria-invalid` |\n| **Read-only** | `readOnly` (fields) | no outline change on focus, text selectable | `readonly` |\n\n## Fields specifically\n\nThe Figma library today designs eight field states: `default, hover, preActive, Active, filled, Active-Filled, read-only, disabled`. They map as follows:\n\n| Figma state | New state | Note |\n|---|---|---|\n| default | enabled (empty) | |\n| hover | hover | |\n| preActive | focus (empty) | \"pre-active\" is focus before typing |\n| Active | focus (typing) | same visual as focus |\n| filled | enabled (has value) | value presence is content, not a state |\n| Active-Filled | focus (has value) | |\n| read-only | read-only | |\n| disabled | disabled | |\n| `--error=True` | error flag | combinable with any of the above |\n\nNet: fields have **enabled, hover, focus, read-only, disabled** plus the **error** flag, and the value (empty / filled) is a content condition. This is what CSS can express and what a screen reader announces.\n\n## Priority when states overlap\n\n`disabled` > `loading` > `error` styling > `pressed` > `focus` > `hover` > `selected/activated` > `enabled`.\n\n## Motion\n\nState changes animate colour and elevation over `ref.duration.short` (100ms) with `ref.easing.standard`. Nothing animates size or position on hover. See `docs/02-styles/motion.md`.\n", "01-foundations/content-and-localization": "# Content and localisation\n\nThe dashboard is Arabic-first and fully bilingual. Every component is designed in both languages. This page is Material's *Content design* foundation plus the rules that make RTL automatic.\n\n## Direction\n\n- `dir=\"rtl\"` for Arabic, `dir=\"ltr\"` for English, set on `<html>` and inherited.\n- Components use **CSS logical properties** only: `margin-inline-start`, `padding-inline`, `inset-inline-end`, `border-inline-start`, `text-align: start`. No `left` / `right`.\n- Props use logical names: `iconStart` / `iconEnd`, `placement=\"start\" | \"end\"`, `position=\"start\" | \"end\"` (SwitchField). Figma's `Dir=Left/Right` migrates to `placement`.\n- Flex and grid flip automatically; nothing is re-ordered by hand.\n\nConsequence for Figma: `Language=Arabic|English` stops being a variant axis on every component and becomes a **variable mode** applied to the page. Only components with genuinely different Arabic and English layouts keep both frames (typography-heavy ones such as `AlertBanner`, `UpgradeCard`, `LearnMore`).\n\n## Mirroring\n\n| Mirror in RTL | Never mirror |\n|---|---|\n| arrows, chevrons, back / forward, undo / redo, indent, list bullets, progress direction, `Switch` thumb travel, `Stepper` order, `Breadcrumb` separators, `Pagination` prev / next | search magnifier, trash, settings gear, close ×, check ✓, sort carets (they point up / down), media playback, brand logos, clocks, phone, numbers and units |\n\n`Icon` exposes `mirrorInRtl`; the icon inventory should tag directional glyphs so the default is right.\n\n## Numbers, dates and currency\n\nFollows the live dashboard (s.salla.sa), which does **not** use Arabic-Indic digits:\n\n| Item | Rule | Example |\n|---|---|---|\n| Digits | Western Arabic (0-9) in both languages | 1,250 |\n| Currency | Saudi Riyal symbol glyph (the `Saudi-Riyal` icon in `AmountField`) after the number in Arabic, before in English; two decimals | 1,250.00 ر.س / SAR 1,250.00 |\n| Dates | numeric `DD/MM/YYYY` in Arabic UI, `MMM D, YYYY` in English; Hijri available via `DateTimePicker calendar=hijri` | 22/09/2026 |\n| Time | 12-hour with locale AM/PM markers | 3:45 م |\n| Phone | LTR isolate always (`<bdi>`), country code from `PhoneField` | +966 5X XXX XXXX |\n| OTP codes, SKUs, URLs, emails | LTR isolate | |\n\n## Voice and tone\n\n- Address the merchant directly and respectfully: Arabic second person, English \"you\". No slang.\n- Buttons are verbs: `حفظ` / `Save`, `إضافة منتج` / `Add product`. Never \"OK\" alone on a destructive action.\n- Titles are sentence case in English; Arabic has no case.\n- Error messages say what happened and what to do: \"لم يتم حفظ التغييرات. حاول مرة أخرى.\" / \"Changes were not saved. Try again.\"\n- Empty states (EmptyState) lead with the benefit, then the action.\n- Status labels are single nouns or past participles: `تم الشحن` / `Shipped`.\n\n## Typography per language\n\nOne family, PingAR+LT, covers both scripts, so type roles do not change per language. Arabic runs ~10% wider at equal size; components size to content (`hug`) so no fixed widths in molecules and atoms.\n\n## Bilingual fields\n\n`TextField bilingual` shows a `TranslationToggle` (EN / AR) at inline-end. The field's `dir` follows the *selected* language, not the page. Storybook name today: `LingualField`.\n", "01-foundations/accessibility": "# Accessibility\n\nBaseline: **WCAG 2.2 AA** for the merchant dashboard. Base components (structure type 3 and 5) own these behaviours so that global components inherit them.\n\n## Colour and contrast\n\nRatios computed with the WCAG 2.x relative-luminance formula from the verified token values.\n\n| Pairing | Ratio | Status |\n|---|---|---|\n| `sys.color.text.primary` #333 on `sys.color.surface` #fff | 12.6:1 | pass |\n| `sys.color.text.secondary` #666 on #fff | 5.7:1 | pass (AA text) |\n| `sys.color.text.brand` #004956 on `sys.color.primary-container` #a4ffe5 (primary Button) | 8.6:1 | pass |\n| `sys.color.text.inverse` #fff on `sys.color.primary` #004956 (TopAppBar) | 10.1:1 | pass |\n| `sys.color.text.inverse` #fff on `sys.color.status.danger.primary` #f55157 (danger Button) | 3.4:1 | **fails AA for 14px text** (needs 4.5:1) |\n| #fff on `sys.color.status.success.primary` #00af6c (success Button) | 2.9:1 | **fails** |\n| #fff on `sys.color.status.warning.primary` #ffaf44 (warning Button) | 1.8:1 | **fails** |\n| #fff on `sys.color.status.info.primary` #5196f3 (info Button, Alert action) | 3.0:1 | **fails** |\n| #fff on `sys.color.status.danger.dark` #ca4146 | 4.8:1 | pass, candidate fill for the danger Button |\n| #fff on `sys.color.status.success.dark` #008c56 | 4.3:1 | passes only for large text; success needs `darker` #005232 (9.3:1 on white) or a dark label |\n| `sys.color.text.primary` #333 on #ffaf44 | 6.9:1 | pass, candidate label colour for the warning Button |\n| `sys.color.status.info.darker` #204374 on `sys.color.status.info.lighter` #ecf3fe (Alert) | 8.9:1 | pass |\n| `sys.color.status.danger.darker` #7a1f1e on `sys.color.status.danger.lighter` #feecec (Status strong) | 9.0:1 | pass |\n| `sys.color.on-feature` #883000 on feature gradient #ffd8c2 → #ffaf83 | 6.4:1 → 4.7:1 | pass across the gradient |\n\nAction: all four filled status Buttons (`danger`, `success`, `warning`, `info`) with white labels fail AA at 14px. Options: use the `dark` shade as fill (danger passes at 4.8:1), use a dark label on warning (6.9:1), or reserve filled status buttons for 18px+ large text. Tracked as an open item in the audit.\n\nColour is never the only signal: `Status` pairs a dot colour with a label; `Alert` pairs colour with an icon; `Switch` pairs colour with thumb position.\n\n## Focus\n\n- Every interactive element shows `sys.focus.ring` on `:focus-visible`. It is never suppressed.\n- Focus order follows reading order, which follows `dir`.\n- `Dialog`, `BottomSheet`, `MoreMenu`, `DropdownList` trap focus while open and return it to the trigger on close (`useDialog`, `useMenu`).\n\n## Keyboard\n\n| Component | Keys |\n|---|---|\n| Button, Link, IconButton | Enter / Space |\n| Checkbox, Switch | Space |\n| Radio group | Arrow keys move selection |\n| Tabs | Arrow keys move focus, Enter / Space activate (roving tabindex) |\n| DropdownList / SelectField / MoreMenu | Arrow keys, Home / End, type-ahead, Enter select, Escape close |\n| DataTable | Tab to interactive cells, Space to select row, Shift+Space range |\n| Dialog / BottomSheet | Escape closes (unless blocking) |\n| Stepper | steps are links or buttons, no custom keys |\n\n## Semantics\n\n- Icon-only controls (`IconButton`, `ActionsCell` icons, close buttons) require `ariaLabel`. The catalog marks it required.\n- `FieldLabel` is a `<label for>`; `HelperText` is linked with `aria-describedby`; errors set `aria-invalid` and are announced.\n- `Status` uses text, not just colour; `LoadingIndicator` sets `aria-busy` on the region it covers.\n- `Alert` uses `role=\"status\"` for info/success and `role=\"alert\"` for warning/danger.\n- `Toast` is a `role=\"status\"` live region.\n\n## Target size\n\nInteractive targets are at least **24×24 CSS px** (WCAG 2.2 2.5.8) and, on compact screens, **40×40**. `Checkbox sm` (16px) and `Switch sm` (16px) get an invisible hit area to reach the minimum.\n\n## Motion\n\nRespect `prefers-reduced-motion`: durations drop to 0 and loaders use a static state.\n\n## Language\n\n`lang` and `dir` are set on the root and on any field whose language differs from the page (bilingual `TextField`), so screen readers switch voice correctly.\n", "01-foundations/layout": "# Layout and adaptive design\n\nHow screens are structured and how they adapt. Material's *Adaptive design* and *Layout* foundations applied to the merchant dashboard, which is desktop-first with a full mobile experience.\n\n## Grid\n\n- Base unit **4px** (`ref.space.*`). All spacing, sizes and radii are multiples of 4, with 2px allowed only for hairline gaps (`sys.space.3xs`).\n- Page gutter: `sys.space.md` (16px) on phones, `sys.space.xl` (24px) from tablet up.\n- Content max width: 1536px (the Figma desktop frames are 1536 wide inside a 1576 artboard), centred.\n\n## Breakpoints (window size classes)\n\nThe breakpoints are the ones the Twilight code ships as root variables (`--breakpoint-*`), mapped onto Material 3 window size classes:\n\n| Twilight variable | Width | Material class | Layout behaviour |\n|---|---|---|---|\n| `--breakpoint-sm` | 639px | Compact (below `sm`) | Single column. `TopAppBar` mobile, `NavigationDrawer` modal, `DataTable` `layout=responsive` (card rows), `Dropdown` / `Select` open as a mobile sheet (`sheetTitle`), `ActionBar` floats bottom |\n| `--breakpoint-md` | 768px | Medium | Single column with wider gutters. Drawer modal. Tables scroll horizontally (`layout=scroll`) |\n| `--breakpoint-lg` | 1024px | Expanded | Drawer standard (persistent). `ListDetailPage` shows two panes |\n| `--breakpoint-xl` | 1279px | Large | Full desktop |\n| `--breakpoint-2xl` | 1400px | Extra-large | Content capped at 1536px |\n\nOther layout constants shipped in code: `--nav-height` 4.5rem (72px TopAppBar), `--action-bar-height` 79px, control heights `--sm-height` 2rem / `--md-height` 2.5rem / `--lg-height` 3rem (the 32 / 40 / 48 scale in `ref.size.control`).\n\nComponents with genuinely different layouts per class declare a `device` prop in the catalog (`TopAppBar`, `PageTitle`, `DataTable`, `Breadcrumb`, `Stepper`, `Pagination`). Everything else adapts with CSS.\n\n## App shell\n\n```\n┌──────────────────────────────────────────────────────────┐\n│ TopAppBar (sys.color.primary, 64px)                      │\n│  logo · primary Tabs · GlobalSearch · icons · account    │\n├──────────────────────────────────────────────────────────┤\n│ SecondaryNavBar (secondary Tabs · help · CTA)            │\n├────────────┬─────────────────────────────────────────────┤\n│ Navigation │ PageTitle                                    │\n│ Drawer     │ ┌──────────────────────────────────────────┐ │\n│ (expanded+)│ │ Panel / DataTable / form sections        │ │\n│            │ └──────────────────────────────────────────┘ │\n│            │                              [floating help] │\n└────────────┴─────────────────────────────────────────────┘\n```\n\nTemplates (`ListPage`, `ListDetailPage`, `FormPage`, `WizardPage`) fix which organisms sit in the content region. See `docs/03-components/templates/`.\n\n## Panes\n\n- **List pane** min 320px, **detail pane** takes the rest (`ListDetailPage`).\n- Side sheets (`BulkEditSheet`, `EditSheet`) are 400 – 480px wide on expanded, full-width on compact.\n- Dropdown surfaces (`DropdownList`, `MoreMenu`) match the trigger width, min 240px, max 400px.\n\n## Density\n\nTwo densities exist in the library: **default** and **compact** (`QuantityField size=compact`, `AvatarStack size=compact`, `PanelHeader size=small`, `Button size=sm`). Compact is used inside `DataTable` cells and dense forms only.\n\n## Direction\n\nThe dashboard runs in Arabic (RTL) and English (LTR). Layout is written with CSS logical properties so it mirrors automatically. Details: [content-and-localization.md](content-and-localization.md).\n", "02-styles/typography": "# Typography\n\nOne family, three weights, a Tailwind-shaped size scale, expressed as Material type roles. Values observed in Figma on 2026-09-22 are marked ✓.\n\n## Family\n\n`ref.font.family.base` = **Ping AR + LT** ✓ (Figma `Typography/Family/Font`). One family for Arabic and Latin. Fallback stack: `\"Ping AR + LT\", \"PingAR+LT\", \"PingARLT\", \"PT Sans\", system-ui, sans-serif`.\n\nWeights ✓: Regular 400, Medium 500, Bold 700. No light or black.\n\n## Scale\n\n| Token | Size | Figma | Line-height token |\n|---|---|---|---|\n| `ref.font.size.xs` | 12px ✓ | `Typography/Size/xs`, `$text-xs` | `lineHeight.4` = 16px ✓ |\n| `ref.font.size.sm` | 14px ✓ | `Typography/Size/sm`, `$text-sm` | `lineHeight.5` = 20px ✓ |\n| `ref.font.size.md` | 16px ✓ | `Typography/Size/md`, `$text-base` | `lineHeight.6` = 24px ✓ |\n| `ref.font.size.lg` | 18px | `$text-lg` (not observed) | `lineHeight.7` = 28px ✓ |\n| `ref.font.size.xl` | 20px ✓ | `Typography/Size/xl`, `$text-xl` | `lineHeight.7` = 28px ✓ |\n| `ref.font.size.2xl` | 24px ✓ | `Typography/Size/2xl`, `$text-2xl` | `lineHeight.8` = 32px ✓ |\n| `ref.font.size.3xl … 9xl` | 30 … 128px | `$text-3xl … 9xl` (styles exist, values not observed) | |\n\nThe Figma line-height variables are named `typography/line-height (Descreptive)/4|5|6|7|8`, i.e. Tailwind's `leading-4 … leading-8`. Rename to `line-height/4 … 8` (typo fix) and keep the numeric names.\n\n## What the Twilight code ships today\n\nThe Storybook sets `--font-main: \"PingARLT\"` and `--font-base: 14px` (so `body-md` at 14px is the document default), and exposes Tailwind classes `text-3xs`, `text-2xs`, `text-xs` … `text-9xl` from `@salla.sa/ui-merchant-styles`. The two extra small steps (`3xs`, `2xs`) have no Figma counterpart; treat them as 10px and 11px utility sizes for dense table chrome only, never for body text.\n\n## Type roles (Material)\n\n| Role | Token | Figma style | Size / line | Weight | Observed on |\n|---|---|---|---|---|---|\n| Display large | `sys.typography.display-lg` | `Bold/$text-5xl` | 48 / 1 | 700 | marketing surfaces only |\n| Headline large | `headline-lg` | `Bold/$text-2xl` | 24 / 32 ✓ | 700 | PageTitle desktop |\n| Headline medium | `headline-md` | `Bold/$text-xl` | 20 / 28 ✓ | 700 | LearnMore title, Dialog title |\n| Title large | `title-lg` | `Bold/$text-lg` | 18 / 28 | 700 | PanelHeader |\n| Title medium | `title-md` | `Bold/$text-base` | 16 / 24 ✓ | 700 | Alert title, PageTitle mobile, active Tab, active primary Tab |\n| Title small | `title-sm` | `Bold/$text-sm` | 14 / 20 ✓ | 700 | pagination numbers, table header |\n| Body large | `body-lg` | `Regular/$text-base` | 16 / 24 ✓ | 400 | NavigationItem |\n| Body medium | `body-md` | `Regular/$text-sm` | 14 / 20 ✓ | 400 | **default UI text**: field values, placeholders, MenuItem, Alert body, table cells, breadcrumb |\n| Body small | `body-sm` | `Regular/$text-xs` | 12 / 16 ✓ | 400 | HelperText, subtext, units, Table/Status, Tooltip |\n| Label large | `label-lg` | `Medium/$text-base` | 16 / 24 ✓ | 500 | Tab (inactive / hover), primary Tab, active NavigationItem |\n| Label medium | `label-md` | `Medium/$text-sm` | 14 / 20 ✓ | 500 | **Button md / lg label**, FieldLabel, CheckboxField title, UpgradeCard CTA |\n| Label small | `label-sm` | `Medium/$text-xs` | 12 / 16 ✓ | 500 | Button sm label, Status label |\n\nRules:\n\n- Components pick a **role**, never a size + weight pair.\n- Letter-spacing is 0 everywhere (Arabic does not track).\n- Arabic runs ~10% wider than English at equal size; never fix a text width below organism level.\n- Digits are Latin in both languages (see [content-and-localization.md](../01-foundations/content-and-localization.md)).\n- Two legacy styles without variables (`Regular/text-sm`, `Medium/text-sm`, line-height 100%) appear on a few frames (Learn More buttons, header name) and should be replaced with `$text-sm` styles.\n\n## Implementation\n\nCSS: `font: var(--sys-type-body-md);` (shorthand-ready values in `tokens/css/tokens.css`).\nTailwind: the preset ships a plugin that emits `.type-{role}` utilities (`type-body-md`, `type-label-md` …).\n", "02-styles/color": "# Color\n\nSalla's palette as Material colour roles. **Every value below was read from the Figma library on 2026-09-22** (`catalog/figma-tokens-harvest.json`); the Figma variable that produces each role is listed so the two stay diff-able.\n\n## Brand roles\n\n| Role | Token | Value | Figma variable(s) | Use |\n|---|---|---|---|---|\n| Primary | `sys.color.primary` | `#004956` | `background/primary/primary`, `border/primary` | TopAppBar fill, checked Checkbox / Radio / Switch, active-tab underline, checkbox ring |\n| On primary | `sys.color.on-primary` | `#ffffff` | `text/gray/white` | text and icons on the TopAppBar |\n| Primary disabled | `sys.color.primary-disabled` | `#95c8d0` | `text/primary/disabled` | disabled outlined-primary label |\n| Primary container | `sys.color.primary-container` | `#a4ffe5` | `background/secondary/seconadry` | **primary Button fill**, active primary Tab, Tooltip surface |\n| On primary container | `sys.color.on-primary-container` | `#004956` | `text/primary/primary` | primary Button label, Tooltip text |\n| Primary container hover | `sys.color.primary-container-hover` | `#dbfff6` | `border/seconadry-hover` | tag outline in the account chip |\n| Primary container subtle | `sys.color.primary-container-subtle` | `#e6fff9` | `background/secondary/lighter`, `border/seconadry-disabled` | active NavigationItem, video play button |\n| Text brand | `sys.color.text.brand` | `#004956` | `text/primary/link` | links, breadcrumb current item, PageTitle |\n\nNaming note: Figma calls the mint `secondary`, but it is only ever used as the *fill behind primary actions* (primary Button, active primary Tab, Tooltip). Material's name for that role is **primary container**. A true secondary accent is not defined.\n\n## Surfaces, outlines, text\n\n| Role | Token | Value | Figma variable(s) |\n|---|---|---|---|\n| Surface | `sys.color.surface` | `#ffffff` | `background/default/white`, `background/default/cards` |\n| Surface input | `sys.color.surface-input` | `#ffffff` | `background/default/input` |\n| Surface neutral | `sys.color.surface-neutral` | `#f4f4f4` | `background/default/neutrals` |\n| Surface disabled | `sys.color.surface-disabled` | `#eeeeee` | `background/default/disabled`, `background/default/neutrals-dark` |\n| Outline light | `sys.color.outline-light` | `#f4f4f4` | `border/light` (LearnMore card) |\n| Outline | `sys.color.outline` | `#eeeeee` | `border/default` |\n| Outline hover | `sys.color.outline-hover` | `#dddddd` | `border/hover` (field hover, tab hover underline) |\n| Outline strong | `sys.color.outline-strong` | `#737373` | `border/gray-lighter` (disabled-checked checkbox) |\n| Outline primary | `sys.color.outline-primary` | `#a4ffe5` | `border/seconadry` (outlined primary Button) |\n| Outline primary strong | `sys.color.outline-primary-strong` | `#004956` | `border/primary`, `border/primary-link` |\n| Text primary | `sys.color.text.primary` | `#333333` | `text/gray/dark` |\n| Text
