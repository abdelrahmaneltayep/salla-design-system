 | `true` |  | Enable countdown state |\n| `resendLabel` | string | `Resend Code` |  | Resend button label |\n| `size` | string | `md` | `md`, `lg` | Fields siz |\n| `timer` | number | `60000` |  | Timer duration (in milliseconds) |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `canSend` | Emitted when the timer expires and user can resend OTP |\n| `fieldUpdated` | Emitted when any OTP field value is updated |\n| `otpComplete` | Emitted when all OTP fields are filled with complete values |\n| `resendRequest` | Emitted when the resend button is clicked |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--default), [Size Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--size-variants), [Field Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--field-variants), [Six Fields](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--six-fields), [No Timer](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--no-timer), [Short Timer](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--short-timer), [Custom Resend Label](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--custom-resend-label), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-otp--has-error)\n\n**Rendered markup (default story)**\n\n```html\n<s-otp size=\"md\" fields=\"4\" has-timer=\"true\" timer=\"60000\" resend-label=\"Resend Code\" class=\"flex flex-col items-center justify-center gap-6 hydrated\">\n<\/s-otp>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `otp-field`). Edit the catalog, not this file._\n", "03-components/molecules/rate": "# Rate\n\n> Star (half-step) or emoji rating, read-only or interactive, with themed fills.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Selection | 1 - Configurable | existing | storybook | `<s-rate>` |\n\n## Anatomy\n\n- icons ×maxStars\n- value label\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `value` | number |\n| `maxStars` | number |\n| `iconStyle` | `star`, `emoji` |\n| `theme` | `default`, `secondary`, `danger`, `warning`, `info` |\n| `size` | `sm`, `md`, `lg` |\n| `readOnly` | boolean |\n| `hideValue` | boolean |\n\n## States\n\n- read-only\n- interactive\n- hover\n- focus\n\n## Tokens\n\n- sys.color.warning-primary (stars)\n- sys.color.status.*\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Notes and migration\n\nStorybook only: no Figma frame.\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n### `<s-rate>`\n\n[components-rate](https://dashboard-ui-components.pages.dev/?path=/docs/components-rate) · 9 stories · The s-rate component represents a rating system that allows users to provide or view ratings. It supports two icon styles: `star` (classic half-star capable stars) and `emoji` (5 expressive face icons: angry → confused → neutral → happy → star-face). In emoji mode the value is always a whole number (1–5) and the `rateChanged` payload contains the selected emoji icon class instead of maxStars/totalRate.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `hideValue` | boolean | `true` |  | Hide rate value |\n| `iconStyle` | string | `star` | `star`, `emoji` | Icon style for the rating. `star` uses the classic star icons; `emoji` uses expressive face icons (angry → sad → neutral → happy → star-face). |\n| `maxStars` | number | `5` |  | Rate max stars |\n| `readOnly` | boolean | `false` |  | Enable this if you want to make the rate read only |\n| `required` | boolean |  |  |  |\n| `size` | string | `md` | `sm`, `md`, `lg` | Rate size, you can choose between `sm`, `md` and `lg |\n| `theme` | string | `default` | `default`, `secondary`, `danger`, `warning`, `info` | Rate theme |\n| `totalRate` | number | `100` |  | Total rate |\n| `value` | number | `3` |  | Rate value |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onRateChanged` | Emitted when the rating value changes. In `star` mode the payload contains `{ value, maxStars, totalRate }`; in `emoji` mode it contains `{ value, emoji }` where `emoji` is the selected HugeIcons class (e.g. `hgi-solid hgi-smile`). |\n| `rateChanged` | Emitted when a star or emoji is clicked, providing the new value and mode-specific payload. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--default), [Read Only](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--read-only), [Hide Value](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--hide-value), [Warning Theme](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--warning-theme), [Danger Theme](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--danger-theme), [Large](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--large), [Small](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--small), [Emoji](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--emoji), [Emoji Read Only](https://dashboard-ui-components.pages.dev/?path=/story/components-rate--emoji-read-only)\n\n**Rendered markup (default story)**\n\n```html\n<s-rate value=\"3\" theme=\"default\" max-stars=\"5\" total-rate=\"100\" size=\"md\" icon-style=\"star\" class=\"s-rate s-rate--default s-rate--horizontal ltr md hydrated\" id=\"\" name=\"\" layout=\"horizontal\" maxstars=\"5\" totalrate=\"100\" iconstyle=\"star\">\n<\/s-rate>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `rate`). Edit the catalog, not this file._\n", "03-components/molecules/toggle-field": "# SwitchField\n\n> Switch + label with the switch at inline-start or inline-end.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Selection | 3 - Base + Global | existing | figma, storybook | `<s-toggle> (label + desc, layout start\\|end)` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `label` | string |\n| `description` | string |\n| `position` | `start`, `end` |\n| `checked` | boolean |\n| `loading` | boolean |\n| `disabled` | boolean |\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **Switch**.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `toggleField` | Toggle | 20 | Language: Arabic, English; togglePosition: ending, starting; disabled: false, true; selected: false, true; loading: false, true |\n\n## Source in the Twilight Storybook today\n\n### `<s-toggle>` — label + desc, layout start|end\n\n[components-toggle](https://dashboard-ui-components.pages.dev/?path=/docs/components-toggle) · 11 stories · Toggle component is used to switch between two states, typically on/off or enabled/disabled. It provides a clear visual indication of the current state and allows users to toggle between states with a single interaction.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `checked` | boolean | `false` |  | Checked state |\n| `desc` | string |  |  | Toggle description |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `feature` | text | `true (omitted in HTML when unset)` |  | Feature guard: `true` (default), `false` to show gated UI + tag, a flag key string, or JSON for structured state (same as the `feature` attribute on the component). |\n| `hasError` | boolean | `false` |  | Error state |\n| `ischecked` | boolean | `false` |  | Checked state (deprecated, and will be removed soon) |\n| `label` | string | `Toggle option` |  | Toggle label |\n| `layout` | string | `start` |  | Layout position, start or end |\n| `loading` | boolean | `false` |  | Loading state |\n| `required` | boolean | `false` |  | Required state |\n| `size` | string |  |  |  |\n| `wide` | boolean | `true` |  | Full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `valueChanged` | Emitted when the value of the toggle switch changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--default), [Checked](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--checked), [Layout End](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--layout-end), [Required](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--required), [Has Description](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--has-description), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--loading), [Is Checked Property](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--is-checked-property), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--disabled), [Disabled Checked](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--disabled-checked), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--has-error), [Feature Gated](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--feature-gated)\n\n**Rendered markup (default story)**\n\n```html\n<s-toggle label=\"Toggle option\" desc=\"This is a description for the toggle\" size=\"md\" layout=\"start\" wide=\"\" class=\"s-toggle w-full start md ltr hydrated\">\n<\/s-toggle>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `toggle-field`). Edit the catalog, not this file._\n", "03-components/molecules/inline-alert": "# InlineAlert\n\n> Compact, non-dismissible alert placed under a field or inside a card (Alertbox Type=Inline).\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Communication | 3 - Base + Global | existing | figma, storybook | `<s-alert-box> (layout=flat)` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `variant` | `info`, `success`, `warning`, `danger` |\n| `text` | string |\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **BaseAlert**.\n\n## Source in Figma today\n\n- Variant filter: `Type=Inline`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Alertbox` | Alertbox | 64 | Language: Arabic, English; variant: danger, info, success, warning; Type: Default, Inline, white; Title: Off, On; Trasnparet: Off, On |\n\n## Source in the Twilight Storybook today\n\n### `<s-alert-box>` — layout=flat\n\n[components-alertbox](https://dashboard-ui-components.pages.dev/?path=/docs/components-alertbox) · 11 stories · A message box provides contextual feedback to users. It can be used to display success, warning, error, or info messages.\n\nRelated elements: `<s-alert-box-action>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `centerAlign` | boolean |  |  | set to true to center the alert box content |\n| `closable` | boolean | `false` |  | Show close button, if you want user to to be able to close the alert box |\n| `horizontal` | boolean |  |  | If true, the alert box will be displayed in a horizontal layout. |\n| `layout` | string | `default` | `default`, `flat` | Alert box Layout, you can set layout to default or flat |\n| `theme` | string | `default` | `default`, `secondary`, `danger`, `warning`, `info`, `feature` | Alert box Theme, you can set theme to default, secondary, danger, warning, info or feature |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onclick` | Emitted when the alert box is clicked. |\n| `onclose` | Emitted when the alert box is closed. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--default), [Secondary](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--secondary), [Danger](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--danger), [Warning](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--warning), [Info](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--info), [Feature](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--feature), [Flat](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--flat), [Closable](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--closable), [Horizontal](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--horizontal), [Center Align](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--center-align), [Custom Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-alertbox--custom-slot)\n\n**Rendered markup (default story)**\n\n```html\n<s-alert-box theme=\"default\" layout=\"default\" class=\"s-alert-box s-alert-box--default default ltr hydrated\">\n  <i slot=\"icon\" class=\"hgi-stroke hgi-alert-02\">\n  <\/i>\n  <h4 slot=\"title\">AlertBox Title<\/h4>\n  <article slot=\"desc\">\n    <p>This is a default alert description.<\/p>\n  <\/article>\n  <div slot=\"action\">\n    <s-alert-box-action slot=\"action\" layout=\"btn\" theme=\"default\" href=\"https://example.com\" target=\"_blank\" class=\"hydrated\">Primary Action<\/s-alert-box-action>\n    <s-alert-box-action slot=\"action\" layout=\"outlined\" theme=\"default\" href=\"https://example.com\" target=\"_blank\" class=\"hydrated\">Secondary Action<\/s-alert-box-action>\n  <\/div>\n<\/s-alert-box>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `inline-alert`). Edit the catalog, not this file._\n", "03-components/molecules/lingual-field": "# LingualField\n\n> Bilingual wrapper that renders an Input, Textarea or rich-text Editor per merchant language with a language dropdown, per-language values and optional AI suggestion.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Text inputs | 3 - Base + Global | existing | figma, storybook | `<s-lingual-field>` |\n\n## Anatomy\n\n- field (Input | Textarea | Editor)\n- language dropdown (end slot)\n- counter / description\n- AI suggestion actions\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `type` | `input`, `textarea`, `richText` |\n| `value` | {lang: string} |\n| `languages` | config object |\n| `language` | current lang |\n| `size` | `md`, `lg` |\n| `max` | number |\n| `showCount` | boolean |\n| `hasPreview` | boolean |\n| `aiSuggestion` | config |\n\n## States\n\ninherits BaseField\n\n## Tokens\n\ninherits BaseField\n\n## RTL and localisation\n\nEach language's field sets its own dir; the language dropdown stays inline-end.\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **BaseField**.\n\nComposes: [TextField](../molecules/text-field.md), [TextareaField](../molecules/textarea-field.md), [RichTextEditor](../organisms/rich-text-editor.md), [TranslationToggle](../atoms/translation-toggle.md).\n\n## Notes and migration\n\nIn Figma this is TextField with the translation toggle; in Twilight it is its own component that composes the three field types. Keep the name LingualField for continuity.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_TextInput` | Inputs | 28 | Language: Arabic, English; state: Active, Active-Filled, default, disabled, filled, hover, preActive, read-only; error: False, True |\n| `_Translation` | Inputs | 2 | Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-lingual-field>`\n\n[components-lingualfield](https://dashboard-ui-components.pages.dev/?path=/docs/components-lingualfield) · 18 stories · Lingual field component is used to handle multilingual input fields, allowing users to input content in multiple languages with automatic language detection and switching capabilities.\n\nRelated elements: `<s-input>`, `<s-icon>`, `<s-dropdown>`, `<s-button>`, `<s-textarea>`, `<s-editor>`, `<s-editor-toolbar>`, `<s-editor-desc>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `aiSuggestion` | object | `undefined` |  | AI suggestion config (object or JSON string): { enabled, source, regenerable, languages }. When active, the field gets the Moshammer AI highlight and reveals the `actions` slot (input/textarea end area, richText overlay). Per-language `languages: { [lang]: { content, status: 'pending' } }` auto-applies suggested content. |\n| `desc` | text | `undefined` |  | Input description, you can use it to add a description to the input |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | text | `undefined` |  | Input end slot, it accepts strings only, such as SAR or USD for example |\n| `fullHeight` | boolean | `false` |  | Make the textarea fill its container's height (textarea only). |\n| `fullToolbar` | boolean | `false` |  | Show the full rich-text toolbar (richText only). |\n| `hasError` | boolean | `false` |  | Error state |\n| `hasPreview` | boolean | `false` |  | Enable inline preview panel below the field. |\n| `language` | string | `ar` |  | Input current language |\n| `languages` | object | `undefined` |  | Languages configuration object with feature flag, supported languages, and current language |\n| `max` | number | `undefined` |  | Input Maximum value |\n| `min` | number | `undefined` |  | Input Minimum value |\n| `noBorder` | boolean | `false` |  | Remove input borders, use it in complex component in your app if needed |\n| `placeholder` | string | `Enter your text here...` |  | Input placeholder |\n| `required` | boolean | `false` |  | Required state |\n| `rows` | number | `3` |  | Row count for `type: 'textarea'`. |\n| `showCount` | boolean | `false` |  | Live `current/max` counter under the field (textarea + editor). Requires `max`. Counter follows the document direction so it stays anchored when the editor's per-language RTL flips. Turns danger-red under `has-error`. |\n| `size` | string | `md` |  | Input size |\n| `startSlot` | string | `undefined` |  | Input start slot, it accepts icon class name from hugeIcons or Sallaicons |\n| `toolbar` | array |  |  |  |\n| `type` | string | `input` |  | Input type, can be input, textarea or richText |\n| `value` | string | `{\"en\": \"Hello\", \"ar\": \"مرحبا\"}` |  | JSON string mapping languages to their respective values |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `languageChanged` | Emitted when the language is changed. |\n| `valueChanged` | Emitted when the field value changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--default), [Text Area Field](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--text-area-field), [Editor Field](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--editor-field), [Ai Suggestion](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--ai-suggestion), [Ai Suggesti ;current&quot;:{&quot;id&quot;:0,&quot;label&quot;:&quot;English&quot;,&quot;value&quot;:&quot;en&quot;}}\" dir=\"rtl\" class=\"s-lingual-field s-lingual-field--input rtl w-full relative flex items-start justify-start gap-4 hydrated\">\n  <!---->\n  <s-input class=\"flex-1 md rtl multilingual ltr hydrated\" dir=\"rtl\" value=\"مرحبا\">\n    <s-icon slot=\"start\" class=\"hydrated\">\n    <\/s-icon>\n    <div slot=\"end\" class=\"s-lingual-field__actions-end s-lingual-field__actions-end--hidden\" data-lingual-field-internal-slot=\"\">\n      <div class=\"s-lingual-field__actions-end__reserve s-lingual-field__actions-end--hidden\" aria-hidden=\"true\">\n      <\/div>\n    <\/div>\n  <\/s-input>\n  <s-dropdown dir=\"ltr\" class=\"h-fit end ltr hydrated\" overlay-alignment=\"start\">\n    <s-button data-toggle=\"true\" slot=\"dropdown-head\" c\n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `lingual-field`). Edit the catalog, not this file._\n", "03-components/molecules/base-field": "# BaseField (internal)\n\n> The internal base for every field: label + container (icon-start, control, subtext/unit, translation toggle, info) + helper text. Not exported. Today this role is played by InputWrapper, a 24-variant god component; splitting it into a base and named globals is the main structural change in Text inputs.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Text inputs | 3 - Base + Global | existing | figma, storybook | `<s-input>` |\n\n## Anatomy\n\n- FieldLabel\n- container\n- icon-start (slot)\n- control (slot)\n- subtext / unit\n- TranslationToggle\n- info icon\n- HelperText\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `state` | `default`, `hover`, `pre-active`, `active`, `filled`, `active-filled`, `read-only`, `disabled` |\n| `error` | boolean |\n| `language` | `ar`, `en` |\n\n## States\n\n- default\n- hover\n- pre-active\n- active\n- filled\n- active-filled\n- read-only\n- disabled\n- error\n\n## Tokens\n\n- comp.text-field.*\n- sys.color.surface-input\n- sys.color.outline (#eee)\n- sys.color.text.secondary (placeholder #666)\n- sys.shape.small\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\n## Notes and migration\n\nEight interaction states is more than a screen reader or CSS needs. Collapse to: enabled, hover, focus, filled, read-only, disabled, plus an orthogonal error flag.\n\n## Source in Figma today\n\n- Figma node: `InputWrapper 4d4e5f6d`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_TextInput` | Inputs | 28 | Language: Arabic, English; state: Active, Active-Filled, default, disabled, filled, hover, preActive, read-only; error: False, True |\n| `InputWrapper` | Inputs | 24 | Variant: Search, amount, color picker, dropdown-multiple, dropdown-single, dropdown-single-basic, email, password, phone, texArea, text, upload; Langauge: Arabic, English |\n| `_inputLabel` | Inputs | 2 | Language: Arabic, English |\n| `_Text-cursor` | Inputs | 2 | State: Not visible, Visible |\n| `_inputTip` | Inputs | 10 | Type: Danger, Default, Delete File, Variables, character count; Langauge: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-input>`\n\n[components-input](https://dashboard-ui-components.pages.dev/?path=/docs/components-input) · 17 stories · Input component is one of the most used components in any application, it is used to get user different types of input in a text field.\n\nRelated elements: `<s-icon>`, `<s-dropdown>`, `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `aiSuggestion` | object | `undefined` |  | AI suggestion config (object or JSON string): { enabled, regenerable, source }. When `enabled`, the input gets the Moshammer AI highlight and reveals the `actions` slot (regenerate / dismiss). `regenerable` keeps the slot visible without the highlight. |\n| `autocomplete` | array |  |  |  |\n| `desc` | text | `undefined` |  | Input description, you can use it to add a description to the input |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | string |  |  |  |\n| `hasError` | boolean | `false` |  | Error state |\n| `hasPreview` | boolean | `false` |  | Enable input preview |\n| `max` | number | `undefined` |  | Input Maximum value |\n| `min` | number | `undefined` |  | Input Minimum value |\n| `multilingual` | boolean | `false` |  | Enables multilingual support, if true, the input will be able to handle multiple languages, the language will be detected automatically based on merchant supported languages |\n| `noBorder` | boolean | `false` |  | Remove input borders, use it in complex component in your app if needed |\n| `pattern` | text | `undefined` |  | Regular expression for input validation |\n| `placeholder` | string | `Enter your text here...` |  | Input placeholder |\n| `shadow` | boolean | `false` |  | Add shadow to the input |\n| `size` | string | `md` |  | Input field size |\n| `startSlot` | string |  |  |  |\n| `step` | number | `undefined` |  | Steps for number inputs only, default is 0 |\n| `textAlignment` | string | `start` |  | Text alignment within the input |\n| `type` | string | `text` |  | Type of the input |\n| `value` | string | `Default input value` |  | Input value |\n| `wide` | boolean | `true` |  | Wide input mode |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `valueChanged` | Emitted when the input value changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-input--default), [Has Preview](https://dashboard-ui-components.pages.dev/?path=/story/components-input--has-preview), [Large Size](https://dashboard-ui-components.pages.dev/?path=/story/components-input--large-size), [Text Alignment Center](https://dashboard-ui-components.pages.dev/?path=/story/components-input--text-alignment-center), [Text Alignment End](https://dashboard-ui-components.pages.dev/?path=/story/components-input--text-alignment-end), [Multilingual](https://dashboard-ui-components.pages.dev/?path=/story/components-input--multilingual), [Border Less](https://dashboard-ui-components.pages.dev/?path=/story/components-input--border-less), [Reg Ex Pattern](https://dashboard-ui-components.pages.dev/?path=/story/components-input--reg-ex-pattern), [Description](https://dashboard-ui-components.pages.dev/?path=/story/components-input--description), [Email](https://dashboard-ui-components.pages.dev/?path=/story/components-input--email), [Auto Complete](https://dashboard-ui-components.pages.dev/?path=/story/components-input--auto-complete), [Password](https://dashboard-ui-components.pages.dev/?path=/story/components-input--password), [Number](https://dashboard-ui-components.pages.dev/?path=/story/components-input--number), [With Slots](https://dashboard-ui-components.pages.dev/?path=/story/components-input--with-slots), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-input--has-error), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-input--disabled), [Ai Suggestion](https://dashboard-ui-components.pages.dev/?path=/story/components-input--ai-suggestion)\n\n**Rendered markup (default story)**\n\n```html\n<s-input id=\"\" name=\"\" value=\"Default input value\" type=\"text\" placeholder=\"Enter your text here...\" size=\"md\" text-alignment=\"start\" wide=\"\" class=\"w-full md ltr hydrated\">\n  <s-icon slot=\"start\" icon=\"hgi-stroke hgi-text\" class=\"hydrated\">\n  <\/s-icon>\n<\/s-input>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `base-field`). Edit the catalog, not this file._\n", "03-components/molecules/panel-header": "# PanelHeader\n\n> Title + actions row for Panel / Table containers, default and small.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Containment | 4 - Slot / Composition | existing | figma, storybook | `<s-panel> (<s-panel-head>, actions slot)` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `title` | string |\n| `size` | `default`, `small` |\n| `actions` | slot |\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_Table/Panel Header` | Table | 2 | Size: Default, Small |\n\n## Source in the Twilight Storybook today\n\n### `<s-panel>` — <s-panel-head>, actions slot\n\n[components-panel](https://dashboard-ui-components.pages.dev/?path=/docs/components-panel) · 6 stories · The content wrapper component\n\nRelated elements: `<s-panel-head>`, `<s-panel-body>`, `<s-table>`, `<s-button>`, `<s-dropdown>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `actions` | string |  |  |  |\n| `collapsable` | boolean | `false` |  | Make panel collapsable |\n| `collapsed` | boolean | `true` |  | Set collapse prop |\n| `content` | string |  |  | Panel content, use the `<s-panel-body />` to add all your content inside this slot |\n| `layout` | string | `relaxed` |  | for some scenarions, you may need a compact layout for panel |\n| `noPadding` | boolean |  |  | Remove panel body padding, useful for full width panels with tables inside panel body |\n| `overflowHidden` | boolean |  |  | overflow hidden for panel body |\n| `title` | string |  |  | Panel title, you can add the title via `<s-panel-head />` and use the `title` slot |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--default), [No Padding](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--no-padding), [Collapsable](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--collapsable), [Header Actions Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--header-actions-slot), [Compact Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--compact-layout), [Headless Panel](https://dashboard-ui-components.pages.dev/?path=/story/components-panel--headless-panel)\n\n**Rendered markup (default story)**\n\n```html\n<s-panel collapsed=\"\" layout=\"relaxed\" class=\"s-panel ltr hydrated\">\n  <s-panel-head data-collapsed=\"true\" class=\"hydrated\">\n    <div slot=\"title\">Panel Title<\/div>\n  <\/s-panel-head>\n  <s-panel-body class=\"hydrated\"> Panel content, you can add any content here inside this slot <\/s-panel-body>\n<\/s-panel>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `panel-header`). Edit the catalog, not this file._\n", "03-components/molecules/list-item": "# ListItem\n\n> Row inside DropdownList and pickers: plain, with description, with flag, with image; supports checkbox, selected, danger, disabled and 'feature' (upsell) states.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| molecule | Containment | 4 - Slot / Composition | existing | figma, storybook | `<s-list-item>, <s-select> (items[] with thumbnails / groups)` |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `leading` | slot (Flag \\| Avatar \\| Checkbox) |\n| `title` | string |\n| `description` | string |\n| `trailing` | slot |\n| `selected` | boolean |\n| `danger` | boolean |\n| `disabled` | boolean |\n| `feature` | boolean |\n\n## States\n\n- default\n- hover\n- selected\n- disabled\n\n## How to build it\n\nBuild as a **container with named slots**. The component fixes structure, spacing and behaviour of the frame; the parent supplies content. Document every slot and what it accepts.\n\n## Notes and migration\n\nThe PDF names this pattern listItemLayout: a slot-based layout with fixed slots. ListSubheader (_listTitle) is the category / search header variant.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_listItem` | Drop Down List | 50 | Language: Arabic, English; Variant: item, item-description, item-flag, item-image; danger: False, True; selected: False, True; disabled: false, true; feature: false, true |\n| `_listTitle` | Drop Down List | 8 | Language: Arabic, English; Variant: Category, Search Active, Search Default, Subcategory |\n\n## Source in the Twilight Storybook today\n\n### `<s-list-item>`\n\n[components-item](https://dashboard-ui-components.pages.dev/?path=/docs/components-item) · 1 stories · Items are elements that can contain text, icons, avatars, images, inputs, and any other native or custom elements. Items should only be used as rows in a List with other items.\n\nRelated elements: `<s-icon>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `clickable` | boolean |  |  |  |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-item--default)\n\n**Rendered markup (default story)**\n\n```html\n<div style=\"display: contents;\">\n  <s-list-item role=\"listitem\" class=\"hydrated\">List Item <s-icon slot=\"end\" class=\"hydrated\">\n  <\/s-icon>\n<\/s-list-item>\n<\/div>\n```\n\n### `<s-select>` — items[] with thumbnails / groups\n\n[components-select](https://dashboard-ui-components.pages.dev/?path=/docs/components-select) · 29 stories · Select component provides a dropdown interface for choosing from a list of options. It supports single and multiple selection, search functionality, grouping, and various customization options.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `addMissingItem` | boolean | `false` |  | Allow adding new items |\n| `allowParentSelect` | boolean | `true` |  | When false and layout is drawer, clicking a parent item opens the drawer/toggles children instead of selecting the parent. When true, parent items remain selectable. |\n| `autocomplete` | boolean |  |  | Enables this option to fetch items from server dynamically based on the search query |\n| `cancelLabel` | text |  |  | Label of the cancel action. Defaults to the translated \"Cancel\". |\n| `children` | string |  |  |  |\n| `confirmLabel` | text |  |  | Label of the confirm action. Defaults to the translated \"Save\". |\n| `confirmable` | boolean |  |  | Buffers the selection behind sticky confirm/cancel actions at the end of the dropdown. No `selectChange` is emitted while the dropdown is open — confirm emits it once (plus `selectConfirm`), cancel emits `selectCancel` and restores the value the dropdown opened with. |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | text | `undefined` |  | HTML content to render in the end slot |\n| `hasError` | boolean |  |  | Error state |\n| `hideClearButton` | boolean | `false` |  | Hide the clear button, useful in certain cases |\n| `items` | array | `[]` |  | Options for the select |\n| `layout` | select | `default` | `default`, `drawer` | Layout mode for the select dropdown |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean |  |  | Enables multiple selection mode, you can then choose either tags or count of selected items, count is default |\n| `overlayAlignment` | string | `start` | `start`, `end` | Horizontal alignment preference for the dropdown overlay |\n| `placeholder` | string |  |  | Placeholder text |\n| `readonly` | boolean | `false` |  | The value cannot change, but the component stays usable: the dropdown still opens and closes, and the search box still filters. Selecting, select-all, add-new, drawer navigation, the clear button and tag removal are all locked. Use it for async work that must not be interrupted, or for view-only permissions; unlike `disabled`, it never greys out the whole component or force-closes the overlay. |\n| `required` | boolean |  |  | Required state |\n| `responsive` | boolean |  |  | Responsive mode |\n| `searchPlaceholder` | text | `undefined` |  | Search input placeholder |\n| `searchable` | boolean |  |  | Enables search functionality |\n| `selectAll` | boolean |  |  | Shows a select-all row in the dropdown. Works only when multiselect is enabled. |\n| `sheetTitle` | text |  |  | Optional title shown in the mobile sheet header |\n| `size` | select |  | `md`, `lg` | Size of the select component |\n| `tags` | boolean |  |  | Display selections as tags |\n| `toggleSlot` | text | `undefined` |  | HTML content to render in the toggle slot. When provided, replaces the default input-wrapper. Element should have data-toggle attribute. |\n| `value` | string |  |  | Selected value(s) |\n| `wide` | boolean |  |  | Full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `addNewItem` | Emitted when user clicks to add a missing item. Provides value and searchString. |\n| `optionsChange` | Emitted when the value of options changes. |\n| `searchValueChange` | Emitted when the search value changes in searchable mode. |\n| `selectChange` | Emitted when the value of the select component changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-select--default), [Searchable](https://dashboard-ui-components.pages.dev/?path=/story/components-select--searchable), [Auto Complete](https://dashboard-ui-components.pages.dev/?path=/story/components-select--auto-complete), [With End Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-slot), [With End Overlay Alignment](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-end-overlay-alignment), [With Toggle Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-toggle-slot), [With Groups And Thumbnails](https://dashboard-ui-components.pages.dev/?path=/story/components-select--with-groups-and-thumbnails), [Nested Options](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-options), [Drawer Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout), [Drawer Layout No Parent Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--drawer-layout-no-parent-select), [Nested With Child Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-select--nested-with-child-icons), [Multi Select](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select), [Multi Select Tags Layout](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select-tags-layout), [Multi Select With Select All](https://dashboard-ui-components.pages.dev/?path=/story/components-select--multi-select-with-select-all), [Add Missing Item](https://dashboard-ui-components.pages.dev/?path=/story/components-select--add-missing-item), [Hide Clear Button](https://dashboard-ui-components.pages.dev/?path=/story/components-select--hide-clear-button), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-select--loading), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-select--has-error), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled), [Disabled Item](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled-item), [Disabled Nested Item](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled-nested-item), [Disabled Item Multiselect](https://dashboard-ui-components.pages.dev/?path=/story/components-select--disabled-item-multiselect), [Readonly](https://dashboard-ui-components.pages.dev/?p component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\nBase component: **BaseField**.\n\n## Notes and migration\n\nStorybook only: no Figma frame. Material: slider.\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n### `<s-range-slider>`\n\n[components-range-slider](https://dashboard-ui-components.pages.dev/?path=/docs/components-range-slider) · 5 stories · The s-range-slider component represents a range slider that allows users to select a value within a specified range. It offers a visual slider input and a numerical input for selecting values.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `disabled` | boolean | `false` |  | Disabled state |\n| `hasError` | boolean | `false` |  | Error state |\n| `max` | number | `200` |  | Slider maximum value |\n| `min` | number | `0` |  | Slider minimum value |\n| `step` | number | `1` |  | Step value for the range slider |\n| `theme` | string | `default` | `default`, `secondary` | Slider theme, you can choose between default and secondary |\n| `value` | number | `100` |  | Slider value |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onChange` | Emitted when the value of the range slider changes. |\n| `onValueChanged` | Emitted when the value of the range slider changes. Payload includes target, min, max, step, and value. |\n| `onchange` | Emitted when the range slider value changes. Provides the new value as a number. |\n| `valueChanged` | Emitted when the value of the range slider changes. Provides detailed change information. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-range-slider--default), [Step](https://dashboard-ui-components.pages.dev/?path=/story/components-range-slider--step), [Secondary Theme](https://dashboard-ui-componen nglish |\n\n## Source in the Twilight Storybook today\n\n### `<s-select>` — multiselect, tags, selectAll\n\n[components-select](https://dashboard-ui-components.pages.dev/?path=/docs/components-select) · 29 stories · Select component provides a dropdown interface for choosing from a list of options. It supports single and multiple selection, search functionality, grouping, and various customization options.\n\nRelated elements: `<s-button>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `addMissingItem` | boolean | `false` |  | Allow adding new items |\n| `allowParentSelect` | boolean | `true` |  | When false and layout is drawer, clicking a parent item opens the drawer/toggles children instead of selecting the parent. When true, parent items remain selectable. |\n| `autocomplete` | boolean |  |  | Enables this option to fetch items from server dynamically based on the search query |\n| `cancelLabel` | text |  |  | Label of the cancel action. Defaults to the translated \"Cancel\". |\n| `children` | string |  |  |  |\n| `confirmLabel` | text |  |  | Label of the confirm action. Defaults to the translated \"Save\". |\n| `confirmable` | boolean |  |  | Buffers the selection behind sticky confirm/cancel actions at the end of the dropdown. No `selectChange` is emitted while the dropdown is open — confirm emits it once (plus `selectConfirm`), cancel emits `selectCancel` and restores the value the dropdown opened with. |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | text | `undefined` |  | HTML content to render in the end slot |\n| `hasError` | boolean |  |  | Error state |\n| `hideClearButton` | boolean | `false` |  | Hide the clear button, useful in certain cases |\n| `items` | array | `[]` |  | Options for the select |\n| `layout` | select | `default` | `default`, `drawer` | Layout mode for the select dropdown |\n| `loading` | boolean | `false` |  | Loading state |\n| `multiselect` | boolean |  |  | E ev/?path=/story/components-icon--default)\n\n**Rendered markup (default story)**\n\n```html\n<s-icon icon=\"sicon-light-salla\" size=\"1rem\" class=\"hydrated\">\n<\/s-icon>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `icon`). Edit the catalog, not this file._\n", "03-components/atoms/text": "# Text\n\n> Typography primitive exposing the Material type roles (display, headline, title, body, label) that map onto the Figma Bold/Medium/Regular $text-* styles.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Communication | 1 - Configurable | proposed | none yet | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `role` | `display-lg`, `headline-lg`, `headline-md`, `title-lg`, `title-md`, `title-sm`, `body-md`, `body-sm`, `body-xs`, `label-md`, `label-sm` |\n| `color` | sys.color.text.* |\n| `as` | html tag |\n\n## Tokens\n\n- sys.typography.*\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n- Figma styles: `Bold/$text-*, Medium/$text-*, Regular/$text-*`\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `text`). Edit the catalog, not this file._\n", "03-components/atoms/progress-bar": "# ProgressBar\n\n> Linear determinate progress with label, description, percentage and an optional secondary percentage.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Communication | 1 - Configurable | existing | storybook | `<s-progress-bar>` |\n\n## Anatomy\n\n- label\n- track\n- fill (+ secondary fill)\n- percentage\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `percentage` | 0-100 |\n| `secondaryPercentage` | 0-100 |\n| `theme` | `default`, `secondary` |\n| `size` | `sm`, `md`, `lg` |\n| `showPercentage` | boolean |\n| `shortLabel` | boolean |\n\n## Tokens\n\n- sys.color.primary\n- sys.color.primary-container\n- sys.color.surface-disabled\n- sys.shape.full\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Notes and migration\n\nStorybook only: no Figma frame. Pairs with ProgressCircle (_Percentage) which exists only in Figma; both are Material 'progress indicators'.\n\n## Source in Figma today\n\n_No matching frame in the current Figma library._\n\n## Source in the Twilight Storybook today\n\n### `<s-progress-bar>`\n\n[components-progress-bar](https://dashboard-ui-components.pages.dev/?path=/docs/components-progress-bar) · 6 stories · A progress bar component, helping you adding a graphical element to your app. It supports various states, loading, and different toggle elements.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `desc` | string | `This is a progress bar description` |  | Progress bar description |\n| `label` | string | `This is a progress bar label` |  | Progress bar label |\n| `percentage` | number | `25` |  | Progress bar percentage |\n| `secondaryPercentage` | number | `undefined` |  | You can add a secondary percentage to the progress bar if needed |\n| `shortLabel` | boolean | `false` |  | If you need to make the label shorter, you can use this prop |\n| `showPercentage` | boolean | `true` |  | Show or hide the percentage value on the progress bar |\n| `size` | string | `md` |  | Progress bar size |\n| `theme` | string | `default` |  | Progress bar theme, default or secondary |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `onchange` | Emitted when the progress bar value changes. |\n| `onclick` | Emitted when the progress bar is clicked. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-progress-bar--default), [Short Label](https://dashboard-ui-components.pages.dev/?path=/story/components-progress-bar--short-label), [Secondary Theme](https://dashboard-ui-components.pages.dev/?path=/story/components-progress-bar--secondary-theme), [Secondary Percentage](https://dashboard-ui-components.pages.dev/?path=/story/components-progress-bar--secondary-percentage), [Large](https://dashboard-ui-components.pages.dev/?path=/story/components-progress-bar--large), [Small](https://dashboard-ui-components.pages.dev/?path=/story/components-progress-bar--small)\n\n**Rendered markup (default story)**\n\n```html\n<s-progress-bar label=\"This is a progress bar label\" desc=\"This is a progress bar description\" theme=\"default\" size=\"md\" percentage=\"25\" show-percentage=\"true\" class=\"w-full s-progress-bar flex flex-col gap-2 default md ltr hydrated\">\n<\/s-progress-bar>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `progress-bar`). Edit the catalog, not this file._\n", "03-components/atoms/progress-circle": "# ProgressCircle\n\n> Circular determinate progress (25/50/75/100 in Figma, should accept any value).\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Communication | 1 - Configurable | existing | figma | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `value` | 0-100 |\n| `size` | `sm`, `md` |\n\n## Tokens\n\n- sys.color.primary\n- sys.color.outline\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame ues / type |\n|---|---|\n| `language` | `ar`, `en` |\n\n## States\n\n- default\n- hover\n- open\n\n## Tokens\n\n- sys.color.outline\n- sys.shape.small\n- sys.typography.body-xs\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `_Translation` | Inputs | 2 | Language: Arabic, English |\n\n## Source in the Twilight Storybook today\n\n### `<s-lingual-field>` — language dropdown at the end slot\n\n[components-lingualfield](https://dashboard-ui-components.pages.dev/?path=/docs/components-lingualfield) · 18 stories · Lingual field component is used to handle multilingual input fields, allowing users to input content in multiple languages with automatic language detection and switching capabilities.\n\nRelated elements: `<s-input>`, `<s-icon>`, `<s-dropdown>`, `<s-button>`, `<s-textarea>`, `<s-editor>`, `<s-editor-toolbar>`, `<s-editor-desc>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `aiSuggestion` | object | `undefined` |  | AI suggestion config (object or JSON string): { enabled, source, regenerable, languages }. When active, the field gets the Moshammer AI highlight and reveals the `actions` slot (input/textarea end area, richText overlay). Per-language `languages: { [lang]: { content, status: 'pending' } }` auto-applies suggested content. |\n| `desc` | text | `undefined` |  | Input description, you can use it to add a description to the input |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `endSlot` | text | `undefined` |  | Input end slot, it accepts strings only, such as SAR or USD for example |\n| `fullHeight` | boolean | `false` |  | Make the textarea fill its container's height (textarea only). |\n| `fullToolbar` | boolean | `false` |  | Show the full rich-text toolbar (richText only). |\n| `hasError` | boolean | `false` |  | Error state |\n| `hasPreview` | boolean | `false` |  | Enable inline preview panel below the field. |\n| `language` | string | `ar` |  | Input current language |\n| `languages` | object | `undefined` |  | Languages configuration object with feature flag, supported languages, and current language |\n| `max` | number | `undefined` |  | Input Maximum value |\n| `min` | number | `undefined` |  | Input Minimum value |\n| `noBorder` | boolean | `false` |  | Remove input borders, use it in complex component in your app if needed |\n| `placeholder` | string | `Enter your text here...` |  | Input placeholder |\n| `required` | boolean | `false` |  | Required state |\n| `rows` | number | `3` |  | Row count for `type: 'textarea'`. |\n| `showCount` | boolean | `false` |  | Live `current/max` counter under the field (textarea + editor). Requires `max`. Counter follows the document direction so it stays anchored when the editor's per-language RTL flips. Turns danger-red under `has-error`. |\n| `size` | string | `md` |  | Input size |\n| `startSlot` | string | `undefined` |  | Input start slot, it accepts icon class name from hugeIcons or Sallaicons |\n| `toolbar` | array |  |  |  |\n| `type` | string | `input` |  | Input type, can be input, textarea or richText |\n| `value` | string | `{\"en\": \"Hello\", \"ar\": \"مرحبا\"}` |  | JSON string mapping languages to their respective values |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `languageChanged` | Emitted when the language is changed. |\n| `valueChanged` | Emitted when the field value changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--default), [Text Area Field](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--text-area-field), [Editor Field](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--editor-field), [Ai Suggestion](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--ai-suggestion), [Ai Suggestion Rich Text](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--ai-suggestion-rich-text), [Multiple Languages](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--multiple-languages), [Large Size](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--large-size), [Min Length](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--min-length), [Max Length](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--max-length), [With Character Counter Textarea](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--with-character-counter-textarea), [With Character Counter Only](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--with-character-counter-only), [With Character Counter Rich Text](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--with-character-counter-rich-text), [Description](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--description), [Border Less](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--border-less), [End Slot](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--end-slot), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--has-error), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--disabled), [Custom Toolbar](https://dashboard-ui-components.pages.dev/?path=/story/components-lingualfield--custom-toolbar)\n\n**Rendered markup (default story)**\n\n```html\n<s-lingual-field name=\"undefined\" value=\"{&quot;en&quot;: &quot;Hello&quot;, &quot;ar&quot;: &quot;مرحبا&quot;}\" type=\"input\" placeholder=\"Enter your text here...\" size=\"md\" language=\"ar\" start-slot=\"hgi-stroke hgi-language-square\" languages=\"{&quot;feature&quot;:true,&quot;supported&quot;:[],&quot;current&quot;:{&quot;id&quot;:0,&quot;label&quot;:&quot;English&quot;,&quot;value&quot;:&quot;en&quot;}}\" dir=\"rtl\" class=\"s-lingual-field s-lingual-field--input rtl w-full relative flex items-start justify-start gap-4 hydrated\">\n  <!---->\n  <s-input class=\"flex-1 md rtl multilingual ltr hydrated\" dir=\"rtl\" value=\"مرحبا\">\n    <s-icon slot=\"start\" class=\"hydrated\">\n    <\/s-icon>\n    <div slot=\"end\" class=\"s-lingual-field__actions-end s-lingual-field__actions-end--hidden\" data-lingual-field-internal-slot=\"\">\n      <div class=\"s-lingual-field__actions-end__reserve s-lingual-field__actions-end--hidden\" aria-hidden=\"true\">\n      <\/div>\n    <\/div>\n  <\/s-input>\n  <s-dropdown dir=\"ltr\" class=\"h-fit end ltr hydrated\" overlay-alignment=\"start\">\n    <s-button data-toggle=\"true\" slot=\"dropdown-head\" c\n<!-- … truncated … -->\n```\n\n\n---\n_Generated from `catalog/components.json` (id `translation-toggle`). Edit the catalog, not this file._\n", "03-components/atoms/README": "# Atoms\n\nAtoms are the smallest usable UI units: a button, an icon, a checkbox. They do one thing, take tokens directly and never know about product data.\n\n| Component | Material category | Structure | Status |\n|---|---|---|---|\n| [Button](button.md) | Actions | 1 | existing |\n| [IconButton](icon-button.md) | Actions | 3 | existing |\n| [Link](link.md) | Actions | 3 | existing |\n| [Icon](icon.md) | Communication | 2 | existing |\n| [Checkbox](checkbox.md) | Selection | 3 | existing |\n| [Radio](radio.md) | Selection | 3 | existing |\n| [Switch](toggle.md) | Selection | 3 | existing |\n| [LoadingIndicator](loading-indicator.md) | Communication | 1 | existing |\n| [StatusIndicator](status-indicator.md) | Communication | 1 | existing |\n| [Avatar](avatar.md) | Data display | 1 | existing |\n| [Chip](chip.md) | Selection | 1 | existing |\n| [Flag](flag.md) | Data display | 2 | existing |\n| [SocialIcon](social-icon.md) | Data display | 2 | existing |\n| [Illustration](illustration.md) | Communication | 2 | existing |\n| [FieldLabel](label.md) | Text inputs | 1 | existing |\n| [HelperText](helper-text.md) | Text inputs | 1 | existing |\n| [PasswordHint](password-hint.md) | Communication | 1 | existing |\n| [StepperButton](stepper-button.md) | Actions | 1 | existing |\n| [TranslationToggle](translation-toggle.md) | Text inputs | 1 | existing |\n| [ProgressCircle](progress-circle.md) | Communication | 1 | existing |\n| [StepIndicator](step-indicator.md) | Navigation | 1 | existing |\n| [Divider](divider.md) | Containment | 1 | proposed |\n| [Text](text.md) | Communication | 1 | proposed |\n| [ProgressBar](progress-bar.md) | Communication | 1 | existing |\n| [Skeleton](skeleton.md) | Communication | 2 | existing |\n", "03-components/atoms/avatar": "# Avatar\n\n> Image, text initials, icon or fallback in six sizes, circular or rectangular.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Data display | 1 - Configurable | existing | figma, storybook | `<s-avatar>` |\n\n## Anatomy\n\n- container\n- image | initials | icon\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `variant` | `image`, `text`, `icon`, `avatar-fallback`, `image-fallback` |\n| `size` | `xs`, `sm`, `md`, `lg`, `xl`, `2xl` |\n| `shape` | `circular`, `rectangular` |\n\n## Tokens\n\n- sys.shape.full | sys.shape.small\n- sys.color.primary-container\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Notes and migration\n\nPlaceholder image sets (_AvatarplaholderImages, _BanksPlaceholderImages) are assets, not components; move them to assets/.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Avatar` | Avatar | 60 | Variant: avatar, avatar-fallback, icon, image-fallback, text; Size: 2xl, lg, md, sm, xl, xs; radius: circular, rectangular |\n| `_AvatarplaholderImages` | Avatar | 10 | Image: 1, 2, 3, 4, 5, 6, 7, 8, 9, arabic-male |\n| `_BanksPlaceholderImages` | Avatar | 1 | Image: Alarjhi |\n\n## Source in the Twilight Storybook today\n\n### `<s-avatar>`\n\n[components-avatar](https://dashboard-ui-components.pages.dev/?path=/docs/components-avatar) · 16 stories · An avatar is a graphical representation of a user, typically a photo or icon, used to represent a person or entity in a user interface.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `desc` | string |  |  | Description displayed below avatar label |\n| `icon` | text |  |  | If you want to show an icon instead of an image, we are using huge icons, so you can use icons classes here like `hgi-stroke hgi-user-multiple-02 |\n| `iconSize` | text | `md` |  | Custom icon size |\n| `imageFit` | select | `cover` | `cover`, `contain`, `fit` | Image fit type, cover, contain, fit |\n| `initials` | boolean | `false` |  | If you want to show initials instead of an image, you can use this property |\n| `initialsLabel` | text | `undefined` |  | Custom text to extract initials from when initials=true. If not provided, will use the label prop. Supports 1-2 characters for direct display or longer text for auto-extraction. |\n| `isActive` | boolean | `false` |  | adds an active indicator to the avatar image to show that the user is active |\n| `label` | string |  |  | Label displayed next to avatar image |\n| `layout` | string | `circular` | `circular`, `rounded` | Layout variant, you can use either circular, rounded |\n| `loading` | boolean | `false` |  | Shows loading state for the avatar |\n| `outlined` | boolean | `false` |  | You can also add outline to the avatar image |\n| `responsive` | boolean | `false` |  | If set to true, label and description will be hidden on mobile only avatar image will be visible |\n| `shadow` | boolean | `false` |  | You can add shadow to the avatar image |\n| `size` | string | `md` | `xs`, `sm`, `md`, `lg` | Avatar size |\n| `status` | select | `undefined` | `None`, `info`, `success`, `warning`, `danger` | Predefined status badge shown on the avatar thumbnail. Adds a colored icon badge and a matching border to the thumb. |\n| `url` | string |  |  | Image URL |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--default), [Circular](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--circular), [Rounded](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--rounded), [Initials](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--initials), [Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--icons), [Icon Size Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--icon-size-variants), [Shadow And Outline](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--shadow-and-outline), [Image Cover Fit](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--image-cover-fit), [Image Contain Fit](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--image-contain-fit), [Size Variations](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--size-variations), [Loading State](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--loading-state), [Active State](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--active-state), [Responsive](https://dashboard-ui-components.pages.dev/?path=/story/components-avatar--responsive), [Without Thumbnail](https://dashboard-ui-components.pages.dev/? olean | `false` |  | IF the checkbox is partially selected |\n| `items` | text | `[]` |  | Multiple Checkbox value |\n| `label` | string |  |  | Checkbox label |\n| `loading` | boolean | `false` |  | Replaces every option with a skeleton placeholder so the row height is preserved during data fetches. Per-option loading is supported via `loading: true` on an individual item. |\n| `readonly` | boolean | `false` |  | Freezes the value without the disabled styling — the box keeps its normal contrast and the input never receives the `disabled` attribute. |\n| `required` | boolean | `false` |  | If the checkbox is required |\n| `value` | text |  |  | Single Checkbox value |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `valueChanged` | Emitted when the checkbox value changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--default), [Checked](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--checked), [Indeterminate](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--indeterminate), [Group Options](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--group-options), [Row Direction](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--row-direction), [Exclusive Option](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--exclusive-option), [Required](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--required), [Feature Based](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--feature-based), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--disabled), [Readonly](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--readonly), [Disabled Item](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--disabled-item), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--loading), [Loading Item](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--loading-item), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-checkbox--has-error)\n\n**Rendered markup (default story)**\n\n```html\n<s-checkbox label=\"Accept terms and conditions\" desc=\"I agree to the terms and conditions\" direction=\"col\" feature=\"true\" @valuechanged=\"ev=&gt;console.log(\" value=\"\" changed:\",ev.detail)\"=\"\" class=\"s-checkbox ltr hydrated\">\n<\/s-checkbox>\n```\n\n\n---\n_Generated from `catalog/components.json` (id `checkbox`). Edit the catalog, not this file._\n", "03-components/atoms/flag": "# Flag\n\n> Country flag glyphs, one per ISO 3166 code (265 in Figma).\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Data display | 2 - Standalone | existing | figma | _not in Storybook_ |\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `code` | ISO 3166-1 alpha-2 |\n| `size` | `sm`, `md` |\n\n## Tokens\n\n- ref.size.icon.*\n\n## How to build it\n\nBuild as **separate, explicitly named components**. Share styling through tokens and small internal layout helpers, not through a shared prop bag.\n\n## Notes and migration\n\nShip as a sprite or lazy-loaded SVGs; do not bundle 265 inline SVGs in the base package.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Flag` | (top level) | - | - |\n\n## Source in the Twilight Storybook today\n\n_Not in the Twilight Storybook (dashboard-ui-components.pages.dev)._\n\n---\n_Generated from `catalog/components.json` (id `flag`). Edit the catalog, not this file._\n", "03-components/atoms/loading-indicator": "# LoadingIndicator\n\n> Spinner, dots or line progress in nine sizes from 8px to 88px.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---| \n> The single action trigger. Seven colour variants x four appearances x three sizes x five states, plus a circular layout for icon-only use.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Actions | 1 - Configurable | existing | figma, storybook | `<s-button>` |\n\n## Anatomy\n\n- container\n- icon-start (slot)\n- label\n- icon-end (slot)\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `variant` | `primary`, `secondary`, `danger`, `success`, `warning`, `info`, `feature` |\n| `appearance` | `filled`, `outlined`, `link`, `link-auxiliary` |\n| `size` | `sm (32px)`, `md (40px)`, `lg (48px)` |\n| `layout` | `default`, `circular` |\n| `iconStart` | slot |\n| `iconEnd` | slot |\n| `loading` | boolean |\n| `disabled` | boolean |\n\n## States\n\n- default\n- hover\n- pressed\n- loading\n- disabled\n- focus-visible\n\n## Tokens\n\n- comp.button.*\n- sys.color.primary-container (primary filled fill #a4ffe5)\n- sys.color.text.brand (primary label #004956)\n- sys.color.status.*.primary (danger #f55157, success #00af6c, warning #ffaf44, info #5196f3)\n- sys.color.feature.* (gradient orange 200->300, label orange 800)\n- sys.shape.small (8px)\n- sys.typography.label-md\n\n## RTL and localisation\n\niconStart/iconEnd are logical (inline-start / inline-end) and swap automatically under dir=rtl; do not mirror non-directional glyphs.\n\n## How to build it\n\nBuild as **one component** whose variations are props. Keep the prop list flat and enumerable; if it grows past ~8 props or needs mutually exclusive combinations, split (type 2) or introduce a base (type 3).\n\n## Notes and migration\n\nFigma variant values carry a leading `--` (--primary); drop it in code. The 'link' appearance is a Button in Figma but reads as a Link to users; expose it as `Link` (see link.md) built on the same base. `feature` is a non-semantic upsell accent and must stay out of the semantic status palette. Twilight themes add white, transparent and mahally; `outlined`, `wide`, `shadow`, `textAlignment`, `href` are props.\n\n## Source in Figma today\n\n- Figma node: `14526:107536`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Button` | (top level) | - | - |\n\n## Source in the Twilight Storybook today\n\n### `<s-button>`\n\n[components-button](https://dashboard-ui-components.pages.dev/?path=/docs/components-button) · 15 stories · A button is a clickable element that triggers an action when clicked.\n\nRelated elements: `<s-icon>`\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `active` | boolean | `false` |  | Set to true to get an active button state |\n| `autoHeight` | boolean | `false` |  | If the button should have auto height instead of pre-defined height, better used with transparent theme if needed |\n| `disabled` | boolean | `false` |  | Disable the button |\n| `feature` | boolean | `false` |  | Feature based button |\n| `href` | text | `null` |  | if applied, the button will behave as a link and will have a href attribute |\n| `label` | string | `null` |  | you can dynamically set the label of the button if needed |\n| `layout` | select | `default` | `default`, `circular` | Button layout variant, you can default or circular, for circular button, best to use style prop to set the width and height sizes to get a perfect circle |\n| `loading` | boolean | `false` |  | Loading state |\n| `noPadding` | boolean | `false` |  | Remove button padding |\n| `outlined` | boolean | `false` |  | Set to true to get an outlined button |\n| `shadow` | boolean | `false` |  | Add shadow to the button |\n| `size` | select | `md` | `sm`, `md`, `lg` | Button size |\n| `style` | string |  |  |  |\n| `target` | select | `_self` | `_blank`, `_self`, `_parent`, `_top` | target attribute for the button if it is a link |\n| `textAlignment` | select | `center` | `start`, `center`, `end` | Text alignment within the button |\n| `theme` | select | `default` | `default`, `primary`, `secondary`, `danger`, `warning`, `info`, `white`, `transparent`, `feature`, `mahally` | Button theme |\n| `type` | select | `button` | `button`, `submit`, `reset` | Button type, you can use button, submit or reset (optional) |\n| `wide` | boolean | `false` |  | Make button fill container width |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-button--default), [Theme Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-button--theme-variants), [Size Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-button--size-variants), [Outlined Variants](https://dashboard-ui-components.pages.dev/?path=/story/components-button--outlined-variants), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-button--loading), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-button--disabled), [Active](https://dashboard-ui-components.pages.dev/?path=/story/components-button--active), [Wide](https://dashboard-ui-components.pages.dev/?path=/story/components-button--wide), [Text Start](https://dashboard-ui-components.pages.dev/?path=/story/components-button--text-start), [Text End](https://dashboard-ui-components.pages.dev/?path=/story/components-button--text-end), [Has Icons](https://dashboard-ui-components.pages.dev/?path=/story/components-button--has-icons), [Circular](https://dashboard-ui-components.pages.dev/?path=/story/components-button--circular), [Link](https://dashboard-ui-components.pages.dev/?path=/story/components-button--link), [Auto Height](https://dashboard-ui-components.pages.dev/?path=/story/components-button--auto-height), [Feature](https://dashboard-ui-components.pages.dev/?path=/story/components-button--feature)\n\n**Rendered markup (default story)**\n\n```html\n<s-button default=\"\" class=\"s-btn s-btn--default default md ltr hydrated\" theme=\"default\" target= talog, not this file._\n", "03-components/atoms/radio": "# Radio\n\n> Bare single-choice control in two sizes. RadioField, RadioImage and RadioColor build on it.\n\n| Atomic level | Material category | Structure type | Status | Sources | Twilight |\n|---|---|---|---|---|---|\n| atom | Selection | 3 - Base + Global | existing | figma, storybook | `<s-radio>` |\n\n## Anatomy\n\n- ring\n- dot\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `checked` | boolean |\n| `size` | `sm`, `md` |\n| `disabled` | boolean |\n\n## States\n\n- default\n- focus\n- disabled\n\n## Tokens\n\n- sys.color.primary\n- sys.shape.full\n- sys.color.outline\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\n## Source in Figma today\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `radio` | radio Buttton | 12 | Active: Off, On; Status: Default, Disabled, Focus; size: md, sm |\n\n## Source in the Twilight Storybook today\n\n### `<s-radio>`\n\n[components-radio](https://dashboard-ui-components.pages.dev/?path=/docs/components-radio) · 15 stories · A radio button is a form element that allows users to select one option from a list of mutually exclusive choices. It is commonly used in forms where only one selection is allowed.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `autoHeight` | boolean | `false` |  | If the text radio should fill the available height. Applies when layout is \"text\". |\n| `checked` | boolean | `false` |  | Radio checked state |\n| `desc` | string |  |  | Radio description |\n| `direction` | string | `col` |  | Radio direction, you can choose between col (vertical) or row (horizontal) |\n| `disabled` | boolean | `false` |  | Boolean indicating whether the radio is disabled |\n| `feature` | boolean | `true` |  | Fea isting | figma, storybook | `<s-toggle>` |\n\n## Anatomy\n\n- track\n- thumb\n- loading spinner (in thumb)\n\n## Props\n\n| Prop | Values / type |\n|---|---|\n| `checked` | boolean |\n| `size` | `sm (16px)`, `default (24px, track 39px)` |\n| `loading` | boolean |\n| `disabled` | boolean |\n\n## States\n\n- off\n- on\n- loading\n- disabled\n- focus-visible\n\n## Tokens\n\n- comp.toggle.*\n- sys.color.primary\n- sys.shape.full\n\n## RTL and localisation\n\nThumb travels inline-start -> inline-end; on/off direction mirrors in RTL.\n\n## How to build it\n\nBuild a **private base component** that owns logic, states and accessibility, then export **pre-configured global components** that set the base's props. Consumers never import the base.\n\n## Notes and migration\n\nFigma exports the whole toggle as one SVG per variant; rebuild it from primitives so the track and thumb take tokens. Keep the name Toggle in Storybook for continuity, alias Switch in docs.\n\n## Source in Figma today\n\n- Figma node: `12411:21835`\n\n| Figma frame | Section today | Variants | Variant properties (cleaned) |\n|---|---|---|---|\n| `Toggle` | Toggle | 20 | Language: Arabic, English; selected: false, true; disabled: false, true; loading: false, true; size: default-24px, sm-16px |\n\n## Source in the Twilight Storybook today\n\n### `<s-toggle>`\n\n[components-toggle](https://dashboard-ui-components.pages.dev/?path=/docs/components-toggle) · 11 stories · Toggle component is used to switch between two states, typically on/off or enabled/disabled. It provides a clear visual indication of the current state and allows users to toggle between states with a single interaction.\n\n**Props**\n\n| Prop | Type | Default | Options | Description |\n|---|---|---|---|---|\n| `checked` | boolean | `false` |  | Checked state |\n| `desc` | string |  |  | Toggle description |\n| `disabled` | boolean | `false` |  | Disabled state |\n| `feature` | text | `true (omitted in HTML when unset)` |  | Feature guard: `true` (default), `false` to show gated UI + tag, a flag key string, or JSON for structured state (same as the `feature` attribute on the component). |\n| `hasError` | boolean | `false` |  | Error state |\n| `ischecked` | boolean | `false` |  | Checked state (deprecated, and will be removed soon) |\n| `label` | string | `Toggle option` |  | Toggle label |\n| `layout` | string | `start` |  | Layout position, start or end |\n| `loading` | boolean | `false` |  | Loading state |\n| `required` | boolean | `false` |  | Required state |\n| `size` | string |  |  |  |\n| `wide` | boolean | `true` |  | Full width |\n\n**Events**\n\n| Event | Description |\n|---|---|\n| `valueChanged` | Emitted when the value of the toggle switch changes. |\n\n**Stories**\n\n[Default](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--default), [Checked](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--checked), [Layout End](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--layout-end), [Required](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--required), [Has Description](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--has-description), [Loading](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--loading), [Is Checked Property](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--is-checked-property), [Disabled](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--disabled), [Disabled Checked](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--disabled-checked), [Has Error](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--has-error), [Feature Gated](https://dashboard-ui-components.pages.dev/?path=/story/components-toggle--feature-gated)\n\n**Rendered markup (default story)**\n\n```html\n<s-toggle label=\"Toggle option\" desc=\"This is a description for the toggle\"
