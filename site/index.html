t were not observed (type sizes above 2xl, radius sm/lg/2xl/4xl/5xl, space 6xl–8xl, shadows sm/xl, motion) are marked `not observed` / `not in Figma` and follow the same scale the observed values sit on.\n\n## Figma mapping\n\n| Figma collection | Token tier | Notes |\n|---|---|---|\n| `01-*` (primitives, not inspected) | `ref.palette`, `ref.space`, `ref.radius` | assumed to hold the raw scales |\n| `02-*` (typography, not inspected) | `ref.font.*` | |\n| `03-Colors` (`text / background / border / foreground` × role) | `sys.color.*` | one-to-one, see `docs/02-styles/color.md` |\n| `04-Token` (`Spacing/Sizes`, `Radius/Sizes`) | `sys.space.*`, `sys.shape.*` | must absorb the older `spacing/*` and `radius/*` variables |\n| Text styles `Bold|Medium|Regular / $text-*` | `sys.typography.*` | see `docs/02-styles/typography.md` |\n| (none) | `sys.elevation.*`, `ref.duration.*`, `ref.easing.*` | to be added as effect styles / variables |\n\n## Naming\n\nSee [naming-conventions.md](../00-overview/naming-conventions.md#tokens).\n", "01-foundations/interaction-states": "# Interaction states\n\nOne fixed vocabulary of states for every interactive component, following Material's *Interaction states*. Components document these and no others.\n\n## The list\n\n| State | Trigger | Visual rule | CSS / ARIA |\n|---|---|---|---|\n| **Enabled** | default | as designed | – |\n| **Hover** | pointer over | surface darkens ~4–8%; outlined and link variants gain a tinted background | `:hover` |\n| **Focus** | keyboard focus | 2px ring `sys.focus.ring-color` (#a4ffe5) offset 2px; never removed | `:focus-visible` |\n| **Pressed** | pointer down / Enter | surface darkens ~12%; no scale transforms | `:active` |\n| **Dragged** | drag in progress (UploadField, sortable rows) | elevation 3, 90% opacity | `[data-dragging]` |\n| **Disabled** | `disabled` | 38% opacity on content, no hover/pressed, `cursor: not-allowed` | `:disabled`, `aria-disabled` |\n| **Loading** | `loading` | content replaced or overlaid by `LoadingIndicator`, width preserved, pointer events off | `aria-busy` |\n| **Selected** | on/checked (Checkbox, Radio, Switch, Chip, Tab, ListItem, table row) | primary fill or primary outline | `aria-checked` / `aria-selected` |\n| **Activated** | current navigation target (NavigationItem, Tab, BreadcrumbItem) | primary text + indicator | `aria-current` |\n| **Error** | validation failed (fields) | outline and helper text `sys.color.status.danger.primary`; orthogonal to the states above | `aria-invalid` |\n| **Read-only** | `readOnly` (fields) | no outline change on focus, text selectable | `readonly` |\n\n## Fields specifically\n\nThe Figma library today designs eight field states: `default, hover, preActive, Active, filled, Active-Filled, read-only, disabled`. They map as follows:\n\n| Figma state | New state | Note |\n|---|---|---|\n| default | enabled (empty) | |\n| hover | hover | |\n| preActive | focus (empty) | \"pre-active\" is focus before typing |\n| Active | focus (typing) | same visual as focus |\n| filled | enabled (has value) | value presence is content, not a state |\n| Active-Filled | focus (has value) | |\n| read-only | read-only | |\n| disabled | disabled | |\n| `--error=True` | error flag | combinable with any of the above |\n\nNet: fields have **enabled, hover, focus, read-only, disabled** plus the **error** flag, and the value (empty / filled) is a content condition. This is what CSS can express and what a screen reader announces.\n\n## Priority when states overlap\n\n`disabled` > `loading` > `error` styling > `pressed` > `focus` > `hover` > `selected/activated` > `enabled`.\n\n## Motion\n\nState changes animate colour and elevation over `ref.duration.short` (100ms) with `ref.easing.standard`. Nothing animates size or position on hover. See `docs/02-styles/motion.md`.\n", "01-foundations/content-and-localization": "# Content and localisation\n\nThe dashboard is Arabic-first and fully bilingual. Every component is designed in both languages. This page is Material's *Content design* foundation plus the rules that make RTL automatic.\n\n## Direction\n\n- `dir=\"rtl\"` for Arabic, `dir=\"ltr\"` for English, set on `<html>` and inherited.\n- Components use **CSS logical properties** only: `margin-inline-start`, `padding-inline`, `inset-inline-end`, `border-inline-start`, `text-align: start`. No `left` / `right`.\n- Props use logical names: `iconStart` / `iconEnd`, `placement=\"start\" | \"end\"`, `position=\"start\" | \"end\"` (SwitchField). Figma's `Dir=Left/Right` migrates to `placement`.\n- Flex and grid flip automatically; nothing is re-ordered by hand.\n\nConsequence for Figma: `Language=Arabic|English` stops being a variant axis on every component and becomes a **variable mode** applied to the page. Only components with genuinely different Arabic and English layouts keep both frames (typography-heavy ones such as `AlertBanner`, `UpgradeCard`, `LearnMore`).\n\n## Mirroring\n\n| Mirror in RTL | Never mirror |\n|---|---|\n| arrows, chevrons, back / forward, undo / redo, indent, list bullets, progress direction, `Switch` thumb travel, `Stepper` order, `Breadcrumb` separators, `Pagination` prev / next | search magnifier, trash, settings gear, close ×, check ✓, sort carets (they point up / down), media playback, brand logos, clocks, phone, numbers and units |\n\n`Icon` exposes `mirrorInRtl`; the icon inventory should tag directional glyphs so the default is right.\n\n## Numbers, dates and currency\n\nFollows the live dashboard (s.salla.sa), which does **not** use Arabic-Indic digits:\n\n| Item | Rule | Example |\n|---|---|---|\n| Digits | Western Arabic (0-9) in both languages | 1,250 |\n| Currency | Saudi Riyal symbol glyph (the `Saudi-Riyal` icon in `AmountField`) after the number in Arabic, before in English; two decimals | 1,250.00 ر.س / SAR 1,250.00 |\n| Dates | numeric `DD/MM/YYYY` in Arabic UI, `MMM D, YYYY` in English; Hijri available via `DateTimePicker calendar=hijri` | 22/09/2026 |\n| Time | 12-hour with locale AM/PM markers | 3:45 م |\n| Phone | LTR isolate always (`<bdi>`), country code from `PhoneField` | +966 5X XXX XXXX |\n| OTP codes, SKUs, URLs, emails | LTR isolate | |\n\n## Voice and tone\n\n- Address the merchant directly and respectfully: Arabic second person, English \"you\". No slang.\n- Buttons are verbs: `حفظ` / `Save`, `إضافة منتج` / `Add product`. Never \"OK\" alone on a destructive action.\n- Titles are sentence case in English; Arabic has no case.\n- Error messages say what happened and what to do: \"لم يتم حفظ التغييرات. حاول مرة أخرى.\" / \"Changes were not saved. Try again.\"\n- Empty states (EmptyState) lead with the benefit, then the action.\n- Status labels are single nouns or past participles: `تم الشحن` / `Shipped`.\n\n## Typography per language\n\nOne family, PingAR+LT, covers both scripts, so type roles do not change per language. Arabic runs ~10% wider at equal size; components size to content (`hug`) so no fixed widths in molecules and atoms.\n\n## Bilingual fields\n\n`TextField bilingual` shows a `TranslationToggle` (EN / AR) at inline-end. The field's `dir` follows the *selected* language, not the page. Storybook name today: `LingualField`.\n", "01-foundations/accessibility": "# Accessibility\n\nBaseline: **WCAG 2.2 AA** for the merchant dashboard. Base components (structure type 3 and 5) own these behaviours so that global components inherit them.\n\n## Colour and contrast\n\nRatios computed with the WCAG 2.x relative-luminance formula from the verified token values.\n\n| Pairing | Ratio | Status |\n|---|---|---|\n| `sys.color.text.primary` #333 on `sys.color.surface` #fff | 12.6:1 | pass |\n| `sys.color.text.secondary` #666 on #fff | 5.7:1 | pass (AA text) |\n| `sys.color.text.brand` #004956 on `sys.color.primary-container` #a4ffe5 (primary Button) | 8.6:1 | pass |\n| `sys.color.text.inverse` #fff on `sys.color.primary` #004956 (TopAppBar) | 10.1:1 | pass |\n| `sys.color.text.inverse` #fff on `sys.color.status.danger.primary` #f55157 (danger Button) | 3.4:1 | **fails AA for 14px text** (needs 4.5:1) |\n| #fff on `sys.color.status.success.primary` #00af6c (success Button) | 2.9:1 | **fails** |\n| #fff on `sys.color.status.warning.primary` #ffaf44 (warning Button) | 1.8:1 | **fails** |\n| #fff on `sys.color.status.info.primary` #5196f3 (info Button, Alert action) | 3.0:1 | **fails** |\n| #fff on `sys.color.status.danger.dark` #ca4146 | 4.8:1 | pass, candidate fill for the danger Button |\n| #fff on `sys.color.status.success.dark` #008c56 | 4.3:1 | passes only for large text; success needs `darker` #005232 (9.3:1 on white) or a dark label |\n| `sys.color.text.primary` #333 on #ffaf44 | 6.9:1 | pass, candidate label colour for the warning Button |\n| `sys.color.status.info.darker` #204374 on `sys.color.status.info.lighter` #ecf3fe (Alert) | 8.9:1 | pass |\n| `sys.color.status.danger.darker` #7a1f1e on `sys.color.status.danger.lighter` #feecec (Status strong) | 9.0:1 | pass |\n| `sys.color.on-feature` #883000 on feature gradient #ffd8c2 → #ffaf83 | 6.4:1 → 4.7:1 | pass across the gradient |\n\nAction: all four filled status Buttons (`danger`, `success`, `warning`, `info`) with white labels fail AA at 14px. Options: use the `dark` shade as fill (danger passes at 4.8:1), use a dark label on warning (6.9:1), or reserve filled status buttons for 18px+ large text. Tracked as an open item in the audit.\n\nColour is never the only signal: `Status` pairs a dot colour with a label; `Alert` pairs colour with an icon; `Switch` pairs colour with thumb position.\n\n## Focus\n\n- Every interactive element shows `sys.focus.ring` on `:focus-visible`. It is never suppressed.\n- Focus order follows reading order, which follows `dir`.\n- `Dialog`, `BottomSheet`, `MoreMenu`, `DropdownList` trap focus while open and return it to the trigger on close (`useDialog`, `useMenu`).\n\n## Keyboard\n\n| Component | Keys |\n|---|---|\n| Button, Link, IconButton | Enter / Space |\n| Checkbox, Switch | Space |\n| Radio group | Arrow keys move selection |\n| Tabs | Arrow keys move focus, Enter / Space activate (roving tabindex) |\n| DropdownList / SelectField / MoreMenu | Arrow keys, Home / End, type-ahead, Enter select, Escape close |\n| DataTable | Tab to interactive cells, Space to select row, Shift+Space range |\n| Dialog / BottomSheet | Escape closes (unless blocking) |\n| Stepper | steps are links or buttons, no custom keys |\n\n## Semantics\n\n- Icon-only controls (`IconButton`, `ActionsCell` icons, close buttons) require `ariaLabel`. The catalog marks it required.\n- `FieldLabel` is a `<label for>`; `HelperText` is linked with `aria-describedby`; errors set `aria-invalid` and are announced.\n- `Status` uses text, not just colour; `LoadingIndicator` sets `aria-busy` on the region it covers.\n- `Alert` uses `role=\"status\"` for info/success and `role=\"alert\"` for warning/danger.\n- `Toast` is a `role=\"status\"` live region.\n\n## Target size\n\nInteractive targets are at least **24×24 CSS px** (WCAG 2.2 2.5.8) and, on compact screens, **40×40**. `Checkbox sm` (16px) and `Switch sm` (16px) get an invisible hit area to reach the minimum.\n\n## Motion\n\nRespect `prefers-reduced-motion`: durations drop to 0 and loaders use a static state.\n\n## Language\n\n`lang` and `dir` are set on the root and on any field whose language differs from the page (bilingual `TextField`), so screen readers switch voice correctly.\n", "01-foundations/layout": "# Layout and adaptive design\n\nHow screens are structured and how they adapt. Material's *Adaptive design* and *Layout* foundations applied to the merchant dashboard, which is desktop-first with a full mobile experience.\n\n## Grid\n\n- Base unit **4px** (`ref.space.*`). All spacing, sizes and radii are multiples of 4, with 2px allowed only for hairline gaps (`sys.space.3xs`).\n- Page gutter: `sys.space.md` (16px) on phones, `sys.space.xl` (24px) from tablet up.\n- Content max width: 1536px (the Figma desktop frames are 1536 wide inside a 1576 artboard), centred.\n\n## Breakpoints (window size classes)\n\nMaterial 3 window size classes, with Salla's Tailwind names:\n\n| Class | Width | Tailwind | Layout behaviour |\n|---|---|---|---|\n| Compact | < 600 | `sm` and below | Single column. `TopAppBar` mobile, `NavigationDrawer` modal, `DataTable` renders `MobileRow`, `ActionBar` floats bottom, `BottomSheet` replaces `Dialog` |\n| Medium | 600 – 839 | `md` | Single column with wider gutters. Drawer modal. Tables scroll horizontally |\n| Expanded | 840 – 1199 | `lg` | Drawer standard (persistent). `ListDetailPage` shows two panes |\n| Large / Extra-large | ≥ 1200 | `xl`, `2xl` | Full desktop; content capped at 1536 |\n\nComponents with genuinely different layouts per class declare a `device` prop in the catalog (`TopAppBar`, `PageTitle`, `DataTable`, `Breadcrumb`, `Stepper`, `Pagination`). Everything else adapts with CSS.\n\n## App shell\n\n```\n┌──────────────────────────────────────────────────────────┐\n│ TopAppBar (sys.color.primary, 64px)                      │\n│  logo · primary Tabs · GlobalSearch · icons · account    │\n├──────────────────────────────────────────────────────────┤\n│ SecondaryNavBar (secondary Tabs · help · CTA)            │\n├────────────┬─────────────────────────────────────────────┤\n│ Navigation │ PageTitle                                    │\n│ Drawer     │ ┌──────────────────────────────────────────┐ │\n│ (expanded+)│ │ Panel / DataTable / form sections        │ │\n│            │ └──────────────────────────────────────────┘ │\n│            │                              [floating help] │\n└────────────┴─────────────────────────────────────────────┘\n```\n\nTemplates (`ListPage`, `ListDetailPage`, `FormPage`, `WizardPage`) fix which organisms sit in the content region. See `docs/03-components/templates/`.\n\n## Panes\n\n- **List pane** min 320px, **detail pane** takes the rest (`ListDetailPage`).\n- Side sheets (`BulkEditSheet`, `EditSheet`) are 400 – 480px wide on expanded, full-width on compact.\n- Dropdown surfaces (`DropdownList`, `MoreMenu`) match the trigger width, min 240px, max 400px.\n\n## Density\n\nTwo densities exist in the library: **default** and **compact** (`QuantityField size=compact`, `AvatarStack size=compact`, `PanelHeader size=small`, `Button size=sm`). Compact is used inside `DataTable` cells and dense forms only.\n\n## Direction\n\nThe dashboard runs in Arabic (RTL) and English (LTR). Layout is written with CSS logical properties so it mirrors automatically. Details: [content-and-localization.md](content-and-localization.md).\n", "02-styles/typography": "# Typography\n\nOne family, three weights, a Tailwind-shaped size scale, expressed as Material type roles. Values observed in Figma on 2026-09-22 are marked ✓.\n\n## Family\n\n`ref.font.family.base` = **Ping AR + LT** ✓ (Figma `Typography/Family/Font`). One family for Arabic and Latin. Fallback stack: `\"Ping AR + LT\", \"PingAR+LT\", \"PingARLT\", \"PT Sans\", system-ui, sans-serif`.\n\nWeights ✓: Regular 400, Medium 500, Bold 700. No light or black.\n\n## Scale\n\n| Token | Size | Figma | Line-height token |\n|---|---|---|---|\n| `ref.font.size.xs` | 12px ✓ | `Typography/Size/xs`, `$text-xs` | `lineHeight.4` = 16px ✓ |\n| `ref.font.size.sm` | 14px ✓ | `Typography/Size/sm`, `$text-sm` | `lineHeight.5` = 20px ✓ |\n| `ref.font.size.md` | 16px ✓ | `Typography/Size/md`, `$text-base` | `lineHeight.6` = 24px ✓ |\n| `ref.font.size.lg` | 18px | `$text-lg` (not observed) | `lineHeight.7` = 28px ✓ |\n| `ref.font.size.xl` | 20px ✓ | `Typography/Size/xl`, `$text-xl` | `lineHeight.7` = 28px ✓ |\n| `ref.font.size.2xl` | 24px ✓ | `Typography/Size/2xl`, `$text-2xl` | `lineHeight.8` = 32px ✓ |\n| `ref.font.size.3xl … 9xl` | 30 … 128px | `$text-3xl … 9xl` (styles exist, values not observed) | |\n\nThe Figma line-height variables are named `typography/line-height (Descreptive)/4|5|6|7|8`, i.e. Tailwind's `leading-4 … leading-8`. Rename to `line-height/4 … 8` (typo fix) and keep the numeric names.\n\n## Type roles (Material)\n\n| Role | Token | Figma style | Size / line | Weight | Observed on |\n|---|---|---|---|---|---|\n| Display large | `sys.typography.display-lg` | `Bold/$text-5xl` | 48 / 1 | 700 | marketing surfaces only |\n| Headline large | `headline-lg` | `Bold/$text-2xl` | 24 / 32 ✓ | 700 | PageTitle desktop |\n| Headline medium | `headline-md` | `Bold/$text-xl` | 20 / 28 ✓ | 700 | LearnMore title, Dialog title |\n| Title large | `title-lg` | `Bold/$text-lg` | 18 / 28 | 700 | PanelHeader |\n| Title medium | `title-md` | `Bold/$text-base` | 16 / 24 ✓ | 700 | Alert title, PageTitle mobile, active Tab, active primary Tab |\n| Title small | `title-sm` | `Bold/$text-sm` | 14 / 20 ✓ | 700 | pagination numbers, table header |\n| Body large | `body-lg` | `Regular/$text-base` | 16 / 24 ✓ | 400 | NavigationItem |\n| Body medium | `body-md` | `Regular/$text-sm` | 14 / 20 ✓ | 400 | **default UI text**: field values, placeholders, MenuItem, Alert body, table cells, breadcrumb |\n| Body small | `body-sm` | `Regular/$text-xs` | 12 / 16 ✓ | 400 | HelperText, subtext, units, Table/Status, Tooltip |\n| Label large | `label-lg` | `Medium/$text-base` | 16 / 24 ✓ | 500 | Tab (inactive / hover), primary Tab, active NavigationItem |\n| Label medium | `label-md` | `Medium/$text-sm` | 14 / 20 ✓ | 500 | **Button md / lg label**, FieldLabel, CheckboxField title, UpgradeCard CTA |\n| Label small | `label-sm` | `Medium/$text-xs` | 12 / 16 ✓ | 500 | Button sm label, Status label |\n\nRules:\n\n- Components pick a **role**, never a size + weight pair.\n- Letter-spacing is 0 everywhere (Arabic does not track).\n- Arabic runs ~10% wider than English at equal size; never fix a text width below organism level.\n- Digits are Latin in both languages (see [content-and-localization.md](../01-foundations/content-and-localization.md)).\n- Two legacy styles without variables (`Regular/text-sm`, `Medium/text-sm`, line-height 100%) appear on a few frames (Learn More buttons, header name) and should be replaced with `$text-sm` styles.\n\n## Implementation\n\nCSS: `font: var(--sys-type-body-md);` (shorthand-ready values in `tokens/css/tokens.css`).\nTailwind: the preset ships a plugin that emits `.type-{role}` utilities (`type-body-md`, `type-label-md` …).\n", "02-styles/color": "# Color\n\nSalla's palette as Material colour roles. **Every value below was read from the Figma library on 2026-09-22** (`catalog/figma-tokens-harvest.json`); the Figma variable that produces each role is listed so the two stay diff-able.\n\n## Brand roles\n\n| Role | Token | Value | Figma variable(s) | Use |\n|---|---|---|---|---|\n| Primary | `sys.color.primary` | `#004956` | `background/primary/primary`, `border/primary` | TopAppBar fill, checked Checkbox / Radio / Switch, active-tab underline, checkbox ring |\n| On primary | `sys.color.on-primary` | `#ffffff` | `text/gray/white` | text and icons on the TopAppBar |\n| Primary disabled | `sys.color.primary-disabled` | `#95c8d0` | `text/primary/disabled` | disabled outlined-primary label |\n| Primary container | `sys.color.primary-container` | `#a4ffe5` | `background/secondary/seconadry` | **primary Button fill**, active primary Tab, Tooltip surface |\n| On primary container | `sys.color.on-primary-container` | `#004956` | `text/primary/primary` | primary Button label, Tooltip text |\n| Primary container hover | `sys.color.primary-container-hover` | `#dbfff6` | `border/seconadry-hover` | tag outline in the account chip |\n| Primary container subtle | `sys.color.primary-container-subtle` | `#e6fff9` | `background/secondary/lighter`, `border/seconadry-disabled` | active NavigationItem, video play button |\n| Text brand | `sys.color.text.brand` | `#004956` | `text/primary/link` | links, breadcrumb current item, PageTitle |\n\nNaming note: Figma calls the mint `secondary`, but it is only ever used as the *fill behind primary actions* (primary Button, active primary Tab, Tooltip). Material's name for that role is **primary container**. A true secondary accent is not defined.\n\n## Surfaces, outlines, text\n\n| Role | Token | Value | Figma variable(s) |\n|---|---|---|---|\n| Surface | `sys.color.surface` | `#ffffff` | `background/default/white`, `background/default/cards` |\n| Surface input | `sys.color.surface-input` | `#ffffff` | `background/default/input` |\n| Surface neutral | `sys.color.surface-neutral` | `#f4f4f4` | `background/default/neutrals` |\n| Surface disabled | `sys.color.surface-disabled` | `#eeeeee` | `background/default/disabled`, `background/default/neutrals-dark` |\n| Outline light | `sys.color.outline-light` | `#f4f4f4` | `border/light` (LearnMore card) |\n| Outline | `sys.color.outline` | `#eeeeee` | `border/default` |\n| Outline hover | `sys.color.outline-hover` | `#dddddd` | `border/hover` (field hover, tab hover underline) |\n| Outline strong | `sys.color.outline-strong` | `#737373` | `border/gray-lighter` (disabled-checked checkbox) |\n| Outline primary | `sys.color.outline-primary` | `#a4ffe5` | `border/seconadry` (outlined primary Button) |\n| Outline primary strong | `sys.color.outline-primary-strong` | `#004956` | `border/primary`, `border/primary-link` |\n| Text primary | `sys.color.text.primary` | `#333333` | `text/gray/dark` |\n| Text secondary | `sys.color.text.secondary` | `#666666` | `text/gray/light` (placeholder, helper text) |\n| Text tertiary | `sys.color.text.tertiary` | `#737373` | `text/gray/lighter` (inactive tab, breadcrumb ancestors, neutral status) |\n| Text disabled | `sys.color.text.disabled` | `#bbbbbb` | `text/gray/disabled` |\n| Text inverse | `sys.color.text.inverse` | `#ffffff` | `text/gray/white` |\n\n## Status colours\n\nFive statuses × five shades, all observed except where noted.\n\n| Status | lighter (fill) | light (border) | primary | dark (dot) | darker (text) |\n|---|---|---|---|---|---|\n| Success | `#effbf6` | `#97e7c8` | `#00af6c` | `#008c56` | `#005232` |\n| Danger | `#feecec` | `#fbb9bc` | `#f55157` | `#ca4146` | `#7a1f1e` |\n| Warning | `#fff9eb` | `#ffe7c7` | `#ffaf44` | `#d18f36` | `#8f5f22` |\n| Info | `#ecf3fe` | `#cbe0fb` | `#5196f3` | `#417ac8` | `#204374` |\n| Neutral | `#eeeeee` | `#dddddd` | `#bbbbbb` | `#bbbbbb` | `#737373` |\n\nFigma variables per shade: `{status}/{status}-lighter`, `border/status/{status}-light`, `background/status/{status}/primary` (also `{status}/{status}`), `{status}/{status}-dark`, `{status}/{status}-darker` (also `text/status/{status}/darker`). Neutral uses `background/default/neutrals-dark`, `border/hover`, `background/default/neutrals-darkest`, `text/gray/lighter`.\n\nHow components use the shades:\n\n| Component | fill | border / accent | dot | text |\n|---|---|---|---|---|\n| `Button` filled status | `primary` | `primary` (2px) | – | `text.inverse` |\n| `Alert` | `lighter` | `light` (3px inline-start) | – | `darker` |\n| `Status` subtle | – | – | `dark` | `darker` |\n| `Status` strong | `lighter` | – | `dark` | `darker` |\n| `Table/Status` | `lighter` | `light` (1px) | `dark` | `darker` |\n| `TextField` focus underline | – | `info.primary` (2px) | – | – |\n| `TextField` error | – | `danger.primary` | – | `danger.primary` |\n| `MenuItem` danger | – | – | – | `danger.primary` |\n\n## Accent roles (non-semantic)\n\n| Role | Token | Values | Figma | Use |\n|---|---|---|---|---|\n| Feature | `sys.color.feature.*` | gradient `#ffd8c2 → #ffaf83`, text `#883000` | `color/support-non-semantic/orange/200|300`, `background/supporting-colors/orange/darker` | `Button variant=feature`, `ListItem feature` |\n| Upgrade | `sys.color.upgrade.*` | lighter `#fffbea`, primary `#ffe895`, dark `#d1b44c`, darker `#554300` | `background/supporting-colors/gold/*`, `border/upgrade/dark`, `text/upgrade/darker` | `UpgradeCard`, crown CTA |\n\n## Reference palette\n\n`ref.palette.{teal, gray, green, red, amber, blue, orange, gold}.{step}` in `tokens/tokens.json`. Steps are named by lightness (50 lightest → 900 darkest); every step listed was observed in Figma.\n\n## Contrast\n\nSee [accessibility.md](../01-foundations/accessibility.md#colour-and-contrast). Filled `success`, `warning`, `danger` and `info` Buttons with white labels do not reach AA at 14px; the `dark` shades do (danger 4.8:1) or nearly do (success 4.3:1).\n\n## Dark theme\n\nNot shipped. `tokens/css/tokens.css` includes a `[data-theme=\"dark\"]` block with placeholder values that proves the `sys` tier is theme-able. Legacy variables from the `07--light-theme/*` collection (`color-white-drop-menu`, `color-gray-200`) still appear on a few frames and should be re-pointed to the roles above.\n", "02-styles/spacing": "# Spacing\n\nThe scale is the Figma **`Spacing/Sizes`** collection (`04-Token`), adopted verbatim. Values were read from Figma on 2026-09-22; the older `spacing/*` variables that some frames still use are mapped below.\n\n## The scale\n\n| Token | Value | Figma `Spacing/Sizes` | Older `spacing/*` alias | Observed use |\n|---|---|---|---|---|\n| `ref.space.none` | 0 | `none` ✓ | – | |\n| `ref.space.3xs` | 2px | `3xs` ✓ | `spacing/6xs` ✓ | Checkbox inner padding, TranslationToggle gap, Alert icon offset |\n| `ref.space.2xs` | 4px | `2xs` ✓ | `spacing/5xs` ✓ | Button icon–label gap, Status dot–label gap, Alert title–body gap, Button sm vertical padding |\n| `ref.space.xs` | 6px | `xs` ✓ | `spacing/4xs` ✓ | Table/Status vertical padding, Loader padding |\n| `ref.space.sm` | 8px | `sm` ✓ | `spacing/3xs` ✓ | Button / field vertical padding, field gap, Status horizontal padding, Tab vertical padding, Alert gap |\n| `ref.space.md` | 10px | `md` ✓ | `spacing/2xs` ✓ | UpgradeCard CTA vertical padding, page-size select, primary Tabs gap |\n| `ref.space.lg` | 12px | `lg` ✓ | `spacing/xs` ✓ | Button / field horizontal padding, MenuItem padding, label–field gap, Tooltip padding |\n| `ref.space.xl` | 14px | `xl` ✓ | – | mobile gutters (PageTitle, Table/Footer) |\n| `ref.space.2xl` | 16px | `2xl` ✓ | `spacing/base` ✓ | card padding, TopAppBar vertical padding, Alert vertical padding, NavigationItem padding, primary Tab horizontal padding |\n| `ref.space.3xl` | 20px | `3xl` ✓ | – | TopAppBar gap |\n| `ref.space.4xl` | 24px | `4xl` ✓ | `spacing/2xl` ✓ | Alert horizontal padding, Pagination gap, SecondaryNavBar gap |\n| `ref.space.5xl` | 26px | `5xl` ✓ | – | Table/Footer desktop horizontal padding (off-grid, see below) |\n| `ref.space.6xl` | 32px | `6xl` | – | not observed |\n| `ref.space.7xl` | 40px | `7xl` | – | not observed |\n| `ref.space.8xl` | 48px | `8xl` | – | not observed |\n| `ref.space.9xl` | 56px | `9xl` ✓ | `spacing/7xl` ✓ | **desktop page gutter** (TopAppBar, SecondaryNavBar, PageTitle, Breadcrumb) |\n\n## Semantic aliases\n\nComponents use role names so intent reads in the CSS:\n\n| Alias | → | Use |\n|---|---|---|\n| `sys.space.hairline` | `3xs` 2px | inner padding of tiny controls |\n| `sys.space.tight` | `2xs` 4px | icon ↔ label |\n| `sys.space.compact` | `sm` 8px | control vertical padding, sibling gaps in a row |\n| `sys.space.default` | `lg` 12px | control horizontal padding, list item padding |\n| `sys.space.comfortable` | `2xl` 16px | card / bar padding |\n| `sys.space.loose` | `3xl` 20px | bar item gap |\n| `sys.space.section` | `4xl` 24px | between sections, alert side padding |\n| `sys.space.gutter` | `9xl` 56px | page side gutter (desktop) |\n\n## The two-scale problem, resolved\n\nFigma still carries two variable sets with **the same names for different values**:\n\n| Name | `spacing/*` (older) | `Spacing/Sizes/*` (04-Token) |\n|---|---|---|\n| `3xs` | 8px | 2px |\n| `2xs` | 10px | 4px |\n| `xs` | 12px | 6px |\n| `2xl` | 24px | 16px |\n\n`Button`, `Alertbox`, `Page Title` and `Header` use the older set; `_TextInput`, `checkBox`, `Status`, `Side menu`, `More Menu`, `Table/*` use `Spacing/Sizes`. The value is always the same physical pixel; only the name differs. **Decision: `Spacing/Sizes` is the scale**, because it is the newer collection, it is complete (`none … 9xl`), and most component frames already use it. Re-point the older `spacing/*` variables per the alias column above, then delete them.\n\nTwo values are off the 4px grid and worth a design decision: `xl` = 14px (used as the mobile gutter) and `5xl` = 26px (Table/Footer). Recommend 16px and 24px.\n\n## Rules\n\n- Padding inside atoms and molecules comes from `comp.*` tokens that alias `ref.space.*`.\n- Gaps between siblings use the semantic aliases.\n- No values outside the scale; legacy hard-coded `gap-[5px]`, `p-[10px]` seen on a few frames are migration targets.\n", "02-styles/shape": "# Shape\n\nCorner radii as a Material shape scale. Salla's default corner is **8px**; the system is rounded but not pill-shaped except for status chips, avatars, switches and tags.\n\n## Scale\n\n| Shape role | Token | Value | Figma variable | Observed on |\n|---|---|---|---|---|\n| None | `sys.shape.none` | 0 | `Radius/Sizes/None` | table cells, full-bleed banners |\n| Extra small | `sys.shape.extra-small` | 4px ✓ | `radius/md` | Checkbox, secondary Tab, primary Tab, Tooltip, product image in MenuItem |\n| Small | `sys.shape.small` | 8px ✓ | `radius/xl`, `Radius/Sizes/xl` | **Button, fields, Alert, UpgradeCard, NavigationDrawer, MoreMenu, page-size select, video thumbnail** |\n| Medium | `sys.shape.medium` | 12px | `Radius/Sizes/2xl` (value not observed) | side sheets |\n| Large | `sys.shape.large` | 16px ✓ | `Radius/Sizes/3xl` | LearnMore card, Dialog, BottomSheet top corners |\n| Full | `sys.shape.full` | 9999px ✓ | `radius/full`, `Radius/Sizes/Full` | Status, Avatar, Switch, header tag, crown badge |\n\n## Reference scale\n\n`ref.radius.{none 0, sm 2, md 4, lg 6, xl 8, 2xl 12, 3xl 16, 4xl 24, 5xl 32, full}` mirrors Figma `Radius/Sizes/{None, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, Full}`. `md`, `xl`, `3xl` and `full` were verified; the rest follow the scale.\n\n## Issues found in Figma\n\n- The old variable **`radius/sm` resolves to 8px** (seen on the header avatar chip and the page-size select) while `radius/xl` is also 8px. `radius/sm` must be re-pointed to 2px or the instances moved to `radius/xl`.\n- `Status` hard-codes `30px` and `Radius/Sizes/full` sometimes resolves to `8888px` / `8749px` instead of `9999px` (scaled instances). All map to `sys.shape.full`.\n- Header tag uses `radius/xl` overridden to `140px`; map to `sys.shape.full`.\n\n## Rules\n\n- Nested surfaces step down one role (LearnMore large → Button small → Chip extra-small).\n- In RTL, start/end corner radii mirror automatically when written with logical properties (`border-start-start-radius`).\n- Cut corners and asymmetric shapes are not used, except the MoreMenu sub-menu which squares the corner touching its parent.\n", "02-styles/illustrations": "# Illustrations\n\nSpot illustrations for empty states, onboarding and success moments. Source frames: `Illustration` (variant web / mobile) and `Illustrations Collection` (20 named pieces) in the Merchant DS.\n\n## Inventory (from Figma)\n\n`search field not found` · `product custom fields` · `product options` · `add brands` · `export template` · `no values` · `add template` · `add category` · `classifications` · `no codes` · `add products` · `product measurements` · `add to cart` · `info settings` · `order filters empty` · (5 more in the collection frame)\n\n## Usage\n\n- Illustrations appear only inside `EmptyState` (organism) and onboarding `WizardPage` steps. Never as decoration in forms or tables.\n- One illustration per screen state.\n- Two sizes: `web` (~200px) and `mobile` (~140px), chosen by window size class.\n- Illustrations use the brand palette (`ref.palette.teal.*`, `gray.*`) plus at most one status accent; they must read in both LTR and RTL without mirroring (avoid text and directional arrows inside artwork).\n\n## Component\n\n```\n<Illustration name=\"add-products\" device=\"web\" />\n```\n\nNames migrate to kebab-case ids (`order-filters-empty`). The collection frame becomes `assets/illustrations/` with one SVG per id; `Illustration` is a thin atom that loads by id.\n\n## Adding a new illustration\n\n1. Draw at 200×200 on the web artboard, export mobile at 140.\n2. Add to `Illustrations Collection` with the kebab-case id as the layer name.\n3. Add the id to `assets/illustrations/index.json` and reference it from the `EmptyState` story.\n", "02-styles/motion": "# Motion\n\nMaterial's motion system reduced to what the dashboard needs. **No motion tokens exist in Figma today**; these are proposed.\n\n## Tokens\n\n| Token | Value | Use |\n|---|---|---|\n| `ref.duration.short` | 100ms | state changes: hover, pressed, focus ring, checkbox tick |\n| `ref.duration.medium` | 200ms | enter / exit of small surfaces: DropdownList, MoreMenu, Tooltip, Toast |\n| `ref.duration.long` | 300ms | enter / exit of large surfaces: Dialog, BottomSheet, side sheets, NavigationDrawer |\n| `ref.easing.standard` | `cubic-bezier(0.2, 0, 0, 1)` | everything entering or changing state |\n| `ref.easing.emphasized` | `cubic-bezier(0.3, 0, 0.8, 0.15)` | exits (accelerate out) |\n\n## Patterns\n\n| Pattern | Spec |\n|---|---|\n| Fade | opacity 0 → 1, `medium`, `standard` |\n| Fade through | outgoing fades over first 30%, incoming fades in with 4px rise |\n| Slide (sheets) | translate 100% → 0 on the inline / block edge, `long`, `standard`; exit `emphasized` |\n| Scale (menus) | 0.95 → 1 with fade, `medium`, transform-origin at the trigger |\n| Loading | `LoadingIndicator` spinner 1s linear infinite; dots 1.2s; line indeterminate 2s |\n| Switch thumb | 100ms `standard` translate; loading spinner fades in inside the thumb |\n| Skeleton | shimmer 1.5s linear infinite, disabled under reduced motion |\n\n## Rules\n\n- Animate only `opacity`, `transform`, `color`, `background-color`, `border-color`, `box-shadow`. Never `width`, `height`, `top`, `left`.\n- Hover and pressed never move or scale elements.\n- Honour `prefers-reduced-motion: reduce`: durations 0, spinners become static, shimmer off.\n- RTL: slide directions use logical axes (`translateX` sign flips with `dir`).\n", "02-styles/elevation": "# Elevation\n\nMaterial's elevation levels mapped onto the Figma **`Shadows/*`** effect styles. Two styles were observed on 2026-09-22 (`Shadows/md`, `Shadows/lg`); they follow the Tailwind shadow scale with a cool black `rgb(18 18 23)`, so `sm` and `xl` are filled in on the same scale.\n\n| Level | Token | Figma style | Shadow | Observed on |\n|---|---|---|---|---|\n| 0 | `sys.elevation.0` | – | none | page, Panel (Salla's default is flat with an outline) |\n| 1 | `sys.elevation.1` | `Shadows/sm` (not observed) | `0 1px 2px 0 rgb(18 18 23 / .06)` | raised Panel, sticky table header |\n| 2 | `sys.elevation.2` | `Shadows/md` ✓ | `0 4px 6px -1px rgb(18 18 23 / .08), 0 2px 4px -1px rgb(18 18 23 / .05)` | Table/Footer on mobile (sticky bottom bar, shadow flipped upward) |\n| 3 | `sys.elevation.3` | `Shadows/lg` ✓ | `0 10px 15px -3px rgb(18 18 23 / .08), 0 4px 6px -2px rgb(18 18 23 / .05)` | MoreMenu, Tooltip, DropdownList |\n| 4 | `sys.elevation.4` | `Shadows/xl` (not observed) | `0 20px 25px -5px rgb(18 18 23 / .10), 0 8px 10px -6px rgb(18 18 23 / .05)` | Dialog, BottomSheet, side sheets |\n\nFigma variables behind the styles: `shadow/{size}/type-{1,2}/{position-x, position-y, blur, spread, color}`.\n\n## Rules\n\n- Salla is **flat-first**: containment is shown with `sys.color.outline` borders; elevation is reserved for surfaces that float above the page (menus, tooltips, sheets, dialogs) and for drag states.\n- Elevation never changes on hover for cards or rows; hover uses colour (see [interaction-states.md](../01-foundations/interaction-states.md)).\n- Scrim under Dialog and BottomSheet: `sys.color.scrim` = `rgb(0 0 0 / .4)` (proposed).\n- Tonal elevation (Material's surface tint) is not used; Salla surfaces stay white.\n\n## To do in Figma\n\n- Confirm `Shadows/sm` and `Shadows/xl` exist; if not, add them with the values above.\n- Bind `Drop Down List`, `Bottom sheet`, `Table/Bulk Edit Sheet`, `Table/Edit Sheet` and `Action Buttons Type=Float` to a shadow style (they carry none today).\n", "02-styles/icons": "# Icons\n\nSource: the `Icons DS_V.1` Figma library (exported 2026-07-07). Inventory: `assets/icons/icon-inventory.json`.\n\n## What the library contains\n\n| Property | Values | Count |\n|---|---|---|\n| Names | kebab-case, numbered where a family has several forms (`search-01`, `search-02`, `mail-open-01`) | **4,049** unique |\n| Style | Stroke (3,889), Solid (3,889), Bulk (5), Twotone (3), Duotone (3) | |\n| Type | Rounded (default), Sharp (3) | |\n| Categories | Add Remove Delete · Alert Notification · Arrows · Artificial Intelligence · Award Reward · Bookmark Favourite · Brand logo · Building Landmark Places · Business and finance · Chat Bubbles · Check Validation · Cloth Accessories · Date and Time · Download Upload · Edit Formatting · Files Folders · Filter Sorting · Food Drink · Game Sports · Geometric Shapes · Global Map · Gym Fitness · Hand Gestures · Image Camera Video · Layout Borders · Link Unlink · Login Logout · More Menu · Mouse Cursors · Science Technology · Smiley Emojis · Wifi Signal · … | 60 category frames |\n\nThe Merchant DS consumes the set through two frames, `Icons/Outline` and `Icons/Filled`, and names instances `{name}-outline` / `{name}-filled` (`add-01-outline`, `arrow-down-01-outline`, `cancel-01-outline`, `information-circle-outline`, `file-01-outline`, `star-outline` were seen in component code). The Storybook still exposes the older `sicon-*` icon font.\n\n## Shipped subset\n\nShip **Stroke** (as `outline`) and **Solid** (as `filled`), **Rounded** only. Bulk, Twotone, Duotone and Sharp stay in the source library; they are not part of the system.\n\n## The Icon atom\n\n```\n<Icon name=\"add-01\" style=\"outline\" size=\"sm\" />\n```\n\n| Prop | Values | Default |\n|---|---|---|\n| `name` | any inventory name | required |\n| `style` | `outline` (Stroke), `filled` (Solid) | `outline` |\n| `size` | `sm` 16 ✓, `md` 18 ✓, `lg` 20, `xl` 24 | `sm` in buttons and fields, `md` in alerts |\n| `mirrorInRtl` | boolean | true for directional glyphs |\n| `label` | string; omit for decorative icons (`aria-hidden`) | – |\n\nColour is `currentColor`; icons never carry their own colour tokens.\n\n## Sizes in context (verified)\n\n| Context | Size |\n|---|---|\n| Button, IconButton, field leading / trailing icons | 16px |\n| Alert, Status leading icon | 18px |\n| NavigationItem, Tab | 20px |\n| EmptyState, MobileRow leading | 24px |\n\n## Naming and migration\n\n| Today | New |\n|---|---|\n| `add-01-outline` (Figma instance) | `name=\"add-01\" style=\"outline\"` |\n| `sicon-add` (Storybook font class) | alias table → `add-01`; retire the font after migration |\n| `Style=Stroke, Type=Rounded` (library variant) | `style=\"outline\"` |\n| `Style=Solid, Type=Rounded` | `style=\"filled\"` |\n\n## Delivery\n\n- SVG sprite per style, generated from the Figma export; tree-shakeable named exports for frameworks.\n- The 265 `Flag` glyphs and the brand `SocialIcon` set are separate atoms and separate sprites.\n- Directional icons (arrows, chevrons, undo/redo, login/logout, indent) are tagged `mirror: true` in the inventory build so `mirrorInRtl` defaults correctly.\n", "00-overview/introduction": "# Salla Design System\n\nThe merchant dashboard design system for Salla, restructured on **Atomic Design** (Brad Frost) with **Material Design 3** as the structural reference.\n\nIt takes what Salla has today, the `Merchant - Storybook DS` Figma library (17 sections, 117 component frames, ~10,000 variants) and the public Twilight Storybook at `dashboard-ui-components.pages.dev`, and reorganises it into a layered system: tokens, foundations, styles, and components sorted by atomic level and Material category.\n\n> Status: **v0.1 - structure and documentation**. Component code is not in this repo yet; every component page carries a build plan (structure type, props, tokens) so implementation can start from it.\n\n## How the system is layered\n\n```\n┌───────────────────────────────────────────────────────────────┐\n│  PAGES        real merchant screens (Orders, Products ...)     │  Atomic: pages\n├───────────────────────────────────────────────────────────────┤\n│  TEMPLATES    list page, list-detail, form page, wizard        │  Atomic: templates\n├───────────────────────────────────────────────────────────────┤\n│  ORGANISMS    Header, Table, DropDownList, Alertbox, Steps ... │  Atomic: organisms\n├───────────────────────────────────────────────────────────────┤\n│  MOLECULES    TextField, CheckboxField, Status, Breadcrumb ... │  Atomic: molecules\n├───────────────────────────────────────────────────────────────┤\n│  ATOMS        Button, Icon, Checkbox, Toggle, Avatar, Loader   │  Atomic: atoms\n├───────────────────────────────────────────────────────────────┤\n│  STYLES       color · typography · spacing · shape · elevation │  Material: Styles\n│               icons · illustrations · motion                   │\n├───────────────────────────────────────────────────────────────┤\n│  FOUNDATIONS  tokens · layout · interaction states · a11y      │  Material: Foundations\n│               content & localisation (AR/EN, RTL)              │\n└───────────────────────────────────────────────────────────────┘\n```\n\nEvery component is classified on three axes:\n\n| Axis | Values | Why |\n|---|---|---|\n| **Atomic level** | atom · molecule · organism · template · page | Where it sits in the composition hierarchy |\n| **Material category** | Actions · Communication · Containment · Navigation · Selection · Text inputs · Data display | How designers find it (Material's component taxonomy, plus Data display for tables) |\n| **Structure type** | 1 Configurable · 2 Standalone · 3 Base + Global · 4 Slot / Composition · 5 Headless | How engineers build it, from the internal *Component Structure Types* document |\n\n\n## Quick start\n\n```bash\n# Regenerate the component docs after editing catalog/components.json\npython3 scripts/build-catalog.py\n\n# Preview tokens and atoms\nopen preview/index.html\n```\n\nUse the tokens in product code:\n\n```css\n@import \"salla-design-system/tokens/css/tokens.css\";\n.my-card { background: var(--sys-color-surface); border-radius: var(--sys-shape-small); padding: var(--sys-space-md); }\n```\n\n```js\n// tailwind.config.js\nmodule.exports = { presets: [require('./tokens/tailwind/preset')], content: ['./src/**/*.{html,js,ts,vue}'] };\n```\n\n## Sources of truth\n\n| Source | What it gives us | Where it is captured |\n|---|---|---|\n| Figma `Merchant - Storybook DS` (file `zuGhoKg2BaBIYUreKuSBGY`, branch `dnmyqzYKK9dUJjVHuIWMDS`, page *Main Components (Full)*) | Component anatomy, variants, states, token names and values | `catalog/figma-inventory.json`, `tokens/tokens.json` |\n| Figma `Icons DS_V.1` | Icon set: 4,049 names, Stroke/Solid/Bulk/Twotone/Duotone × Rounded/Sharp | `assets/icons/icon-inventory.json`, `docs/02-styles/icons.md` |\n| Storybook `dashboard-ui-components.pages.dev` (Twilight web components) | Shipped component names and stories | `catalog/components.json` → `storybook` field |\n| *Component Structure Types* (internal PDF, 2025-07-06) | The five build patterns | `docs/00-overview/component-structure-types.md` |\n| Material Design 3 (m3.material.io) | Foundations / Styles / Components structure, token tiers, category taxonomy | `docs/00-overview/methodology.md` |\n\n## Next steps\n\n1. Confirm the values marked `assumed` in `tokens/tokens.json` against Figma and add elevation styles to the library.\n2. Rename Figma frames and variables per `docs/00-overview/migration-map.md` (typos, `--` prefixes, the two spacing scales).\n3. Implement atoms first (Button, Icon, Checkbox, Radio, Toggle, Loader, Avatar) as Base + Global or Configurable components, then molecules, following each component page's build plan.\n4. Wire Storybook to the same catalog so story titles follow `Level / Category / Component`.\n"}, "nav": [["Overview", [["00-overview/introduction", "Introduction"], ["00-overview/methodology", "Atomic × Material"], ["00-overview/component-structure-types", "Structure types"], ["00-overview/naming-conventions", "Naming conventions"], ["00-overview/current-state-audit", "Current state audit"], ["00-overview/migration-map", "Migration map"]]], ["Foundations", [["01-foundations/design-tokens", "Design tokens"], ["01-foundations/layout", "Layout & adaptive"], ["01-foundations/interaction-states", "Interaction states"], ["01-foundations/accessibility", "Accessibility"], ["01-foundations/content-and-localization", "Content & localisation"]]], ["Styles", [["02-styles/color", "Color"], ["02-styles/typography", "Typography"], ["02-styles/spacing", "Spacing"], ["02-styles/shape", "Shape"], ["02-styles/elevation", "Elevation"], ["02-styles/icons", "Icons"], ["02-styles/illustrations", "Illustrations"], ["02-styles/motion", "Motion"]]]], "compNav": [["Atoms", [["03-components/atoms/button", "Button"], ["03-components/atoms/icon-button", "IconButton"], ["03-components/atoms/link", "Link"], ["03-components/atoms/icon", "Icon"], ["03-components/atoms/checkbox", "Checkbox"], ["03-components/atoms/radio", "Radio"], ["03-components/atoms/toggle", "Switch"], ["03-components/atoms/loading-indicator", "LoadingIndicator"], ["03-components/atoms/status-indicator", "StatusIndicator"], ["03-components/atoms/avatar", "Avatar"], ["03-components/atoms/chip", "Chip"], ["03-components/atoms/flag", "Flag"], ["03-components/atoms/social-icon", "SocialIcon"], ["03-components/atoms/illustration", "Illustration"], ["03-components/atoms/label", "FieldLabel"], ["03-components/atoms/helper-text", "HelperText"], ["03-components/atoms/password-hint", "PasswordHint"], ["03-components/atoms/stepper-button", "StepperButton"], ["03-components/atoms/translation-toggle", "TranslationToggle"], ["03-components/atoms/progress-circle", "ProgressCircle"], ["03-components/atoms/step-indicator", "StepIndicator"], ["03-components/atoms/divider", "Divider"], ["03-components/atoms/text", "Text"]]], ["Molecules", [["03-components/molecules/base-field", "BaseField (internal)"], ["03-components/molecules/text-field", "TextField"], ["03-components/molecules/textarea-field", "TextareaField"], ["03-components/molecules/password-field", "PasswordField"], ["03-components/molecules/email-field", "EmailField"], ["03-components/molecules/amount-field", "AmountField"], ["03-components/molecules/phone-field", "PhoneField"], ["03-components/molecules/search-field", "SearchField"], ["03-components/molecules/otp-field", "OtpField"], ["03-components/molecules/quantity-field", "QuantityField"], ["03-components/molecules/select-field", "SelectField"], ["03-components/molecules/multi-select-field", "MultiSelectField"], ["03-components/molecules/upload-field", "UploadField"], ["03-components/molecules/color-picker-field", "ColorPickerField"], ["03-components/molecules/checkbox-field", "CheckboxField"], ["03-components/molecules/radio-field", "RadioField"], ["03-components/molecules/radio-image", "RadioImage"], ["03-components/molecules/radio-color", "RadioColor"], ["03-components/molecules/toggle-field", "SwitchField"], ["03-components/molecules/status", "Status"], ["03-components/molecules/loading", "Loading"], ["03-components/molecules/avatar-with-text", "AvatarWithText"], ["03-components/molecules/avatar-stack", "AvatarStack"], ["03-components/molecules/breadcrumb", "Breadcrumb"], ["03-components/molecules/breadcrumb-item", "BreadcrumbItem"], ["03-components/molecules/tab", "Tab"], ["03-components/molecules/side-menu-item", "NavigationItem"], ["03-components/molecules/menu-item", "MenuItem"], ["03-components/molecules/list-item", "ListItem"], ["03-components/molecules/table-cell", "TableCell"], ["03-components/molecules/date-time-cell", "CalendarCell"], ["03-components/molecules/header-avatar", "AccountMenuTrigger"], ["03-components/molecules/page-title", "PageTitle"], ["03-components/molecules/learn-more", " \/span>عبدالله محمد<\/span><\/td><td class=\"amount\">1,250.00 SAR<\/td><td><span class=\"status status--strong status--info\">بانتظار الدفع<\/span><\/td><td><button class=\"btn btn--secondary btn--sm\" aria-label=\"More\">…<\/button><\/td><\/tr>\n      <tr><td><input type=\"checkbox\" class=\"checkbox\" aria-label=\"Select\" checked><\/td><td>#10491<\/td><td><span class=\"row\" style=\"gap:var(--sys-space-compact)\"><span class=\"avatar avatar--sm\">س<\/span>سارة أحمد<\/span><\/td><td class=\"amount\">390.00 SAR<\/td><td><span class=\"status status--strong status--success\">تم التوصيل<\/span><\/td><td><button class=\"btn btn--secondary btn--sm\" aria-label=\"More\">…<\/button><\/td><\/tr>\n      <tr><td><input type=\"checkbox\" class=\"checkbox\" aria-label=\"Select\"><\/td><td>#10490<\/td><td><span class=\"row\" style=\"gap:var(--sys-space-compact)\"><span class=\"avatar avatar--sm\">م<\/span>محمد علي<\/span><\/td><td class=\"amount\">2,080.00 SAR<\/td><td><span class=\"status status--strong status--danger\">ملغي<\/span><\/td><td><button class=\"btn btn--secondary btn--sm\" aria-label=\"More\">…<\/button><\/td><\/tr>\n    <\/tbody>\n  <\/table>\n  <\/div>"}}, "harvestMeta": {"colors": 65, "spacing": 27, "frames": 20}};
const LEVEL_DIR = {atom:"atoms",molecule:"molecules",organism:"organisms",template:"templates",page:"pages"};
const byId = Object.fromEntries(DATA.catalog.components.map(c => [c.id, c]));
let exampleDir = "ltr";
try { exampleDir = localStorage.getItem("sds-example-dir") || "ltr"; } catch (e) {}

// ---------- navigation ----------
function buildNav() {
  const nav = document.getElementById("nav");
  const groups = [...DATA.nav, ["Components", [["03-components/README", "Components index"]]], ...DATA.compNav];
  nav.innerHTML = groups.map(([title, items], gi) => `
    <details class="group" ${gi < 4 ? "open" : ""} data-group="${title}">
      <summary>${title}</summary>
      ${items.map(([id, label]) => {
        const c = byId[id.split("/").pop()];
        const tag = c ? `<span class="tag">${c.category}</span>` : "";
        return `<a href="#/${id}" data-id="${id}" data-text="${(label + " " + (c ? c.category + " " + c.summary : "")).toLowerCase().replace(/"/g, "")}">${label}${tag}</a>`;
      }).join("")}
    </details>`).join("");
}

function currentId() {
  const h = location.hash.replace(/^#\/?/, "");
  return h || "00-overview/introduction";
}

// resolve a relative markdown link from a page id to another page id
function resolveLink(fromId, href) {
  if (/^(https?:|mailto:|#)/.test(href)) return href;
  let [path, anchor] = href.split("#");
  if (!path) return "#" + anchor;
  if (!path.endsWith(".md")) return href;
  path = path.replace(/\.md$/, "");
  const base = fromId.split("/").slice(0, -1);
  for (const seg of path.split("/")) {
    if (seg === "..") base.pop(); else if (seg !== ".") base.push(seg);
  }
  const id = base.join("/");
  return "#/" + id + (anchor ? "#" + anchor : "");
}

function colorize(html) {
  return html.replace(/<code>(#[0-9a-fA-F]{6})<\/code>/g, (m, hex) => `<code><span class="swatch-inline" style="background:${hex}"></span>${hex}</code>`);
}

// Minimal fallback renderer so the site still reads if the marked CDN is unreachable.
function fallbackMarkdown(id, md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/_([^_]+)_/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => `<a href="${resolveLink(id, h)}">${t}</a>`);
  const lines = md.split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) { const buf = []; i++; while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    const h = l.match(/^(#{1,6})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (l.startsWith("|")) { const rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]); const cells = r => r.replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, "|"))); const head = cells(rows[0]); const body = rows.slice(2); out.push(`<div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue; }
    if (/^\s*[-*]\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, "")); out.push(`<ul>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); continue; }
    if (/^\s*\d+\.\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/, "")); out.push(`<ol>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ol>`); continue; }
    if (l.startsWith(">")) { const buf = []; while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote><p>${inline(buf.join(" "))}</p></blockquote>`); continue; }
    if (l.trim() === "---") { out.push("<hr>"); i++; continue; }
    if (l.trim() === "") { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() !== "" && !/^(#|\||```|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return colorize(out.join("\n"));
}

function renderMarkdown(id, md) {
  if (typeof marked === "undefined") return fallbackMarkdown(id, md);
  const renderer = new marked.Renderer();
  const origLink = renderer.link.bind(renderer);
  renderer.link = (href, title, text) => {
    if (typeof href === "object") { const t = href; href = t.href; title = t.title; text = t.text; }
    const target = resolveLink(id, href);
    const ext = /^https?:/.test(target) ? ' target="_blank" rel="noopener"' : "";
    return `<a href="${target}"${ext}>${text}</a>`;
  };
  marked.use({ renderer, gfm: true, breaks: false });
  let html = marked.parse(md);
  html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  return colorize(html);
}

function exampleBlock(exId) {
  const ex = DATA.examples[exId];
  if (!ex) return "";
  return `<div class="example"><div class="example__bar"><span>Live example · ${ex.title}</span><span>rendered from tokens.css</span></div><div class="example__stage sds ${exampleDir === "rtl" ? "rtl" : ""}" dir="${exampleDir}">${ex.html}</div></div>`;
}

function componentHeader(c) {
  const st = DATA.catalog.structureTypes[String(c.structure)].split(" (")[0];
  return `<div class="classify"><span class="pill level">${c.level}</span><span class="pill">${c.category}</span><span class="pill">Structure ${c.structure} · ${st}</span><span class="pill">${c.status}</span>${c.storybook ? `<span class="pill">Storybook: ${c.storybook}</span>` : ""}</div>`;
}

function componentsIndex() {
  const cat = DATA.catalog;
  const total = cat.components.length, existing = cat.components.filter(c => c.status === "existing").length, proposed = cat.components.filter(c => c.status === "proposed").length;
  return `
    <div class="hero"><h1>Components</h1><p>Every component classified by <span class="mint">atomic level</span>, <span class="mint">Material category</span> and <span class="mint">structure type</span>. Filter the catalog or browse by level in the sidebar.</p></div>
    <div class="stat-row"><div class="stat"><b>${total}</b><span>components</span></div><div class="stat"><b>${existing}</b><span>in Figma / Storybook today</span></div><div class="stat"><b>${proposed}</b><span>proposed to fill gaps</span></div><div class="stat"><b>${Object.keys(DATA.examples).length}</b><span>with live examples</span></div></div>
    <div class="filters">
      <input id="fq" type="search" placeholder="Filter by name…" aria-label="Filter components">
      <select id="fl" aria-label="Level"><option value="">All levels</option>${cat.levels.map(l => `<option>${l}</option>`).join("")}</select>
      <select id="fc" aria-label="Category"><option value="">All categories</option>${cat.categories.map(l => `<option>${l}</option>`).join("")}</select>
      <select id="fs" aria-label="Structure"><option value="">All structures</option>${Object.entries(cat.structureTypes).map(([k, v]) => `<option value="${k}">${k} · ${v.split(" (")[0]}</option>`).join("")}</select>
      <select id="ft" aria-label="Status"><option value="">Any status</option><option>existing</option><option>proposed</option><option>reference</option></select>
    </div>
    <div class="cards" id="cards"></div>
    <h2>Structure types</h2>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Pattern</th></tr></thead><tbody>${Object.entries(cat.structureTypes).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</tbody></table></div>`;
}

function drawCards() {
  const q = (document.getElementById("fq").value || "").toLowerCase();
  const fl = document.getElementById("fl").value, fc = document.getElementById("fc").value, fs = document.getElementById("fs").value, ft = document.getElementById("ft").value;
  const list = DATA.catalog.components.filter(c => (!q || (c.name + " " + c.id + " " + c.summary).toLowerCase().includes(q)) && (!fl || c.level === fl) && (!fc || c.category === fc) && (!fs || String(c.structure) === fs) && (!ft || c.status === ft));
  const el = document.getElementById("cards");
  el.innerHTML = list.length ? list.map(c => `<a class="card" href="#/03-components/${LEVEL_DIR[c.level]}/${c.id}"><b>${c.name}</b><span>${c.summary.split(". ")[0]}.</span><div class="meta"><i>${c.level}</i><i>${c.category}</i><i>structure ${c.structure}</i>${DATA.examples[c.id] ? "<i>live</i>" : ""}</div></a>`).join("") : `<div class="empty">No components match.</div>`;
}

function render() {
  const id = currentId();
  const content = document.getElementById("content");
  const md = DATA.pages[id];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.id === id));
  const active = document.querySelector("#nav a.active");
  if (active) { active.closest("details").open = true; }
  const parts = id.split("/");
  const compId = parts[0] === "03-components" && parts.length === 3 ? parts[2] : null;
  const c = compId ? byId[compId] : null;
  document.getElementById("crumbs").innerHTML = parts.slice(0, -1).map(p => p.replace(/^\d+-/, "")).join(" / ") + (parts.length > 1 ? " / " : "") + `<b>${c ? c.name : (parts.at(-1) === "README" ? "Index" : parts.at(-1).replace(/-/g, " "))}</b>`;

  if (id === "03-components/README") {
    content.innerHTML = componentsIndex();
    ["fq", "fl", "fc", "fs", "ft"].forEach(i => document.getElementById(i).addEventListener("input", drawCards));
    drawCards();
  } else if (md !== undefined) {
    let html = renderMarkdown(id, md);
    if (c) {
      html = html.replace(/(<\/h1>)/, "$1" + componentHeader(c) + exampleBlock(c.id));
    }
    if (id === "00-overview/introduction") {
      html = html.replace(/(<\/h1>)/, "$1");
      html = `<div class="hero"><h1>Salla Design System</h1><p>The merchant dashboard design system, restructured on <span class="mint">Atomic Design</span> with <span class="mint">Material Design 3</span> as the structural reference. Tokens and component specs are read directly from the Merchant – Storybook DS Figma library.</p></div>
        <div class="stat-row"><div class="stat"><b>${DATA.catalog.components.length}</b><span>components catalogued</span></div><div class="stat"><b>117</b><span>Figma frames mapped</span></div><div class="stat"><b>${DATA.harvestMeta.colors}</b><span>colour variables verified</span></div><div class="stat"><b>4,049</b><span>icons inventoried</span></div></div>` + html.replace(/^[\s\S]*?<\/h1>/, "");
    }
    content.innerHTML = html;
  } else {
    content.innerHTML = `<h1>Not found</h1><p>No page at <code>${id}</code>.</p>`;
  }
  // pager
  const flat = [...DATA.nav, ["Components", [["03-components/README", "Components index"]]], ...DATA.compNav].flatMap(([g, items]) => items.map(([i, l]) => ({ id: i, label: l, group: g })));
  const idx = flat.findIndex(p => p.id === id);
  if (idx >= 0) {
    const prev = flat[idx - 1], next = flat[idx + 1];
    content.insertAdjacentHTML("beforeend", `<div class="pager"><span>${prev ? `<a href="#/${prev.id}"><small>Previous</small>← ${prev.label}</a>` : ""}</span><span style="text-align:end">${next ? `<a href="#/${next.id}"><small>Next</small>${next.label} →</a>` : ""}</span></div>`);
  }
  const anchor = location.hash.split("#")[2];
  if (anchor) { const t = document.getElementById(anchor); if (t) t.scrollIntoView(); } else { window.scrollTo(0, 0); }
  closeSide();
}

// ---------- chrome ----------
function openSide() { document.getElementById("side").classList.add("open"); document.getElementById("scrim").hidden = false; }
function closeSide() { document.getElementById("side").classList.remove("open"); document.getElementById("scrim").hidden = true; }
document.getElementById("menuBtn").addEventListener("click", openSide);
document.getElementById("scrim").addEventListener("click", closeSide);
document.getElementById("dirBtn").addEventListener("click", () => {
  exampleDir = exampleDir === "ltr" ? "rtl" : "ltr";
  try { localStorage.setItem("sds-example-dir", exampleDir); } catch (e) {}
  document.getElementById("dirBtn").textContent = "Examples: " + exampleDir.toUpperCase();
  document.querySelectorAll(".example__stage").forEach(s => { s.dir = exampleDir; s.classList.toggle("rtl", exampleDir === "rtl"); });
});
document.getElementById("dirBtn").textContent = "Examples: " + exampleDir.toUpperCase();
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("hidden", !!q && !a.dataset.text.includes(q)));
  document.querySelectorAll("#nav details").forEach(d => { if (q) d.open = true; });
});
buildNav();
window.addEventListener("hashchange", render);
render();
</script>
